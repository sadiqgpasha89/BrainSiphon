# EXAMPLE ONLY: the keys the `app-secrets` Secret must contain. Create the real one with kubectl or your secret manager
# (External Secrets, Sealed Secrets, Vault); never commit real values.
apiVersion: v1
kind: Secret
metadata: {name: app-secrets}
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://USER:PASSWORD@HOST:5432/DBNAME
  SOURCE_DATABASE_URL: postgresql+psycopg://CDC_USER:PASSWORD@SOURCE_HOST:5432/ERP
  OIDC_JWKS_URL: https://YOUR_IDP/.well-known/jwks.json
  OIDC_ISSUER: https://YOUR_IDP/
  OIDC_AUDIENCE: batch-forecasting
  ALERT_WEBHOOK_URL: ""
