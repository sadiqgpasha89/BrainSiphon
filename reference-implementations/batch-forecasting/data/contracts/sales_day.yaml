# Data contract for sales.day_closed and sales.restated events from the ERP / point-of-sale system. Owner: retail data platform.
dataset: sales_day
version: 1
owner: retail-data-platform
fields:
  - {name: store_id, type: string, pattern: "S[0-9]{3}"}
  - {name: sku, type: string, pattern: "K[0-9]{4}"}
  - {name: day, type: string, pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}"}
  - {name: units, type: integer, min: 0, max: 100000}
  - {name: on_promo, type: boolean}
  - {name: stockout, type: boolean}
  - {name: price, type: number, min: 0.01, max: 100000}
additional_fields: forbid
