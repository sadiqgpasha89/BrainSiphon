<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fraud review console</title>
<link rel="stylesheet" href="/_shared/app.css">
</head>
<body>
<header><h1>Fraud review console</h1><div id="who" class="row"></div></header>
<main>
  <section id="login" class="card">
    <h2>Sign in</h2>
    <form id="login-form" class="row">
      <input name="username" placeholder="username" autocomplete="username" required>
      <input name="password" type="password" placeholder="password" autocomplete="current-password" required>
      <button class="primary">Sign in</button>
    </form>
    <p class="mute">Use <code>analyst</code> or <code>ml-admin</code>; the passwords are in your <code>.env</code> file.</p>
  </section>
  <div id="app" class="hidden" style="display:grid;gap:16px">
    <section class="card"><h2>Last 24 hours</h2><div id="stats" class="grid"></div><div id="alerts"></div></section>
    <section class="card">
      <h2>Blocked payments awaiting review</h2>
      <div class="row"><select id="status"><option value="open">Open</option><option value="claimed">Claimed</option><option value="approved">Confirmed fraud</option><option value="rejected">Released as genuine</option><option value="expired">Expired</option></select><button id="reload">Refresh</button></div>
      <table><thead><tr><th>Txn</th><th>Amount</th><th>Score</th><th>Why</th><th>Due</th><th>Action</th></tr></thead><tbody id="queue"></tbody></table>
    </section>
    <section class="card" id="models-card"><h2>Models</h2><table><thead><tr><th>Version</th><th>Stage</th><th>PR-AUC</th><th>Recall at block</th><th>False declines</th><th>Trained</th><th></th></tr></thead><tbody id="models"></tbody></table></section>
  </div>
</main>
<div id="toast" role="status"></div>
<script src="/_shared/app.js"></script>
<script>
const $ = (id) => document.getElementById(id), e = BS.esc;
async function refresh() {
  const [sum, tasks, models] = await Promise.all([
    BS.api("/v1/monitoring/summary"), BS.api("/v1/reviews?status=" + $("status").value), BS.api("/v1/models")]);
  const d = sum.decisions_24h;
  $("stats").innerHTML = [["Serving model", sum.model_version], ["Allowed", d.ALLOW], ["Step-up", d.STEP_UP], ["Blocked", d.BLOCK],
    ["Open reviews", sum.open_reviews], ["Quarantined events", sum.quarantined_events], ["Dead letters", sum.dead_letters]]
    .map(([k, v]) => `<div class="stat"><b>${e(v)}</b><span>${e(k)}</span></div>`).join("");
  $("alerts").innerHTML = sum.alerts_firing.map((a) => `<p><span class="pill bad">${e(a.severity)}</span> ${e(a.message)}</p>`).join("");
  $("queue").innerHTML = tasks.map((t) => {
    const p = t.payload, open = t.status === "open" || t.status === "claimed";
    return `<tr><td><code>${e(t.subject_id)}</code><br><span class="mute">card ${e(p.txn.card_id)} · ${e(p.txn.rail)} · ${e(p.txn.country)}</span></td>
      <td class="num">${e(p.txn.amount.toFixed(2))}</td><td class="num">${e(p.score.toFixed(3))}</td><td>${e(p.reason)}</td>
      <td>${e(BS.time(t.due_at))}${t.assignee ? `<br><span class="mute">${e(t.assignee)}</span>` : ""}</td>
      <td>${open ? `<div class="row">${t.status === "open" ? `<button data-claim="${t.id}">Claim</button>` : ""}
        <button class="danger" data-verdict="fraud" data-id="${t.id}">Confirm fraud</button>
        <button data-verdict="genuine" data-id="${t.id}">Release as genuine</button></div>` : `<span class="pill">${e(t.status)}</span>`}</td></tr>`;
  }).join("") || `<tr><td colspan="6" class="mute">Nothing in this view.</td></tr>`;
  const admin = BS.has("ml-admin");
  $("models").innerHTML = models.versions.slice().reverse().map((m) => `<tr><td><code>${e(m.version)}</code></td>
    <td>${m.stage === "production" ? '<span class="pill ok">production</span>' : '<span class="pill">candidate</span>'}</td>
    <td class="num">${e(m.metrics.pr_auc.toFixed(3))}</td><td class="num">${e((m.metrics.recall_at_block * 100).toFixed(1))}%</td>
    <td class="num">${e((m.metrics.false_decline_rate * 100).toFixed(2))}%</td><td>${e(BS.time(m.created_at))}</td>
    <td>${admin && m.stage !== "production" ? `<button data-promote="${e(m.version)}">Promote</button>` : ""}</td></tr>`).join("");
}
document.addEventListener("click", async (ev) => {
  const b = ev.target.closest("button"); if (!b) return;
  try {
    if (b.dataset.claim) await BS.api(`/v1/reviews/${b.dataset.claim}/claim`, { method: "POST" });
    else if (b.dataset.verdict) {
      const notes = prompt(`Notes for "${b.dataset.verdict}" (optional)`) ?? null; if (notes === null) return;
      await BS.api(`/v1/reviews/${b.dataset.id}/decision`, { method: "POST", json: { verdict: b.dataset.verdict, notes } });
    } else if (b.dataset.promote) {
      const reason = prompt("Reason for promotion (required)"); if (!reason) return;
      await BS.api(`/v1/models/${b.dataset.promote}/promote`, { method: "POST", json: { reason } });
    } else if (b.id !== "reload") return;
    await refresh();
  } catch (err) { BS.toast(err.message); }
});
$("status").onchange = () => refresh().catch((err) => BS.toast(err.message));
BS.init();
</script>
</body>
</html>
