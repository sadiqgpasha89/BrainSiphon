# One replica: the ingestion consumer is a single ordered stream. To scale out, partition the topic by card and run one
# consumer per partition (with Kafka this is a consumer group).
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, labels: {app: worker}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      containers:
        - name: worker
          image: realtime-decisioning
          command: ["python", "-m", "data.worker", "--loop"]
          envFrom: [{configMapRef: {name: app-config}}, {secretRef: {name: app-secrets}}]
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "1", memory: 1Gi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
