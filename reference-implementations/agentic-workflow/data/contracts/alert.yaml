# Data contract for alert.raised events from the SIEM. Owner: detection engineering.
dataset: alert
version: 1
owner: detection-engineering
fields:
  - {name: alert_id, type: string, pattern: "[A-Z]-[0-9]{4}"}
  - {name: rule, type: string, enum: [brute_force_success, suspicious_process, impossible_travel]}
  - {name: severity, type: string, enum: [low, medium, high, critical]}
  - {name: host, type: string, pattern: "[a-z0-9-]{2,40}"}
  - {name: user, type: string, pattern: "[a-z0-9._-]{2,40}"}
  - {name: src_ip, type: string, pattern: "[0-9]{1,3}(\\.[0-9]{1,3}){3}"}
  - {name: summary, type: string, max_length: 2000}
  - {name: created_at, type: number, min: 1000000000}
additional_fields: forbid
