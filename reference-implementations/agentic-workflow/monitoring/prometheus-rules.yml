# GENERATED from monitoring/alerts.yaml by `python -m bsref.observability`. Do not edit.
groups:
- name: bsref
  rules:
  - alert: AgentOverrideRateHigh
    expr: sum(increase(agent_analyst_verdicts_total{agreement="override"}[1d])) / sum(increase(agent_analyst_verdicts_total[1d]))
      > 0.20
    for: 1h
    labels:
      severity: page
    annotations:
      summary: Analysts are changing more than 20% of the agent's own verdicts
      runbook: docs/RUNBOOK.md#override-rate-high
  - alert: AgentMissedThreat
    expr: agent_live_missed_threats > 0
    for: 0m
    labels:
      severity: page
    annotations:
      summary: A case the agent closed as benign was judged a true positive by an analyst
      runbook: docs/RUNBOOK.md#missed-threat
  - alert: AgentEscalationRateHigh
    expr: sum(rate(agent_investigations_total{verdict="needs_human"}[6h])) / sum(rate(agent_investigations_total[6h])) > 0.5
    for: 6h
    labels:
      severity: ticket
    annotations:
      summary: The agent is sending more than half of the cases to a person
      runbook: docs/RUNBOOK.md#escalation-rate-high
  - alert: AgentApprovalRejectionRateHigh
    expr: sum(increase(agent_approval_decisions_total{decision="reject"}[1d])) / sum(increase(agent_approval_decisions_total[1d]))
      > 0.3
    for: 6h
    labels:
      severity: ticket
    annotations:
      summary: Approvers are rejecting more than 30% of the containment actions the agent proposes
      runbook: docs/RUNBOOK.md#approval-rejections-high
  - alert: AgentToolErrors
    expr: agent_tool_error_rate > 0.05
    for: 10m
    labels:
      severity: page
    annotations:
      summary: More than 5% of the agent's tool calls are failing, so investigations are running on partial evidence
      runbook: docs/RUNBOOK.md#tool-errors
  - alert: AgentStepBudgetExhausted
    expr: agent_budget_exhausted_cases > 0
    for: 30m
    labels:
      severity: ticket
    annotations:
      summary: Investigations are hitting the step budget without reaching a conclusion
      runbook: docs/RUNBOOK.md#step-budget-exhausted
  - alert: ApprovalsOverdue
    expr: agent_approvals_overdue > 0
    for: 5m
    labels:
      severity: page
    annotations:
      summary: Containment actions have waited past the approval SLA; the threat is still active
      runbook: docs/RUNBOOK.md#approvals-overdue
  - alert: CasesUninvestigated
    expr: agent_uninvestigated_cases > 0
    for: 10m
    labels:
      severity: page
    annotations:
      summary: Alerts have been ingested but not investigated (no production agent, or the worker is down)
      runbook: docs/RUNBOOK.md#cases-uninvestigated
  - alert: IngestDeadLetters
    expr: agent_ingest_dead_letters > 0
    for: 1m
    labels:
      severity: ticket
    annotations:
      summary: Alert events are in the dead-letter queue and need a person to look at them
      runbook: docs/RUNBOOK.md#dead-letters
