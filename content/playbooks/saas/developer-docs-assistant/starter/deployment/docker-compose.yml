version: '3.8'

services:
  docs-rag:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    ports:
      - "8002:8002"
    environment:
      - PGVECTOR_URL=postgresql://rag:ragpass@postgres:5432/rag_docs
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health/liveness"]
      interval: 10s
      timeout: 3s
      retries: 3

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_DB=rag_docs
      - POSTGRES_USER=rag
      - POSTGRES_PASSWORD=ragpass
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    ports:
      - "6381:6379"

volumes:
  pgdata:

