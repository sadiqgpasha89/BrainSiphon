apiVersion: opendatacontract.com/v2alpha1
kind: DataContract
id: urn:datacontract:supplychain:network-demand-history
info:
  title: Supply Chain Demand History Contract
  version: 1.1.0
  owner: Supply Chain AI & Forecasting Engineering
  sla:
    freshness: 86400s
    availability: 99.9%
models:
  demand_history:
    description: Daily sales, orderbook commitments, and stockout flags
    type: table
    fields:
      sid: { type: integer, primaryKey: true }
      day: { type: integer, primaryKey: true }
      sales: { type: float, description: "Observed daily sales units" }
      prebooked_1: { type: float, description: "Orders booked 1 day in advance" }
      constrained: { type: integer, description: "1 if store experienced inventory stockout" }
    quality:
      - rule: sales >= 0
      - rule: constrained in (0, 1)

