apiVersion: opendatacontract.com/v2alpha1
kind: DataContract
id: urn:datacontract:retail:session-events
info:
  title: Ecommerce Session Clickstream Contract
  version: 1.2.0
  owner: Personalization & Recommender Engineering Team
  sla:
    freshness: 10s
    availability: 99.99%
models:
  session_clicks:
    description: Cleaned clickstream events with crawler labels
    type: table
    fields:
      session: { type: integer, primaryKey: true }
      day: { type: integer }
      item: { type: integer }
      category: { type: string }
      is_bot: { type: integer, description: "1 if detected crawler, 0 if genuine shopper" }
    quality:
      - rule: is_bot in (0, 1)
      - rule: item >= 0

