version: '3.8'

services:
  recommender-service:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    ports:
      - "8004:8004"
    environment:
      - REDIS_SESSION_HOST=redis
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health/liveness"]
      interval: 10s
      timeout: 3s
      retries: 3

  redis:
    image: redis:7.2-alpine
    ports:
      - "6382:6379"

volumes:
  redis_data:

