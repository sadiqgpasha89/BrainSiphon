version: '3.8'

services:
  ctr-scoring:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    ports:
      - "8007:8007"
    environment:
      - REDIS_COUNTERS_HOST=redis
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/health/liveness"]
      interval: 10s
      timeout: 3s
      retries: 3

  redis:
    image: redis:7.2-alpine
    ports:
      - "6384:6379"

volumes:
  redis_data:

