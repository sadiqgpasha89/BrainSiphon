name: Blueprint review finding
description: Raise an issue against one section of one blueprint (reviewers, domain experts, anyone who finds an error)
title: '[review] <slug> · <section>'
labels: [review-finding]
body:
  - type: input
    id: slug
    attributes:
      label: Blueprint slug
      description: For example fintech.1 (the part of the URL after the site name)
    validations: { required: true }
  - type: input
    id: section
    attributes:
      label: Section
      description: For example discovery, enterprise, evaluation, governance, operations
    validations: { required: true }
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Blocks real-world use (safety, legal or financial harm if followed)
        - Wrong or misleading, but not harmful
        - Improvement
    validations: { required: true }
  - type: textarea
    id: finding
    attributes:
      label: What is wrong or missing
    validations: { required: true }
  - type: textarea
    id: reviewer
    attributes:
      label: Your qualification (optional, needed if this is part of a formal review)
      description: Registration, role, organisation. A formal review is recorded in content/reviews.json with these fields.
