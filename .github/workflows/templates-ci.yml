name: ci

# Every worked template must keep running. The matrix runs each domain's starters and their tests with the pinned libraries, then the
# validator checks the whole repository (files, contracts, manifests, hashes).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13', cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Every engine's own tests
        run: for d in engines/*/; do (cd "$d" && python -m pytest -q -p no:cacheprovider) || exit 1; done

  templates:
    runs-on: ubuntu-latest
    needs: engines
    strategy:
      fail-fast: false
      matrix:
        domain:
          [adtech, bfsi, cybersecurity, edtech, fintech, healthcare, real-estate, retail, saas, supply-chain]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13', cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Run every starter and its tests in this domain
        run: PYTHON=python python tools/run_packs.py --test --jobs 4 ${{ matrix.domain }}

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install -r tools/requirements.txt
      - run: python tools/validate_repo.py
