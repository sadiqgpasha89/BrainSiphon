name: generate-templates

# One-off job for the branch that adds the eight new domains: generates the 400 worked templates (starter, contracts, docs,
# deployment, saved results, WORKED_EXAMPLE.md, manifest) with the repository's own tools and commits them to the branch.
# It only runs when this file changes on that branch, and the file is removed again before the branch is merged.
on:
  push:
    branches: [claude/new-agentic-domains]
    paths: ['.github/workflows/generate-templates.yml']

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13', cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: npm ci
      - run: pip install -r requirements-dev.txt -r tools/requirements.txt
      - name: Build content and export the blueprints
        run: |
          npm run content:build
          python tools/export_blueprints.py "$PWD"
      - name: Build the packs for the new domains
        run: |
          for d in telecom manufacturing energy public-sector public-safety devtools it-ops engineering; do
            python tools/build_packs.py "$d"
          done
      - name: Run every new starter on its synthetic data
        run: |
          for d in telecom manufacturing energy public-sector public-safety devtools it-ops engineering; do
            PYTHON=python python tools/run_packs.py --jobs 4 "$d/" || echo "FAILED $d" >> /tmp/failed
          done
          if [ -f /tmp/failed ]; then cat /tmp/failed; fi
      - name: Render worked examples, manifests, catalogue and index
        run: python tools/render_results.py
      - name: Validate the repository
        run: python tools/validate_repo.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates data catalog.json public-catalog.json INDEX.md
          git status --short | head -20
          git status --short | wc -l
          git commit -m "Generate worked templates for the eight new domains" || echo "nothing to commit"
          git push
