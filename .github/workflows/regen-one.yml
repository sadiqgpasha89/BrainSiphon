name: regen-one

# One-off: re-run one starter after its seed changed, then re-render its worked example and the manifests. Removed before merge.
on:
  push:
    branches: [claude/new-agentic-domains]
    paths: ['.github/workflows/regen-one.yml']

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13', cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt -r tools/requirements.txt
      - run: PYTHON=python python tools/run_packs.py --test engineering/generative-design-exploration
      - run: python tools/render_results.py
      - run: python tools/validate_repo.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates catalog.json public-catalog.json INDEX.md
          git status --short
          git commit -m "Re-run engineering/generative-design-exploration with a new seed" || echo "nothing to commit"
          git push
