name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ── Stage 1: static analysis ────────────────────────────────────────────────
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run content:build # generated types/data are inputs to tsc
      - run: npm run lint
      - run: npm run format
      - run: npm run typecheck

  # ── Stage 2: content integrity gate ─────────────────────────────────────────
  content-gate:
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      # strict Zod schema, ≥50 use cases per domain, KaTeX + Mermaid syntax, staleness, slug-history targets
      - run: npm run validate:content
      # pinned versions are inside vendor support and match the files; infrastructure files pass the static checks
      - run: npm run check:versions
      - run: npm run validate:infra

  # ── Stage 3: automated tests ────────────────────────────────────────────────
  tests:
    runs-on: ubuntu-latest
    needs: content-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run content:build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }

  # ── Stage 3b: playbook starter kits (the exit gates quoted in each playbook, run for real) ──
  starter-kits:
    runs-on: ubuntu-latest
    needs: content-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - uses: actions/setup-python@v5
        with:
          { python-version: '3.13', cache: pip, cache-dependency-path: content/playbooks/requirements.txt }
      - run: npm ci
      - run: pip install -r content/playbooks/requirements.txt
      - run: npm run test:playbooks
      # the deployment is only built when this report was produced for the same commit and content (see release:check)
      - uses: actions/upload-artifact@v4
        with:
          name: kit-results
          path: .release/kit-results.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

  # ── Stage 3c: infrastructure validation (Terraform, Helm, Kubernetes, policy-as-code) ─────────────────────────────────────────────
  # Reports what these tools say about the reference IaC. It does NOT provision anything in a cloud account, and it is deliberately not
  # a dependency of the Pages deployment: a failure is published in the report and the job summary rather than hidden or silently fatal.
  infrastructure-validation:
    runs-on: ubuntu-latest
    needs: content-gate
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        cloud: [aws, azure, gcp]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: '1.9.8' }
      - uses: terraform-linters/setup-tflint@v4
      - name: terraform fmt, init and validate (no backend, no credentials)
        working-directory: deployment/terraform/${{ matrix.cloud }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.infra-report"
          R="$GITHUB_WORKSPACE/.infra-report/${{ matrix.cloud }}.txt"
          terraform version | tee "$R"
          { terraform fmt -check -diff -recursive . && echo "fmt: ok"; } 2>&1 | tee -a "$R" || echo "fmt: NEEDS FORMATTING" | tee -a "$R"
          terraform init -backend=false -input=false 2>&1 | tail -n 3 | tee -a "$R"
          terraform validate 2>&1 | tee -a "$R"
      - name: tflint
        working-directory: deployment/terraform/${{ matrix.cloud }}
        run: tflint --format compact 2>&1 | tee -a "$GITHUB_WORKSPACE/.infra-report/${{ matrix.cloud }}.txt"
      - name: checkov (static security scan of the Terraform)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: deployment/terraform/${{ matrix.cloud }}
          config_file: deployment/policy/checkov.yaml
          output_format: cli
          soft_fail: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infra-report-${{ matrix.cloud }}
          path: .infra-report
          include-hidden-files: true
          retention-days: 14

  kubernetes-validation:
    runs-on: ubuntu-latest
    needs: content-gate
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Install conftest and kubeconform (official release archives)
        run: |
          curl -sSL https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz | tar xz conftest
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          sudo mv conftest kubeconform /usr/local/bin/
      - name: helm lint and render every environment, then validate and apply policy
        run: |
          mkdir -p .infra-report
          R=.infra-report/kubernetes.txt
          helm lint deployment/helm/ai-solution 2>&1 | tee -a "$R"
          conftest verify --policy deployment/policy 2>&1 | tee -a "$R"
          for env in dev staging preprod prod; do
            echo "== $env" | tee -a "$R"
            helm template aiml deployment/helm/ai-solution -f "deployment/helm/ai-solution/values-$env.yaml" > ".infra-report/rendered-$env.yaml"
            kubeconform -strict -summary -ignore-missing-schemas ".infra-report/rendered-$env.yaml" 2>&1 | tee -a "$R"
            conftest test --policy deployment/policy ".infra-report/rendered-$env.yaml" 2>&1 | tee -a "$R"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infra-report-kubernetes
          path: .infra-report
          include-hidden-files: true
          retention-days: 14

  # ── Stage 4: build, container, vulnerability scan ───────────────────────────
  build-and-scan:
    runs-on: ubuntu-latest
    needs: [tests, starter-kits]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: brainsiphon:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy vulnerability scan (image)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: brainsiphon:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Trivy filesystem scan (lockfile)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  # ── Deploy: static export to GitHub Pages (main only) ───────────────────────
  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build-and-scan
    permissions:
      pages: write
      id-token: write
      contents: read
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: kit-results
          path: .release
      # Strict release gate: build:static re-runs validate:content, then refuses to build unless the validation and starter-kit
      # reports belong to this exact commit and content. It stamps release.json (commit, content version, timestamps, check
      # statuses) into the export, and verify:static fails if the export disagrees with the checkout.
      - run: npm run build:static
        env:
          BS_RELEASE_STRICT: '1'
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: out }
      - id: deployment
        uses: actions/deploy-pages@v4

  # ── After deploy: the site being served must be the release that was validated ──────────────
  verify-live:
    needs: deploy-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run verify:live
        env:
          SITE: ${{ needs.deploy-pages.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
