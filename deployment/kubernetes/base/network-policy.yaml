apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inference-network-policy
  namespace: brainsiphon-prod
spec:
  podSelector:
    matchLabels:
      app: brainsiphon-inference
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming traffic only from Envoy/Kong API Gateway
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # Allow egress only to Redis cluster, PostgreSQL database, and internal DNS
    - to:
        - podSelector:
            matchLabels:
              app: redis-cluster
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: postgres-ledger
      ports:
        - protocol: TCP
          port: 5432
    - ports:
        - protocol: UDP
          port: 53

