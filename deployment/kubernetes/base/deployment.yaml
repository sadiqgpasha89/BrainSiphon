apiVersion: apps/v1
kind: Deployment
metadata:
  name: brainsiphon-inference
  namespace: brainsiphon-prod
  labels:
    app: brainsiphon-inference
    tier: serving
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: brainsiphon-inference
  template:
    metadata:
      labels:
        app: brainsiphon-inference
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8000'
        prometheus.io/path: '/metrics'
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: inference-api
          image: brainsiphon/inference-service:v1.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: '1000m'
              memory: '2Gi'
            limits:
              cpu: '2000m'
              memory: '4Gi'
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: PORT
              value: '8000'
            - name: REDIS_HOST
              value: 'redis-cluster.brainsiphon-prod.svc.cluster.local'
            - name: REDIS_TIMEOUT_MS
              value: '5'
            - name: HARD_DEADLINE_MS
              value: '12'
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
