apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: brainsiphon-inference-hpa
  namespace: brainsiphon-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: brainsiphon-inference
  minReplicas: 4
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: '500'
