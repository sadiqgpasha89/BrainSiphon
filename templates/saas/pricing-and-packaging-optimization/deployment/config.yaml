serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: deal_and_usage_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: conjoint_and_test_results, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: choice_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: price_optimiser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: cannibalisation_simulator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: pricing_committee, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: rollout_metrics, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Net revenue retention after change"
    - "Conversion at new prices"
privacy:
  pii_in_logs: false
  retention_days: 400
