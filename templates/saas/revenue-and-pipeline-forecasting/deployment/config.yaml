serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: crm_snapshots, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: deal_feature_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: win_and_slippage_models, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: monte_carlo_aggregator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: forecast_dashboard, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: sales_leadership, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: realised_bookings, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Forecast accuracy at week 6"
    - "Commit accuracy"
privacy:
  pii_in_logs: false
  retention_days: 400
