serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: inference_logs, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: reference_baselines, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: drift_and_quality_metrics, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: label_free_estimator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: alert_policy, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: model_owner, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: retrain_trigger, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to detect degradation"
    - "Retrains triggered unnecessarily"
privacy:
  pii_in_logs: false
  retention_days: 400
