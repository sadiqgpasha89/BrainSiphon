serving:
  deadline_ms: 2500
  stages:
    - { name: account_request, timeout_ms: 247, on_timeout: fallback_level_1 }
    - { name: metric_tools, timeout_ms: 247, on_timeout: fallback_level_1 }
    - { name: insight_detectors, timeout_ms: 660, on_timeout: fallback_level_1 }
    - { name: narrative_llm, timeout_ms: 659, on_timeout: fallback_level_1 }
    - { name: numeric_verifier, timeout_ms: 165, on_timeout: fallback_level_1 }
    - { name: brief_storage, timeout_ms: 247, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "CSM prep time"
    - "Customer meeting outcomes"
privacy:
  pii_in_logs: false
  retention_days: 400
