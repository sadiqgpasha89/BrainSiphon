serving:
  deadline_ms: 80
  stages:
    - { name: editor_request, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: context_assembler, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: router, timeout_ms: 19, on_timeout: fallback_level_1 }
    - { name: completion_model, timeout_ms: 19, on_timeout: fallback_level_1 }
    - { name: filters, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: suggestion_display, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: acceptance_telemetry, timeout_ms: 4, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Persisted accepted characters"
    - "Developer-reported productivity"
privacy:
  pii_in_logs: false
  retention_days: 400
