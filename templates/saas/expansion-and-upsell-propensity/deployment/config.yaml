serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: usage_and_billing_events, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: feature_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: expansion_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: arr_estimator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: priority_ranker, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: sales_worklist, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: closed_won_outcomes, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Expansion ARR per rep"
    - "Win rate on model-sourced opportunities"
privacy:
  pii_in_logs: false
  retention_days: 400
