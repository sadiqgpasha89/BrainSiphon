serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: crm_and_marketing_records, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: normaliser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: blocking, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: pair_scorer, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: cluster_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: golden_record_store, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Duplicate rate"
    - "Routing conflicts"
privacy:
  pii_in_logs: false
  retention_days: 400
