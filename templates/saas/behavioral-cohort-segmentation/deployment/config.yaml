serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: event_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: sequence_encoder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: clustering, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: segment_profiler, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: segment_api, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: lifecycle_campaigns, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outcome_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Lifecycle campaign lift by segment"
    - "Segment usage by teams"
privacy:
  pii_in_logs: false
  retention_days: 400
