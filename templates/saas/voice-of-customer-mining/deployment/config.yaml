serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: sources, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: pii_redaction, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: topic_assignment, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: aspect_sentiment, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: revenue_weighting, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: product_manager_dashboard, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: roadmap_decisions, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Roadmap decisions informed"
    - "Time to detect emerging issues"
privacy:
  pii_in_logs: false
  retention_days: 400
