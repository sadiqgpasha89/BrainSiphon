serving:
  deadline_ms: 80
  stages:
    - { name: llm_request, timeout_ms: 16, on_timeout: fallback_level_1 }
    - { name: auth_and_budget_check, timeout_ms: 4, on_timeout: fallback_level_1 }
    - { name: semantic_cache, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: router, timeout_ms: 15, on_timeout: fallback_level_1 }
    - { name: model_call, timeout_ms: 15, on_timeout: fallback_level_1 }
    - { name: quality_sampler, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: usage_metering, timeout_ms: 6, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Cost per request"
    - "Quality regressions"
privacy:
  pii_in_logs: false
  retention_days: 400
