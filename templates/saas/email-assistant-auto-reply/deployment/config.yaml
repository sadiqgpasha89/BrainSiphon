serving:
  deadline_ms: 2500
  stages:
    - { name: inbox_event, timeout_ms: 186, on_timeout: fallback_level_1 }
    - { name: context_retriever, timeout_ms: 556, on_timeout: fallback_level_1 }
    - { name: draft_llm, timeout_ms: 742, on_timeout: fallback_level_1 }
    - { name: safety_filter, timeout_ms: 185, on_timeout: fallback_level_1 }
    - { name: draft_ui, timeout_ms: 278, on_timeout: fallback_level_1 }
    - { name: user_edit_and_send, timeout_ms: 278, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time spent on email"
    - "Drafts sent"
privacy:
  pii_in_logs: false
  retention_days: 400
