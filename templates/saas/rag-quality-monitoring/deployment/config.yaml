serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: traces, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: sampler, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: retrieval_judge, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: groundedness_judge, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: gap_analyser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: fix_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Resolution rate"
    - "Content gaps closed"
privacy:
  pii_in_logs: false
  retention_days: 400
