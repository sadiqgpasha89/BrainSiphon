serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: billing_exports, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: tag_and_ownership_resolver, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: cost_per_unit_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: anomaly_detector, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: forecast_and_commitment_planner, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: team_notification, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: savings_outcomes, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Waste avoided"
    - "Forecast accuracy"
privacy:
  pii_in_logs: false
  retention_days: 400
