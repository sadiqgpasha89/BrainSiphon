serving:
  deadline_ms: 2500
  stages:
    - { name: meeting_audio, timeout_ms: 191, on_timeout: fallback_level_1 }
    - { name: asr_and_diarisation, timeout_ms: 509, on_timeout: fallback_level_1 }
    - { name: extraction_llm, timeout_ms: 508, on_timeout: fallback_level_1 }
    - { name: owner_resolver, timeout_ms: 508, on_timeout: fallback_level_1 }
    - { name: span_verifier, timeout_ms: 127, on_timeout: fallback_level_1 }
    - { name: participants_confirm, timeout_ms: 191, on_timeout: fallback_level_1 }
    - { name: task_sync, timeout_ms: 191, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Action completion rate"
    - "Time to publish notes"
privacy:
  pii_in_logs: false
  retention_days: 400
