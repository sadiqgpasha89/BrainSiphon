serving:
  deadline_ms: 80
  stages:
    - { name: signup_context, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: user_features, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: candidate_steps, timeout_ms: 13, on_timeout: fallback_level_1 }
    - { name: bandit_selector, timeout_ms: 18, on_timeout: fallback_level_1 }
    - { name: onboarding_ui, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: experiment_platform, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: activation_labels, timeout_ms: 7, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to first value"
    - "Week-4 retention"
privacy:
  pii_in_logs: false
  retention_days: 400
