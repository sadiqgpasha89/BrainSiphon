serving:
  deadline_ms: 80
  stages:
    - { name: traffic_metrics, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: forecaster, timeout_ms: 16, on_timeout: fallback_level_1 }
    - { name: capacity_model, timeout_ms: 15, on_timeout: fallback_level_1 }
    - { name: scaling_controller, timeout_ms: 15, on_timeout: fallback_level_1 }
    - { name: orchestrator, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: sre_oversight, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: slo_outcomes, timeout_ms: 6, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "SLO attainment"
    - "Infrastructure cost per request"
privacy:
  pii_in_logs: false
  retention_days: 400
