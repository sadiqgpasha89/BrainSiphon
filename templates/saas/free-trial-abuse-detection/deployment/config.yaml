serving:
  deadline_ms: 80
  stages:
    - { name: signup_request, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: identity_graph_lookup, timeout_ms: 13, on_timeout: fallback_level_1 }
    - { name: abuse_model, timeout_ms: 27, on_timeout: fallback_level_1 }
    - { name: friction_policy, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: account_decisions, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: abuse_labels, timeout_ms: 10, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Trial abuse rate"
    - "Conversion rate of genuine trials"
privacy:
  pii_in_logs: false
  retention_days: 400
