serving:
  deadline_ms: 2500
  stages:
    - { name: alerts_and_telemetry, timeout_ms: 127, on_timeout: fallback_level_1 }
    - { name: topology_builder, timeout_ms: 191, on_timeout: fallback_level_1 }
    - { name: anomaly_onset_detector, timeout_ms: 509, on_timeout: fallback_level_1 }
    - { name: causal_ranker, timeout_ms: 508, on_timeout: fallback_level_1 }
    - { name: change_correlator, timeout_ms: 191, on_timeout: fallback_level_1 }
    - { name: llm_summary_with_evidence, timeout_ms: 508, on_timeout: fallback_level_1 }
    - { name: on_call_engineer, timeout_ms: 191, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Mean time to diagnose"
    - "Incident duration"
privacy:
  pii_in_logs: false
  retention_days: 400
