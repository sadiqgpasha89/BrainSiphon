serving:
  deadline_ms: 2500
  stages:
    - { name: incident_alert, timeout_ms: 257, on_timeout: fallback_level_1 }
    - { name: context_gatherer, timeout_ms: 342, on_timeout: fallback_level_1 }
    - { name: runbook_retriever, timeout_ms: 513, on_timeout: fallback_level_1 }
    - { name: planner_agent, timeout_ms: 685, on_timeout: fallback_level_1 }
    - { name: typed_ops_tools, timeout_ms: 171, on_timeout: fallback_level_1 }
    - { name: approval_gate, timeout_ms: 257, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Mean time to mitigate"
    - "Toil hours saved"
privacy:
  pii_in_logs: false
  retention_days: 400
