serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: product_and_billing_events, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: account_feature_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: churn_hazard_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: uplift_selector, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: csm_worklist, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: csm_outreach, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: renewal_outcomes, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Gross revenue retention"
    - "Net revenue retention"
privacy:
  pii_in_logs: false
  retention_days: 400
