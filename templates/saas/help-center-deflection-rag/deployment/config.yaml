serving:
  deadline_ms: 2500
  stages:
    - { name: user_question, timeout_ms: 223, on_timeout: fallback_level_1 }
    - { name: retriever, timeout_ms: 445, on_timeout: fallback_level_1 }
    - { name: reranker, timeout_ms: 593, on_timeout: fallback_level_1 }
    - { name: answer_llm, timeout_ms: 593, on_timeout: fallback_level_1 }
    - { name: groundedness_check, timeout_ms: 148, on_timeout: fallback_level_1 }
    - { name: gap_analytics, timeout_ms: 223, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Verified resolution rate"
    - "Ticket volume per active user"
privacy:
  pii_in_logs: false
  retention_days: 400
