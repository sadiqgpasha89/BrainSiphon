serving:
  deadline_ms: 2500
  stages:
    - { name: change_event, timeout_ms: 186, on_timeout: fallback_level_1 }
    - { name: feature_builder, timeout_ms: 371, on_timeout: fallback_level_1 }
    - { name: failure_predictor, timeout_ms: 742, on_timeout: fallback_level_1 }
    - { name: selector, timeout_ms: 185, on_timeout: fallback_level_1 }
    - { name: ci_executor, timeout_ms: 278, on_timeout: fallback_level_1 }
    - { name: safety_net, timeout_ms: 185, on_timeout: fallback_level_1 }
    - { name: outcome_logging, timeout_ms: 278, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Escaped regressions"
    - "CI minutes per commit"
privacy:
  pii_in_logs: false
  retention_days: 400
