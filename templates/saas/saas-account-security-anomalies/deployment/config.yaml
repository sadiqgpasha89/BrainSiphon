serving:
  deadline_ms: 80
  stages:
    - { name: per_user_feature_state, timeout_ms: 12, on_timeout: fallback_level_1 }
    - { name: risk_model, timeout_ms: 25, on_timeout: fallback_level_1 }
    - { name: tenant_policy_engine, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: response, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: admin_console, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: verdicts, timeout_ms: 9, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Account takeovers detected"
    - "Admin-reported false alerts"
privacy:
  pii_in_logs: false
  retention_days: 400
