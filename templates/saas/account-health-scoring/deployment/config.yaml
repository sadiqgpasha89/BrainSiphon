serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: source_system_sync, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: feature_mart, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: health_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: driver_explainer, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: score_publisher, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: csm_playbook, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: renewal_outcomes, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Renewal rate of healthy vs unhealthy"
    - "CSM actions per score alert"
privacy:
  pii_in_logs: false
  retention_days: 400
