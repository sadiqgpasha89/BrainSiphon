serving:
  deadline_ms: 2500
  stages:
    - { name: upload, timeout_ms: 171, on_timeout: fallback_level_1 }
    - { name: ocr_and_layout, timeout_ms: 685, on_timeout: fallback_level_1 }
    - { name: classifier_and_extractor, timeout_ms: 684, on_timeout: fallback_level_1 }
    - { name: validation_rules, timeout_ms: 171, on_timeout: fallback_level_1 }
    - { name: workflow_trigger, timeout_ms: 257, on_timeout: fallback_level_1 }
    - { name: corrections, timeout_ms: 257, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Straight-through processing rate"
    - "Correction rate"
privacy:
  pii_in_logs: false
  retention_days: 400
