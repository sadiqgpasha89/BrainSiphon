serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: source_schema_and_samples, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: candidate_retriever, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: mapping_llm, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: validation_runner, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: approval_ui, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: pipeline_deploy, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Integration setup time"
    - "Data errors after integration"
privacy:
  pii_in_logs: false
  retention_days: 400
