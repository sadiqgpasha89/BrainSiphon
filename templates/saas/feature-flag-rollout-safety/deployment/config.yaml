serving:
  deadline_ms: 2500
  stages:
    - { name: flag_service, timeout_ms: 371, on_timeout: fallback_level_1 }
    - { name: exposure_logging, timeout_ms: 247, on_timeout: fallback_level_1 }
    - { name: metric_computation, timeout_ms: 247, on_timeout: fallback_level_1 }
    - { name: sequential_tester, timeout_ms: 371, on_timeout: fallback_level_1 }
    - { name: ramp_controller, timeout_ms: 247, on_timeout: fallback_level_1 }
    - { name: auto_rollback, timeout_ms: 371, on_timeout: fallback_level_1 }
    - { name: rollout_history, timeout_ms: 371, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Bad-change blast radius"
    - "Rollout time"
privacy:
  pii_in_logs: false
  retention_days: 400
