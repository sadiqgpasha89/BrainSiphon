serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: metric_profiler, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: seasonal_anomaly_detector, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: lineage_impact_ranker, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: alert_router, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: data_engineer, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Data incidents caught before consumers"
    - "Alert noise"
privacy:
  pii_in_logs: false
  retention_days: 400
