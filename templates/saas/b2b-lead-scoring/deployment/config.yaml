serving:
  deadline_ms: 80
  stages:
    - { name: lead_capture, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: enrichment, timeout_ms: 11, on_timeout: fallback_level_1 }
    - { name: feature_builder, timeout_ms: 11, on_timeout: fallback_level_1 }
    - { name: lead_scorer, timeout_ms: 22, on_timeout: fallback_level_1 }
    - { name: routing_engine, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: sales_development, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: opportunity_outcomes, timeout_ms: 8, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Pipeline created per SDR hour"
    - "Closed-won rate"
privacy:
  pii_in_logs: false
  retention_days: 400
