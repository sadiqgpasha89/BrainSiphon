serving:
  deadline_ms: 2500
  stages:
    - { name: ticket_thread, timeout_ms: 290, on_timeout: fallback_level_1 }
    - { name: context_fetcher, timeout_ms: 387, on_timeout: fallback_level_1 }
    - { name: retriever, timeout_ms: 580, on_timeout: fallback_level_1 }
    - { name: draft_llm, timeout_ms: 774, on_timeout: fallback_level_1 }
    - { name: citation_and_policy_check, timeout_ms: 194, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Handle time"
    - "First-contact resolution"
privacy:
  pii_in_logs: false
  retention_days: 400
