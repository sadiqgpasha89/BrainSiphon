serving:
  deadline_ms: 80
  stages:
    - { name: query, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: query_understanding, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: acl_aware_hybrid_retrieval, timeout_ms: 17, on_timeout: fallback_level_1 }
    - { name: learning_to_rank, timeout_ms: 22, on_timeout: fallback_level_1 }
    - { name: result_assembly, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: ui, timeout_ms: 8, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Search success rate"
    - "Time to find"
privacy:
  pii_in_logs: false
  retention_days: 400
