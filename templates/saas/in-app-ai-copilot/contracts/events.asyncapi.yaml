asyncapi: 3.0.0
info:
  title: In-App AI Copilot for SaaS Products events (illustrative)
  version: 0.1.0
  description: Generated from the blueprint's event schema. Partition by the entity key so one entity's events stay
    ordered.
channels:
  events:
    address: in.app.ai.copilot.events
    messages:
      event:
        $ref: '#/components/messages/Event'
operations:
  publishEvents:
    action: send
    channel:
      $ref: '#/channels/events'
components:
  messages:
    Event:
      name: Event
      contentType: application/json
      payload:
        $ref: '#/components/schemas/EventPayload'
  schemas:
    EventPayload:
      type: object
      properties:
        type:
          type: string
          enum:
          - TaskStateChanged
          - ToolCalled
          - ApprovalRequested
          - ApprovalDecided
        task_id:
          type: string
        step_no:
          type: integer
        from_state:
          type: string
        to_state:
          type: string
        tool:
          type: string
        actor:
          type: string
          enum:
          - agent
          - human
          - system
        occurred_at:
          type: string
          format: date-time
