serving:
  deadline_ms: 2500
  stages:
    - { name: pr_event, timeout_ms: 212, on_timeout: fallback_level_1 }
    - { name: diff_and_context_retriever, timeout_ms: 636, on_timeout: fallback_level_1 }
    - { name: verifier, timeout_ms: 212, on_timeout: fallback_level_1 }
    - { name: comment_ranker, timeout_ms: 847, on_timeout: fallback_level_1 }
    - { name: pr_comments, timeout_ms: 318, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Defects found pre-merge"
    - "Developer mute/disable rate"
privacy:
  pii_in_logs: false
  retention_days: 400
