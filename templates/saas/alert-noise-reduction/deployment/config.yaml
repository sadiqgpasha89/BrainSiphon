serving:
  deadline_ms: 80
  stages:
    - { name: alert_stream, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: entity_and_ownership_resolver, timeout_ms: 22, on_timeout: fallback_level_1 }
    - { name: actionability_model, timeout_ms: 22, on_timeout: fallback_level_1 }
    - { name: correlator, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: suppression_policy, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: on_call_routing, timeout_ms: 8, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Pages per on-call shift"
    - "Mean time to acknowledge"
privacy:
  pii_in_logs: false
  retention_days: 400
