serving:
  deadline_ms: 80
  stages:
    - { name: ticket_creation, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: language_detector, timeout_ms: 20, on_timeout: fallback_level_1 }
    - { name: classifier, timeout_ms: 20, on_timeout: fallback_level_1 }
    - { name: incident_linker, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: routing_engine, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: resolution_outcomes, timeout_ms: 7, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "SLA breach rate"
    - "Time to first response"
privacy:
  pii_in_logs: false
  retention_days: 400
