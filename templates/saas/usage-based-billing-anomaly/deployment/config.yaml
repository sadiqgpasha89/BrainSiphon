serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: usage_events, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: independent_meter, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: reconciliation_engine, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: baseline_anomaly_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: invoice_generator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: dispute_outcomes, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Billing disputes"
    - "Revenue leakage recovered"
privacy:
  pii_in_logs: false
  retention_days: 400
