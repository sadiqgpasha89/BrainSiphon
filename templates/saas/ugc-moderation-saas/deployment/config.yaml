serving:
  deadline_ms: 80
  stages:
    - { name: content_api, timeout_ms: 10, on_timeout: fallback_level_1 }
    - { name: text_and_image_models, timeout_ms: 40, on_timeout: fallback_level_1 }
    - { name: tenant_policy_engine, timeout_ms: 10, on_timeout: fallback_level_1 }
    - { name: policy_simulator, timeout_ms: 10, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Violating content exposure"
    - "Review workload"
privacy:
  pii_in_logs: false
  retention_days: 400
