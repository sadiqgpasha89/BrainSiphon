serving:
  deadline_ms: 2500
  stages:
    - { name: question, timeout_ms: 185, on_timeout: fallback_level_1 }
    - { name: schema_and_metric_linker, timeout_ms: 371, on_timeout: fallback_level_1 }
    - { name: sql_generator, timeout_ms: 495, on_timeout: fallback_level_1 }
    - { name: validator_and_cost_guard, timeout_ms: 495, on_timeout: fallback_level_1 }
    - { name: read_only_executor, timeout_ms: 185, on_timeout: fallback_level_1 }
    - { name: result_explainer, timeout_ms: 494, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Self-serve query success"
    - "Analyst request backlog"
privacy:
  pii_in_logs: false
  retention_days: 400
