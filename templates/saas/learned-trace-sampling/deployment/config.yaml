serving:
  deadline_ms: 8
  stages:
    - { name: span_ingestion, timeout_ms: 0.7, on_timeout: fallback_level_1 }
    - { name: trace_assembler, timeout_ms: 1, on_timeout: fallback_level_1 }
    - { name: value_estimator, timeout_ms: 2.7, on_timeout: fallback_level_1 }
    - { name: budget_controller, timeout_ms: 0.7, on_timeout: fallback_level_1 }
    - { name: sampler, timeout_ms: 0.6, on_timeout: fallback_level_1 }
    - { name: storage, timeout_ms: 1, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Debug success with sampled data"
    - "Observability cost"
privacy:
  pii_in_logs: false
  retention_days: 400
