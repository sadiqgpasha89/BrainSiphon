# Overrides for deployment/helm/ai-solution in the free BrainSiphon deployment kit, for Learned Trace & Telemetry Sampling.
# Modelled sizing at 10M registered users. Replace with your measured peak, and set autoscaling bounds from a load test.
# Blueprint compute statement: 16,667 8-vCPU pods for 41,666,667 req/s (≈2,500 scores/s per pod (GBDT / small NN, features already in memory)); 1389 online feature-store shards and 5430 event-bus partitions.
replicaCount: 16667   # modelled pods at peak, including failover headroom
resources:
  requests:
    cpu: '8000m'
  limits:
    cpu: '8000m'
