serving:
  deadline_ms: 2500
  stages:
    - { name: event_ingestion, timeout_ms: 165, on_timeout: fallback_level_1 }
    - { name: entity_and_location_resolution, timeout_ms: 247, on_timeout: fallback_level_1 }
    - { name: supply_link, timeout_ms: 247, on_timeout: fallback_level_1 }
    - { name: impact_estimate, timeout_ms: 660, on_timeout: fallback_level_1 }
    - { name: brief_draft, timeout_ms: 659, on_timeout: fallback_level_1 }
    - { name: outcome_tracking, timeout_ms: 247, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Lead time before disruption impact"
    - "Expedite cost"
    - "Alerts dismissed as irrelevant"
privacy:
  pii_in_logs: false
  retention_days: 400
