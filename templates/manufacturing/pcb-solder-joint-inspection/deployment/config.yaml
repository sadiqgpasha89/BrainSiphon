serving:
  deadline_ms: 80
  stages:
    - { name: board_image_and_height_capture, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: joint_extraction, timeout_ms: 13, on_timeout: fallback_level_1 }
    - { name: joint_classifier, timeout_ms: 25, on_timeout: fallback_level_1 }
    - { name: package_thresholds, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: repair_guidance, timeout_ms: 10, on_timeout: fallback_level_1 }
    - { name: process_cause_link, timeout_ms: 10, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Boards failing at test"
    - "Repair time"
    - "False call rate at inspection"
privacy:
  pii_in_logs: false
  retention_days: 400
