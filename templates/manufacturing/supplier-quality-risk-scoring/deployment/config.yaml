serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: receipt_and_inspection_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: supplier_feature_build, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: risk_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: inspection_level_mapping, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: receiving_instruction, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: result_capture, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: retrain, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Inspection hours"
    - "Line stops from incoming defects"
    - "Skip-lot share"
privacy:
  pii_in_logs: false
  retention_days: 400
