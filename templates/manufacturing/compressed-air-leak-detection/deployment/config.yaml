serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: flow_and_pressure_capture, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: idle_period_detection, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: baseline_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: leak_growth_detector, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: priority_list, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: work_order, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: savings_verification, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Air energy per unit produced"
    - "Leaks repaired"
    - "Compressor hours"
privacy:
  pii_in_logs: false
  retention_days: 400
