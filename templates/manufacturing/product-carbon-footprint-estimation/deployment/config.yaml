serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: bom_and_routing_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: factor_library, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: energy_allocation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: estimator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: uncertainty_and_lever_analysis, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Footprint reduction in redesigned products"
    - "Supplier data coverage"
    - "Audit findings"
privacy:
  pii_in_logs: false
  retention_days: 400
