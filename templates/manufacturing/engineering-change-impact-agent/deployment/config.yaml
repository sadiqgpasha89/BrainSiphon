serving:
  deadline_ms: 2500
  stages:
    - { name: change_request_intake, timeout_ms: 165, on_timeout: fallback_level_1 }
    - { name: structure_expansion, timeout_ms: 247, on_timeout: fallback_level_1 }
    - { name: impact_enrichment, timeout_ms: 330, on_timeout: fallback_level_1 }
    - { name: risk_and_cost_estimate, timeout_ms: 659, on_timeout: fallback_level_1 }
    - { name: draft_assessment, timeout_ms: 659, on_timeout: fallback_level_1 }
    - { name: decision_capture, timeout_ms: 165, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to assess a change"
    - "Post-release change surprises"
    - "Obsolete stock created"
privacy:
  pii_in_logs: false
  retention_days: 400
