  stages:
    - { name: complaint_intake, timeout_ms: 148, on_timeout: fallback_level_1 }
    - { name: genealogy_trace, timeout_ms: 223, on_timeout: fallback_level_1 }
    - { name: process_and_supplier_evidence, timeout_ms: 223, on_timeout: fallback_level_1 }
    - { name: hypothesis_ranking, timeout_ms: 593, on_timeout: fallback_level_1 }
    - { name: containment_draft, timeout_ms: 593, on_timeout: fallback_level_1 }
    - { name: engineer_approval, timeout_ms: 223, on_timeout: fallback_level_1 }
    - { name: action_tracking, timeout_ms: 222, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to containment"
    - "Parts shipped after a known issue"
    - "Escape recurrence"
privacy:
  pii_in_logs: false
  retention_days: 400
