serving:
  deadline_ms: 2500
  stages:
    - { name: stop_event_intake, timeout_ms: 212, on_timeout: fallback_level_1 }
    - { name: alarm_sequence_build, timeout_ms: 212, on_timeout: fallback_level_1 }
    - { name: precedent_retrieval, timeout_ms: 636, on_timeout: fallback_level_1 }
    - { name: cause_ranking, timeout_ms: 847, on_timeout: fallback_level_1 }
    - { name: shift_lead_confirmation, timeout_ms: 318, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Mean time to restart"
    - "Share of stops with a verified cause"
    - "Repeat stops"
privacy:
  pii_in_logs: false
  retention_days: 400
