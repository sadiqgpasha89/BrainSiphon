serving:
  deadline_ms: 2500
  stages:
    - { name: mission_intake, timeout_ms: 127, on_timeout: fallback_level_1 }
    - { name: assignment, timeout_ms: 509, on_timeout: fallback_level_1 }
    - { name: path_planning_with_reservations, timeout_ms: 508, on_timeout: fallback_level_1 }
    - { name: blockage_prediction, timeout_ms: 508, on_timeout: fallback_level_1 }
    - { name: command_dispatch, timeout_ms: 191, on_timeout: fallback_level_1 }
    - { name: simulation_tests, timeout_ms: 191, on_timeout: fallback_level_1 }
    - { name: performance_monitor, timeout_ms: 191, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Throughput"
    - "Mission wait time"
    - "Interventions per shift"
privacy:
  pii_in_logs: false
  retention_days: 400
