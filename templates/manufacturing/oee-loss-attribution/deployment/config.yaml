serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: machine_state_capture, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: stop_classification, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: loss_tree, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: unexplained_loss_flag, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: pareto_and_cost, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: action_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: quality_join, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "OEE improvement on targeted lines"
    - "Time spent producing the report"
    - "Loss closed per quarter"
privacy:
  pii_in_logs: false
  retention_days: 400
