serving:
  deadline_ms: 2500
  stages:
    - { name: cell_gateway, timeout_ms: 262, on_timeout: fallback_level_1 }
    - { name: parameter_band_decision, timeout_ms: 262, on_timeout: fallback_level_1 }
    - { name: supervisor_approval, timeout_ms: 393, on_timeout: fallback_level_1 }
    - { name: change_history, timeout_ms: 523, on_timeout: fallback_level_1 }
    - { name: edit_drift_monitor, timeout_ms: 393, on_timeout: fallback_level_1 }
    - { name: change_replay_console, timeout_ms: 392, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Out-of-band edits stopped before the line"
    - "Scrap tied to agent changes"
    - "Minutes to pull a change history for quality"
privacy:
  pii_in_logs: false
  retention_days: 400
