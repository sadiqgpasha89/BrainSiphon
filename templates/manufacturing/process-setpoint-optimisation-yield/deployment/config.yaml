serving:
  deadline_ms: 2500
  stages:
    - { name: process_data_capture, timeout_ms: 154, on_timeout: fallback_level_1 }
    - { name: process_model, timeout_ms: 614, on_timeout: fallback_level_1 }
    - { name: constrained_optimiser, timeout_ms: 614, on_timeout: fallback_level_1 }
    - { name: safety_clip, timeout_ms: 153, on_timeout: fallback_level_1 }
    - { name: advisory_display, timeout_ms: 230, on_timeout: fallback_level_1 }
    - { name: operator_action_log, timeout_ms: 230, on_timeout: fallback_level_1 }
    - { name: matched_control_evaluation, timeout_ms: 230, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Yield improvement against matched controls"
    - "Energy per unit"
    - "Off-spec output"
privacy:
  pii_in_logs: false
  retention_days: 400
