serving:
  deadline_ms: 2500
  stages:
    - { name: process_data_capture, timeout_ms: 159, on_timeout: fallback_level_1 }
    - { name: alignment_to_part_or_lot, timeout_ms: 318, on_timeout: fallback_level_1 }
    - { name: feature_build, timeout_ms: 318, on_timeout: fallback_level_1 }
    - { name: quality_model, timeout_ms: 636, on_timeout: fallback_level_1 }
    - { name: reason_display, timeout_ms: 238, on_timeout: fallback_level_1 }
    - { name: engineer_action_log, timeout_ms: 238, on_timeout: fallback_level_1 }
    - { name: outcome_labels, timeout_ms: 318, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Scrap and rework rate"
    - "Lots diverted early"
    - "Engineer response time"
privacy:
  pii_in_logs: false
  retention_days: 400
