serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: production_plan_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: labour_demand_forecast, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: skill_and_rule_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: roster_optimiser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outcome_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Overtime hours"
    - "Understaffed shifts"
    - "Skill gaps closed"
privacy:
  pii_in_logs: false
  retention_days: 400
