serving:
  deadline_ms: 80
  stages:
    - { name: camera_capture, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: person_detection, timeout_ms: 28, on_timeout: fallback_level_1 }
    - { name: zone_logic, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: warning_output, timeout_ms: 11, on_timeout: fallback_level_1 }
    - { name: advisory_signal, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: near_miss_statistics, timeout_ms: 10, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Near misses"
    - "Zone violations"
    - "False warning rate"
privacy:
  pii_in_logs: false
  retention_days: 400
