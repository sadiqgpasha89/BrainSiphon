serving:
  deadline_ms: 2500
  stages:
    - { name: cycle_data_capture, timeout_ms: 178, on_timeout: fallback_level_1 }
    - { name: drift_detection, timeout_ms: 356, on_timeout: fallback_level_1 }
    - { name: move_proposal, timeout_ms: 712, on_timeout: fallback_level_1 }
    - { name: safe_range_check, timeout_ms: 178, on_timeout: fallback_level_1 }
    - { name: setter_approval, timeout_ms: 267, on_timeout: fallback_level_1 }
    - { name: part_quality_check, timeout_ms: 267, on_timeout: fallback_level_1 }
    - { name: learning_update, timeout_ms: 267, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Scrap rate"
    - "Setup time"
    - "Setter interventions per shift"
privacy:
  pii_in_logs: false
  retention_days: 400
