serving:
  deadline_ms: 2500
  stages:
    - { name: redaction, timeout_ms: 848, on_timeout: fallback_level_1 }
    - { name: rule_layer_for_mandatory_cases, timeout_ms: 212, on_timeout: fallback_level_1 }
    - { name: classifier, timeout_ms: 847, on_timeout: fallback_level_1 }
    - { name: trend_analytics, timeout_ms: 318, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to route severe reports"
    - "Systemic hazards identified"
    - "Reporting rate"
privacy:
  pii_in_logs: false
  retention_days: 400
