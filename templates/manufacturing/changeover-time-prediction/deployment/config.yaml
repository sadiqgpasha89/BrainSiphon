serving:
  deadline_ms: 2500
  stages:
    - { name: changeover_history, timeout_ms: 209, on_timeout: fallback_level_1 }
    - { name: pair_feature_build, timeout_ms: 278, on_timeout: fallback_level_1 }
    - { name: duration_model, timeout_ms: 556, on_timeout: fallback_level_1 }
    - { name: interval_estimate, timeout_ms: 556, on_timeout: fallback_level_1 }
    - { name: scheduler_feed, timeout_ms: 209, on_timeout: fallback_level_1 }
    - { name: overrun_flags, timeout_ms: 209, on_timeout: fallback_level_1 }
    - { name: retrain, timeout_ms: 208, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Schedule adherence"
    - "Changeover hours"
    - "Late orders from changeover overruns"
privacy:
  pii_in_logs: false
  retention_days: 400
