serving:
  deadline_ms: 2500
  stages:
    - { name: weld_image_and_curve_capture, timeout_ms: 144, on_timeout: fallback_level_1 }
    - { name: curve_alignment, timeout_ms: 215, on_timeout: fallback_level_1 }
    - { name: bead_feature_model, timeout_ms: 574, on_timeout: fallback_level_1 }
    - { name: combined_quality_model, timeout_ms: 574, on_timeout: fallback_level_1 }
    - { name: decision_and_routing, timeout_ms: 144, on_timeout: fallback_level_1 }
    - { name: model_update, timeout_ms: 574, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Rework per thousand welds"
    - "Destructive tests needed"
    - "Weld-related warranty claims"
privacy:
  pii_in_logs: false
  retention_days: 400
