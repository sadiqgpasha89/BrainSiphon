serving:
  deadline_ms: 2500
  stages:
    - { name: question_and_photo_intake, timeout_ms: 194, on_timeout: fallback_level_1 }
    - { name: asset_resolution, timeout_ms: 290, on_timeout: fallback_level_1 }
    - { name: document_and_history_retrieval, timeout_ms: 580, on_timeout: fallback_level_1 }
    - { name: grounded_procedure, timeout_ms: 774, on_timeout: fallback_level_1 }
    - { name: safety_content_injection, timeout_ms: 194, on_timeout: fallback_level_1 }
    - { name: fix_capture, timeout_ms: 193, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Mean time to repair"
    - "First-time fix rate"
    - "Expert escalations"
privacy:
  pii_in_logs: false
  retention_days: 400
