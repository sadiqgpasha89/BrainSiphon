serving:
  deadline_ms: 2500
  stages:
    - { name: camera_capture_and_face_blur, timeout_ms: 186, on_timeout: fallback_level_1 }
    - { name: person_and_ppe_detection, timeout_ms: 742, on_timeout: fallback_level_1 }
    - { name: aggregation_by_zone_and_hour, timeout_ms: 371, on_timeout: fallback_level_1 }
    - { name: statistics_upload, timeout_ms: 185, on_timeout: fallback_level_1 }
    - { name: ehs_dashboard, timeout_ms: 278, on_timeout: fallback_level_1 }
    - { name: training_targeting, timeout_ms: 278, on_timeout: fallback_level_1 }
    - { name: retention_enforcement, timeout_ms: 185, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Compliance rate in targeted zones"
    - "Training sessions targeted"
    - "Complaints about monitoring"
privacy:
  pii_in_logs: false
  retention_days: 400
