serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: demand_and_receipts, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: distribution_fitting, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: policy_optimiser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: constraint_filter, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: order_proposals, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: buyer_approval, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outcome_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Stock-outs"
    - "Inventory value"
    - "Expedite orders"
privacy:
  pii_in_logs: false
  retention_days: 400
