serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: condition_data_capture, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: indicator_extraction, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: life_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: interval_and_calibration, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: risk_ranking, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: work_order_proposal, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Unplanned downtime hours"
    - "Planned versus emergency repairs"
    - "Spare parts held"
privacy:
  pii_in_logs: false
  retention_days: 400
