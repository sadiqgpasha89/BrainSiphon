serving:
  deadline_ms: 2500
  stages:
    - { name: order_and_capacity_intake, timeout_ms: 194, on_timeout: fallback_level_1 }
    - { name: duration_prediction, timeout_ms: 774, on_timeout: fallback_level_1 }
    - { name: constraint_model, timeout_ms: 774, on_timeout: fallback_level_1 }
    - { name: plan_stability_filter, timeout_ms: 193, on_timeout: fallback_level_1 }
    - { name: release_to_mes, timeout_ms: 290, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "On-time delivery"
    - "Changeover hours"
    - "Work in progress"
privacy:
  pii_in_logs: false
  retention_days: 400
