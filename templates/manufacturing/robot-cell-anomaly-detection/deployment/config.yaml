serving:
  deadline_ms: 2500
  stages:
    - { name: controller_signal_capture, timeout_ms: 159, on_timeout: fallback_level_1 }
    - { name: cycle_segmentation, timeout_ms: 636, on_timeout: fallback_level_1 }
    - { name: signature_model, timeout_ms: 636, on_timeout: fallback_level_1 }
    - { name: joint_explanation, timeout_ms: 318, on_timeout: fallback_level_1 }
    - { name: alert_routing, timeout_ms: 238, on_timeout: fallback_level_1 }
    - { name: baseline_refresh, timeout_ms: 238, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Unplanned robot stops"
    - "Time to find the fault"
    - "Alerts closed as no fault"
privacy:
  pii_in_logs: false
  retention_days: 400
