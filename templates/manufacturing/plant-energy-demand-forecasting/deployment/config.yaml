serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: meter_data_ingestion, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: plant_cleaning, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: feature_build, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: plant_quantile_forecast, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: plant_reconciliation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: plant_peak_alert, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: plant_accuracy_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Demand charges"
    - "Energy cost per unit"
    - "Forecast bias at peak"
privacy:
  pii_in_logs: false
  retention_days: 400
