serving:
  deadline_ms: 2500
  stages:
    - { name: query_intake, timeout_ms: 154, on_timeout: fallback_level_1 }
    - { name: shape_and_text_embedding, timeout_ms: 614, on_timeout: fallback_level_1 }
    - { name: candidate_retrieval, timeout_ms: 460, on_timeout: fallback_level_1 }
    - { name: constraint_re_ranking, timeout_ms: 614, on_timeout: fallback_level_1 }
    - { name: permission_filter, timeout_ms: 153, on_timeout: fallback_level_1 }
    - { name: result_display, timeout_ms: 230, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Part reuse rate"
    - "New part numbers avoided"
    - "Time to find a design"
privacy:
  pii_in_logs: false
  retention_days: 400
