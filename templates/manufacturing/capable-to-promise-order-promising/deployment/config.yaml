serving:
  deadline_ms: 80
  stages:
    - { name: order_request, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: stock_and_capacity_check, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: delay_model, timeout_ms: 23, on_timeout: fallback_level_1 }
    - { name: allocation_policy, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: promise_response, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: reservation, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: performance_tracking, timeout_ms: 8, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Promise reliability"
    - "Orders re-dated"
    - "Expedite cost"
privacy:
  pii_in_logs: false
  retention_days: 400
