serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: change_records_and_outcomes, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: matching_and_effect_estimation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: process_model_simulation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: uncertainty_estimate, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: trial_ranking, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outcome_capture, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Trials with positive results"
    - "Time to validate changes"
    - "Failed trials"
privacy:
  pii_in_logs: false
  retention_days: 400
