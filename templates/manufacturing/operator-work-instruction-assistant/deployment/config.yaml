serving:
  deadline_ms: 2500
  stages:
    - { name: question_intake, timeout_ms: 165, on_timeout: fallback_level_1 }
    - { name: station_context, timeout_ms: 330, on_timeout: fallback_level_1 }
    - { name: retrieval, timeout_ms: 494, on_timeout: fallback_level_1 }
    - { name: answer_with_citation, timeout_ms: 659, on_timeout: fallback_level_1 }
    - { name: critical_step_insertion, timeout_ms: 330, on_timeout: fallback_level_1 }
    - { name: usage_analytics, timeout_ms: 247, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Operator questions to supervisors"
    - "First-pass yield on changeovers"
    - "Training time for new operators"
privacy:
  pii_in_logs: false
  retention_days: 400
