serving:
  deadline_ms: 80
  stages:
    - { name: image_capture_and_trigger, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: quality_gate_on_image, timeout_ms: 12, on_timeout: fallback_level_1 }
    - { name: defect_detection, timeout_ms: 31, on_timeout: fallback_level_1 }
    - { name: calibrated_thresholds, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: reject_or_flag, timeout_ms: 11, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Customer escapes per million"
    - "False reject cost"
    - "Inspection labour hours"
privacy:
  pii_in_logs: false
  retention_days: 400
