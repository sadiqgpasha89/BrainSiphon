serving:
  deadline_ms: 2500
  stages:
    - { name: data_request_and_intake, timeout_ms: 165, on_timeout: fallback_level_1 }
    - { name: retrieval_and_calculation_tools, timeout_ms: 495, on_timeout: fallback_level_1 }
    - { name: gap_and_anomaly_checks, timeout_ms: 659, on_timeout: fallback_level_1 }
    - { name: draft_narrative, timeout_ms: 659, on_timeout: fallback_level_1 }
    - { name: disclosure_export, timeout_ms: 247, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Days to produce the report"
    - "Audit findings"
    - "Manual corrections"
privacy:
  pii_in_logs: false
  retention_days: 400
