serving:
  deadline_ms: 80
  stages:
    - { name: point_cloud_capture, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: segmentation_and_pose, timeout_ms: 20, on_timeout: fallback_level_1 }
    - { name: grasp_ranking, timeout_ms: 19, on_timeout: fallback_level_1 }
    - { name: motion_plan_and_collision_check, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: grasp_execution, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: outcome_label, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: retraining, timeout_ms: 7, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Picks per hour"
    - "Operator interventions"
    - "Jams"
privacy:
  pii_in_logs: false
  retention_days: 400
