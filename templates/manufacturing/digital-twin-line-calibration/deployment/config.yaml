serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: event_log_extraction, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: distribution_fitting, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: simulation_build, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: calibration, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: validation_on_held_out_weeks, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: scenario_library, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Decisions with simulated evidence"
    - "Trial costs avoided"
    - "Layout change surprises"
privacy:
  pii_in_logs: false
  retention_days: 400
