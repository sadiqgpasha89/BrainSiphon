serving:
  deadline_ms: 2500
  stages:
    - { name: measurement_ingestion, timeout_ms: 144, on_timeout: fallback_level_1 }
    - { name: stream_segmentation_by_tool_and_product, timeout_ms: 574, on_timeout: fallback_level_1 }
    - { name: drift_detectors, timeout_ms: 574, on_timeout: fallback_level_1 }
    - { name: alarm_scoring, timeout_ms: 574, on_timeout: fallback_level_1 }
    - { name: response_plan_lookup, timeout_ms: 215, on_timeout: fallback_level_1 }
    - { name: operator_acknowledgement, timeout_ms: 144, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time from drift onset to action"
    - "Out-of-spec output"
    - "Operator alarm acknowledgement rate"
privacy:
  pii_in_logs: false
  retention_days: 400
