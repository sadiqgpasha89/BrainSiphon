serving:
  deadline_ms: 2500
  stages:
    - { name: chat_or_voice_front_end, timeout_ms: 247, on_timeout: fallback_level_1 }
    - { name: symptom_extractor, timeout_ms: 660, on_timeout: fallback_level_1 }
    - { name: protocol_engine, timeout_ms: 247, on_timeout: fallback_level_1 }
    - { name: red_flag_overrides, timeout_ms: 165, on_timeout: fallback_level_1 }
    - { name: disposition_explainer, timeout_ms: 659, on_timeout: fallback_level_1 }
    - { name: outcome_follow_up, timeout_ms: 247, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Appropriate care-level match"
    - "Unnecessary ED visits avoided"
privacy:
  pii_in_logs: false
  retention_days: 400
