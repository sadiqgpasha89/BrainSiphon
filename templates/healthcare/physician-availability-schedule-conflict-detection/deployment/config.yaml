serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: schedule_event_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: event_normaliser_and_merger, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: temporal_and_spatial_conflict_checker, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: severity_ranker, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: fix_proposer, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: change_and_outcome_log, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Conflicts found before patients are affected"
    - "Cancelled or delayed appointments from conflicts"
    - "Scheduler time per conflict"
privacy:
  pii_in_logs: false
  retention_days: 400
