serving:
  deadline_ms: 80
  stages:
    - { name: emergency_call_intake, timeout_ms: 4, on_timeout: fallback_level_1 }
    - { name: priority_classifier, timeout_ms: 17, on_timeout: fallback_level_1 }
    - { name: demand_forecaster, timeout_ms: 17, on_timeout: fallback_level_1 }
    - { name: dispatch_optimiser, timeout_ms: 17, on_timeout: fallback_level_1 }
    - { name: repositioning_policy, timeout_ms: 4, on_timeout: fallback_level_1 }
    - { name: dispatcher_decision, timeout_ms: 4, on_timeout: fallback_level_1 }
    - { name: response_time_logs, timeout_ms: 7, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "90th percentile response time"
    - "Cardiac arrest survival"
privacy:
  pii_in_logs: false
  retention_days: 400
