asyncapi: 3.0.0
info:
  title: Medical Image De-Identification (DICOM) events (illustrative)
  version: 0.1.0
  description: Generated from the blueprint's event schema. Partition by the entity key so one entity's events stay
    ordered.
channels:
  events:
    address: dicom.image.deidentification.events
    messages:
      event:
        $ref: '#/components/messages/Event'
operations:
  publishEvents:
    action: send
    channel:
      $ref: '#/channels/events'
components:
  messages:
    Event:
      name: Event
      contentType: application/json
      payload:
        $ref: '#/components/schemas/EventPayload'
  schemas:
    EventPayload:
      type: object
      properties:
        type:
          type: string
          description: ObservationEmitted
        source_id:
          type: string
        frame_id:
          type: string
        events:
          type: string
          description: '[{''type'': ''string'', ''zone'': ''string'', ''score'': ''float''}]'
        model_version:
          type: string
        captured_at:
          type: string
          format: date-time
