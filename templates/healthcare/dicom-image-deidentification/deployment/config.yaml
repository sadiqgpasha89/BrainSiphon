serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: dicom_ingest, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: header_sanitiser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: pixel_text_detector, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: defacing, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: research_release, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Privacy incident count"
    - "Share-readiness throughput"
privacy:
  pii_in_logs: false
  retention_days: 400
