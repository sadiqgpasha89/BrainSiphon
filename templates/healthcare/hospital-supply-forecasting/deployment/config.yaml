serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: usage_and_po_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: driver_forecasts, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: demand_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: replenishment_policy, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: supply_chain_planner, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: order_system, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: stock_out_log, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Critical stock-outs"
    - "Expired inventory value"
privacy:
  pii_in_logs: false
  retention_days: 400
