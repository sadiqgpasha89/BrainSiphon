serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: contract_and_risk_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: dimension_score_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: dependency_graph_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: portfolio_risk_scorer, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: scenario_engine, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "High-exposure agreements reviewed"
    - "Risk reduced after remediation"
    - "Time from flag to action"
privacy:
  pii_in_logs: false
  retention_days: 400
