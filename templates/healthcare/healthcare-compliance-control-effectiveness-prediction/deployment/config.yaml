serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: control_and_event_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: control_rules, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: failure_risk_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: signal_explainer, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: next_test_scheduler, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: risk_owner_validation, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Failures caught before an audit finding"
    - "Test effort focused on at-risk controls"
    - "Time from risk rise to owner action"
privacy:
  pii_in_logs: false
  retention_days: 400
