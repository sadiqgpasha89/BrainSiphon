serving:
  deadline_ms: 2500
  stages:
    - { name: ct_mr_import, timeout_ms: 267, on_timeout: fallback_level_1 }
    - { name: preprocessing, timeout_ms: 178, on_timeout: fallback_level_1 }
    - { name: segmentation_ensemble, timeout_ms: 712, on_timeout: fallback_level_1 }
    - { name: uncertainty_and_qc, timeout_ms: 267, on_timeout: fallback_level_1 }
    - { name: contour_editor, timeout_ms: 267, on_timeout: fallback_level_1 }
    - { name: physician_approval, timeout_ms: 267, on_timeout: fallback_level_1 }
    - { name: edit_logging, timeout_ms: 267, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Planning time"
    - "Plan quality indicators"
privacy:
  pii_in_logs: false
  retention_days: 400
