serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: delivery_and_quality_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: external_risk_feed_loader, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: risk_feature_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: supplier_risk_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: criticality_overlay, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Disruption events avoided or mitigated"
    - "Critical-item stockouts"
    - "Share of high-risk suppliers with a mitigation plan"
privacy:
  pii_in_logs: false
  retention_days: 400
