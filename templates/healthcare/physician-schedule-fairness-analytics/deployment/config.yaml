serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: schedule_and_roster_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: burden_metric_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: group_comparison_and_dispersion, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: small_group_suppression, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: what_if_optimizer, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Disparity reduced across cycles"
    - "Leader time to prepare fairness reviews"
    - "Physician-reported fairness"
privacy:
  pii_in_logs: false
  retention_days: 400
