serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: source_extract_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: standardiser_and_blocker, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: pairwise_matcher, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: cluster_reconciler, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: survivorship_engine, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: data_steward_approval, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Share of records reconciled without manual work"
    - "Steward time per conflict"
    - "Directory and claims mismatches"
privacy:
  pii_in_logs: false
  retention_days: 400
