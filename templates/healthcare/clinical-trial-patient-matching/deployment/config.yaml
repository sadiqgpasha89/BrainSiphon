serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: trial_registry_sync, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: criteria_parser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: chart_retriever, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: evidence_extractor, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: logic_evaluator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: enrolment_outcomes, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Patients screened per coordinator hour"
    - "Enrolment rate"
privacy:
  pii_in_logs: false
  retention_days: 400
