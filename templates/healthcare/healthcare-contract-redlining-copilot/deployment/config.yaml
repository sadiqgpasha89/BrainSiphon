serving:
  deadline_ms: 2500
  stages:
    - { name: draft_and_playbook_intake, timeout_ms: 154, on_timeout: fallback_level_1 }
    - { name: clause_segmenter_and_classifier, timeout_ms: 614, on_timeout: fallback_level_1 }
    - { name: playbook_retriever, timeout_ms: 460, on_timeout: fallback_level_1 }
    - { name: redline_drafter, timeout_ms: 614, on_timeout: fallback_level_1 }
    - { name: approved_language_and_policy_guard, timeout_ms: 153, on_timeout: fallback_level_1 }
    - { name: accepted_and_rejected_redline_log, timeout_ms: 230, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Counsel review time per contract"
    - "Playbook adherence in signed contracts"
    - "Cycle time to signature"
privacy:
  pii_in_logs: false
  retention_days: 400
