serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: gap_and_candidate_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: eligibility_filter, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: access_gain_calculator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: expansion_optimizer, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: scenario_comparer, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Members brought within the access standard"
    - "Cost per member reached"
    - "Scenario adoption by strategy teams"
privacy:
  pii_in_logs: false
  retention_days: 400
