serving:
  deadline_ms: 2500
  stages:
    - { name: evidence_retriever, timeout_ms: 742, on_timeout: fallback_level_1 }
    - { name: verification_tool_caller, timeout_ms: 247, on_timeout: fallback_level_1 }
    - { name: summary_and_draft_agent, timeout_ms: 989, on_timeout: fallback_level_1 }
    - { name: policy_and_permission_guard, timeout_ms: 247, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Recredentialing cycle time"
    - "Specialist hours per case"
    - "Cases completed before expiry"
privacy:
  pii_in_logs: false
  retention_days: 400
