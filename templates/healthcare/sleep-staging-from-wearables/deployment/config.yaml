serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: sensor_streams, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: epoch_features, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: sleep_stage_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: night_summary, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: coaching_logic, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: psg_validation, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Weekly active users"
    - "Clinical referral accuracy"
privacy:
  pii_in_logs: false
  retention_days: 400
