serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: invoice_and_contract_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: item_crosswalk_matcher, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: expected_price_engine, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: variance_cause_classifier, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: residual_anomaly_ranker, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: finance_validation, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Recovered amount"
    - "Time to dispute resolution"
    - "Share of variance explained automatically"
privacy:
  pii_in_logs: false
  retention_days: 400
