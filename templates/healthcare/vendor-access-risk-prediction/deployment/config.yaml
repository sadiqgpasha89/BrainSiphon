serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: access_event_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: policy_and_allow_list_rules, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: baseline_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: sequence_and_graph_anomaly_detector, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: explanation_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Confirmed policy exceptions found"
    - "Reviewer time per alert"
    - "False-alarm rate"
privacy:
  pii_in_logs: false
  retention_days: 400
