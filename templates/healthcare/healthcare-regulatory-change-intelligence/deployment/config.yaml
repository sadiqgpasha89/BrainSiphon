serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: source_ingestion, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: versioned_document_store, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: change_detector, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: applicability_candidate_ranker, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: cited_summary_drafter, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: citation_and_source_guard, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time from publication to review"
    - "Relevant changes missed"
    - "Reviewer time per change"
privacy:
  pii_in_logs: false
  retention_days: 400
