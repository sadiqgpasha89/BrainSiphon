serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: aggregate_absence_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: suppression_and_aggregation_rules, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: absence_forecaster, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: contingency_sizing, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Contingency cover available when needed"
    - "Premium hours on high-absence days"
    - "Short-notice gap rate"
privacy:
  pii_in_logs: false
  retention_days: 400
