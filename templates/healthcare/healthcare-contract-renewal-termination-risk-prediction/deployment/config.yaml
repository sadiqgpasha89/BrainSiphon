serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: contract_and_spend_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: notice_calendar_rules, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: renewal_risk_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: evidence_gap_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Renewals reviewed before notice deadline"
    - "Savings from renegotiation"
    - "Contracts renewed by default"
privacy:
  pii_in_logs: false
  retention_days: 400
