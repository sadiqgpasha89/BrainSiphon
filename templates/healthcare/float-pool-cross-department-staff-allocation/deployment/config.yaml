serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: shortage_and_availability_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: eligibility_rules, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: allocation_optimizer, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: fairness_and_cost_evaluator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: publish_and_notification, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Coverage achieved at shift start"
    - "Premium labour hours avoided"
    - "Float-pool retention"
privacy:
  pii_in_logs: false
  retention_days: 400
