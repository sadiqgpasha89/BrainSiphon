serving:
  deadline_ms: 2500
  stages:
    - { name: request_and_evidence_intake, timeout_ms: 194, on_timeout: fallback_level_1 }
    - { name: hybrid_retriever, timeout_ms: 580, on_timeout: fallback_level_1 }
    - { name: evidence_grading, timeout_ms: 194, on_timeout: fallback_level_1 }
    - { name: internal_analytics_builder, timeout_ms: 290, on_timeout: fallback_level_1 }
    - { name: packet_drafter_with_citations, timeout_ms: 774, on_timeout: fallback_level_1 }
    - { name: citation_and_policy_guard, timeout_ms: 193, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Committee preparation time"
    - "Decisions deferred for missing evidence"
    - "Post-decision realised value versus the packet estimate"
privacy:
  pii_in_logs: false
  retention_days: 400
