serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: dispense_and_inventory_feed, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: substitution_graph, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: demand_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: expiry_aware_optimiser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: transfer_recommender, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: pharmacist_approval, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: waste_and_availability_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Out-of-stock rate"
    - "Expired stock value"
privacy:
  pii_in_logs: false
  retention_days: 400
