serving:
  deadline_ms: 2500
  stages:
    - { name: slide_scanner_output, timeout_ms: 257, on_timeout: fallback_level_1 }
    - { name: tissue_segmentation_and_tiling, timeout_ms: 685, on_timeout: fallback_level_1 }
    - { name: tile_encoder, timeout_ms: 684, on_timeout: fallback_level_1 }
    - { name: mil_aggregator, timeout_ms: 342, on_timeout: fallback_level_1 }
    - { name: outcome_concordance, timeout_ms: 257, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to diagnosis"
    - "Second-opinion rate"
privacy:
  pii_in_logs: false
  retention_days: 400
