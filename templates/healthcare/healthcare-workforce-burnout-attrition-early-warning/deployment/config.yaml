serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: aggregated_hr_and_schedule_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: minimum_size_and_suppression_rules, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: team_level_risk_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: driver_explainer, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: leader_dashboard, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Voluntary attrition rate in supported units"
    - "Overtime and schedule-churn reduction after intervention"
    - "Pulse-survey trend"
privacy:
  pii_in_logs: false
  retention_days: 400
