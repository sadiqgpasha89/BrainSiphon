serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: indicator_and_metadata_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: data_quality_gate, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: adjusted_baseline_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: anomaly_detector, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: data_versus_performance_classifier, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Analyst-confirmed performance shifts caught early"
    - "Data defects found by the gate"
    - "Alert acknowledgement rate"
privacy:
  pii_in_logs: false
  retention_days: 400
