serving:
  deadline_ms: 2500
  stages:
    - { name: request_intake, timeout_ms: 594, on_timeout: fallback_level_1 }
    - { name: policy_retriever, timeout_ms: 445, on_timeout: fallback_level_1 }
    - { name: evidence_retriever, timeout_ms: 445, on_timeout: fallback_level_1 }
    - { name: criteria_checker, timeout_ms: 593, on_timeout: fallback_level_1 }
    - { name: decision_router, timeout_ms: 148, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Auto-approval rate"
    - "Turnaround time"
privacy:
  pii_in_logs: false
  retention_days: 400
