serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: census_and_schedule_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: workload_feature_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: hierarchical_demand_forecaster, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: reconciliation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: policy_floor_and_ratio_rules, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Fill rate of planned shifts at publication"
    - "Share of shifts covered by premium labour"
    - "Forecast-to-actual worked-hours gap"
privacy:
  pii_in_logs: false
  retention_days: 400
