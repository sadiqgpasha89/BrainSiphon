serving:
  deadline_ms: 2500
  stages:
    - { name: message_intake, timeout_ms: 223, on_timeout: fallback_level_1 }
    - { name: emergency_rule_layer, timeout_ms: 222, on_timeout: fallback_level_1 }
    - { name: urgency_classifier, timeout_ms: 890, on_timeout: fallback_level_1 }
    - { name: threshold_and_abstain_gate, timeout_ms: 222, on_timeout: fallback_level_1 }
    - { name: suggestion_display_with_rationale, timeout_ms: 334, on_timeout: fallback_level_1 }
    - { name: recipient_confirmation_or_correction, timeout_ms: 334, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to first response for urgent messages"
    - "Urgent messages escalated late"
    - "Share of suggestions corrected by recipients"
privacy:
  pii_in_logs: false
  retention_days: 400
