serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: schedule_and_punch_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: reconciliation_rule_engine, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: event_correlator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: exception_ranker, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: impact_estimator, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Corrections before payroll close"
    - "Post-payment recoveries avoided"
    - "Exception resolution time"
privacy:
  pii_in_logs: false
  retention_days: 400
