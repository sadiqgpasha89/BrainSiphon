contract: schedule_actual_time_discrepancy_inputs.v1
owner: payroll@example.com
system_of_record: Timekeeping system
schema:
  registry_compatibility: BACKWARD_TRANSITIVE
  fields:
    - { name: event_id, type: string, unique: true }
    - { name: event_time, type: timestamp, required: true, tz: UTC }
    - { name: punch_to_schedule_delta, type: double, nullable: false }
    - { name: edit_history, type: double, nullable: false }
    - { name: duplicate_signature, type: double, nullable: false }
sla:
  freshness_p95: available_before_run
  completeness: ">=99.9%"
  duplicates: "<0.01%"
on_breach: { notify: owner, action: quarantine_and_serve_stale, escalate_after: 30m }
