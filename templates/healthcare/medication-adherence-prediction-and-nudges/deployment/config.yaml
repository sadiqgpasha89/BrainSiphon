serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: pharmacy_fill_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: adherence_features, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: hazard_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: nudge_bandit, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outreach_platform, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: pharmacist_follow_up, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: refill_outcomes, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Proportion of days covered"
    - "Outreach cost per adherent patient"
privacy:
  pii_in_logs: false
  retention_days: 400
