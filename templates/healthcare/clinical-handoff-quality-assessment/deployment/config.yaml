serving:
  deadline_ms: 2500
  stages:
    - { name: handoff_note_intake, timeout_ms: 278, on_timeout: fallback_level_1 }
    - { name: section_and_field_extractor, timeout_ms: 1113, on_timeout: fallback_level_1 }
    - { name: checklist_validator, timeout_ms: 278, on_timeout: fallback_level_1 }
    - { name: consistency_checker, timeout_ms: 278, on_timeout: fallback_level_1 }
    - { name: quote_verifier, timeout_ms: 278, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Handoffs meeting the checklist"
    - "Reviewer time per handoff"
    - "Handoff-related communication events"
privacy:
  pii_in_logs: false
  retention_days: 400
