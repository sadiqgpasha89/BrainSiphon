serving:
  deadline_ms: 2500
  stages:
    - { name: message_event_intake, timeout_ms: 318, on_timeout: fallback_level_1 }
    - { name: response_time_survival_model, timeout_ms: 1271, on_timeout: fallback_level_1 }
    - { name: urgent_timer_override, timeout_ms: 318, on_timeout: fallback_level_1 }
    - { name: alert_limiter_and_explainer, timeout_ms: 318, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Messages meeting their service level"
    - "Time to acknowledgement"
    - "Late escalations avoided"
privacy:
  pii_in_logs: false
  retention_days: 400
