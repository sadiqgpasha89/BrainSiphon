serving:
  deadline_ms: 80
  stages:
    - { name: order_entry_hook, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: medication_list_service, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: interaction_scorer, timeout_ms: 21, on_timeout: fallback_level_1 }
    - { name: context_risk_model, timeout_ms: 20, on_timeout: fallback_level_1 }
    - { name: alert_tiering, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: prescriber_display, timeout_ms: 8, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Preventable adverse drug events"
    - "Alert override rate"
privacy:
  pii_in_logs: false
  retention_days: 400
