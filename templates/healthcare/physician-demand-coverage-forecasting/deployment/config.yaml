serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: demand_and_roster_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: feature_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: hierarchical_forecaster, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: reconciliation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: coverage_rules_and_shortage_risk, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: medical_group_leader_approval, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: forecast_and_outcome_log, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Coverage gaps found in advance"
    - "Locum and overtime spend"
    - "Share of plans approved without rework"
privacy:
  pii_in_logs: false
  retention_days: 400
