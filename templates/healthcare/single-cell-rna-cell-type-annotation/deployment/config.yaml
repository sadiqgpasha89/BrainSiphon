serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: count_matrices, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: qc_and_filtering, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: batch_corrected_embedding, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: reference_mapping, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: novelty_detector, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: atlas_update, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Annotation time per dataset"
    - "Curator corrections"
privacy:
  pii_in_logs: false
  retention_days: 400
