serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: findings_and_capacity_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: priority_rules, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: constraint_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: multi_objective_optimizer, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: scenario_and_overdue_forecaster, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: risk_owner_approval, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: plan_and_outcome_log, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Overdue findings"
    - "Risk reduced per unit of effort"
    - "Share of recurring findings"
privacy:
  pii_in_logs: false
  retention_days: 400
