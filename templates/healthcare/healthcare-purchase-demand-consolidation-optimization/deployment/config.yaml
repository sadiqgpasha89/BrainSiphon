serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: forecast_and_inventory_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: constraint_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: consolidation_optimizer, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: savings_and_risk_evaluator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: buyer_approval, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: order_release, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Tier savings achieved"
    - "Order count reduction"
    - "Critical-item service level"
privacy:
  pii_in_logs: false
  retention_days: 400
