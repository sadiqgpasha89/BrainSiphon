serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: performance_and_payment_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: program_year_rule_loader, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: exposure_scenario_calculator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: input_uncertainty_sampler, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Exposure estimate error at year end"
    - "Share of exposure explained by the top three measures"
    - "Time to refresh after a rule publication"
privacy:
  pii_in_logs: false
  retention_days: 400
