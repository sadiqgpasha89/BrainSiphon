serving:
  deadline_ms: 2500
  stages:
    - { name: confirmed_change_intake, timeout_ms: 186, on_timeout: fallback_level_1 }
    - { name: impact_graph_traversal, timeout_ms: 371, on_timeout: fallback_level_1 }
    - { name: clause_level_matcher, timeout_ms: 556, on_timeout: fallback_level_1 }
    - { name: task_plan_drafter, timeout_ms: 742, on_timeout: fallback_level_1 }
    - { name: permission_and_policy_guard, timeout_ms: 185, on_timeout: fallback_level_1 }
    - { name: compliance_owner_approval, timeout_ms: 185, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to approved implementation plan"
    - "Missed impacts found late"
    - "Planning effort per change"
privacy:
  pii_in_logs: false
  retention_days: 400
