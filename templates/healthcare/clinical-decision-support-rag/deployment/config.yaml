serving:
  deadline_ms: 2500
  stages:
    - { name: question_intake, timeout_ms: 202, on_timeout: fallback_level_1 }
    - { name: chart_context_fetch, timeout_ms: 405, on_timeout: fallback_level_1 }
    - { name: evidence_retriever, timeout_ms: 607, on_timeout: fallback_level_1 }
    - { name: reasoning_llm, timeout_ms: 809, on_timeout: fallback_level_1 }
    - { name: citation_verifier, timeout_ms: 202, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to answer"
    - "Clinician adoption and override rate"
privacy:
  pii_in_logs: false
  retention_days: 400
