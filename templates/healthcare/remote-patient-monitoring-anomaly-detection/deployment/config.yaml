serving:
  deadline_ms: 80
  stages:
    - { name: device_data, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: validation, timeout_ms: 12, on_timeout: fallback_level_1 }
    - { name: patient_baseline_model, timeout_ms: 31, on_timeout: fallback_level_1 }
    - { name: condition_rules, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: nurse_outreach, timeout_ms: 11, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Avoided admissions"
    - "Alert response time"
privacy:
  pii_in_logs: false
  retention_days: 400
