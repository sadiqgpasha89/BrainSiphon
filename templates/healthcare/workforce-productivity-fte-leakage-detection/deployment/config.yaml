serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: payroll_and_volume_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: data_quality_gate, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: kpi_normaliser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: variance_anomaly_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: exposure_and_evidence_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Recovered or explained exposure"
    - "Time to close an investigation"
    - "Share of leads closed as data defects"
privacy:
  pii_in_logs: false
  retention_days: 400
