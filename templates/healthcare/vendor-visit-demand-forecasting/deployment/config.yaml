serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: visit_and_booking_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: calendar_and_driver_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: visit_demand_forecaster, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: capacity_planner, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Peak wait time at the access desk"
    - "Desk staffing hours per visit"
    - "Visits outside the access window"
privacy:
  pii_in_logs: false
  retention_days: 400
