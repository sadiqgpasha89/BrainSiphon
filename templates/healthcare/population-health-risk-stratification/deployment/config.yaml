serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: claims_and_ehr_lake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: feature_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: risk_models, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: programme_assigner, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: care_manager_worklist, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outcomes, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Avoidable admissions in programme vs control"
    - "Programme cost per outcome"
privacy:
  pii_in_logs: false
  retention_days: 400
