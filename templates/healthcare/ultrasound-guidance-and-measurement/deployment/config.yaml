serving:
  deadline_ms: 80
  stages:
    - { name: probe_stream, timeout_ms: 4, on_timeout: fallback_level_1 }
    - { name: view_classifier, timeout_ms: 18, on_timeout: fallback_level_1 }
    - { name: guidance_generator, timeout_ms: 17, on_timeout: fallback_level_1 }
    - { name: landmark_tracker, timeout_ms: 17, on_timeout: fallback_level_1 }
    - { name: measurement_calculator, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: saved_study, timeout_ms: 7, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Scan success rate by novice operators"
    - "Time per exam"
privacy:
  pii_in_logs: false
  retention_days: 400
