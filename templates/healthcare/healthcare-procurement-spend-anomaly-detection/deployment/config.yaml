serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: purchase_and_invoice_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: unit_and_item_normaliser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: business_rule_checks, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: spend_anomaly_detector, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: exposure_ranker_and_evidence_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Recovered or avoided spend"
    - "Time to resolve an exception"
    - "False-alert share"
privacy:
  pii_in_logs: false
  retention_days: 400
