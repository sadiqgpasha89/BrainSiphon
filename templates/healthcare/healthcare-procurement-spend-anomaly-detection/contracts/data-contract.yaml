contract: healthcare_procurement_spend_anomaly_inputs.v1
owner: supply-chain-finance@example.com
system_of_record: Procurement and accounts-payable system
schema:
  registry_compatibility: BACKWARD_TRANSITIVE
  fields:
    - { name: event_id, type: string, unique: true }
    - { name: event_time, type: timestamp, required: true, tz: UTC }
    - { name: unit_price_deviation, type: double, nullable: false }
    - { name: order_frequency_change, type: double, nullable: false }
    - { name: supplier_concentration_shift, type: double, nullable: false }
sla:
  freshness_p95: available_before_run
  completeness: ">=99.9%"
  duplicates: "<0.01%"
on_breach: { notify: owner, action: quarantine_and_serve_stale, escalate_after: 30m }
