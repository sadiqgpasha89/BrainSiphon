serving:
  deadline_ms: 2500
  stages:
    - { name: query_interface, timeout_ms: 318, on_timeout: fallback_level_1 }
    - { name: query_translator, timeout_ms: 847, on_timeout: fallback_level_1 }
    - { name: patient_embedding_retrieval, timeout_ms: 636, on_timeout: fallback_level_1 }
    - { name: structured_filter_engine, timeout_ms: 212, on_timeout: fallback_level_1 }
    - { name: cohort_validator, timeout_ms: 212, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to build cohorts"
    - "Reuse of cohort definitions"
privacy:
  pii_in_logs: false
  retention_days: 400
