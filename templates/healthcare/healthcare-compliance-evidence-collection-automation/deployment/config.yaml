serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: requirement_and_owner_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: evidence_connectors, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: document_classifier_and_matcher, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: freshness_and_completeness_checker, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: binder_assembler_agent, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: control_owner_attestation, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Audit preparation hours"
    - "Evidence requests answered first time"
    - "Exceptions found before the audit"
privacy:
  pii_in_logs: false
  retention_days: 400
