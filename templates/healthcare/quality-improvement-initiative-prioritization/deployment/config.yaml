serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: proposal_and_gap_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: criteria_scoring, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: portfolio_optimizer_for_resource, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: sensitivity_and_equity_analysis, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: decision_record_and_benefit_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Realised benefit of selected projects"
    - "Portfolio utilisation of capacity"
    - "Share of mandatory deadlines met"
privacy:
  pii_in_logs: false
  retention_days: 400
