serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: message_and_policy_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: duplicate_clusterer, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: category_value_ranker, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: workload_forecaster, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: bundling_and_routing_optimizer, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Message volume per clinician per shift"
    - "Urgent messages reaching accountable recipients"
    - "Share of proposals approved by governance"
privacy:
  pii_in_logs: false
  retention_days: 400
