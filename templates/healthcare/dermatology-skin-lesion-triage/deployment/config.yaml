serving:
  deadline_ms: 2500
  stages:
    - { name: photo_capture, timeout_ms: 171, on_timeout: fallback_level_1 }
    - { name: quality_gate, timeout_ms: 257, on_timeout: fallback_level_1 }
    - { name: lesion_classifier, timeout_ms: 685, on_timeout: fallback_level_1 }
    - { name: conformal_uncertainty, timeout_ms: 684, on_timeout: fallback_level_1 }
    - { name: triage_policy, timeout_ms: 171, on_timeout: fallback_level_1 }
    - { name: biopsy_outcomes, timeout_ms: 257, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to specialist for urgent lesions"
    - "Unnecessary referrals"
privacy:
  pii_in_logs: false
  retention_days: 400
