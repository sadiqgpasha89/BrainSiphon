serving:
  deadline_ms: 80
  stages:
    - { name: hl7_fhir_stream, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: feature_aggregator, timeout_ms: 15, on_timeout: fallback_level_1 }
    - { name: sepsis_scorer, timeout_ms: 30, on_timeout: fallback_level_1 }
    - { name: alert_policy, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: outcome_labels, timeout_ms: 11, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to antibiotics after alert"
    - "Sepsis mortality and alert override rate"
privacy:
  pii_in_logs: false
  retention_days: 400
