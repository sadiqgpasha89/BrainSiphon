serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: contract_and_po_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: contract_term_extractor, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: item_matcher_for_catalogue_identifiers, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: compliance_rule_engine, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: exposure_and_evidence_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Compliant spend share"
    - "Recovered price variance"
    - "Time to resolve an exception"
privacy:
  pii_in_logs: false
  retention_days: 400
