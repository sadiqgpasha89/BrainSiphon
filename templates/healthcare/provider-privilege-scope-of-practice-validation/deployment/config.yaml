serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: credential_and_privilege_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: temporal_graph_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: eligibility_rules_engine, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: exception_prioritiser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: explanation_and_citation_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Assignments flagged before the case date"
    - "Review hours per exception"
    - "Privilege-mismatch events reaching the day of care"
privacy:
  pii_in_logs: false
  retention_days: 400
