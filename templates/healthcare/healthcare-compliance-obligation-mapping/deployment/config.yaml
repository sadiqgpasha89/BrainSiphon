serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: source_and_policy_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: obligation_extractor, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: candidate_edge_retriever, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: mapping_ranker, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: obligation_graph_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: compliance_expert_confirmation, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Mappings confirmed per expert hour"
    - "Uncovered obligations found before audit"
    - "Policy conflicts resolved"
privacy:
  pii_in_logs: false
  retention_days: 400
