serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: preference_and_roster_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: constraint_and_objective_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: schedule_optimizer, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: alternative_schedule_ranker, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: trade_off_explainer, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Preference satisfaction"
    - "Manual rework per cycle"
    - "Schedule publication lead time"
privacy:
  pii_in_logs: false
  retention_days: 400
