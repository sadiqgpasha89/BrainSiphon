serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: scheduling_and_demand_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: capacity_and_slot_features, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: wait_time_forecaster, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: observed_versus_inferred_labeller, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: operations_validation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: forecast_and_outcome_log, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Share of availability statements validated"
    - "Wait-time forecast accuracy"
    - "Members given a wrong wait estimate"
privacy:
  pii_in_logs: false
  retention_days: 400
