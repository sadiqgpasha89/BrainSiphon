serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: directory_and_source_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: source_reconciler, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: field_drift_scorer, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: provenance_and_confidence_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: data_steward_or_provider_confirmation, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Directory accuracy on audited samples"
    - "Time to correct a stale field"
    - "Member complaints about wrong directory data"
privacy:
  pii_in_logs: false
  retention_days: 400
