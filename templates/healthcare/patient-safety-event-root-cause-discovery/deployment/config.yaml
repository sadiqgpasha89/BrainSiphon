serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: de_identified_narrative_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: narrative_embedder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: topic_and_cluster_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: contributing_factor_graph, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: hypothesis_evidence_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Investigations started from a surfaced pattern"
    - "Recurring-event reduction in addressed patterns"
    - "Investigator time to a first hypothesis"
privacy:
  pii_in_logs: false
  retention_days: 400
