serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: access_and_authorisation_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: policy_rule_engine, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: event_correlator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: residual_anomaly_ranker, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Confirmed violations resolved within SLA"
    - "Violations reaching restricted areas"
    - "False-alert share"
privacy:
  pii_in_logs: false
  retention_days: 400
