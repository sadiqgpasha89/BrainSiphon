serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: ehr_extract, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: feature_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: note_extractor, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: readmission_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: care_manager_worklist, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: intervention_team, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: readmission_outcomes, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "30-day readmission rate in treated vs control"
    - "Care-manager time per avoided readmission"
privacy:
  pii_in_logs: false
  retention_days: 400
