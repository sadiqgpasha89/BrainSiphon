serving:
  deadline_ms: 2500
  stages:
    - { name: fundus_capture, timeout_ms: 278, on_timeout: fallback_level_1 }
    - { name: quality_assessor, timeout_ms: 418, on_timeout: fallback_level_1 }
    - { name: grading_ensemble, timeout_ms: 417, on_timeout: fallback_level_1 }
    - { name: referral_policy, timeout_ms: 278, on_timeout: fallback_level_1 }
    - { name: clinic_app, timeout_ms: 417, on_timeout: fallback_level_1 }
    - { name: outcome_follow_up, timeout_ms: 417, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Screening completion rate"
    - "Time to ophthalmology referral"
privacy:
  pii_in_logs: false
  retention_days: 400
