serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: policy_and_record_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: policy_statement_extractor, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: semantic_comparator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: configuration_rule_checks, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: process_variant_detector, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Drift found before an audit finding"
    - "Time to policy or process correction"
    - "Owner time per review"
privacy:
  pii_in_logs: false
  retention_days: 400
