serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: event_extraction, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: event_log_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: process_miner, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: stage_delay_analyser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: driver_analysis, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Cycle time for the target pathways"
    - "Discharge or referral delays"
    - "Improvement actions completed"
privacy:
  pii_in_logs: false
  retention_days: 400
