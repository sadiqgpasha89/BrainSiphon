serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: schedule_extract, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: feature_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: no_show_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: uplift_reminder_selector, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: overbooking_optimiser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: attendance_outcomes, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "No-show rate"
    - "Patient wait time"
privacy:
  pii_in_logs: false
  retention_days: 400
