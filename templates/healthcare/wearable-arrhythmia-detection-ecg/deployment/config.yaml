serving:
  deadline_ms: 80
  stages:
    - { name: sensor_sampling, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: signal_quality_gate, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: arrhythmia_cnn, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: episode_aggregator, timeout_ms: 12, on_timeout: fallback_level_1 }
    - { name: cloud_confirmation, timeout_ms: 25, on_timeout: fallback_level_1 }
    - { name: outcome_labels, timeout_ms: 9, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Confirmed AF detection rate"
    - "Alert-induced clinic visits"
privacy:
  pii_in_logs: false
  retention_days: 400
