serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: pii_redaction, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: topic_and_sentiment, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: safety_flagger, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: trend_analyser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: action_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Issues resolved"
    - "Patient satisfaction trend"
privacy:
  pii_in_logs: false
  retention_days: 400
