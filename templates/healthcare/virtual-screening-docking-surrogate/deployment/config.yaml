serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: library_ingest, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: surrogate_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: selection, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: docking, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: rescoring, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: chemist_triage, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: assay_results, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Compounds docked per hit"
    - "Experimental hit rate"
privacy:
  pii_in_logs: false
  retention_days: 400
