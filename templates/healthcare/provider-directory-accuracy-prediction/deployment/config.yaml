serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: directory_and_source_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: identity_reconciliation_for_provider, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: field_feature_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: accuracy_risk_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outreach_ranker_with_capacity, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Directory error rate in secret-shopper audits"
    - "Attestation response rate"
    - "Patient complaints about wrong directory data"
privacy:
  pii_in_logs: false
  retention_days: 400
