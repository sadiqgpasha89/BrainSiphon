serving:
  deadline_ms: 2500
  stages:
    - { name: study_intake, timeout_ms: 278, on_timeout: fallback_level_1 }
    - { name: image_encoder, timeout_ms: 417, on_timeout: fallback_level_1 }
    - { name: prior_retrieval, timeout_ms: 835, on_timeout: fallback_level_1 }
    - { name: safety_checker, timeout_ms: 278, on_timeout: fallback_level_1 }
    - { name: radiologist_edit_and_sign, timeout_ms: 417, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Reporting time per study"
    - "Addendum rate"
privacy:
  pii_in_logs: false
  retention_days: 400
