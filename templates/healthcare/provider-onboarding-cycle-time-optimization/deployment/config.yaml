serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: workflow_event_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: dependency_graph_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: duration_predictor, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: critical_path_scheduler, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: policy_and_mandatory_step_rules, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Days from offer to start-readiness"
    - "Cases starting on the planned date"
    - "Idle wait per case"
privacy:
  pii_in_logs: false
  retention_days: 400
