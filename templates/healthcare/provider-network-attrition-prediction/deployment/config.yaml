serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: contract_and_participation_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: feature_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: attrition_risk_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: criticality_overlay, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: driver_explainer, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Departures avoided or planned for"
    - "Time from risk flag to outreach"
    - "Continuity gaps from departures"
privacy:
  pii_in_logs: false
  retention_days: 400
