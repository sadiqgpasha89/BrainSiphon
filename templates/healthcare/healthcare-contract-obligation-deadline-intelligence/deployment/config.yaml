serving:
  deadline_ms: 2500
  stages:
    - { name: contract_intake_and_parsing, timeout_ms: 574, on_timeout: fallback_level_1 }
    - { name: obligation_extractor, timeout_ms: 574, on_timeout: fallback_level_1 }
    - { name: date_and_notice_calculator, timeout_ms: 144, on_timeout: fallback_level_1 }
    - { name: task_drafting_agent, timeout_ms: 574, on_timeout: fallback_level_1 }
    - { name: permission_and_policy_guard, timeout_ms: 144, on_timeout: fallback_level_1 }
    - { name: contract_owner_confirmation, timeout_ms: 215, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Obligations with a confirmed owner"
    - "Notice windows met"
    - "Contract manager time per contract"
privacy:
  pii_in_logs: false
  retention_days: 400
