serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: open_shift_and_offer_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: incentive_policy_rules, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: fill_uplift_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: budget_constrained_allocator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: fairness_check, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: workforce_manager_approval, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: offer_log_with_propensities, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Fill rate of hard-to-staff shifts"
    - "Incentive spend per filled shift"
    - "Fairness gap across comparable groups"
privacy:
  pii_in_logs: false
  retention_days: 400
