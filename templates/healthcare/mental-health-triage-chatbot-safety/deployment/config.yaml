serving:
  deadline_ms: 2500
  stages:
    - { name: chat_gateway, timeout_ms: 159, on_timeout: fallback_level_1 }
    - { name: crisis_classifier, timeout_ms: 636, on_timeout: fallback_level_1 }
    - { name: policy_engine, timeout_ms: 159, on_timeout: fallback_level_1 }
    - { name: supportive_llm, timeout_ms: 636, on_timeout: fallback_level_1 }
    - { name: safety_output_filter, timeout_ms: 635, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Appropriate escalation rate"
    - "User-reported helpfulness with safety audit"
privacy:
  pii_in_logs: false
  retention_days: 400
