serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: roster_and_absence_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: coverage_rule_engine, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: gap_risk_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: severity_and_eligible_cover_ranker, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Gaps closed before shift start"
    - "Share of shifts below minimum at start"
    - "Manager alert-acknowledgement rate"
privacy:
  pii_in_logs: false
  retention_days: 400
