serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: roster_and_rules_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: constraint_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: rotation_optimizer, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: publication_and_notification, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: override_and_outcome_log, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Coverage gaps"
    - "Share of rotations published without manual rework"
    - "Physician-reported fairness"
privacy:
  pii_in_logs: false
  retention_days: 400
