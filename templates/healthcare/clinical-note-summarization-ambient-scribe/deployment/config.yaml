    - { name: asr_and_diarisation, timeout_ms: 774, on_timeout: fallback_level_1 }
    - { name: note_drafter, timeout_ms: 774, on_timeout: fallback_level_1 }
    - { name: grounding_checker, timeout_ms: 290, on_timeout: fallback_level_1 }
    - { name: ehr_writer, timeout_ms: 193, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
