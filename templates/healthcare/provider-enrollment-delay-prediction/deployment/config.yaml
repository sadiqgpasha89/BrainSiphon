serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: enrollment_and_status_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: stage_and_event_normaliser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: delay_risk_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: bottleneck_classifier, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: follow_up_recommender, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Days from submission to effective date"
    - "Providers scheduled before enrollment completes"
    - "Follow-ups that unblock a case"
privacy:
  pii_in_logs: false
  retention_days: 400
