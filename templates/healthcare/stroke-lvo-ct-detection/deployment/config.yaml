serving:
  deadline_ms: 2500
  stages:
    - { name: ct_acquisition, timeout_ms: 278, on_timeout: fallback_level_1 }
    - { name: dicom_routing, timeout_ms: 186, on_timeout: fallback_level_1 }
    - { name: preprocessing, timeout_ms: 185, on_timeout: fallback_level_1 }
    - { name: lvo_detector, timeout_ms: 742, on_timeout: fallback_level_1 }
    - { name: notification_service, timeout_ms: 278, on_timeout: fallback_level_1 }
    - { name: radiologist_and_neurologist, timeout_ms: 278, on_timeout: fallback_level_1 }
    - { name: outcome_registry, timeout_ms: 278, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Door-to-puncture time"
    - "Thrombectomy rate"
privacy:
  pii_in_logs: false
  retention_days: 400
