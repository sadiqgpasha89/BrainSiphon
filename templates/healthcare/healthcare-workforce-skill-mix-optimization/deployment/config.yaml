serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: competency_and_requirement_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: eligibility_validator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: skill_mix_optimizer, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: publish, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Shifts meeting required mix at start"
    - "Roster publication lead time"
    - "Manager override rate"
privacy:
  pii_in_logs: false
  retention_days: 400
