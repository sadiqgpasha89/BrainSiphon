serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: roster_leave_and_demand_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: minimum_coverage_rules, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: gap_risk_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: cause_classifier, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: contingency_option_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: clinical_operations_validation, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Gaps avoided or mitigated"
    - "Locum and overtime spend"
    - "Hours of uncovered service"
privacy:
  pii_in_logs: false
  retention_days: 400
