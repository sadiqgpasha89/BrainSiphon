serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: shortage_or_risk_event_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: equivalence_filter, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: candidate_retriever, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: substitution_ranker, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: evidence_and_approval_status_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: clinical_and_procurement_approval, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: decision_and_outcome_log, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to resolve a shortage"
    - "Substitution acceptance rate"
    - "Cost impact of substitutions"
privacy:
  pii_in_logs: false
  retention_days: 400
