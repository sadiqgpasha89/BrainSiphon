serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: assay_database, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: standardiser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: graph_encoder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: multitask_head, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: uncertainty_and_domain_check, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: new_assay_results, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Synthesis cycles to hit"
    - "Hit rate of selected compounds"
privacy:
  pii_in_logs: false
  retention_days: 400
