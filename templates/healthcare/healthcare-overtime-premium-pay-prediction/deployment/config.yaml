serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: payroll_and_roster_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: pay_code_and_rule_normaliser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: premium_labour_forecaster, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: scenario_engine, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: threshold_and_budget_rules, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Premium hours as a share of worked hours"
    - "Accrual forecast error"
    - "Share of recommended levers adopted"
privacy:
  pii_in_logs: false
  retention_days: 400
