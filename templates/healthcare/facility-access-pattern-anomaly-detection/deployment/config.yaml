serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: access_event_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: policy_rule_checks, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: context_joiner_for_shifts_and_roles, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: sequence_and_graph_anomaly_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: explanation_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: security_triage, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Confirmed findings per 1000 alerts"
    - "Triage time per alert"
    - "Reader and policy issues discovered"
privacy:
  pii_in_logs: false
  retention_days: 400
