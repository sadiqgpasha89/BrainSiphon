serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: site_data_prep, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: local_trainer, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: secure_aggregation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: global_model_server, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: privacy_accountant, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: governance_board, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: site_evaluation, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Sites onboarded"
    - "Model uplift at small hospitals"
privacy:
  pii_in_logs: false
  retention_days: 400
