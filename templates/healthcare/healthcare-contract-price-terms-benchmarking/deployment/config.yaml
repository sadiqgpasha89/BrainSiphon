serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: contract_and_benchmark_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: term_extractor_and_normaliser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: cohort_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: benchmark_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: unfavourable_term_flagger, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Savings found from benchmark gaps"
    - "Share of reviews using the benchmark"
    - "Unfavourable terms renegotiated"
privacy:
  pii_in_logs: false
  retention_days: 400
