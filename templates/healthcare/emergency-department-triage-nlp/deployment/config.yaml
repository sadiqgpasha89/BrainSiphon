serving:
  deadline_ms: 2500
  stages:
    - { name: triage_form, timeout_ms: 230, on_timeout: fallback_level_1 }
    - { name: text_encoder, timeout_ms: 614, on_timeout: fallback_level_1 }
    - { name: acuity_model, timeout_ms: 614, on_timeout: fallback_level_1 }
    - { name: safety_rules, timeout_ms: 154, on_timeout: fallback_level_1 }
    - { name: nurse_display, timeout_ms: 230, on_timeout: fallback_level_1 }
    - { name: nurse_decision, timeout_ms: 153, on_timeout: fallback_level_1 }
    - { name: outcome_labels, timeout_ms: 230, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Under-triage events"
    - "Time to treatment for high acuity"
privacy:
  pii_in_logs: false
  retention_days: 400
