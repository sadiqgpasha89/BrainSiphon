serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: credential_and_document_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: requirement_validator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: compliance_risk_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: eligibility_recommendation, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Lapsed credentials reaching a facility"
    - "Time to remediate a gap"
    - "Access desk handling time"
privacy:
  pii_in_logs: false
  retention_days: 400
