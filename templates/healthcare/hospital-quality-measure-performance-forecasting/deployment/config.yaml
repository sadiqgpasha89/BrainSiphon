serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: measure_data_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: denominator_and_version_validator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: completeness_nowcaster, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: quality_measure_forecaster, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: target_gap_and_scenario_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Share of measures reaching target"
    - "Lead time between a forecast miss and an intervention"
    - "Improvement-plan completion"
privacy:
  pii_in_logs: false
  retention_days: 400
