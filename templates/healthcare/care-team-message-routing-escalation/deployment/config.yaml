serving:
  deadline_ms: 2500
  stages:
    - { name: message_intake, timeout_ms: 234, on_timeout: fallback_level_1 }
    - { name: intent_classifier, timeout_ms: 937, on_timeout: fallback_level_1 }
    - { name: context_lookup, timeout_ms: 469, on_timeout: fallback_level_1 }
    - { name: routing_rule_engine, timeout_ms: 234, on_timeout: fallback_level_1 }
    - { name: sender_confirmation_or_correction, timeout_ms: 351, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to acknowledgement"
    - "Messages reaching the wrong team"
    - "Escalations triggered"
privacy:
  pii_in_logs: false
  retention_days: 400
