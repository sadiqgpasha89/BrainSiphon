serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: document_intake_and_ocr, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: document_classifier, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: field_extractor, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: requirement_and_expiry_rules, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: master_reconciliation, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Reviewer time per document"
    - "Share of fields accepted without edits"
    - "Lapsed-evidence incidents"
privacy:
  pii_in_logs: false
  retention_days: 400
