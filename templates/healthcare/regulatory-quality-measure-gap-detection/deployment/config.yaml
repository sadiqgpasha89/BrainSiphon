serving:
  deadline_ms: 2500
  stages:
    - { name: requirement_and_document_intake, timeout_ms: 223, on_timeout: fallback_level_1 }
    - { name: hybrid_retriever, timeout_ms: 668, on_timeout: fallback_level_1 }
    - { name: rule_checker_for_fields_and_dates, timeout_ms: 222, on_timeout: fallback_level_1 }
    - { name: gap_explainer_with_citations, timeout_ms: 890, on_timeout: fallback_level_1 }
    - { name: citation_and_policy_guard, timeout_ms: 222, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Gaps closed before the audit date"
    - "Owner time per requirement"
    - "False-gap rate after owner review"
privacy:
  pii_in_logs: false
  retention_days: 400
