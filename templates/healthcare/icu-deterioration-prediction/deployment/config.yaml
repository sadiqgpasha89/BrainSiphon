serving:
  deadline_ms: 80
  stages:
    - { name: bedside_monitor_feed, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: feature_windowing, timeout_ms: 12, on_timeout: fallback_level_1 }
    - { name: deterioration_model, timeout_ms: 25, on_timeout: fallback_level_1 }
    - { name: calibration_layer, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: rapid_response_alerts, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: outcome_registry, timeout_ms: 9, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Unplanned ICU transfers"
    - "Cardiac arrests on wards"
privacy:
  pii_in_logs: false
  retention_days: 400
