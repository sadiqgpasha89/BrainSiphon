serving:
  deadline_ms: 80
  stages:
    - { name: order_event, timeout_ms: 4, on_timeout: fallback_level_1 }
    - { name: inventory_view, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: cost_and_capacity_lookup, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: node_selector, timeout_ms: 19, on_timeout: fallback_level_1 }
    - { name: opportunity_cost_model, timeout_ms: 19, on_timeout: fallback_level_1 }
    - { name: fulfilment_instruction, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: outcome_tracking, timeout_ms: 7, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Cost per order"
    - "On-time delivery rate"
privacy:
  pii_in_logs: false
  retention_days: 400
