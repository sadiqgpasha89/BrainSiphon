serving:
  deadline_ms: 80
  stages:
    - { name: submission_api, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: hash_prefilter, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: multimodal_classifier, timeout_ms: 33, on_timeout: fallback_level_1 }
    - { name: policy_engine, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: appeals_handling, timeout_ms: 13, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Prohibited content exposure"
    - "Wrongful removal rate"
privacy:
  pii_in_logs: false
  retention_days: 400
