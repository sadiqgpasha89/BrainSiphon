serving:
  deadline_ms: 2500
  stages:
    - { name: image_capture, timeout_ms: 278, on_timeout: fallback_level_1 }
    - { name: edge_detector, timeout_ms: 557, on_timeout: fallback_level_1 }
    - { name: sku_recogniser, timeout_ms: 417, on_timeout: fallback_level_1 }
    - { name: planogram_diff, timeout_ms: 139, on_timeout: fallback_level_1 }
    - { name: task_prioritiser, timeout_ms: 556, on_timeout: fallback_level_1 }
    - { name: store_associate_app, timeout_ms: 278, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "On-shelf availability"
    - "Lost sales recovered"
privacy:
  pii_in_logs: false
  retention_days: 400
