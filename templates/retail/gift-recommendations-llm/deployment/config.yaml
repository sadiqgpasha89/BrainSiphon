serving:
  deadline_ms: 2500
  stages:
    - { name: chat_interface, timeout_ms: 202, on_timeout: fallback_level_1 }
    - { name: slot_extractor, timeout_ms: 540, on_timeout: fallback_level_1 }
    - { name: candidate_retrieval, timeout_ms: 405, on_timeout: fallback_level_1 }
    - { name: feasibility_filter, timeout_ms: 135, on_timeout: fallback_level_1 }
    - { name: suggestion_composer, timeout_ms: 539, on_timeout: fallback_level_1 }
    - { name: grounding_check, timeout_ms: 202, on_timeout: fallback_level_1 }
    - { name: conversion_tracking, timeout_ms: 202, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Gift conversion rate"
    - "Delivery-on-time rate"
privacy:
  pii_in_logs: false
  retention_days: 400
