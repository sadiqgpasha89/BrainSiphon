serving:
  deadline_ms: 80
  stages:
    - { name: order_submission, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: entity_resolution, timeout_ms: 10, on_timeout: fallback_level_1 }
    - { name: feature_lookup, timeout_ms: 13, on_timeout: fallback_level_1 }
    - { name: risk_scorer, timeout_ms: 25, on_timeout: fallback_level_1 }
    - { name: action_policy, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: chargeback_labels, timeout_ms: 10, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Fraud losses as percent of GMV"
    - "Approval rate"
privacy:
  pii_in_logs: false
  retention_days: 400
