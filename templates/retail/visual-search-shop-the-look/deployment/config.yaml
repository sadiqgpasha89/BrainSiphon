serving:
  deadline_ms: 80
  stages:
    - { name: image_upload, timeout_ms: 4, on_timeout: fallback_level_1 }
    - { name: detector_and_cropper, timeout_ms: 15, on_timeout: fallback_level_1 }
    - { name: embedding_model, timeout_ms: 15, on_timeout: fallback_level_1 }
    - { name: ann_search, timeout_ms: 11, on_timeout: fallback_level_1 }
    - { name: attribute_re_ranker, timeout_ms: 15, on_timeout: fallback_level_1 }
    - { name: inventory_filter, timeout_ms: 4, on_timeout: fallback_level_1 }
    - { name: interaction_logs, timeout_ms: 6, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Visual search conversion"
    - "Search sessions per user"
privacy:
  pii_in_logs: false
  retention_days: 400
