serving:
  deadline_ms: 2500
  stages:
    - { name: audio_stream, timeout_ms: 127, on_timeout: fallback_level_1 }
    - { name: streaming_asr, timeout_ms: 509, on_timeout: fallback_level_1 }
    - { name: contextual_biasing, timeout_ms: 254, on_timeout: fallback_level_1 }
    - { name: nlu_intent_and_slots, timeout_ms: 509, on_timeout: fallback_level_1 }
    - { name: entity_resolver, timeout_ms: 508, on_timeout: fallback_level_1 }
    - { name: confirmation_dialogue, timeout_ms: 191, on_timeout: fallback_level_1 }
    - { name: order_service, timeout_ms: 127, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Voice order success rate"
    - "Correction rate"
privacy:
  pii_in_logs: false
  retention_days: 400
