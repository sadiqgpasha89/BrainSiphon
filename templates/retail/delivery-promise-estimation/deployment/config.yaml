serving:
  deadline_ms: 80
  stages:
    - { name: promise_request, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: capacity_and_backlog_feed, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: leg_quantile_models, timeout_ms: 25, on_timeout: fallback_level_1 }
    - { name: distribution_combiner, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: promise_cache, timeout_ms: 12, on_timeout: fallback_level_1 }
    - { name: business_rules, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: delivery_outcome_logs, timeout_ms: 6, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Late delivery rate"
    - "Conversion lift from faster promises"
privacy:
  pii_in_logs: false
  retention_days: 400
