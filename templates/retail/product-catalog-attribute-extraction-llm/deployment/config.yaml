serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: catalogue_change_feed, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: pre_filter_and_normaliser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: student_extractor, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: schema_validator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: catalogue_writer, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Filter coverage"
    - "Search conversion in enriched categories"
privacy:
  pii_in_logs: false
  retention_days: 400
