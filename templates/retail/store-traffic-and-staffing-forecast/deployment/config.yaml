serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: traffic_counters_and_pos, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: feature_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: hourly_forecaster, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: demand_to_labour_converter, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: shift_optimiser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: actuals_comparison, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Labour cost percent of sales"
    - "Wait time breaches"
privacy:
  pii_in_logs: false
  retention_days: 400
