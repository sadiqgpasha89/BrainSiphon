serving:
  deadline_ms: 80
  stages:
    - { name: product_page_request, timeout_ms: 4, on_timeout: fallback_level_1 }
    - { name: item_graph_store, timeout_ms: 18, on_timeout: fallback_level_1 }
    - { name: relation_retrieval, timeout_ms: 13, on_timeout: fallback_level_1 }
    - { name: compatibility_filter, timeout_ms: 4, on_timeout: fallback_level_1 }
    - { name: margin_aware_ranker, timeout_ms: 18, on_timeout: fallback_level_1 }
    - { name: cache, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: interaction_logs, timeout_ms: 4, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Attach rate"
    - "Average order value"
privacy:
  pii_in_logs: false
  retention_days: 400
