serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: product_attributes_and_images, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: embedding_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: analogue_retriever, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: bayesian_forecaster, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: buy_plan_optimiser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: actuals_feed, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "First-buy accuracy"
    - "End-of-season leftover units"
privacy:
  pii_in_logs: false
  retention_days: 400
