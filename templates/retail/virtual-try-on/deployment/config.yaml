serving:
  deadline_ms: 2500
  stages:
    - { name: photo_or_camera_capture, timeout_ms: 154, on_timeout: fallback_level_1 }
    - { name: pose_and_parsing, timeout_ms: 614, on_timeout: fallback_level_1 }
    - { name: garment_warping, timeout_ms: 230, on_timeout: fallback_level_1 }
    - { name: refinement, timeout_ms: 230, on_timeout: fallback_level_1 }
    - { name: quality_gate, timeout_ms: 614, on_timeout: fallback_level_1 }
    - { name: delivery_to_app, timeout_ms: 230, on_timeout: fallback_level_1 }
    - { name: usage_analytics, timeout_ms: 153, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Return rate of try-on users"
    - "Conversion lift"
privacy:
  pii_in_logs: false
  retention_days: 400
