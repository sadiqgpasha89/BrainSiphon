serving:
  deadline_ms: 80
  stages:
    - { name: page_request, timeout_ms: 4, on_timeout: fallback_level_1 }
    - { name: category_candidate_fetch, timeout_ms: 11, on_timeout: fallback_level_1 }
    - { name: feature_lookup, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: ltr_ranker, timeout_ms: 15, on_timeout: fallback_level_1 }
    - { name: business_re_rank, timeout_ms: 15, on_timeout: fallback_level_1 }
    - { name: exploration_allocator, timeout_ms: 15, on_timeout: fallback_level_1 }
    - { name: impression_logs, timeout_ms: 3, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Category conversion rate"
    - "Revenue per visit"
privacy:
  pii_in_logs: false
  retention_days: 400
