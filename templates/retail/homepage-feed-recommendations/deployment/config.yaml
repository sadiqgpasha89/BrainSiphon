serving:
  deadline_ms: 80
  stages:
    - { name: feed_request, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: user_state_fetch, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: candidate_generation, timeout_ms: 14, on_timeout: fallback_level_1 }
    - { name: multi_task_ranker, timeout_ms: 19, on_timeout: fallback_level_1 }
    - { name: diversity_and_policy_re_rank, timeout_ms: 19, on_timeout: fallback_level_1 }
    - { name: impression_logger, timeout_ms: 4, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Purchases per user session"
    - "7-day return rate"
privacy:
  pii_in_logs: false
  retention_days: 400
