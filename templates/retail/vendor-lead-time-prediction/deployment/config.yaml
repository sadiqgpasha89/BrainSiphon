serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: po_and_receipt_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: feature_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: quantile_lead_time_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: distribution_publisher, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: buyer_dashboard, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: disruption_monitor, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Stock-out events"
    - "Safety stock reduction"
privacy:
  pii_in_logs: false
  retention_days: 400
