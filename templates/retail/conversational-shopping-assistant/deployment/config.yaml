serving:
  deadline_ms: 2500
  stages:
    - { name: chat_gateway, timeout_ms: 144, on_timeout: fallback_level_1 }
    - { name: query_planner, timeout_ms: 574, on_timeout: fallback_level_1 }
    - { name: catalogue_search_tool, timeout_ms: 431, on_timeout: fallback_level_1 }
    - { name: comparison_and_stock_tools, timeout_ms: 144, on_timeout: fallback_level_1 }
    - { name: response_generator, timeout_ms: 574, on_timeout: fallback_level_1 }
    - { name: grounding_verifier, timeout_ms: 143, on_timeout: fallback_level_1 }
    - { name: transcript_logger, timeout_ms: 215, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Assisted conversion rate"
    - "Cost per assisted session"
privacy:
  pii_in_logs: false
  retention_days: 400
