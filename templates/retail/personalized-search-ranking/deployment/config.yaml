serving:
  deadline_ms: 80
  stages:
    - { name: query_service, timeout_ms: 4, on_timeout: fallback_level_1 }
    - { name: query_understanding, timeout_ms: 15, on_timeout: fallback_level_1 }
    - { name: hybrid_retrieval, timeout_ms: 11, on_timeout: fallback_level_1 }
    - { name: feature_fetch, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: ranker, timeout_ms: 15, on_timeout: fallback_level_1 }
    - { name: business_re_rank, timeout_ms: 15, on_timeout: fallback_level_1 }
    - { name: click_logger, timeout_ms: 3, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Search conversion rate"
    - "Revenue per search"
privacy:
  pii_in_logs: false
  retention_days: 400
