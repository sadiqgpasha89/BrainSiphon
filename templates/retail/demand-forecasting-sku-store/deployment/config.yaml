serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: sales_and_inventory_ingestion, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: stock_out_correction, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: feature_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: global_forecaster, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: hierarchical_reconciler, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: forecast_publisher, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: planner_overrides, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "In-stock rate"
    - "Waste and markdown rate"
privacy:
  pii_in_logs: false
  retention_days: 400
