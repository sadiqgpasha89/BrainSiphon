serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: order_history, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: interval_features, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: survival_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: uplift_selector, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: crm_dispatch, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: holdout_analysis, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outcome_labels, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Retained customers per marketing dollar"
    - "Repeat purchase rate"
privacy:
  pii_in_logs: false
  retention_days: 400
