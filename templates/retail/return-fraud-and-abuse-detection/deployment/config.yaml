serving:
  deadline_ms: 80
  stages:
    - { name: return_request, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: customer_trust_features, timeout_ms: 10, on_timeout: fallback_level_1 }
    - { name: return_risk_model, timeout_ms: 21, on_timeout: fallback_level_1 }
    - { name: cost_sensitive_policy, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: inspection_router, timeout_ms: 21, on_timeout: fallback_level_1 }
    - { name: outcome_labels, timeout_ms: 8, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Return abuse losses"
    - "Customer complaint rate"
privacy:
  pii_in_logs: false
  retention_days: 400
