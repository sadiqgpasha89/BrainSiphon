serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: sales_and_inventory_feed, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: demand_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: elasticity_store, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: price_optimiser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: guardrail_engine, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: price_publisher, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Gross margin dollars"
    - "Price perception index"
privacy:
  pii_in_logs: false
  retention_days: 400
