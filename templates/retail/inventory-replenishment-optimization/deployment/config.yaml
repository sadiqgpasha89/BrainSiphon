serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: inventory_and_po_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: lead_time_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: demand_quantiles, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: policy_optimiser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: order_generator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: buyer_approval, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: service_level_tracker, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Fill rate"
    - "Inventory turns"
privacy:
  pii_in_logs: false
  retention_days: 400
