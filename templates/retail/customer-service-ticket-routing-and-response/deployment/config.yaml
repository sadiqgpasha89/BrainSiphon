serving:
  deadline_ms: 2500
  stages:
    - { name: ticket_intake, timeout_ms: 159, on_timeout: fallback_level_1 }
    - { name: context_enrichment, timeout_ms: 318, on_timeout: fallback_level_1 }
    - { name: intent_and_urgency_model, timeout_ms: 636, on_timeout: fallback_level_1 }
    - { name: policy_retriever, timeout_ms: 477, on_timeout: fallback_level_1 }
    - { name: reply_drafter, timeout_ms: 635, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Handle time"
    - "First-contact resolution"
privacy:
  pii_in_logs: false
  retention_days: 400
