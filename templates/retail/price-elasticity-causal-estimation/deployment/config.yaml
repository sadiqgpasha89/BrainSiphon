serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: experiment_platform, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: panel_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: nuisance_models, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: dml_estimator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: uncertainty_calibration, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: elasticity_store, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: pricing_consumers, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Pricing lift realised vs predicted"
    - "Experiment cost saved"
privacy:
  pii_in_logs: false
  retention_days: 400
