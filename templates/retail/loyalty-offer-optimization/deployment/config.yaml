serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: member_360, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: elasticity_and_ltv_models, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: offer_policy, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: budget_allocator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: offer_publisher, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: redemption_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Incremental margin per programme dollar"
    - "Active member retention"
privacy:
  pii_in_logs: false
  retention_days: 400
