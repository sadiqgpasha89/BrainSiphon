serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: crawler_fleet, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: extraction, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: candidate_matcher, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: pair_classifier, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: price_index_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: price_feed, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Price-index coverage"
    - "Pricing action accuracy"
privacy:
  pii_in_logs: false
  retention_days: 400
