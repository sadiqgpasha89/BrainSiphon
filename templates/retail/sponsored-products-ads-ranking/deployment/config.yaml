serving:
  deadline_ms: 80
  stages:
    - { name: search_request, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: ad_candidate_retrieval, timeout_ms: 16, on_timeout: fallback_level_1 }
    - { name: relevance_gate, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: pctr_pcvr_model, timeout_ms: 22, on_timeout: fallback_level_1 }
    - { name: auction_and_pricing, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: pacing_controller, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: impression_and_click_logs, timeout_ms: 5, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Ad revenue per search"
    - "Advertiser ROAS"
privacy:
  pii_in_logs: false
  retention_days: 400
