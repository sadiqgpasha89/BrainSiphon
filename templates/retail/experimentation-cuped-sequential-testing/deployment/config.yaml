serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: assignment_logs, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: metric_computation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: variance_reduction, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: sequential_tester, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: srm_and_quality_checks, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: decision_dashboard, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to decision"
    - "Win-rate vs holdout outcomes"
privacy:
  pii_in_logs: false
  retention_days: 400
