serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: text_features, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: graph_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: fraud_scorer, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: takedown_policy, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: appeals_and_labels, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Fake review prevalence from audits"
    - "Seller appeal overturn rate"
privacy:
  pii_in_logs: false
  retention_days: 400
