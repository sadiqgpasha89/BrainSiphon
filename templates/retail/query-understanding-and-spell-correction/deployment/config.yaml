serving:
  deadline_ms: 8
  stages:
    - { name: query_intake, timeout_ms: 0.5, on_timeout: fallback_level_1 }
    - { name: normaliser, timeout_ms: 0.5, on_timeout: fallback_level_1 }
    - { name: spell_corrector, timeout_ms: 0.7, on_timeout: fallback_level_1 }
    - { name: intent_and_ner_model, timeout_ms: 1.8, on_timeout: fallback_level_1 }
    - { name: attribute_resolver, timeout_ms: 1.8, on_timeout: fallback_level_1 }
    - { name: query_cache, timeout_ms: 0.9, on_timeout: fallback_level_1 }
    - { name: reformulation_logger, timeout_ms: 0.5, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Zero-result rate"
    - "Search conversion"
privacy:
  pii_in_logs: false
  retention_days: 400
