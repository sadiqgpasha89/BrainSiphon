serving:
  deadline_ms: 80
  stages:
    - { name: product_page_request, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: user_fit_profile, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: item_latent_size_lookup, timeout_ms: 14, on_timeout: fallback_level_1 }
    - { name: fit_model, timeout_ms: 19, on_timeout: fallback_level_1 }
    - { name: recommendation_formatter, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: cache, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: return_reason_feed, timeout_ms: 7, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Size-related return rate"
    - "Conversion on items with recommendation"
privacy:
  pii_in_logs: false
  retention_days: 400
