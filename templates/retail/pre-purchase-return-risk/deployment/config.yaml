serving:
  deadline_ms: 80
  stages:
    - { name: cart_event, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: risk_feature_fetch, timeout_ms: 11, on_timeout: fallback_level_1 }
    - { name: return_reason_model, timeout_ms: 22, on_timeout: fallback_level_1 }
    - { name: uplift_nudge_selector, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: nudge_ui, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: size_recommender, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: return_outcomes, timeout_ms: 6, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Net revenue after returns"
    - "Avoidable-return rate"
privacy:
  pii_in_logs: false
  retention_days: 400
