serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: sales_and_space_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: choice_model_trainer, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: cluster_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: assortment_optimiser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: planogram_generator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: post_reset_sales, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Margin per square foot"
    - "Customer-switching loss"
privacy:
  pii_in_logs: false
  retention_days: 400
