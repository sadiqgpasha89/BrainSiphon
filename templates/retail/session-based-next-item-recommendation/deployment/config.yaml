serving:
  deadline_ms: 80
  stages:
    - { name: event_stream, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: session_state_store, timeout_ms: 10, on_timeout: fallback_level_1 }
    - { name: sequence_encoder, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: ann_retrieval, timeout_ms: 16, on_timeout: fallback_level_1 }
    - { name: re_ranker, timeout_ms: 21, on_timeout: fallback_level_1 }
    - { name: response_cache, timeout_ms: 10, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Click-through on recommendations"
    - "Add-to-cart rate"
privacy:
  pii_in_logs: false
  retention_days: 400
