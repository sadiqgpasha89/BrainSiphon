asyncapi: 3.0.0
info:
  title: Session-Based Next-Item Recommendation events (illustrative)
  version: 0.1.0
  description: Generated from the blueprint's event schema. Partition by the entity key so one entity's events stay
    ordered.
channels:
  events:
    address: session.based.next.item.recommendation.events
    messages:
      event:
        $ref: '#/components/messages/Event'
operations:
  publishEvents:
    action: send
    channel:
      $ref: '#/channels/events'
components:
  messages:
    Event:
      name: Event
      contentType: application/json
      payload:
        $ref: '#/components/schemas/EventPayload'
  schemas:
    EventPayload:
      type: object
      properties:
        type:
          type: string
          description: SlateShown
        request_id:
          type: string
        user_id:
          type: string
          description: pseudonymous string
        surface:
          type: string
        items:
          type: string
          description: '[{''item_id'': ''string'', ''rank'': ''int'', ''propensity'': ''float'', ''source'': ''string''}]'
        model_version:
          type: string
        experiment_arm:
          type: string
        shown_at:
          type: string
          format: date-time
