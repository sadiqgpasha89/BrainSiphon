serving:
  deadline_ms: 2500
  stages:
    - { name: seller_registration, timeout_ms: 223, on_timeout: fallback_level_1 }
    - { name: kyb_and_sanctions_checks, timeout_ms: 222, on_timeout: fallback_level_1 }
    - { name: entity_graph, timeout_ms: 334, on_timeout: fallback_level_1 }
    - { name: risk_model, timeout_ms: 890, on_timeout: fallback_level_1 }
    - { name: limit_policy, timeout_ms: 222, on_timeout: fallback_level_1 }
    - { name: early_outcomes, timeout_ms: 334, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Buyer harm per GMV"
    - "Genuine seller approval time"
privacy:
  pii_in_logs: false
  retention_days: 400
