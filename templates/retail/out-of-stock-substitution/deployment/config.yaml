serving:
  deadline_ms: 80
  stages:
    - { name: stock_event, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: candidate_generator, timeout_ms: 16, on_timeout: fallback_level_1 }
    - { name: constraint_filter, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: acceptance_ranker, timeout_ms: 22, on_timeout: fallback_level_1 }
    - { name: picker_app, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: customer_approval, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: outcome_logging, timeout_ms: 5, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Substitution acceptance rate"
    - "Refunds due to substitutions"
privacy:
  pii_in_logs: false
  retention_days: 400
