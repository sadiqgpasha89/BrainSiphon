serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: listing_ingestion, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: brand_matcher, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: fine_grained_authenticity_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: seller_risk_features, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: takedown_scorer, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Counterfeit listing prevalence"
    - "Brand complaints"
privacy:
  pii_in_logs: false
  retention_days: 400
