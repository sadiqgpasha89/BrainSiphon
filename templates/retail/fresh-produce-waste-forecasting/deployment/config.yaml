serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: pos_and_stock_feed, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: age_profile_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: demand_quantile_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: order_optimiser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: markdown_trigger, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: store_ordering, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: waste_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Waste percentage"
    - "In-stock rate"
privacy:
  pii_in_logs: false
  retention_days: 400
