serving:
  deadline_ms: 80
  stages:
    - { name: camera_streams, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: person_tracker, timeout_ms: 18, on_timeout: fallback_level_1 }
    - { name: action_recogniser, timeout_ms: 18, on_timeout: fallback_level_1 }
    - { name: sensor_fusion, timeout_ms: 18, on_timeout: fallback_level_1 }
    - { name: basket_validator, timeout_ms: 4, on_timeout: fallback_level_1 }
    - { name: billing, timeout_ms: 7, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Billing disputes per 1000 baskets"
    - "Exception review rate"
privacy:
  pii_in_logs: false
  retention_days: 400
