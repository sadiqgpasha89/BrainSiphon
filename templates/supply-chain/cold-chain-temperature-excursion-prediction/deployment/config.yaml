serving:
  deadline_ms: 80
  stages:
    - { name: telemetry_stream, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: thermal_feature_builder, timeout_ms: 11, on_timeout: fallback_level_1 }
    - { name: time_to_breach_model, timeout_ms: 22, on_timeout: fallback_level_1 }
    - { name: alert_policy, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: driver_and_control_tower, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: corrective_action_log, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: outcome_labels, timeout_ms: 8, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Product loss from excursions"
    - "Alerts acted upon"
privacy:
  pii_in_logs: false
  retention_days: 400
