serving:
  deadline_ms: 80
  stages:
    - { name: out_for_delivery_list, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: address_features, timeout_ms: 10, on_timeout: fallback_level_1 }
    - { name: failure_model, timeout_ms: 20, on_timeout: fallback_level_1 }
    - { name: intervention_selector, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: messaging_service, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: route_adjustment, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: delivery_outcome, timeout_ms: 8, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "First-attempt success rate"
    - "Cost per redelivery avoided"
privacy:
  pii_in_logs: false
  retention_days: 400
