serving:
  deadline_ms: 2500
  stages:
    - { name: load_creation, timeout_ms: 176, on_timeout: fallback_level_1 }
    - { name: candidate_carriers, timeout_ms: 351, on_timeout: fallback_level_1 }
    - { name: acceptance_and_otp_models, timeout_ms: 469, on_timeout: fallback_level_1 }
    - { name: tender_optimiser, timeout_ms: 468, on_timeout: fallback_level_1 }
    - { name: tender_api, timeout_ms: 117, on_timeout: fallback_level_1 }
    - { name: transport_planner, timeout_ms: 468, on_timeout: fallback_level_1 }
    - { name: outcome_logs, timeout_ms: 176, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "First-tender acceptance rate"
    - "Spot spend share"
privacy:
  pii_in_logs: false
  retention_days: 400
