serving:
  deadline_ms: 2500
  stages:
    - { name: driver_app_capture, timeout_ms: 148, on_timeout: fallback_level_1 }
    - { name: on_device_privacy_blur, timeout_ms: 593, on_timeout: fallback_level_1 }
    - { name: quality_gate, timeout_ms: 223, on_timeout: fallback_level_1 }
    - { name: authenticity_checks, timeout_ms: 223, on_timeout: fallback_level_1 }
    - { name: parcel_detector, timeout_ms: 593, on_timeout: fallback_level_1 }
    - { name: dispute_handling, timeout_ms: 223, on_timeout: fallback_level_1 }
    - { name: outcome_labels, timeout_ms: 222, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Not-received claims"
    - "Driver rework rate"
privacy:
  pii_in_logs: false
  retention_days: 400
