serving:
  deadline_ms: 80
  stages:
    - { name: address_input, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: normaliser, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: tagger, timeout_ms: 19, on_timeout: fallback_level_1 }
    - { name: gazetteer_matcher, timeout_ms: 15, on_timeout: fallback_level_1 }
    - { name: geocode_refiner, timeout_ms: 19, on_timeout: fallback_level_1 }
    - { name: confidence_policy, timeout_ms: 5, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Failed delivery due to address"
    - "Time spent searching for the address"
privacy:
  pii_in_logs: false
  retention_days: 400
