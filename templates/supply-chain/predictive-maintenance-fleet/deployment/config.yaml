serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: telematics_stream, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: feature_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: component_risk_models, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: maintenance_optimiser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: workshop_booking, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: failure_and_service_records, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Unplanned breakdowns"
    - "Maintenance cost per km"
privacy:
  pii_in_logs: false
  retention_days: 400
