serving:
  deadline_ms: 80
  stages:
    - { name: quote_request, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: market_feature_service, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: rate_model, timeout_ms: 15, on_timeout: fallback_level_1 }
    - { name: win_probability_model, timeout_ms: 15, on_timeout: fallback_level_1 }
    - { name: price_optimiser, timeout_ms: 15, on_timeout: fallback_level_1 }
    - { name: sales_approval, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: quote_outcomes, timeout_ms: 6, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Margin per load"
    - "Quote win rate"
privacy:
  pii_in_logs: false
  retention_days: 400
