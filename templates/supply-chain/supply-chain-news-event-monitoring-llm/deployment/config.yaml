serving:
  deadline_ms: 2500
  stages:
    - { name: news_and_notice_feeds, timeout_ms: 120, on_timeout: fallback_level_1 }
    - { name: event_extractor, timeout_ms: 481, on_timeout: fallback_level_1 }
    - { name: event_clusterer, timeout_ms: 481, on_timeout: fallback_level_1 }
    - { name: network_impact_analyser, timeout_ms: 181, on_timeout: fallback_level_1 }
    - { name: mitigation_agent, timeout_ms: 481, on_timeout: fallback_level_1 }
    - { name: planner_approval, timeout_ms: 481, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time from event to action"
    - "Alert-to-action ratio"
privacy:
  pii_in_logs: false
  retention_days: 400
