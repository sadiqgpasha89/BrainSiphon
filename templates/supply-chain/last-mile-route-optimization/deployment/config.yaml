serving:
  deadline_ms: 2500
  stages:
    - { name: order_and_address_feed, timeout_ms: 223, on_timeout: fallback_level_1 }
    - { name: geocoder, timeout_ms: 223, on_timeout: fallback_level_1 }
    - { name: service_and_travel_time_models, timeout_ms: 593, on_timeout: fallback_level_1 }
    - { name: vrp_solver, timeout_ms: 593, on_timeout: fallback_level_1 }
    - { name: route_publisher, timeout_ms: 223, on_timeout: fallback_level_1 }
    - { name: dispatcher_override, timeout_ms: 222, on_timeout: fallback_level_1 }
    - { name: execution_traces, timeout_ms: 148, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Cost per stop"
    - "On-time delivery rate"
privacy:
  pii_in_logs: false
  retention_days: 400
