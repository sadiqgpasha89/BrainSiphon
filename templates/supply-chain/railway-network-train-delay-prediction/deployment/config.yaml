serving:
  deadline_ms: 80
  stages:
    - { name: train_position_feed, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: timetable_and_graph_builder, timeout_ms: 18, on_timeout: fallback_level_1 }
    - { name: delay_propagation_model, timeout_ms: 18, on_timeout: fallback_level_1 }
    - { name: quantile_calibrator, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: dispatcher_view, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: passenger_info, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: actual_times, timeout_ms: 6, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Dispatcher intervention success"
    - "Passenger information accuracy"
privacy:
  pii_in_logs: false
  retention_days: 400
