serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: network_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: calibrator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: simulator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: surrogate_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: policy_search, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: realised_kpis, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Policy decisions informed"
    - "Realised vs simulated improvements"
privacy:
  pii_in_logs: false
  retention_days: 400
