serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: gate_and_vessel_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: dwell_predictor, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: stacking_policy, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: crane_sequencer, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: plan_to_equipment, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: yard_planner_approval, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: move_logs, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Vessel turnaround time"
    - "Moves per crane hour"
privacy:
  pii_in_logs: false
  retention_days: 400
