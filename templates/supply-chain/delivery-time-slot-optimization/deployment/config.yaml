serving:
  deadline_ms: 80
  stages:
    - { name: checkout_request, timeout_ms: 4, on_timeout: fallback_level_1 }
    - { name: insertion_cost_estimator, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: choice_model, timeout_ms: 19, on_timeout: fallback_level_1 }
    - { name: slot_pricer, timeout_ms: 19, on_timeout: fallback_level_1 }
    - { name: slot_display, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: booking_service, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: outcome_logs, timeout_ms: 7, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Route cost per delivery"
    - "Conversion rate"
privacy:
  pii_in_logs: false
  retention_days: 400
