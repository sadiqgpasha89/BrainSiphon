serving:
  deadline_ms: 80
  stages:
    - { name: scan_and_gps_events, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: journey_state_builder, timeout_ms: 10, on_timeout: fallback_level_1 }
    - { name: leg_and_dwell_models, timeout_ms: 21, on_timeout: fallback_level_1 }
    - { name: eta_combiner, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: eta_cache, timeout_ms: 10, on_timeout: fallback_level_1 }
    - { name: customer_notification, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: delivery_outcome, timeout_ms: 8, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Late-without-notice rate"
    - "Customer contacts per shipment"
privacy:
  pii_in_logs: false
  retention_days: 400
