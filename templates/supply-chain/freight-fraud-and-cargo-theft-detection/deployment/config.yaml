serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: tender_request, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: carrier_identity_graph, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: fraud_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: tender_gate, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: gps_stream_monitor, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: security_desk, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: incident_outcomes, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Cargo loss value"
    - "Carrier onboarding time"
privacy:
  pii_in_logs: false
  retention_days: 400
