serving:
  deadline_ms: 2500
  stages:
    - { name: contract_repository, timeout_ms: 257, on_timeout: fallback_level_1 }
    - { name: layout_parser, timeout_ms: 171, on_timeout: fallback_level_1 }
    - { name: clause_indexer, timeout_ms: 257, on_timeout: fallback_level_1 }
    - { name: extraction_llm, timeout_ms: 685, on_timeout: fallback_level_1 }
    - { name: citation_verifier, timeout_ms: 171, on_timeout: fallback_level_1 }
    - { name: obligation_tracker, timeout_ms: 684, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to answer contract questions"
    - "Missed renewal incidents"
privacy:
  pii_in_logs: false
  retention_days: 400
