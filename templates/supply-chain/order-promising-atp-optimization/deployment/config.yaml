serving:
  deadline_ms: 80
  stages:
    - { name: order_request, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: atp_service, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: reservation_optimiser, timeout_ms: 18, on_timeout: fallback_level_1 }
    - { name: promise_calculator, timeout_ms: 18, on_timeout: fallback_level_1 }
    - { name: allocation_executor, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: customer_service, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: fulfilment_outcomes, timeout_ms: 6, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "On-time-in-full rate"
    - "Revenue from priority orders"
privacy:
  pii_in_logs: false
  retention_days: 400
