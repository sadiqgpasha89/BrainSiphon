serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: shipment_and_telematics_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: distance_and_load_calculator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: emission_factor_service, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: ml_calibrator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: allocation_engine, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Verified emissions coverage"
    - "Reduction from lane decisions"
privacy:
  pii_in_logs: false
  retention_days: 400
