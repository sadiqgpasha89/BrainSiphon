serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: pos_and_order_feeds, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: signal_feature_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: sensing_forecaster, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: hierarchical_reconciler, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: plan_publisher, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: planner_override, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: actuals_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Forecast accuracy at lag 2"
    - "Expedite shipments avoided"
privacy:
  pii_in_logs: false
  retention_days: 400
