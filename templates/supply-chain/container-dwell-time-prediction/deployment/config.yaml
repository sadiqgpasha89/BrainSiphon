serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: port_and_customs_events, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: feature_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: survival_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: yard_capacity_forecast, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: planner_dashboard, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: terminal_planner, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: release_events, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Yard utilisation forecast error"
    - "Demurrage costs"
privacy:
  pii_in_logs: false
  retention_days: 400
