serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: receipts_and_inspection_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: supplier_features, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: defect_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: inspection_planner, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: quality_engineer, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: supplier_scorecards, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: defect_outcomes, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Escaped defects"
    - "Inspection cost"
privacy:
  pii_in_logs: false
  retention_days: 400
