serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: order_lines_and_pick_logs, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: demand_and_affinity_features, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: slotting_optimiser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: move_planner, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: simulator_check, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: supervisor_approval, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: productivity_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Lines picked per labour hour"
    - "Travel distance per order"
privacy:
  pii_in_logs: false
  retention_days: 400
