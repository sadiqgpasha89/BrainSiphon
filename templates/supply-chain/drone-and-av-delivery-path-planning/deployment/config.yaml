serving:
  deadline_ms: 80
  stages:
    - { name: mission_request, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: airspace_and_weather_check, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: path_planner, timeout_ms: 23, on_timeout: fallback_level_1 }
    - { name: runtime_assurance, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: vehicle_autopilot, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: remote_operator, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: flight_logs, timeout_ms: 8, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Mission success rate"
    - "Incidents per 10k flights"
privacy:
  pii_in_logs: false
  retention_days: 400
