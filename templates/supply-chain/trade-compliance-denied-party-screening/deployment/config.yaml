serving:
  deadline_ms: 80
  stages:
    - { name: shipment_party_data, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: name_normaliser, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: candidate_retrieval, timeout_ms: 17, on_timeout: fallback_level_1 }
    - { name: re_ranker, timeout_ms: 23, on_timeout: fallback_level_1 }
    - { name: ownership_graph_check, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: compliance_officer, timeout_ms: 6, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "False-hit workload"
    - "Violations avoided"
privacy:
  pii_in_logs: false
  retention_days: 400
