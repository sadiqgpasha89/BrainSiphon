serving:
  deadline_ms: 80
  stages:
    - { name: invoice_or_product_description, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: attribute_extractor, timeout_ms: 12, on_timeout: fallback_level_1 }
    - { name: hierarchical_classifier, timeout_ms: 31, on_timeout: fallback_level_1 }
    - { name: tariff_rule_checker, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: declaration_builder, timeout_ms: 11, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Auto-classification rate"
    - "Duty adjustments from audits"
privacy:
  pii_in_logs: false
  retention_days: 400
