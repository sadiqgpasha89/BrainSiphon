serving:
  deadline_ms: 80
  stages:
    - { name: task_allocator, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: path_planner, timeout_ms: 30, on_timeout: fallback_level_1 }
    - { name: safety_shield, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: robot_control, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: operations_monitoring, timeout_ms: 11, on_timeout: fallback_level_1 }
    - { name: telemetry, timeout_ms: 7, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Orders per hour"
    - "Robot utilisation"
privacy:
  pii_in_logs: false
  retention_days: 400
