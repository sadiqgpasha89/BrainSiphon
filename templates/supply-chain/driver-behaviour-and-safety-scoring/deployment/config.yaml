serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: telematics_and_video_events, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: context_enricher, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: event_normaliser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: risk_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: coaching_recommender, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: safety_manager, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: incident_records, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Accident rate"
    - "Coaching completion"
privacy:
  pii_in_logs: false
  retention_days: 400
