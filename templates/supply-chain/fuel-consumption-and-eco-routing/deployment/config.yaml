serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: telematics_and_routes, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: segment_feature_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: fuel_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: eco_router, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: plan_publisher, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: dispatcher, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: actual_fuel, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Fuel per delivery"
    - "CO2 per tonne-km"
privacy:
  pii_in_logs: false
  retention_days: 400
