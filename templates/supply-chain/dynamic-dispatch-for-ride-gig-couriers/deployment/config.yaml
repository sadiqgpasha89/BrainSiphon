serving:
  deadline_ms: 80
  stages:
    - { name: order_stream, timeout_ms: 4, on_timeout: fallback_level_1 }
    - { name: courier_state, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: acceptance_and_eta_models, timeout_ms: 18, on_timeout: fallback_level_1 }
    - { name: value_function_estimator, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: matching_solver, timeout_ms: 18, on_timeout: fallback_level_1 }
    - { name: offer_service, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: outcome_logs, timeout_ms: 7, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Delivery time P90"
    - "Courier earnings per hour"
privacy:
  pii_in_logs: false
  retention_days: 400
