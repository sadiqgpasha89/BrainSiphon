serving:
  deadline_ms: 80
  stages:
    - { name: event_stream, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: expected_state_models, timeout_ms: 21, on_timeout: fallback_level_1 }
    - { name: anomaly_scorer, timeout_ms: 20, on_timeout: fallback_level_1 }
    - { name: impact_propagator, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: incident_clusterer, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: resolution_outcomes, timeout_ms: 8, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to detect disruptions"
    - "Revenue protected"
privacy:
  pii_in_logs: false
  retention_days: 400
