serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: appointments_and_etas, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: eta_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: door_assignment, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: work_scheduler, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: dock_supervisor, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: execution_logs, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: dwell_metrics, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Truck dwell hours"
    - "Cross-dock labour hours per pallet"
privacy:
  pii_in_logs: false
  retention_days: 400
