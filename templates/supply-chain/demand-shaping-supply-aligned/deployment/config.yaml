serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: supply_plan_and_forecasts, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: uplift_and_substitution_models, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: joint_optimiser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: scenario_robustness_check, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: promotion_execution, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outcome_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Stock-outs during promotions"
    - "Waste on promoted items"
privacy:
  pii_in_logs: false
  retention_days: 400
