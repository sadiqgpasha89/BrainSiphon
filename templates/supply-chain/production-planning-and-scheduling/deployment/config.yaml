serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: orders_and_bom, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: processing_time_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: cp_sat_scheduler, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: reactive_dispatcher, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: schedule_publish, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: planner_override, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "On-time delivery"
    - "Changeover time"
privacy:
  pii_in_logs: false
  retention_days: 400
