serving:
  deadline_ms: 80
  stages:
    - { name: sensors, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: edge_preprocessor, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: anomaly_model, timeout_ms: 22, on_timeout: fallback_level_1 }
    - { name: alert_aggregator, timeout_ms: 11, on_timeout: fallback_level_1 }
    - { name: maintenance_ticket, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: technician_check, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: failure_confirmation, timeout_ms: 8, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Unplanned stoppage minutes"
    - "Maintenance cost"
privacy:
  pii_in_logs: false
  retention_days: 400
