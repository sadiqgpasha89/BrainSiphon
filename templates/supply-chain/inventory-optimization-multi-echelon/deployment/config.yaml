serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: network_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: distribution_estimators, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: multi_echelon_optimiser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: simulator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: policy_publisher, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: inventory_planner, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: service_kpis, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Inventory days of supply"
    - "Fill rate"
privacy:
  pii_in_logs: false
  retention_days: 400
