serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: prices_and_indices, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: contract_formulas, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: pass_through_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: quantile_forecaster, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: scenario_engine, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: buyer_dashboard, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: realised_prices, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Savings vs budget"
    - "Hedge effectiveness"
privacy:
  pii_in_logs: false
  retention_days: 400
