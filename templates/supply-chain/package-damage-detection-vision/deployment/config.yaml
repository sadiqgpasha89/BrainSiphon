serving:
  deadline_ms: 2500
  stages:
    - { name: camera_tunnel, timeout_ms: 209, on_timeout: fallback_level_1 }
    - { name: parcel_tracker, timeout_ms: 556, on_timeout: fallback_level_1 }
    - { name: damage_detector, timeout_ms: 556, on_timeout: fallback_level_1 }
    - { name: severity_classifier, timeout_ms: 556, on_timeout: fallback_level_1 }
    - { name: claim_record_creator, timeout_ms: 139, on_timeout: fallback_level_1 }
    - { name: claims_outcomes, timeout_ms: 209, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Damage claims resolved with evidence"
    - "Damage rate trend"
privacy:
  pii_in_logs: false
  retention_days: 400
