serving:
  deadline_ms: 80
  stages:
    - { name: checkout_api, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: consortium_lookup, timeout_ms: 11, on_timeout: fallback_level_1 }
    - { name: feature_store, timeout_ms: 11, on_timeout: fallback_level_1 }
    - { name: risk_model, timeout_ms: 22, on_timeout: fallback_level_1 }
    - { name: affordability_and_policy, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: collections_trigger, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: repayment_labels, timeout_ms: 6, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Loss rate per GMV"
    - "Approval rate"
privacy:
  pii_in_logs: false
  retention_days: 400
