serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: source_ingestion, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: normaliser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: candidate_blocking, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: pair_scorer, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: group_matcher, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Days to close"
    - "Manual touches per 1000 entries"
privacy:
  pii_in_logs: false
  retention_days: 400
