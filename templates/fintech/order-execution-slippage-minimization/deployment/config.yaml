serving:
  deadline_ms: 8
  stages:
    - { name: market_data_handler, timeout_ms: 1.1, on_timeout: fallback_level_1 }
    - { name: state_encoder, timeout_ms: 1.5, on_timeout: fallback_level_1 }
    - { name: execution_policy, timeout_ms: 0.8, on_timeout: fallback_level_1 }
    - { name: risk_guard, timeout_ms: 0.8, on_timeout: fallback_level_1 }
    - { name: order_gateway, timeout_ms: 0.7, on_timeout: fallback_level_1 }
    - { name: post_trade_tca, timeout_ms: 1.1, on_timeout: fallback_level_1 }
    - { name: policy_trainer, timeout_ms: 0.7, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Average slippage in basis points"
    - "Fill rate"
privacy:
  pii_in_logs: false
  retention_days: 400
