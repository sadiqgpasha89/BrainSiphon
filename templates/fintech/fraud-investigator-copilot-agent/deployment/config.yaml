serving:
  deadline_ms: 2500
  stages:
    - { name: planner_agent, timeout_ms: 1187, on_timeout: fallback_level_1 }
    - { name: entity_graph_tool, timeout_ms: 297, on_timeout: fallback_level_1 }
    - { name: transaction_query_tool, timeout_ms: 445, on_timeout: fallback_level_1 }
    - { name: claim_verifier, timeout_ms: 296, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Investigation time per case"
    - "Analyst-approved suggestion rate"
privacy:
  pii_in_logs: false
  retention_days: 400
