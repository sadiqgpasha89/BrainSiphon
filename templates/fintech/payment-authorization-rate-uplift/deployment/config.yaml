serving:
  deadline_ms: 80
  stages:
    - { name: decline_intake, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: decline_normaliser, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: retry_success_model, timeout_ms: 26, on_timeout: fallback_level_1 }
    - { name: action_selector, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: retry_scheduler, timeout_ms: 10, on_timeout: fallback_level_1 }
    - { name: outcome_logging, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: experiment_holdout, timeout_ms: 10, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Recovered revenue"
    - "Issuer decline-rate trend"
privacy:
  pii_in_logs: false
  retention_days: 400
