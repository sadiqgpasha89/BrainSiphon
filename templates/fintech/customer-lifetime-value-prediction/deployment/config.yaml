serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: customer_ledger, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: early_life_feature_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: ltv_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: calibration_layer, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: marketing_bid_feed, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: realised_value_tracker, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Marketing ROI by channel"
    - "Value captured in top decile"
privacy:
  pii_in_logs: false
  retention_days: 400
