serving:
  deadline_ms: 2500
  stages:
    - { name: upload_intake, timeout_ms: 371, on_timeout: fallback_level_1 }
    - { name: image_cleanup, timeout_ms: 556, on_timeout: fallback_level_1 }
    - { name: layout_extractor, timeout_ms: 556, on_timeout: fallback_level_1 }
    - { name: validation_engine, timeout_ms: 371, on_timeout: fallback_level_1 }
    - { name: erp_posting, timeout_ms: 371, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Cost per processed document"
    - "Posting error rate"
privacy:
  pii_in_logs: false
  retention_days: 400
