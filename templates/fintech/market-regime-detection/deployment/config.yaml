serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: market_data_feed, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: feature_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: regime_filter, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: probability_publisher, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: limit_adjuster, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Drawdown reduction vs static"
    - "Turnover cost of regime switching"
privacy:
  pii_in_logs: false
  retention_days: 400
