serving:
  deadline_ms: 80
  stages:
    - { name: transaction_feed, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: descriptor_cleaner, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: merchant_resolver, timeout_ms: 26, on_timeout: fallback_level_1 }
    - { name: category_classifier, timeout_ms: 26, on_timeout: fallback_level_1 }
    - { name: user_override_layer, timeout_ms: 6, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "User correction rate"
    - "Budget feature engagement"
privacy:
  pii_in_logs: false
  retention_days: 400
