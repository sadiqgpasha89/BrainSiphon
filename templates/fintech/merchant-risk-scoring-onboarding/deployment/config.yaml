serving:
  deadline_ms: 2500
  stages:
    - { name: onboarding_form, timeout_ms: 165, on_timeout: fallback_level_1 }
    - { name: website_crawler_and_classifier, timeout_ms: 659, on_timeout: fallback_level_1 }
    - { name: entity_graph_lookup, timeout_ms: 330, on_timeout: fallback_level_1 }
    - { name: merchant_risk_model, timeout_ms: 659, on_timeout: fallback_level_1 }
    - { name: policy_decision, timeout_ms: 165, on_timeout: fallback_level_1 }
    - { name: portfolio_outcomes, timeout_ms: 247, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to onboard"
    - "Merchant fraud rate at 90 days"
privacy:
  pii_in_logs: false
  retention_days: 400
