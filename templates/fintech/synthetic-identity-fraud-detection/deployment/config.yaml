serving:
  deadline_ms: 80
  stages:
    - { name: application_gateway, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: identity_attribute_lookup, timeout_ms: 10, on_timeout: fallback_level_1 }
    - { name: cluster_embedding, timeout_ms: 21, on_timeout: fallback_level_1 }
    - { name: risk_scorer, timeout_ms: 21, on_timeout: fallback_level_1 }
    - { name: decision_engine, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: bust_out_labels, timeout_ms: 8, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Bust-out loss per originated dollar"
    - "Thin-file approval rate"
privacy:
  pii_in_logs: false
  retention_days: 400
