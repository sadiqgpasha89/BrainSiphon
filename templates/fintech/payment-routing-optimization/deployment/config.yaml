serving:
  deadline_ms: 8
  stages:
    - { name: payment_intake, timeout_ms: 0.5, on_timeout: fallback_level_1 }
    - { name: segment_key_builder, timeout_ms: 2, on_timeout: fallback_level_1 }
    - { name: bandit_router, timeout_ms: 2, on_timeout: fallback_level_1 }
    - { name: fee_and_constraint_check, timeout_ms: 0.5, on_timeout: fallback_level_1 }
    - { name: acquirer_dispatch, timeout_ms: 0.5, on_timeout: fallback_level_1 }
    - { name: retry_manager, timeout_ms: 0.7, on_timeout: fallback_level_1 }
    - { name: outcome_stream, timeout_ms: 0.5, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Authorisation rate uplift"
    - "Blended processing cost per transaction"
privacy:
  pii_in_logs: false
  retention_days: 400
