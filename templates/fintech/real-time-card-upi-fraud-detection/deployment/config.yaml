serving:
  deadline_ms: 8
  stages:
    - { name: auth_gateway, timeout_ms: 0.6, on_timeout: fallback_level_1 }
    - { name: feature_store_lookup, timeout_ms: 1.1, on_timeout: fallback_level_1 }
    - { name: graph_embedding, timeout_ms: 2.2, on_timeout: fallback_level_1 }
    - { name: fraud_scorer, timeout_ms: 2.2, on_timeout: fallback_level_1 }
    - { name: policy_engine, timeout_ms: 0.6, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Fraud basis points per volume"
    - "False-decline rate on good customers"
privacy:
  pii_in_logs: false
  retention_days: 400
