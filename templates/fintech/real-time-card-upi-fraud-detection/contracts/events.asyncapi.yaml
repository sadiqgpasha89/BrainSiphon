asyncapi: 3.0.0
info:
  title: Real-Time Card & UPI Fraud Detection events (illustrative)
  version: 0.1.0
  description: Generated from the blueprint's event schema. Partition by the entity key so one entity's events stay
    ordered.
channels:
  events:
    address: real.time.card.upi.fraud.detection.events
    messages:
      event:
        $ref: '#/components/messages/Event'
operations:
  publishEvents:
    action: send
    channel:
      $ref: '#/channels/events'
components:
  messages:
    Event:
      name: Event
      contentType: application/json
      payload:
        $ref: '#/components/schemas/EventPayload'
  schemas:
    EventPayload:
      type: object
      properties:
        type:
          type: string
          description: DecisionMade
        decision_id:
          type: string
        request_id:
          type: string
        entity_id:
          type: string
        decision:
          type: string
          enum:
          - PASS
          - REVIEW
          - ACT
        score:
          type: number
        reason_codes:
          type: string
          description: '[''string'']'
        model_version:
          type: string
        degraded:
          type: boolean
        latency_ms:
          type: number
        decided_at:
          type: string
          format: date-time
