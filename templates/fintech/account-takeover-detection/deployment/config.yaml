serving:
  deadline_ms: 80
  stages:
    - { name: login_event_gateway, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: session_feature_cache, timeout_ms: 13, on_timeout: fallback_level_1 }
    - { name: sequence_encoder, timeout_ms: 10, on_timeout: fallback_level_1 }
    - { name: ato_scorer, timeout_ms: 25, on_timeout: fallback_level_1 }
    - { name: step_up_policy, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: outcome_labels, timeout_ms: 10, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "ATO loss per 10k logins"
    - "Login success rate for good users"
privacy:
  pii_in_logs: false
  retention_days: 400
