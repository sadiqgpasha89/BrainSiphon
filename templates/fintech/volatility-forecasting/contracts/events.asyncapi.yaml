asyncapi: 3.0.0
info:
  title: Volatility Forecasting for Risk & Options events (illustrative)
  version: 0.1.0
  description: Generated from the blueprint's event schema. Partition by the entity key so one entity's events stay
    ordered.
channels:
  events:
    address: volatility.forecasting.events
    messages:
      event:
        $ref: '#/components/messages/Event'
operations:
  publishEvents:
    action: send
    channel:
      $ref: '#/channels/events'
components:
  messages:
    Event:
      name: Event
      contentType: application/json
      payload:
        $ref: '#/components/schemas/EventPayload'
  schemas:
    EventPayload:
      type: object
      properties:
        type:
          type: string
          description: ForecastRunCompleted
        run_id:
          type: string
        origin:
          type: string
          format: date-time
        series_total:
          type: integer
        series_fallback:
          type: integer
        model_version:
          type: string
        manifest_uri:
          type: string
        dq_gate:
          type: string
          enum:
          - PASSED
          - FAILED
        published_at:
          type: string
          format: date-time
