serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: delinquency_snapshot, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: uplift_scorer, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: constraint_optimiser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: compliance_filter, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: campaign_dispatcher, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: agent_desk, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outcome_feed, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Cure rate per collection rupee"
    - "Complaint rate"
privacy:
  pii_in_logs: false
  retention_days: 400
