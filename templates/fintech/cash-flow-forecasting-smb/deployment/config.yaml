serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: transaction_ingestion, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: recurrence_detector, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: feature_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: quantile_forecaster, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: conformal_calibrator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: alert_publisher, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: customer_actions, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Avoided overdraft incidents"
    - "Offer take-up of working-capital products"
privacy:
  pii_in_logs: false
  retention_days: 400
