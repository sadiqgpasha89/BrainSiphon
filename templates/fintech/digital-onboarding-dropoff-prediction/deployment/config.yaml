serving:
  deadline_ms: 80
  stages:
    - { name: client_event_stream, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: session_feature_builder, timeout_ms: 11, on_timeout: fallback_level_1 }
    - { name: drop_off_scorer, timeout_ms: 22, on_timeout: fallback_level_1 }
    - { name: uplift_selector, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: intervention_api, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: experiment_platform, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: completion_outcome, timeout_ms: 8, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Completion rate"
    - "Cost per activated account"
privacy:
  pii_in_logs: false
  retention_days: 400
