serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: sensor_ingestion, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: trip_segmentation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: map_matching, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: driving_event_extractor, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: risk_scorer, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: premium_engine, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: claims_linkage, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Claim frequency of high-score vs low-score"
    - "Opt-in retention"
privacy:
  pii_in_logs: false
  retention_days: 400
