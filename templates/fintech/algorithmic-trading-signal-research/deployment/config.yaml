serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: market_data_lake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: factor_engine, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: model_trainer, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: backtester, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: promotion_gate, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: portfolio_constructor, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: live_performance_tracker, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Live vs backtest slippage gap"
    - "Information coefficient decay"
privacy:
  pii_in_logs: false
  retention_days: 400
