serving:
  deadline_ms: 80
  stages:
    - { name: offer_request, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: eligibility_service, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: feature_lookup, timeout_ms: 11, on_timeout: fallback_level_1 }
    - { name: offer_ranker, timeout_ms: 23, on_timeout: fallback_level_1 }
    - { name: exploration_layer, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: display_api, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: outcome_events, timeout_ms: 6, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Booked accounts per impression"
    - "Profit per offer shown"
privacy:
  pii_in_logs: false
  retention_days: 400
