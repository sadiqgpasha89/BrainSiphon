serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: atm_dispense_logs, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: de_censoring_module, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: quantile_forecaster, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: cash_level_optimiser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: route_planner, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: operations_dispatch, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: replenishment_outcomes, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Cash-out incidents"
    - "Idle cash balance"
privacy:
  pii_in_logs: false
  retention_days: 400
