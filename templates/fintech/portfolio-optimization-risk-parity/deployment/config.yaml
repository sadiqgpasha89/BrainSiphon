serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: account_and_holdings_snapshot, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: risk_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: optimiser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: tax_and_constraint_layer, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: order_generator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: performance_attribution, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Goal-achievement probability"
    - "Tracking error to target"
privacy:
  pii_in_logs: false
  retention_days: 400
