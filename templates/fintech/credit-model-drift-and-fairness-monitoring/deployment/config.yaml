serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: scored_decisions_log, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outcome_joiner, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: drift_and_fairness_metrics, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: delay_aware_estimator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: governance_dashboard, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: model_risk_committee, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: retrain_trigger, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to detect degradation"
    - "Audit finding count"
privacy:
  pii_in_logs: false
  retention_days: 400
