serving:
  deadline_ms: 2500
  stages:
    - { name: chat_gateway, timeout_ms: 120, on_timeout: fallback_level_1 }
    - { name: redaction_layer, timeout_ms: 481, on_timeout: fallback_level_1 }
    - { name: intent_router, timeout_ms: 481, on_timeout: fallback_level_1 }
    - { name: rag_assistant, timeout_ms: 361, on_timeout: fallback_level_1 }
    - { name: policy_and_disclosure_check, timeout_ms: 120, on_timeout: fallback_level_1 }
    - { name: agent_handoff, timeout_ms: 481, on_timeout: fallback_level_1 }
    - { name: conversation_analytics, timeout_ms: 181, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Containment with CSAT parity"
    - "Escalation quality"
privacy:
  pii_in_logs: false
  retention_days: 400
