serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: insight_generator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: candidate_retrieval, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: multi_objective_ranker, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: budget_optimiser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: suitability_filter, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: push_dispatcher, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: response_events, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Goal progress per active user"
    - "Opt-out rate"
privacy:
  pii_in_logs: false
  retention_days: 400
