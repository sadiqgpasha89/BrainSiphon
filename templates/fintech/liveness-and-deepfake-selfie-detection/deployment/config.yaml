serving:
  deadline_ms: 2500
  stages:
    - { name: capture_sdk, timeout_ms: 234, on_timeout: fallback_level_1 }
    - { name: frame_sampler, timeout_ms: 234, on_timeout: fallback_level_1 }
    - { name: pad_ensemble, timeout_ms: 352, on_timeout: fallback_level_1 }
    - { name: attack_class_aggregator, timeout_ms: 469, on_timeout: fallback_level_1 }
    - { name: decision_service, timeout_ms: 234, on_timeout: fallback_level_1 }
    - { name: fraud_ops, timeout_ms: 351, on_timeout: fallback_level_1 }
    - { name: attack_library, timeout_ms: 351, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Account-opening fraud rate"
    - "Onboarding completion rate"
privacy:
  pii_in_logs: false
  retention_days: 400
