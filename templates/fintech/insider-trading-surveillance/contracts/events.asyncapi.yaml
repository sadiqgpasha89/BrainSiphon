asyncapi: 3.0.0
info:
  title: Insider Trading & Market Abuse Surveillance events (illustrative)
  version: 0.1.0
  description: Generated from the blueprint's event schema. Partition by the entity key so one entity's events stay
    ordered.
channels:
  events:
    address: insider.trading.surveillance.events
    messages:
      event:
        $ref: '#/components/messages/Event'
operations:
  publishEvents:
    action: send
    channel:
      $ref: '#/channels/events'
components:
  messages:
    Event:
      name: Event
      contentType: application/json
      payload:
        $ref: '#/components/schemas/EventPayload'
  schemas:
    EventPayload:
      type: object
      properties:
        type:
          type: string
          enum:
          - DocumentProcessed
          - ReviewRequested
          - ReviewResolved
        document_id:
          type: string
        status:
          type: string
        fields_extracted:
          type: integer
        fields_needing_review:
          type: integer
        model_version:
          type: string
        occurred_at:
          type: string
          format: date-time
