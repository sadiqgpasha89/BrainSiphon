serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: trade_and_news_ingestion, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: event_study_feature_job, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: relationship_graph, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: abuse_scorer, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: timeline_summariser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: disposition_labels, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Alerts per confirmed case"
    - "Review time per alert"
privacy:
  pii_in_logs: false
  retention_days: 400
