serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: edge_extractor, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: graph_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: community_detection, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: ring_classifier, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: ring_dossier_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outcome_labels, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Accounts removed per ring"
    - "Repeat-fraud rate after takedown"
privacy:
  pii_in_logs: false
  retention_days: 400
