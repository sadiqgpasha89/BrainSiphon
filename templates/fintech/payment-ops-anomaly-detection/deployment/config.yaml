serving:
  deadline_ms: 80
  stages:
    - { name: metrics_stream, timeout_ms: 4, on_timeout: fallback_level_1 }
    - { name: segment_aggregator, timeout_ms: 16, on_timeout: fallback_level_1 }
    - { name: seasonal_forecaster, timeout_ms: 16, on_timeout: fallback_level_1 }
    - { name: anomaly_scorer, timeout_ms: 16, on_timeout: fallback_level_1 }
    - { name: alert_deduplicator, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: on_call_page, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: incident_labels, timeout_ms: 6, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Mean time to detect"
    - "Alert fatigue (pages per incident)"
privacy:
  pii_in_logs: false
  retention_days: 400
