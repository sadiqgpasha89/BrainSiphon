serving:
  deadline_ms: 2500
  stages:
    - { name: upload_gateway, timeout_ms: 178, on_timeout: fallback_level_1 }
    - { name: quality_gate, timeout_ms: 267, on_timeout: fallback_level_1 }
    - { name: document_classifier, timeout_ms: 712, on_timeout: fallback_level_1 }
    - { name: tamper_and_ocr_models, timeout_ms: 712, on_timeout: fallback_level_1 }
    - { name: decision_aggregator, timeout_ms: 356, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Manual review rate"
    - "Document fraud passed to downstream"
privacy:
  pii_in_logs: false
  retention_days: 400
