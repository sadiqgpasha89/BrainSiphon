serving:
  deadline_ms: 80
  stages:
    - { name: application_api, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: account_aggregator_pull, timeout_ms: 11, on_timeout: fallback_level_1 }
    - { name: cash_flow_feature_engine, timeout_ms: 11, on_timeout: fallback_level_1 }
    - { name: credit_scorer, timeout_ms: 22, on_timeout: fallback_level_1 }
    - { name: fairness_and_policy_layer, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: underwriter_exceptions, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: repayment_outcomes, timeout_ms: 8, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Bad rate in thin-file cohort"
    - "Incremental approvals at equal loss"
privacy:
  pii_in_logs: false
  retention_days: 400
