serving:
  deadline_ms: 80
  stages:
    - { name: screening_api, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: name_normaliser, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: candidate_generation, timeout_ms: 17, on_timeout: fallback_level_1 }
    - { name: cross_encoder_reranker, timeout_ms: 23, on_timeout: fallback_level_1 }
    - { name: threshold_policy, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: adjudication_labels, timeout_ms: 12, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Analyst hours per 1000 screens"
    - "Missed true match incidents"
privacy:
  pii_in_logs: false
  retention_days: 400
