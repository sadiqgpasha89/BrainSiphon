serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: claim_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: entity_resolution, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: graph_feature_job, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: fraud_scorer, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: narrative_analyser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: siu_referral, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: recovery_outcomes, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Fraud recovery per investigator hour"
    - "Genuine claim cycle time"
privacy:
  pii_in_logs: false
  retention_days: 400
