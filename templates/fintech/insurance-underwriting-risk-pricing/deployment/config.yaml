serving:
  deadline_ms: 80
  stages:
    - { name: quote_request, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: rating_factor_service, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: risk_model, timeout_ms: 20, on_timeout: fallback_level_1 }
    - { name: price_optimiser, timeout_ms: 19, on_timeout: fallback_level_1 }
    - { name: compliance_check, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: underwriter_referral, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: claims_outcomes, timeout_ms: 7, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Loss ratio by cohort"
    - "Conversion rate at target margin"
privacy:
  pii_in_logs: false
  retention_days: 400
