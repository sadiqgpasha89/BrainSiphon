serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: transcript_ingestion, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: speaker_diarisation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: claim_extractor, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: delta_feature_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: point_in_time_store, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: signal_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Analyst usage"
    - "Portfolio contribution of signals"
privacy:
  pii_in_logs: false
  retention_days: 400
