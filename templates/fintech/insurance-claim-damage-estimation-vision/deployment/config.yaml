serving:
  deadline_ms: 2500
  stages:
    - { name: guided_capture_app, timeout_ms: 171, on_timeout: fallback_level_1 }
    - { name: image_quality_gate, timeout_ms: 257, on_timeout: fallback_level_1 }
    - { name: damage_segmentation, timeout_ms: 685, on_timeout: fallback_level_1 }
    - { name: repair_line_estimator, timeout_ms: 684, on_timeout: fallback_level_1 }
    - { name: price_service, timeout_ms: 171, on_timeout: fallback_level_1 }
    - { name: settlement_outcomes, timeout_ms: 257, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Straight-through settlement rate"
    - "Supplement (re-estimate) rate"
privacy:
  pii_in_logs: false
  retention_days: 400
