serving:
  deadline_ms: 2500
  stages:
    - { name: alert_intake, timeout_ms: 223, on_timeout: fallback_level_1 }
    - { name: evidence_retriever, timeout_ms: 668, on_timeout: fallback_level_1 }
    - { name: planner_llm, timeout_ms: 890, on_timeout: fallback_level_1 }
    - { name: citation_verifier, timeout_ms: 222, on_timeout: fallback_level_1 }
    - { name: guardrail_filter, timeout_ms: 222, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Analyst minutes per alert"
    - "Missed-suspicious rate in QA sample"
privacy:
  pii_in_logs: false
  retention_days: 400
