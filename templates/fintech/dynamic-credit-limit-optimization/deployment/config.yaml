serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: portfolio_snapshot, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: risk_and_uplift_models, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: policy_optimiser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: constraint_checker, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: change_publisher, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outcome_tracker, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Revenue per account net of loss"
    - "Share of accounts with limit increases that default"
privacy:
  pii_in_logs: false
  retention_days: 400
