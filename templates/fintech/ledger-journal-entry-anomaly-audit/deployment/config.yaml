serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: gl_extract, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: peer_group_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: anomaly_ensemble, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: rule_checks, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: explanation_generator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: finding_outcomes, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Findings per hundred hours"
    - "Time to complete testing"
privacy:
  pii_in_logs: false
  retention_days: 400
