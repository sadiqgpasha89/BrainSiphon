serving:
  deadline_ms: 80
  stages:
    - { name: application_intake, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: identity_and_bureau_checks, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: linkage_features, timeout_ms: 13, on_timeout: fallback_level_1 }
    - { name: risk_model, timeout_ms: 26, on_timeout: fallback_level_1 }
    - { name: decision_and_reasons, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: outcome_labels, timeout_ms: 13, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Fraud loss at onboarding"
    - "Genuine approval rate"
    - "Review queue volume"
privacy:
  pii_in_logs: false
  retention_days: 400
