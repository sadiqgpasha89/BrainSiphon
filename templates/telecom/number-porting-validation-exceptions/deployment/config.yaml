serving:
  deadline_ms: 2500
  stages:
    - { name: port_request_intake, timeout_ms: 186, on_timeout: fallback_level_1 }
    - { name: field_and_format_validation, timeout_ms: 185, on_timeout: fallback_level_1 }
    - { name: rejection_risk_model, timeout_ms: 742, on_timeout: fallback_level_1 }
    - { name: reason_mapping, timeout_ms: 278, on_timeout: fallback_level_1 }
    - { name: guidance_to_requester, timeout_ms: 278, on_timeout: fallback_level_1 }
    - { name: submission_to_porting_hub, timeout_ms: 185, on_timeout: fallback_level_1 }
    - { name: outcome_capture, timeout_ms: 371, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "First-attempt port success"
    - "Days to complete a port"
    - "Port-related care contacts"
privacy:
  pii_in_logs: false
  retention_days: 400
