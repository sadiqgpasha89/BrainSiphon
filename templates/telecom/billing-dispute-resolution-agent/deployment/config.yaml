serving:
  deadline_ms: 2500
  stages:
    - { name: dispute_intake, timeout_ms: 194, on_timeout: fallback_level_1 }
    - { name: record_retrieval, timeout_ms: 580, on_timeout: fallback_level_1 }
    - { name: rule_trace_and_plan_check, timeout_ms: 194, on_timeout: fallback_level_1 }
    - { name: resolution_proposal, timeout_ms: 774, on_timeout: fallback_level_1 }
    - { name: approval_gate, timeout_ms: 193, on_timeout: fallback_level_1 }
    - { name: correction_and_message, timeout_ms: 290, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to resolve"
    - "Disputes reopened"
    - "Credits outside policy"
privacy:
  pii_in_logs: false
  retention_days: 400
