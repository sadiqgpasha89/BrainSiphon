serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: usage_and_base_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: demand_forecast, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: lead_time_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: stock_optimiser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: order_proposals, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: accuracy_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Stock-outs"
    - "Inventory value"
    - "Write-offs"
privacy:
  pii_in_logs: false
  retention_days: 400
