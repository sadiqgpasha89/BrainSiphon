serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: usage_feed, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: cycle_to_date_features, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: shock_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: alert_rules_and_caps, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: message_with_cause, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: customer_response_capture, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: dispute_join, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Bill disputes"
    - "Complaints about charges"
    - "Opt-outs from alerts"
privacy:
  pii_in_logs: false
  retention_days: 400
