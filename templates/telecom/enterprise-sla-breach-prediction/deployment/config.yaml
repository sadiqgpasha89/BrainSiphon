serving:
  deadline_ms: 2500
  stages:
    - { name: service_impact_and_budget, timeout_ms: 139, on_timeout: fallback_level_1 }
    - { name: path_and_incident_features, timeout_ms: 278, on_timeout: fallback_level_1 }
    - { name: breach_model, timeout_ms: 556, on_timeout: fallback_level_1 }
    - { name: planned_work_join, timeout_ms: 278, on_timeout: fallback_level_1 }
    - { name: ranked_alerts, timeout_ms: 556, on_timeout: fallback_level_1 }
    - { name: action_tracking, timeout_ms: 209, on_timeout: fallback_level_1 }
    - { name: outcome_tracking, timeout_ms: 209, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "SLA credits paid"
    - "Breaches avoided"
    - "Enterprise churn"
privacy:
  pii_in_logs: false
  retention_days: 400
