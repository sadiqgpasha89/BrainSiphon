serving:
  deadline_ms: 2500
  stages:
    - { name: requirements_capture, timeout_ms: 171, on_timeout: fallback_level_1 }
    - { name: profile_validation, timeout_ms: 342, on_timeout: fallback_level_1 }
    - { name: design_selection, timeout_ms: 257, on_timeout: fallback_level_1 }
    - { name: feasibility_and_capacity, timeout_ms: 257, on_timeout: fallback_level_1 }
    - { name: plan_and_quote_draft, timeout_ms: 684, on_timeout: fallback_level_1 }
    - { name: engineer_approval, timeout_ms: 257, on_timeout: fallback_level_1 }
    - { name: activation_orchestration, timeout_ms: 257, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Request to activation time"
    - "Quotes revised after delivery"
    - "Customer SLA attainment"
privacy:
  pii_in_logs: false
  retention_days: 400
