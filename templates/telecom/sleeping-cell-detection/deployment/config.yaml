serving:
  deadline_ms: 2500
  stages:
    - { name: kpi_ingestion, timeout_ms: 342, on_timeout: fallback_level_1 }
    - { name: peer_prediction, timeout_ms: 685, on_timeout: fallback_level_1 }
    - { name: residual_and_kpi_features, timeout_ms: 342, on_timeout: fallback_level_1 }
    - { name: silent_outage_classifier, timeout_ms: 685, on_timeout: fallback_level_1 }
    - { name: planned_work_filter, timeout_ms: 171, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Silent outage duration"
    - "Customer complaints per silent outage"
    - "Truck rolls avoided"
privacy:
  pii_in_logs: false
  retention_days: 400
