serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: recharge_event_ingestion, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: customer_features, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: time_to_recharge_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: amount_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: reminder_list, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: liquidity_forecast, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: accuracy_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Reminder conversion"
    - "Liquidity forecast error"
    - "Customers contacted per recharge"
privacy:
  pii_in_logs: false
  retention_days: 400
