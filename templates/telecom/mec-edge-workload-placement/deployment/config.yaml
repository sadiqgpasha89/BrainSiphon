serving:
  deadline_ms: 2500
  stages:
    - { name: capacity_and_latency_telemetry, timeout_ms: 154, on_timeout: fallback_level_1 }
    - { name: demand_forecast, timeout_ms: 614, on_timeout: fallback_level_1 }
    - { name: placement_optimiser, timeout_ms: 614, on_timeout: fallback_level_1 }
    - { name: simulation_check, timeout_ms: 230, on_timeout: fallback_level_1 }
    - { name: approval_gate, timeout_ms: 230, on_timeout: fallback_level_1 }
    - { name: orchestration, timeout_ms: 153, on_timeout: fallback_level_1 }
    - { name: outcome_monitor, timeout_ms: 230, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "SLA attainment for edge services"
    - "Edge compute cost"
    - "Disruptive migrations"
privacy:
  pii_in_logs: false
  retention_days: 400
