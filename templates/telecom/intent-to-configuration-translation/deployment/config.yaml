serving:
  deadline_ms: 2500
  stages:
    - { name: request_intake, timeout_ms: 212, on_timeout: fallback_level_1 }
    - { name: intent_extraction, timeout_ms: 847, on_timeout: fallback_level_1 }
    - { name: schema_and_policy_validation, timeout_ms: 212, on_timeout: fallback_level_1 }
    - { name: config_rendering, timeout_ms: 318, on_timeout: fallback_level_1 }
    - { name: twin_simulation, timeout_ms: 318, on_timeout: fallback_level_1 }
    - { name: approval_and_push, timeout_ms: 318, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Lead time for routine changes"
    - "Post-change defects"
    - "Share of changes through the typed path"
privacy:
  pii_in_logs: false
  retention_days: 400
