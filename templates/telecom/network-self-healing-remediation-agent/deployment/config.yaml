serving:
  deadline_ms: 2500
  stages:
    - { name: alarm_intake_and_correlation, timeout_ms: 154, on_timeout: fallback_level_1 }
    - { name: incident_enrichment, timeout_ms: 307, on_timeout: fallback_level_1 }
    - { name: runbook_retrieval, timeout_ms: 460, on_timeout: fallback_level_1 }
    - { name: plan_proposal, timeout_ms: 614, on_timeout: fallback_level_1 }
    - { name: approval_gate, timeout_ms: 230, on_timeout: fallback_level_1 }
    - { name: execution, timeout_ms: 230, on_timeout: fallback_level_1 }
    - { name: kpi_verification_and_rollback, timeout_ms: 230, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Mean time to restore for covered fault classes"
    - "Incidents resolved without escalation"
    - "Change-induced outages"
privacy:
  pii_in_logs: false
  retention_days: 400
