serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: session_kpi_aggregation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: customer_feature_build, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: experience_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: score_banding_and_reason, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: publish_to_care_and_ops, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: retrain, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Contacts per low-score customer"
    - "Churn among low-score customers"
    - "Reduction in unaddressed low scores"
privacy:
  pii_in_logs: false
  retention_days: 400
