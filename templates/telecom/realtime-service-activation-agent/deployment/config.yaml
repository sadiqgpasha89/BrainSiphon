serving:
  deadline_ms: 2500
  stages:
    - { name: order_intake, timeout_ms: 194, on_timeout: fallback_level_1 }
    - { name: eligibility_and_consent_gate, timeout_ms: 193, on_timeout: fallback_level_1 }
    - { name: step_planning, timeout_ms: 774, on_timeout: fallback_level_1 }
    - { name: provisioning_calls, timeout_ms: 774, on_timeout: fallback_level_1 }
    - { name: verification_probes, timeout_ms: 290, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to activate"
    - "Orders needing manual touch"
    - "Billing errors after activation"
privacy:
  pii_in_logs: false
  retention_days: 400
