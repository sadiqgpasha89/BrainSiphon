serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: image_upload, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: quality_check, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: component_and_defect_detection, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: registration_and_change, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: severity_ranking, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: work_order, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Inspection hours per tower"
    - "Defects found early"
    - "Climber hours"
privacy:
  pii_in_logs: false
  retention_days: 400
