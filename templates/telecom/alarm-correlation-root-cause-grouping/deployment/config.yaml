serving:
  deadline_ms: 2500
  stages:
    - { name: alarm_normalisation, timeout_ms: 144, on_timeout: fallback_level_1 }
    - { name: topology_graph_build, timeout_ms: 287, on_timeout: fallback_level_1 }
    - { name: candidate_grouping, timeout_ms: 431, on_timeout: fallback_level_1 }
    - { name: root_cause_ranking, timeout_ms: 574, on_timeout: fallback_level_1 }
    - { name: incident_creation, timeout_ms: 215, on_timeout: fallback_level_1 }
    - { name: model_refresh, timeout_ms: 574, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Tickets per underlying fault"
    - "Time to first correct diagnosis"
    - "Engineer overrides"
privacy:
  pii_in_logs: false
  retention_days: 400
