serving:
  deadline_ms: 80
  stages:
    - { name: application_and_bureau_pull, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: feature_build, timeout_ms: 11, on_timeout: fallback_level_1 }
    - { name: risk_model, timeout_ms: 23, on_timeout: fallback_level_1 }
    - { name: policy_and_deposit_tiers, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: decision_and_reasons, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: performance_tracking, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: fairness_and_drift_monitor, timeout_ms: 9, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Bad debt rate"
    - "Approval rate"
    - "Appeals upheld"
privacy:
  pii_in_logs: false
  retention_days: 400
