serving:
  deadline_ms: 2500
  stages:
    - { name: question_intake, timeout_ms: 178, on_timeout: fallback_level_1 }
    - { name: policy_and_catalogue_retrieval, timeout_ms: 534, on_timeout: fallback_level_1 }
    - { name: mapping_and_gap_check, timeout_ms: 178, on_timeout: fallback_level_1 }
    - { name: grounded_answer, timeout_ms: 712, on_timeout: fallback_level_1 }
    - { name: owner_routing, timeout_ms: 267, on_timeout: fallback_level_1 }
    - { name: decision_log, timeout_ms: 178, on_timeout: fallback_level_1 }
    - { name: policy_update_sync, timeout_ms: 178, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to answer privacy questions"
    - "Datasets with overdue retention"
    - "Escalations to legal"
privacy:
  pii_in_logs: false
  retention_days: 400
