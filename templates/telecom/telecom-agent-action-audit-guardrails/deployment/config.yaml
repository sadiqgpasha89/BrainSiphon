serving:
  deadline_ms: 2500
  stages:
    - { name: orchestration_gate, timeout_ms: 202, on_timeout: fallback_level_1 }
    - { name: change_tier_decision, timeout_ms: 202, on_timeout: fallback_level_1 }
    - { name: duty_manager_approval, timeout_ms: 304, on_timeout: fallback_level_1 }
    - { name: change_trail, timeout_ms: 405, on_timeout: fallback_level_1 }
    - { name: action_behaviour_monitor, timeout_ms: 809, on_timeout: fallback_level_1 }
    - { name: trail_replay_console, timeout_ms: 303, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Risky changes stopped before execution"
    - "Service incidents traced to agent actions"
    - "Minutes to answer a regulator trail request"
privacy:
  pii_in_logs: false
  retention_days: 400
