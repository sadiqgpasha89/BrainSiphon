serving:
  deadline_ms: 2500
  stages:
    - { name: fallout_event_intake, timeout_ms: 144, on_timeout: fallback_level_1 }
    - { name: error_classification, timeout_ms: 574, on_timeout: fallback_level_1 }
    - { name: evidence_gathering, timeout_ms: 216, on_timeout: fallback_level_1 }
    - { name: fix_selection, timeout_ms: 574, on_timeout: fallback_level_1 }
    - { name: fix_execution, timeout_ms: 215, on_timeout: fallback_level_1 }
    - { name: verification, timeout_ms: 287, on_timeout: fallback_level_1 }
    - { name: handoff_note, timeout_ms: 215, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Share of fallout resolved without a person"
    - "Handler time per order"
    - "Repeat fallout"
privacy:
  pii_in_logs: false
  retention_days: 400
