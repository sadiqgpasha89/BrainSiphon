serving:
  deadline_ms: 80
  stages:
    - { name: signalling_ingestion, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: windowed_rates, timeout_ms: 11, on_timeout: fallback_level_1 }
    - { name: baseline_and_anomaly_score, timeout_ms: 22, on_timeout: fallback_level_1 }
    - { name: source_attribution, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: throttle_proposal, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: approval_and_apply, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: recovery_check, timeout_ms: 8, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Core overload minutes"
    - "Storm-induced outages"
    - "Throttle duration"
privacy:
  pii_in_logs: false
  retention_days: 400
