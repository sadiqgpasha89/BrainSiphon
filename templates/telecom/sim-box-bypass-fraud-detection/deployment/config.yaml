serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: cdr_ingestion, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: line_aggregates, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: graph_construction, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: fraud_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: cluster_ranking, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: block_action, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Bypass minutes blocked"
    - "Revenue recovered"
    - "False blocks of genuine lines"
privacy:
  pii_in_logs: false
  retention_days: 400
