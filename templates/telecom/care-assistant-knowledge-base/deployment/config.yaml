serving:
  deadline_ms: 2500
  stages:
    - { name: question_intake, timeout_ms: 202, on_timeout: fallback_level_1 }
    - { name: intent_and_plan_context, timeout_ms: 405, on_timeout: fallback_level_1 }
    - { name: retrieval, timeout_ms: 607, on_timeout: fallback_level_1 }
    - { name: grounded_answer, timeout_ms: 809, on_timeout: fallback_level_1 }
    - { name: confidence_and_policy_gate, timeout_ms: 202, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Contacts resolved without an agent"
    - "Repeat contacts"
    - "Handle time on escalated chats"
privacy:
  pii_in_logs: false
  retention_days: 400
