serving:
  deadline_ms: 2500
  stages:
    - { name: experience_scoring, timeout_ms: 659, on_timeout: fallback_level_1 }
    - { name: cause_attribution, timeout_ms: 165, on_timeout: fallback_level_1 }
    - { name: remedy_selection, timeout_ms: 659, on_timeout: fallback_level_1 }
    - { name: cost_and_consent_gate, timeout_ms: 165, on_timeout: fallback_level_1 }
    - { name: action_execution, timeout_ms: 247, on_timeout: fallback_level_1 }
    - { name: outcome_tracking, timeout_ms: 330, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Contacts avoided per 1000 customers"
    - "Credit cost per avoided contact"
    - "Satisfaction after proactive contact"
privacy:
  pii_in_logs: false
  retention_days: 400
