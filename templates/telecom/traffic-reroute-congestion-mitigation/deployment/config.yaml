serving:
  deadline_ms: 2500
  stages:
    - { name: telemetry_and_flow_ingestion, timeout_ms: 159, on_timeout: fallback_level_1 }
    - { name: demand_estimation, timeout_ms: 636, on_timeout: fallback_level_1 }
    - { name: topology_and_capacity_model, timeout_ms: 636, on_timeout: fallback_level_1 }
    - { name: plan_search, timeout_ms: 159, on_timeout: fallback_level_1 }
    - { name: safety_and_approval_gate, timeout_ms: 159, on_timeout: fallback_level_1 }
    - { name: template_execution, timeout_ms: 238, on_timeout: fallback_level_1 }
    - { name: post_change_validation, timeout_ms: 238, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Minutes of congested links at peak"
    - "Customer-impacting packet loss"
    - "Manual reroutes"
privacy:
  pii_in_logs: false
  retention_days: 400
