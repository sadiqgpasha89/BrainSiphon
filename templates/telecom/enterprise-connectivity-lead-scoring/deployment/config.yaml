serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: lead_and_firmographic_ingestion, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: serviceability_join, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: lead_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: value_estimate, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: rank_and_reasons, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: retrain, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Sales conversion"
    - "Revenue per sales hour"
    - "Leads closed as unserviceable"
privacy:
  pii_in_logs: false
  retention_days: 400
