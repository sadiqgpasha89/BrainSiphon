serving:
  deadline_ms: 2500
  stages:
    - { name: otdr_trace_capture, timeout_ms: 165, on_timeout: fallback_level_1 }
    - { name: event_detection, timeout_ms: 165, on_timeout: fallback_level_1 }
    - { name: route_join, timeout_ms: 330, on_timeout: fallback_level_1 }
    - { name: location_model, timeout_ms: 659, on_timeout: fallback_level_1 }
    - { name: fault_classifier, timeout_ms: 659, on_timeout: fallback_level_1 }
    - { name: crew_guidance, timeout_ms: 247, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to locate the fault"
    - "Wasted crew travel"
    - "Repeat visits to the same fault"
privacy:
  pii_in_logs: false
  retention_days: 400
