serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: usage_file_ingestion, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: exact_matching, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: near_match_proposal, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: mismatch_classification, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: dispute_pack, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: partner_submission, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Settlement variance"
    - "Days to close a period"
    - "Disputed amount recovered"
privacy:
  pii_in_logs: false
  retention_days: 400
