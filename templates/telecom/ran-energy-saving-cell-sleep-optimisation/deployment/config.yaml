serving:
  deadline_ms: 2500
  stages:
    - { name: kpi_and_energy_ingestion, timeout_ms: 135, on_timeout: fallback_level_1 }
    - { name: load_forecast, timeout_ms: 540, on_timeout: fallback_level_1 }
    - { name: candidate_set_and_guardrails, timeout_ms: 405, on_timeout: fallback_level_1 }
    - { name: policy_selection, timeout_ms: 539, on_timeout: fallback_level_1 }
    - { name: action_push, timeout_ms: 202, on_timeout: fallback_level_1 }
    - { name: quality_monitor_and_revert, timeout_ms: 202, on_timeout: fallback_level_1 }
    - { name: savings_attribution, timeout_ms: 202, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Energy cost per site"
    - "Customer quality complaints in sleep areas"
    - "Wake-up events"
privacy:
  pii_in_logs: false
  retention_days: 400
