serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: usage_data_extraction, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: hop_level_reconciliation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: baseline_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: anomaly_scoring, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: root_cause_classifier, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: recovery_list, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: fix_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Revenue recovered"
    - "Time from leak to fix"
    - "Leaks found by customers"
privacy:
  pii_in_logs: false
  retention_days: 400
