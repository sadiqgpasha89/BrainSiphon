serving:
  deadline_ms: 2500
  stages:
    - { name: ticket_intake, timeout_ms: 194, on_timeout: fallback_level_1 }
    - { name: line_test_and_device_data, timeout_ms: 290, on_timeout: fallback_level_1 }
    - { name: fixability_model, timeout_ms: 774, on_timeout: fallback_level_1 }
    - { name: safety_and_critical_rules, timeout_ms: 194, on_timeout: fallback_level_1 }
    - { name: remote_step_sequence, timeout_ms: 290, on_timeout: fallback_level_1 }
    - { name: visit_decision, timeout_ms: 193, on_timeout: fallback_level_1 }
    - { name: outcome_labels, timeout_ms: 290, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Truck rolls avoided"
    - "Repeat visits"
    - "Time to fix"
privacy:
  pii_in_logs: false
  retention_days: 400
