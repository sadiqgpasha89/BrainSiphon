serving:
  deadline_ms: 80
  stages:
    - { name: eligibility_filter, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: candidate_retrieval, timeout_ms: 17, on_timeout: fallback_level_1 }
    - { name: re_ranker, timeout_ms: 22, on_timeout: fallback_level_1 }
    - { name: suitability_and_consent_gate, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: offer_display, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: response_capture, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: holdout_evaluation, timeout_ms: 8, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Incremental revenue against holdout"
    - "Complaints about offers"
    - "Retention of accepting customers"
privacy:
  pii_in_logs: false
  retention_days: 400
