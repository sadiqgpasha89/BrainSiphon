serving:
  deadline_ms: 2500
  stages:
    - { name: change_intake, timeout_ms: 153, on_timeout: fallback_level_1 }
    - { name: feature_build, timeout_ms: 307, on_timeout: fallback_level_1 }
    - { name: risk_model, timeout_ms: 614, on_timeout: fallback_level_1 }
    - { name: calibration, timeout_ms: 230, on_timeout: fallback_level_1 }
    - { name: post_change_outcome, timeout_ms: 307, on_timeout: fallback_level_1 }
    - { name: model_monitoring, timeout_ms: 614, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Change-induced incidents"
    - "Median approval time for low-risk changes"
    - "Changes rolled back"
privacy:
  pii_in_logs: false
  retention_days: 400
