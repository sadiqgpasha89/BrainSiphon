serving:
  deadline_ms: 80
  stages:
    - { name: activation_request, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: feature_fetch, timeout_ms: 12, on_timeout: fallback_level_1 }
    - { name: risk_model, timeout_ms: 23, on_timeout: fallback_level_1 }
    - { name: policy_tiers, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: step_up_or_hold, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: outcome_labels, timeout_ms: 11, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Takeover losses"
    - "Genuine customers stepped up"
    - "Activation completion rate"
privacy:
  pii_in_logs: false
  retention_days: 400
