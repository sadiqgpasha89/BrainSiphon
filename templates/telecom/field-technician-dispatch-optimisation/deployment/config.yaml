serving:
  deadline_ms: 2500
  stages:
    - { name: job_and_schedule_intake, timeout_ms: 159, on_timeout: fallback_level_1 }
    - { name: duration_model, timeout_ms: 636, on_timeout: fallback_level_1 }
    - { name: travel_matrix, timeout_ms: 238, on_timeout: fallback_level_1 }
    - { name: optimiser, timeout_ms: 636, on_timeout: fallback_level_1 }
    - { name: re_plan_on_events, timeout_ms: 159, on_timeout: fallback_level_1 }
    - { name: dispatcher_console, timeout_ms: 238, on_timeout: fallback_level_1 }
    - { name: outcome_capture, timeout_ms: 159, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "On-time completion"
    - "Kilometres per job"
    - "Repeat visits"
privacy:
  pii_in_logs: false
  retention_days: 400
