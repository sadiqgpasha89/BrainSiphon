serving:
  deadline_ms: 2500
  stages:
    - { name: complaint_intake, timeout_ms: 318, on_timeout: fallback_level_1 }
    - { name: rule_layer, timeout_ms: 318, on_timeout: fallback_level_1 }
    - { name: classifier, timeout_ms: 1271, on_timeout: fallback_level_1 }
    - { name: severity_and_routing, timeout_ms: 318, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Regulator breaches"
    - "Time to first response"
    - "Complaint reopen rate"
privacy:
  pii_in_logs: false
  retention_days: 400
