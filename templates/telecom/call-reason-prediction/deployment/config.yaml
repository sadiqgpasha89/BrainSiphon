serving:
  deadline_ms: 80
  stages:
    - { name: contact_start_event, timeout_ms: 4, on_timeout: fallback_level_1 }
    - { name: feature_fetch, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: reason_model, timeout_ms: 18, on_timeout: fallback_level_1 }
    - { name: calibration, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: routing_and_self_service_hint, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: agent_coding, timeout_ms: 18, on_timeout: fallback_level_1 }
    - { name: retrain, timeout_ms: 7, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Transfers per contact"
    - "Time to first correct skill"
    - "Self-service resolution"
privacy:
  pii_in_logs: false
  retention_days: 400
