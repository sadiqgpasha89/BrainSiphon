serving:
  deadline_ms: 2500
  stages:
    - { name: requirement_capture, timeout_ms: 159, on_timeout: fallback_level_1 }
    - { name: property_filter, timeout_ms: 159, on_timeout: fallback_level_1 }
    - { name: regulatory_and_supply_filter, timeout_ms: 159, on_timeout: fallback_level_1 }
    - { name: ranking, timeout_ms: 636, on_timeout: fallback_level_1 }
    - { name: cited_shortlist, timeout_ms: 636, on_timeout: fallback_level_1 }
    - { name: engineer_validation, timeout_ms: 238, on_timeout: fallback_level_1 }
    - { name: selection_record, timeout_ms: 238, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to shortlist"
    - "Late material changes"
    - "Test failures"
privacy:
  pii_in_logs: false
  retention_days: 400
