serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: telemetry_ingestion, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: state_classification, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: utilisation_analytics, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: failure_risk, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: service_plan, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outcome_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Unplanned machine downtime"
    - "Fuel cost"
    - "Idle time"
privacy:
  pii_in_logs: false
  retention_days: 400
