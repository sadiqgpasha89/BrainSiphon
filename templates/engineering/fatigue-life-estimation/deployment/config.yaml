serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: load_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: cycle_counting, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: stress_mapping, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: damage_accumulation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: remaining_life_range, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: inspection_plan, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Fatigue cracks found late"
    - "Inspection cost"
    - "Assets beyond design life"
privacy:
  pii_in_logs: false
  retention_days: 400
