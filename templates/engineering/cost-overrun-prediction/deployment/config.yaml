serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: cost_and_commitment_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: feature_build, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: overrun_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: calibration, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: driver_attribution, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outcome_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Cost overrun rate"
    - "Time to detect overruns"
    - "Contingency use"
privacy:
  pii_in_logs: false
  retention_days: 400
