serving:
  deadline_ms: 2500
  stages:
    - { name: consented_transcript, timeout_ms: 223, on_timeout: fallback_level_1 }
    - { name: segmentation, timeout_ms: 593, on_timeout: fallback_level_1 }
    - { name: decision_and_action_extraction, timeout_ms: 593, on_timeout: fallback_level_1 }
    - { name: owner_and_date_proposal, timeout_ms: 148, on_timeout: fallback_level_1 }
    - { name: chair_confirmation, timeout_ms: 223, on_timeout: fallback_level_1 }
    - { name: action_tracking, timeout_ms: 223, on_timeout: fallback_level_1 }
    - { name: reminders, timeout_ms: 222, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Action completion rate"
    - "Time to publish minutes"
    - "Missed actions"
privacy:
  pii_in_logs: false
  retention_days: 400
