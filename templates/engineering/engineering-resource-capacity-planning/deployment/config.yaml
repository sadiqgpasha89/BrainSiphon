serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: pipeline_and_effort_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: demand_forecast, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: capacity_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: gap_analysis, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: option_scenarios, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: manager_decision, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: accuracy_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Idle capacity"
    - "Unmet demand"
    - "Overtime hours"
privacy:
  pii_in_logs: false
  retention_days: 400
