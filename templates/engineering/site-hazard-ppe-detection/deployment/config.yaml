serving:
  deadline_ms: 2500
  stages:
    - { name: camera_stream, timeout_ms: 186, on_timeout: fallback_level_1 }
    - { name: people_blurring, timeout_ms: 742, on_timeout: fallback_level_1 }
    - { name: hazard_classifier, timeout_ms: 742, on_timeout: fallback_level_1 }
    - { name: zone_logic, timeout_ms: 185, on_timeout: fallback_level_1 }
    - { name: safety_manager_alert, timeout_ms: 185, on_timeout: fallback_level_1 }
    - { name: corrective_action, timeout_ms: 185, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Hazards open beyond a day"
    - "Near misses"
    - "Time to correct hazards"
privacy:
  pii_in_logs: false
  retention_days: 400
