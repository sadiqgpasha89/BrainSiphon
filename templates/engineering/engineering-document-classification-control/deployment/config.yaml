serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: document_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: text_and_layout_extraction, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: type_and_discipline_classifier, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: naming_and_revision_check, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: routing_proposal, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: controller_approval, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Document handling time"
    - "Misfiled documents"
    - "Rework from wrong revisions"
privacy:
  pii_in_logs: false
  retention_days: 400
