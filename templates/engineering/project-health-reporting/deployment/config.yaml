serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: data_pull, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: variance_and_change_calculation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: draft_narrative, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: audience_filter, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: distribution, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to produce reports"
    - "Reporting errors"
    - "Manager time"
privacy:
  pii_in_logs: false
  retention_days: 400
