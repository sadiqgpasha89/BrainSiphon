serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: schedule_and_progress_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: duration_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: monte_carlo_simulation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: driver_attribution, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: dashboard, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: accuracy_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Late completion"
    - "Time to detect delay"
    - "Recovery plan effectiveness"
privacy:
  pii_in_logs: false
  retention_days: 400
