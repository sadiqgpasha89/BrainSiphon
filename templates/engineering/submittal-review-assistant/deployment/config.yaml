serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: submittal_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: requirement_lookup, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: value_extraction, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: comparison, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: engineer_decision, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: log_update, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Review turnaround"
    - "Submittals returned for errors"
    - "Late material approvals"
privacy:
  pii_in_logs: false
  retention_days: 400
