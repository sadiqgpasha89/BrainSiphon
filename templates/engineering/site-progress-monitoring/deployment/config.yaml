serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: image_and_scan_capture, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: people_blurring, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: registration_to_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: element_state_classifier, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: progress_mapping, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Progress reporting time"
    - "Disputes over progress"
    - "Schedule surprises"
privacy:
  pii_in_logs: false
  retention_days: 400
