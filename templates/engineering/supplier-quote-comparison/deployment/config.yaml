serving:
  deadline_ms: 2500
  stages:
    - { name: quote_intake, timeout_ms: 247, on_timeout: fallback_level_1 }
    - { name: line_and_term_extraction, timeout_ms: 371, on_timeout: fallback_level_1 }
    - { name: unit_normalisation, timeout_ms: 247, on_timeout: fallback_level_1 }
    - { name: scope_gap_check, timeout_ms: 371, on_timeout: fallback_level_1 }
    - { name: comparison_view, timeout_ms: 371, on_timeout: fallback_level_1 }
    - { name: buyer_decision, timeout_ms: 247, on_timeout: fallback_level_1 }
    - { name: award_record, timeout_ms: 371, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to compare quotes"
    - "Scope gaps found after award"
    - "Procurement cost"
privacy:
  pii_in_logs: false
  retention_days: 400
