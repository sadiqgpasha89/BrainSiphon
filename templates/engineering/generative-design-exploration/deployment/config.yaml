serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: brief_and_constraint_capture, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: option_generation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: solver_evaluation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: constraint_filter, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: ranked_options, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: engineer_verification, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: design_record, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Design iteration time"
    - "Material use"
    - "Late design changes"
privacy:
  pii_in_logs: false
  retention_days: 400
