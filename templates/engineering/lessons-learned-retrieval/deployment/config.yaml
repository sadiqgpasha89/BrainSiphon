serving:
  deadline_ms: 2500
  stages:
    - { name: closeout_intake, timeout_ms: 222, on_timeout: fallback_level_1 }
    - { name: structuring_and_redaction, timeout_ms: 890, on_timeout: fallback_level_1 }
    - { name: owner_confirmation, timeout_ms: 334, on_timeout: fallback_level_1 }
    - { name: index_with_tags, timeout_ms: 334, on_timeout: fallback_level_1 }
    - { name: context_push, timeout_ms: 445, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Repeated mistakes"
    - "Lessons used at decisions"
    - "Time to find lessons"
privacy:
  pii_in_logs: false
  retention_days: 400
