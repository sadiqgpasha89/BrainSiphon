serving:
  deadline_ms: 2500
  stages:
    - { name: simulation_database, timeout_ms: 509, on_timeout: fallback_level_1 }
    - { name: quality_filter, timeout_ms: 127, on_timeout: fallback_level_1 }
    - { name: surrogate_training, timeout_ms: 508, on_timeout: fallback_level_1 }
    - { name: uncertainty_calibration, timeout_ms: 191, on_timeout: fallback_level_1 }
    - { name: range_check_and_fallback, timeout_ms: 191, on_timeout: fallback_level_1 }
    - { name: engineer_query, timeout_ms: 191, on_timeout: fallback_level_1 }
    - { name: revalidation, timeout_ms: 508, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time per design study"
    - "Solver hours"
    - "Surrogate errors found late"
privacy:
  pii_in_logs: false
  retention_days: 400
