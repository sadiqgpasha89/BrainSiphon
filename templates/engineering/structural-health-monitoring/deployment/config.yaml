serving:
  deadline_ms: 2500
  stages:
    - { name: sensor_stream, timeout_ms: 212, on_timeout: fallback_level_1 }
    - { name: quality_and_drift_checks, timeout_ms: 212, on_timeout: fallback_level_1 }
    - { name: environmental_compensation, timeout_ms: 318, on_timeout: fallback_level_1 }
    - { name: anomaly_detection, timeout_ms: 847, on_timeout: fallback_level_1 }
    - { name: engineer_alert, timeout_ms: 318, on_timeout: fallback_level_1 }
    - { name: inspection_trigger, timeout_ms: 318, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Damage found early"
    - "Inspection cost"
    - "False alarm callouts"
privacy:
  pii_in_logs: false
  retention_days: 400
