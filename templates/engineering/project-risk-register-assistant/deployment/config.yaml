serving:
  deadline_ms: 2500
  stages:
    - { name: project_data_intake, timeout_ms: 194, on_timeout: fallback_level_1 }
    - { name: similar_project_search, timeout_ms: 774, on_timeout: fallback_level_1 }
    - { name: risk_suggestion, timeout_ms: 774, on_timeout: fallback_level_1 }
    - { name: quality_and_duplicate_check, timeout_ms: 193, on_timeout: fallback_level_1 }
    - { name: action_tracking, timeout_ms: 290, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Risks realised that were not in the register"
    - "Register quality"
    - "Workshop time"
privacy:
  pii_in_logs: false
  retention_days: 400
