serving:
  deadline_ms: 2500
  stages:
    - { name: package_intake, timeout_ms: 159, on_timeout: fallback_level_1 }
    - { name: sheet_and_table_extraction, timeout_ms: 636, on_timeout: fallback_level_1 }
    - { name: consistency_and_gap_checks, timeout_ms: 159, on_timeout: fallback_level_1 }
    - { name: code_check_with_citations, timeout_ms: 636, on_timeout: fallback_level_1 }
    - { name: findings_list, timeout_ms: 238, on_timeout: fallback_level_1 }
    - { name: engineer_decisions, timeout_ms: 159, on_timeout: fallback_level_1 }
    - { name: release_gate, timeout_ms: 238, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Errors found before issue"
    - "Review time"
    - "Post-issue revisions"
privacy:
  pii_in_logs: false
  retention_days: 400
