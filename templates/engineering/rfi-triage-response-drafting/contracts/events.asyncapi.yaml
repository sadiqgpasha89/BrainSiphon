asyncapi: 3.0.0
info:
  title: RFI Triage and Response Drafting events (illustrative)
  version: 0.1.0
  description: Generated from the blueprint's event schema. Partition by the entity key so one entity's events stay
    ordered.
channels:
  events:
    address: rfi.triage.response.drafting.events
    messages:
      event:
        $ref: '#/components/messages/Event'
operations:
  publishEvents:
    action: send
    channel:
      $ref: '#/channels/events'
components:
  messages:
    Event:
      name: Event
      contentType: application/json
      payload:
        $ref: '#/components/schemas/EventPayload'
  schemas:
    EventPayload:
      type: object
      properties:
        type:
          type: string
          enum:
          - DocumentIngested
          - AnswerGenerated
          - AnswerFeedback
        doc_id:
          type: string
        version:
          type: integer
        chunk_count:
          type: integer
        embedding_model:
          type: string
        answer_id:
          type: string
        cited_chunk_ids:
          type: string
          description: '[''string'']'
        grounded:
          type: boolean
        prompt_version:
          type: string
