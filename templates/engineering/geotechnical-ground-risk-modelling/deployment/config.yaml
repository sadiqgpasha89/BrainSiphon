serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: data_collection, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: quality_rating, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: spatial_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: uncertainty_map, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: investigation_plan, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: update_with_new_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Unexpected ground conditions"
    - "Investigation cost"
    - "Cost growth from ground issues"
privacy:
  pii_in_logs: false
  retention_days: 400
