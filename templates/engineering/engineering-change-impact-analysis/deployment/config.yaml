serving:
  deadline_ms: 2500
  stages:
    - { name: change_request, timeout_ms: 352, on_timeout: fallback_level_1 }
    - { name: dependency_traversal, timeout_ms: 351, on_timeout: fallback_level_1 }
    - { name: text_link_suggestion, timeout_ms: 351, on_timeout: fallback_level_1 }
    - { name: cost_and_schedule_estimate, timeout_ms: 937, on_timeout: fallback_level_1 }
    - { name: board_decision, timeout_ms: 234, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Late discovered impacts"
    - "Change cycle time"
    - "Rework from changes"
privacy:
  pii_in_logs: false
  retention_days: 400
