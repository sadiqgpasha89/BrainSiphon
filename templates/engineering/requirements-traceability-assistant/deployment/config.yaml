serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: requirement_and_design_extraction, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: candidate_link_search, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: link_ranking, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: engineer_confirmation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: change_impact_view, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Untraced requirements"
    - "Time to impact analysis"
    - "Audit findings"
privacy:
  pii_in_logs: false
  retention_days: 400
