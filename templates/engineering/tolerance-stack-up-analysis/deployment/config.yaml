serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: chain_extraction, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: process_data_join, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: monte_carlo_and_worst_case, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: sensitivity_ranking, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: cost_trade_off, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: result_record, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Assemblies out of fit"
    - "Tolerance cost"
    - "Rework"
privacy:
  pii_in_logs: false
  retention_days: 400
