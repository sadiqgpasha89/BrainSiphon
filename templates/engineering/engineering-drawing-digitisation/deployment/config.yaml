serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: scan_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: cleaning_and_deskew, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: symbol_and_line_detection, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: tag_ocr, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: consistency_checks, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: export, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to digitise"
    - "Review corrections"
    - "Errors found in later use"
privacy:
  pii_in_logs: false
  retention_days: 400
