serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: criteria_scoring, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: capacity_check, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: portfolio_optimiser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: scenario_view, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: board_decision, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Portfolio value delivered"
    - "Projects stopped late"
    - "Capacity overload"
privacy:
  pii_in_logs: false
  retention_days: 400
