serving:
  deadline_ms: 2500
  stages:
    - { name: calculation_brief, timeout_ms: 304, on_timeout: fallback_level_1 }
    - { name: draft_structure, timeout_ms: 809, on_timeout: fallback_level_1 }
    - { name: formula_and_unit_execution, timeout_ms: 304, on_timeout: fallback_level_1 }
    - { name: independent_verifier, timeout_ms: 202, on_timeout: fallback_level_1 }
    - { name: clause_citation_check, timeout_ms: 303, on_timeout: fallback_level_1 }
    - { name: record, timeout_ms: 303, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Calculation errors found in review"
    - "Time to draft calculations"
    - "Late design changes"
privacy:
  pii_in_logs: false
  retention_days: 400
