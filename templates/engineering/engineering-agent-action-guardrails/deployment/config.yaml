serving:
  deadline_ms: 2500
  stages:
    - { name: product_data_gateway, timeout_ms: 135, on_timeout: fallback_level_1 }
    - { name: release_state_decision, timeout_ms: 270, on_timeout: fallback_level_1 }
    - { name: design_owner_approval, timeout_ms: 202, on_timeout: fallback_level_1 }
    - { name: revision_trail, timeout_ms: 540, on_timeout: fallback_level_1 }
    - { name: edit_drift_monitor, timeout_ms: 539, on_timeout: fallback_level_1 }
    - { name: revision_replay_console, timeout_ms: 539, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Unsafe edits stopped before release"
    - "Engineering changes traced to agent edits"
    - "Minutes to answer a design history request"
privacy:
  pii_in_logs: false
  retention_days: 400
