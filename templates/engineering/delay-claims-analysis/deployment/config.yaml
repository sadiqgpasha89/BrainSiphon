serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: version_alignment, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: delay_method_run, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: event_and_record_linking, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: evidence_pack, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to prepare claims"
    - "Evidence completeness"
    - "Claim outcomes"
privacy:
  pii_in_logs: false
  retention_days: 400
