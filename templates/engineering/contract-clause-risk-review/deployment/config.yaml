serving:
  deadline_ms: 2500
  stages:
    - { name: contract_intake, timeout_ms: 185, on_timeout: fallback_level_1 }
    - { name: clause_extraction, timeout_ms: 278, on_timeout: fallback_level_1 }
    - { name: playbook_comparison, timeout_ms: 742, on_timeout: fallback_level_1 }
    - { name: risk_ranking, timeout_ms: 742, on_timeout: fallback_level_1 }
    - { name: position_record, timeout_ms: 278, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Contract review time"
    - "Missed risky clauses"
    - "Negotiation cycles"
privacy:
  pii_in_logs: false
  retention_days: 400
