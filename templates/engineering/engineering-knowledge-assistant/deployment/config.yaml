serving:
  deadline_ms: 2500
  stages:
    - { name: question_intake, timeout_ms: 186, on_timeout: fallback_level_1 }
    - { name: permission_check, timeout_ms: 278, on_timeout: fallback_level_1 }
    - { name: hybrid_retrieval, timeout_ms: 556, on_timeout: fallback_level_1 }
    - { name: status_filter, timeout_ms: 185, on_timeout: fallback_level_1 }
    - { name: answer_with_citations, timeout_ms: 742, on_timeout: fallback_level_1 }
    - { name: engineer_verification, timeout_ms: 278, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to find information"
    - "Repeated design errors"
    - "Questions to senior engineers"
privacy:
  pii_in_logs: false
  retention_days: 400
