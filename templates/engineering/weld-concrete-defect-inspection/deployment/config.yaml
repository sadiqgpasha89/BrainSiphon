serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: image_acquisition, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: project_quality_check, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: project_defect_detection, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: severity_ranking, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: decision_record, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: project_retraining, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Defects found before service"
    - "Inspection time"
    - "Weld repairs"
privacy:
  pii_in_logs: false
  retention_days: 400
