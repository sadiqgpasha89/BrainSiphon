serving:
  deadline_ms: 2500
  stages:
    - { name: change_request, timeout_ms: 209, on_timeout: fallback_level_1 }
    - { name: scope_extraction, timeout_ms: 209, on_timeout: fallback_level_1 }
    - { name: activity_and_quantity_link, timeout_ms: 556, on_timeout: fallback_level_1 }
    - { name: cost_and_time_estimate, timeout_ms: 556, on_timeout: fallback_level_1 }
    - { name: entitlement_summary, timeout_ms: 556, on_timeout: fallback_level_1 }
    - { name: decision_record, timeout_ms: 139, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to price changes"
    - "Disputes"
    - "Unapproved work"
privacy:
  pii_in_logs: false
  retention_days: 400
