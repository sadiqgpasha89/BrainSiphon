serving:
  deadline_ms: 80
  stages:
    - { name: camera_and_sensor_capture, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: object_detection, timeout_ms: 28, on_timeout: fallback_level_1 }
    - { name: crossing_logic, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: sensor_corroboration, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: alert_with_clip, timeout_ms: 11, on_timeout: fallback_level_1 }
    - { name: officer_verification, timeout_ms: 10, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Verified intrusions"
    - "Guard time on false alarms"
    - "Response time"
privacy:
  pii_in_logs: false
  retention_days: 400
