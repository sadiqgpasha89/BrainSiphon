serving:
  deadline_ms: 2500
  stages:
    - { name: redaction_and_extraction, timeout_ms: 334, on_timeout: fallback_level_1 }
    - { name: type_classification, timeout_ms: 890, on_timeout: fallback_level_1 }
    - { name: indicator_graph, timeout_ms: 445, on_timeout: fallback_level_1 }
    - { name: urgent_recovery_route, timeout_ms: 222, on_timeout: fallback_level_1 }
    - { name: investigator_view, timeout_ms: 334, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Funds recovered"
    - "Time to victim support"
    - "Campaigns identified"
privacy:
  pii_in_logs: false
  retention_days: 400
