serving:
  deadline_ms: 80
  stages:
    - { name: incident_and_unit_state, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: arrival_time_model, timeout_ms: 17, on_timeout: fallback_level_1 }
    - { name: coverage_impact, timeout_ms: 17, on_timeout: fallback_level_1 }
    - { name: rules_filter, timeout_ms: 4, on_timeout: fallback_level_1 }
    - { name: ranked_suggestions, timeout_ms: 17, on_timeout: fallback_level_1 }
    - { name: dispatcher_choice_logged, timeout_ms: 6, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to assignment"
    - "Dispatcher overrides"
    - "Coverage gaps created"
privacy:
  pii_in_logs: false
  retention_days: 400
