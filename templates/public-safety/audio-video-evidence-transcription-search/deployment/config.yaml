serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: recording_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: hashing, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: speech_recognition, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: speaker_turn_marking, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: search_index, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Review time per hour of audio"
    - "Missed relevant moments"
    - "Transcript corrections"
privacy:
  pii_in_logs: false
  retention_days: 400
