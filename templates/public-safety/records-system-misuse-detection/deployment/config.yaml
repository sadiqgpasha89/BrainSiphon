serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: access_log_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: purpose_and_case_link_check, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: peer_comparison, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: lead_ranking, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outcome_capture, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Misuse found"
    - "Time to detect"
    - "Leads closed as normal"
privacy:
  pii_in_logs: false
  retention_days: 400
