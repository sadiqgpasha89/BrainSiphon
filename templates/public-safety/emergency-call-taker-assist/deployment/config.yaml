serving:
  deadline_ms: 80
  stages:
    - { name: call_audio_stream, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: speech_recognition, timeout_ms: 22, on_timeout: fallback_level_1 }
    - { name: entity_and_cue_extraction, timeout_ms: 22, on_timeout: fallback_level_1 }
    - { name: protocol_gap_check, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: suggested_prompts, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: call_taker_confirmation, timeout_ms: 8, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to capture the address"
    - "Calls with missing key fields"
    - "Call taker workload"
privacy:
  pii_in_logs: false
  retention_days: 400
