serving:
  deadline_ms: 2500
  stages:
    - { name: sensor_and_weather_ingestion, timeout_ms: 159, on_timeout: fallback_level_1 }
    - { name: surface_model, timeout_ms: 636, on_timeout: fallback_level_1 }
    - { name: hazard_classification, timeout_ms: 636, on_timeout: fallback_level_1 }
    - { name: alert_and_treatment_suggestion, timeout_ms: 159, on_timeout: fallback_level_1 }
    - { name: operator_approval, timeout_ms: 238, on_timeout: fallback_level_1 }
    - { name: sign_and_crew_messages, timeout_ms: 238, on_timeout: fallback_level_1 }
    - { name: verification, timeout_ms: 159, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Ice-related crashes"
    - "Salt use"
    - "Time to treat"
privacy:
  pii_in_logs: false
  retention_days: 400
