serving:
  deadline_ms: 2500
  stages:
    - { name: call_intake, timeout_ms: 171, on_timeout: fallback_level_1 }
    - { name: speech_recognition, timeout_ms: 685, on_timeout: fallback_level_1 }
    - { name: emergency_cue_gate, timeout_ms: 684, on_timeout: fallback_level_1 }
    - { name: diversion_offer, timeout_ms: 257, on_timeout: fallback_level_1 }
    - { name: consent_check, timeout_ms: 171, on_timeout: fallback_level_1 }
    - { name: alternative_service_handoff, timeout_ms: 257, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Non-emergency calls to call takers"
    - "Missed emergencies"
    - "Caller satisfaction"
privacy:
  pii_in_logs: false
  retention_days: 400
