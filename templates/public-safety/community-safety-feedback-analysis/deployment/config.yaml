serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: comment_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: redaction, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: theme_clustering, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: stance_classification, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: summary_draft, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: publication, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Analysis time"
    - "Community trust in summaries"
    - "Minority themes surfaced"
privacy:
  pii_in_logs: false
  retention_days: 400
