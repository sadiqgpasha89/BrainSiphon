serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: calls_and_handling_times, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: workload_forecast, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: allocation_optimiser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: equity_checks, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: roster_update, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Response times"
    - "Beats below target"
    - "Community complaints about presence"
privacy:
  pii_in_logs: false
  retention_days: 400
