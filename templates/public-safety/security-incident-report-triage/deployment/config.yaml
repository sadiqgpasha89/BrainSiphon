serving:
  deadline_ms: 2500
  stages:
    - { name: redaction, timeout_ms: 742, on_timeout: fallback_level_1 }
    - { name: rule_layer_for_serious_terms, timeout_ms: 185, on_timeout: fallback_level_1 }
    - { name: classifier, timeout_ms: 742, on_timeout: fallback_level_1 }
    - { name: routing, timeout_ms: 278, on_timeout: fallback_level_1 }
    - { name: trend_dashboard, timeout_ms: 278, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to notify managers"
    - "Trend detection"
    - "Reports reclassified by managers"
privacy:
  pii_in_logs: false
  retention_days: 400
