serving:
  deadline_ms: 2500
  stages:
    - { name: camera_capture, timeout_ms: 223, on_timeout: fallback_level_1 }
    - { name: density_estimation, timeout_ms: 890, on_timeout: fallback_level_1 }
    - { name: flow_analysis, timeout_ms: 334, on_timeout: fallback_level_1 }
    - { name: threshold_logic, timeout_ms: 222, on_timeout: fallback_level_1 }
    - { name: operations_room_display, timeout_ms: 334, on_timeout: fallback_level_1 }
    - { name: operator_action_log, timeout_ms: 222, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Crowd incidents"
    - "Time to open exits"
    - "Staff deployment accuracy"
privacy:
  pii_in_logs: false
  retention_days: 400
