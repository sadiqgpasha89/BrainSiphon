serving:
  deadline_ms: 2500
  stages:
    - { name: page_analysis, timeout_ms: 593, on_timeout: fallback_level_1 }
    - { name: maliciousness_model, timeout_ms: 593, on_timeout: fallback_level_1 }
    - { name: harm_ranking, timeout_ms: 593, on_timeout: fallback_level_1 }
    - { name: takedown_request, timeout_ms: 223, on_timeout: fallback_level_1 }
    - { name: outcome_tracking, timeout_ms: 223, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to takedown"
    - "Victims reached before takedown"
    - "Wrongful takedowns"
privacy:
  pii_in_logs: false
  retention_days: 400
