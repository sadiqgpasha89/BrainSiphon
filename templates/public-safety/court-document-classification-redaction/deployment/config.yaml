serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: filing_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: classification, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: personal_data_detection, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: rule_matching, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: release_gate, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Clerk time per filing"
    - "Redaction errors after release"
    - "Filing turnaround"
privacy:
  pii_in_logs: false
  retention_days: 400
