serving:
  deadline_ms: 2500
  stages:
    - { name: tip_intake, timeout_ms: 185, on_timeout: fallback_level_1 }
    - { name: identity_removal, timeout_ms: 278, on_timeout: fallback_level_1 }
    - { name: urgency_gate, timeout_ms: 742, on_timeout: fallback_level_1 }
    - { name: topic_routing, timeout_ms: 742, on_timeout: fallback_level_1 }
    - { name: duplicate_linking, timeout_ms: 278, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to urgent tip action"
    - "Unrouted tips"
    - "Tipster trust measures"
privacy:
  pii_in_logs: false
  retention_days: 400
