serving:
  deadline_ms: 2500
  stages:
    - { name: entity_and_time_extraction, timeout_ms: 417, on_timeout: fallback_level_1 }
    - { name: conflict_check, timeout_ms: 278, on_timeout: fallback_level_1 }
    - { name: draft_sitrep, timeout_ms: 1113, on_timeout: fallback_level_1 }
    - { name: distribution, timeout_ms: 417, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to produce a sitrep"
    - "Commander corrections"
    - "Briefing accuracy"
privacy:
  pii_in_logs: false
  retention_days: 400
