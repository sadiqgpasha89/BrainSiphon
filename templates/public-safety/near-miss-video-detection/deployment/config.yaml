serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: video_capture, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: edge_anonymisation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: trajectory_store, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: conflict_computation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: treatment_evaluation, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Severe conflicts per day"
    - "Treatment effect"
    - "Crashes at monitored sites"
privacy:
  pii_in_logs: false
  retention_days: 400
