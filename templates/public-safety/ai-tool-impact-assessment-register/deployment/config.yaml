serving:
  deadline_ms: 2500
  stages:
    - { name: assessment_intake, timeout_ms: 212, on_timeout: fallback_level_1 }
    - { name: completeness_and_consistency_checks, timeout_ms: 847, on_timeout: fallback_level_1 }
    - { name: risk_tier, timeout_ms: 212, on_timeout: fallback_level_1 }
    - { name: approval_workflow, timeout_ms: 318, on_timeout: fallback_level_1 }
    - { name: register_publication, timeout_ms: 318, on_timeout: fallback_level_1 }
    - { name: change_trigger, timeout_ms: 318, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Tools with approved assessments"
    - "Time to approval"
    - "Incidents from unassessed tools"
privacy:
  pii_in_logs: false
  retention_days: 400
