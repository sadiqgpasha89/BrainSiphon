serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: image_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: quality_scoring, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: reason_coding, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: discard_schedule, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: camera_maintenance_ticket, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Reviewer time per valid case"
    - "Unusable images reviewed"
    - "Camera downtime"
privacy:
  pii_in_logs: false
  retention_days: 400
