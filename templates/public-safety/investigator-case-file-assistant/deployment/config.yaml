serving:
  deadline_ms: 2500
  stages:
    - { name: document_ingestion, timeout_ms: 144, on_timeout: fallback_level_1 }
    - { name: ocr_and_parsing, timeout_ms: 574, on_timeout: fallback_level_1 }
    - { name: entity_and_timeline_extraction, timeout_ms: 216, on_timeout: fallback_level_1 }
    - { name: index, timeout_ms: 215, on_timeout: fallback_level_1 }
    - { name: answer_with_links, timeout_ms: 574, on_timeout: fallback_level_1 }
    - { name: access_logging, timeout_ms: 287, on_timeout: fallback_level_1 }
    - { name: disclosure_export, timeout_ms: 215, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to review a case file"
    - "Missed documents"
    - "Disclosure errors"
privacy:
  pii_in_logs: false
  retention_days: 400
