serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: building_and_inspection_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: incident_feature_build, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: fire_risk_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: incident_consequence_weighting, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: inspection_route_plan, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: incident_inspector_visit, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Serious violations found"
    - "Fires in inspected buildings"
    - "Time since last inspection of high-risk sites"
privacy:
  pii_in_logs: false
  retention_days: 400
