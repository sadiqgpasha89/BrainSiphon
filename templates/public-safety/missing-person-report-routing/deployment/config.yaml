serving:
  deadline_ms: 2500
  stages:
    - { name: completeness_check, timeout_ms: 404, on_timeout: fallback_level_1 }
    - { name: duplicate_matching, timeout_ms: 607, on_timeout: fallback_level_1 }
    - { name: jurisdiction_routing, timeout_ms: 607, on_timeout: fallback_level_1 }
    - { name: follow_up_prompts, timeout_ms: 607, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to first action"
    - "Duplicate reports found"
    - "Missing details after intake"
privacy:
  pii_in_logs: false
  retention_days: 400
