serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: scan_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: hashing, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: ocr, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: near_duplicate_grouping, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: chain_of_custody_log, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: quality_sampling, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Review hours per case"
    - "Duplicates reviewed twice"
    - "Integrity incidents"
privacy:
  pii_in_logs: false
  retention_days: 400
