serving:
  deadline_ms: 2500
  stages:
    - { name: device_fix_intake, timeout_ms: 202, on_timeout: fallback_level_1 }
    - { name: address_geocoding, timeout_ms: 304, on_timeout: fallback_level_1 }
    - { name: landmark_resolution, timeout_ms: 304, on_timeout: fallback_level_1 }
    - { name: candidate_ranking, timeout_ms: 607, on_timeout: fallback_level_1 }
    - { name: conflict_flagging, timeout_ms: 202, on_timeout: fallback_level_1 }
    - { name: call_taker_confirmation, timeout_ms: 303, on_timeout: fallback_level_1 }
    - { name: outcome_tracking, timeout_ms: 303, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to confirm a location"
    - "Responder wrong-address events"
    - "Calls needing a second location check"
privacy:
  pii_in_logs: false
  retention_days: 400
