serving:
  deadline_ms: 2500
  stages:
    - { name: unit_and_call_data, timeout_ms: 223, on_timeout: fallback_level_1 }
    - { name: demand_forecast, timeout_ms: 593, on_timeout: fallback_level_1 }
    - { name: coverage_model, timeout_ms: 593, on_timeout: fallback_level_1 }
    - { name: move_optimiser, timeout_ms: 593, on_timeout: fallback_level_1 }
    - { name: crew_message, timeout_ms: 223, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Response time"
    - "Zones below target"
    - "Unit travel distance"
privacy:
  pii_in_logs: false
  retention_days: 400
