serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: normalisation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: matching, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: candidate_list, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: owner_verification, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: return_and_logging, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outcome_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Items returned"
    - "Days to return"
    - "Wrong releases"
privacy:
  pii_in_logs: false
  retention_days: 400
