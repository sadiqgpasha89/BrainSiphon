serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: hearing_and_language_needs, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: interpreter_register, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: constraint_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: assignment_optimiser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: coordinator_approval, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: notifications, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: shortage_forecast, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Hearings delayed for interpreters"
    - "Interpreter utilisation"
    - "Cost per hearing"
privacy:
  pii_in_logs: false
  retention_days: 400
