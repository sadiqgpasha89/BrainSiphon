serving:
  deadline_ms: 2500
  stages:
    - { name: user_answers, timeout_ms: 392, on_timeout: fallback_level_1 }
    - { name: rules_engine, timeout_ms: 262, on_timeout: fallback_level_1 }
    - { name: missing_information_check, timeout_ms: 262, on_timeout: fallback_level_1 }
    - { name: explanation, timeout_ms: 1047, on_timeout: fallback_level_1 }
    - { name: rule_update_process, timeout_ms: 262, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Eligible people reached"
    - "Incomplete applications"
    - "Officer time per case"
privacy:
  pii_in_logs: false
  retention_days: 400
