serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: redaction, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: factor_classifier, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: confidence_filter, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: re_labelling, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to study a pattern"
    - "Causes found outside codes"
    - "Treatment targeting"
privacy:
  pii_in_logs: false
  retention_days: 400
