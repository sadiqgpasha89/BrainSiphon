serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: crash_count_and_road_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: risk_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: treatment_effect_library, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: benefit_cost_ranking, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: equity_view, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outcome_study, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Serious injuries per budget"
    - "Equity of treated areas"
    - "Sites treated per year"
privacy:
  pii_in_logs: false
  retention_days: 400
