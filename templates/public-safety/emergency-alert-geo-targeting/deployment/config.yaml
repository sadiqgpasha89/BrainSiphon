serving:
  deadline_ms: 2500
  stages:
    - { name: hazard_forecast_intake, timeout_ms: 660, on_timeout: fallback_level_1 }
    - { name: polygon_proposal, timeout_ms: 659, on_timeout: fallback_level_1 }
    - { name: coverage_estimate, timeout_ms: 247, on_timeout: fallback_level_1 }
    - { name: officer_approval, timeout_ms: 247, on_timeout: fallback_level_1 }
    - { name: template_and_translation, timeout_ms: 247, on_timeout: fallback_level_1 }
    - { name: channel_dispatch, timeout_ms: 165, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Alert area precision"
    - "Time to send"
    - "Complaints about missed alerts"
privacy:
  pii_in_logs: false
  retention_days: 400
