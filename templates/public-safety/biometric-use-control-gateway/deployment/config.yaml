serving:
  deadline_ms: 80
  stages:
    - { name: request_interception, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: request_classification, timeout_ms: 31, on_timeout: fallback_level_1 }
    - { name: policy_decision, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: block_or_route_to_approval, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: immutable_log, timeout_ms: 15, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Blocked attempts"
    - "Exceptions approved"
    - "Time to approve valid requests"
privacy:
  pii_in_logs: false
  retention_days: 400
