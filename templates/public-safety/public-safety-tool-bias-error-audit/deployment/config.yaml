serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: tool_decision_and_outcome_extract, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: sample_draw, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: metric_computation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: disparity_threshold_check, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: board_decision_and_pause, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: public_summary, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Tools audited"
    - "Disparities found and fixed"
    - "Tools paused"
privacy:
  pii_in_logs: false
  retention_days: 400
