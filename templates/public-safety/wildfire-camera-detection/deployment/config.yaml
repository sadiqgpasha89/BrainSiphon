serving:
  deadline_ms: 2500
  stages:
    - { name: camera_loop_capture, timeout_ms: 148, on_timeout: fallback_level_1 }
    - { name: privacy_masking, timeout_ms: 223, on_timeout: fallback_level_1 }
    - { name: smoke_detection, timeout_ms: 593, on_timeout: fallback_level_1 }
    - { name: temporal_confirmation, timeout_ms: 593, on_timeout: fallback_level_1 }
    - { name: dispatcher_verification, timeout_ms: 223, on_timeout: fallback_level_1 }
    - { name: incident_creation, timeout_ms: 223, on_timeout: fallback_level_1 }
    - { name: retraining, timeout_ms: 222, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Fire size at first attack"
    - "Detection time"
    - "Dispatcher false alarm workload"
privacy:
  pii_in_logs: false
  retention_days: 400
