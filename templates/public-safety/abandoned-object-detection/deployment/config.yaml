serving:
  deadline_ms: 2500
  stages:
    - { name: camera_capture, timeout_ms: 194, on_timeout: fallback_level_1 }
    - { name: object_detection, timeout_ms: 774, on_timeout: fallback_level_1 }
    - { name: owner_proximity_logic, timeout_ms: 774, on_timeout: fallback_level_1 }
    - { name: dwell_rule, timeout_ms: 193, on_timeout: fallback_level_1 }
    - { name: staff_check, timeout_ms: 290, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Objects verified"
    - "Staff time on false alarms"
    - "Response time"
privacy:
  pii_in_logs: false
  retention_days: 400
