serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: footage_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: hashing, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: detection_and_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: audio_segmentation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: release_gate, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Review hours per released hour"
    - "Privacy incidents after release"
    - "Release turnaround"
privacy:
  pii_in_logs: false
  retention_days: 400
