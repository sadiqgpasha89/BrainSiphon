serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: imagery_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: co_registration, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: incident_damage_detection, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: priority_weighting, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: field_verification, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: map_publication, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to a damage map"
    - "Rescue tasks prioritised"
    - "Resources sent to the right areas"
privacy:
  pii_in_logs: false
  retention_days: 400
