serving:
  deadline_ms: 80
  stages:
    - { name: audio_stream, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: language_identification, timeout_ms: 18, on_timeout: fallback_level_1 }
    - { name: speech_recognition, timeout_ms: 18, on_timeout: fallback_level_1 }
    - { name: translation_hint, timeout_ms: 18, on_timeout: fallback_level_1 }
    - { name: confidence_labelling, timeout_ms: 4, on_timeout: fallback_level_1 }
    - { name: interpreter_connection, timeout_ms: 7, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to key facts"
    - "Interpreter wait time"
    - "Mistranslation incidents"
privacy:
  pii_in_logs: false
  retention_days: 400
