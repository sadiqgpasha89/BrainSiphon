serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: asset_and_test_data_extraction, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: cohort_and_censoring_setup, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: hazard_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: calibration, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: inspection_list, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: crew_assignment, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outcome_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "In-service failures"
    - "Inspection hit rate"
    - "Renewal cost per avoided failure"
privacy:
  pii_in_logs: false
  retention_days: 400
