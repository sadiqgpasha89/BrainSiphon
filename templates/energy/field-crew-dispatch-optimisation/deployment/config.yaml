serving:
  deadline_ms: 2500
  stages:
    - { name: job_intake, timeout_ms: 194, on_timeout: fallback_level_1 }
    - { name: constraint_model, timeout_ms: 774, on_timeout: fallback_level_1 }
    - { name: route_optimiser, timeout_ms: 774, on_timeout: fallback_level_1 }
    - { name: emergency_insertion, timeout_ms: 193, on_timeout: fallback_level_1 }
    - { name: crew_notification, timeout_ms: 290, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Response time"
    - "Jobs per crew-day"
    - "Overtime hours"
privacy:
  pii_in_logs: false
  retention_days: 400
