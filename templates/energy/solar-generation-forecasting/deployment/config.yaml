serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: weather_and_satellite_ingestion, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: cloud_motion_nowcast, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: day_ahead_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: blend_by_horizon, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: capacity_clipping, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: forecast_publish, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: accuracy_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Imbalance cost"
    - "Curtailment"
    - "Forecast error at ramps"
privacy:
  pii_in_logs: false
  retention_days: 400
