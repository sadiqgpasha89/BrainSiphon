serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: imagery_and_lidar_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: canopy_and_line_segmentation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: clearance_and_growth_estimate, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: risk_ranking, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: trim_work_order, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outcome_and_regrowth_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Vegetation outages"
    - "Trim cost per span"
    - "Spans trimmed that did not need it"
privacy:
  pii_in_logs: false
  retention_days: 400
