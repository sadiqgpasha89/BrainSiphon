serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: imagery_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: damage_detection, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: hazard_flag, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: materials_estimate, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: grid_crew_verification, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: restoration_planning, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Assessment time"
    - "Restoration time"
    - "Crew miles driven"
privacy:
  pii_in_logs: false
  retention_days: 400
