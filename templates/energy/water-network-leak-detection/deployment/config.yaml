serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: flow_and_pressure_capture, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: night_flow_baseline, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: leak_anomaly_detector, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: location_ranking, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: alert_and_work_order, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: crew_verification, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: savings_check, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Water lost"
    - "Time to repair"
    - "Burst frequency"
privacy:
  pii_in_logs: false
  retention_days: 400
