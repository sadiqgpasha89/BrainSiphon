serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: generation_and_demand_feeds, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: mix_forecast, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: intensity_calculation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: interval_estimate, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: publish, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: consumer_use, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: accuracy_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Emissions avoided by shifting"
    - "Reporting corrections"
    - "Forecast error at peaks"
privacy:
  pii_in_logs: false
  retention_days: 400
