serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: telemetry_capture, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: cycle_segmentation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: capacity_and_resistance_estimate, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: calibration_on_tests, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: alerts_and_forecast, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: warranty_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: retraining, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Replacement timing error"
    - "Warranty claims"
    - "Unexpected capacity loss"
privacy:
  pii_in_logs: false
  retention_days: 400
