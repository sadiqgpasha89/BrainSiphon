serving:
  deadline_ms: 2500
  stages:
    - { name: application_intake, timeout_ms: 194, on_timeout: fallback_level_1 }
    - { name: document_extraction, timeout_ms: 774, on_timeout: fallback_level_1 }
    - { name: completeness_check, timeout_ms: 193, on_timeout: fallback_level_1 }
    - { name: study_path_classifier, timeout_ms: 774, on_timeout: fallback_level_1 }
    - { name: applicant_message, timeout_ms: 290, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to a complete application"
    - "Applications returned late"
    - "Engineer review time"
privacy:
  pii_in_logs: false
  retention_days: 400
