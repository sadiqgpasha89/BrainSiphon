serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: energy_balance_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: technical_loss_estimate, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: anomaly_scoring, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: inspection_planning, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: field_verification, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: result_capture, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Energy recovered"
    - "Wrongful findings"
    - "Inspection cost per recovery"
privacy:
  pii_in_logs: false
  retention_days: 400
