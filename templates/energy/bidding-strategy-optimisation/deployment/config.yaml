serving:
  deadline_ms: 2500
  stages:
    - { name: scenario_generation, timeout_ms: 574, on_timeout: fallback_level_1 }
    - { name: constraint_model, timeout_ms: 574, on_timeout: fallback_level_1 }
    - { name: bid_optimiser, timeout_ms: 574, on_timeout: fallback_level_1 }
    - { name: compliance_and_risk_filter, timeout_ms: 144, on_timeout: fallback_level_1 }
    - { name: bid_submission, timeout_ms: 144, on_timeout: fallback_level_1 }
    - { name: post_trade_analysis, timeout_ms: 215, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Margin against the rule-based baseline"
    - "Exposure limit breaches"
    - "Bids rejected by the market"
privacy:
  pii_in_logs: false
  retention_days: 400
