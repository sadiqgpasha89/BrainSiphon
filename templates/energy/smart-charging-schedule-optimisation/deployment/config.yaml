serving:
  deadline_ms: 2500
  stages:
    - { name: session_intake, timeout_ms: 139, on_timeout: fallback_level_1 }
    - { name: constraint_model, timeout_ms: 556, on_timeout: fallback_level_1 }
    - { name: price_and_limit_forecast, timeout_ms: 556, on_timeout: fallback_level_1 }
    - { name: schedule_optimiser, timeout_ms: 556, on_timeout: fallback_level_1 }
    - { name: command_output, timeout_ms: 209, on_timeout: fallback_level_1 }
    - { name: driver_notification, timeout_ms: 209, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Charging cost"
    - "Peak site demand"
    - "Driver complaints about readiness"
privacy:
  pii_in_logs: false
  retention_days: 400
