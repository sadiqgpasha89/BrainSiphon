serving:
  deadline_ms: 2500
  stages:
    - { name: source_collection, timeout_ms: 371, on_timeout: fallback_level_1 }
    - { name: relevance_filter, timeout_ms: 247, on_timeout: fallback_level_1 }
    - { name: calculation_tools, timeout_ms: 247, on_timeout: fallback_level_1 }
    - { name: briefing_draft, timeout_ms: 989, on_timeout: fallback_level_1 }
    - { name: distribution, timeout_ms: 371, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Analyst preparation time"
    - "Missed notices"
    - "Briefings edited by reviewers"
privacy:
  pii_in_logs: false
  retention_days: 400
