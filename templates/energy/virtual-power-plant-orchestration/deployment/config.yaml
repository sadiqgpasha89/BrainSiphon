serving:
  deadline_ms: 2500
  stages:
    - { name: asset_state_and_consent, timeout_ms: 278, on_timeout: fallback_level_1 }
    - { name: availability_forecast, timeout_ms: 556, on_timeout: fallback_level_1 }
    - { name: fleet_bid, timeout_ms: 556, on_timeout: fallback_level_1 }
    - { name: dispatch_signals, timeout_ms: 209, on_timeout: fallback_level_1 }
    - { name: local_control, timeout_ms: 209, on_timeout: fallback_level_1 }
    - { name: delivery_verification, timeout_ms: 209, on_timeout: fallback_level_1 }
    - { name: settlement_and_learning, timeout_ms: 208, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Delivered flexibility"
    - "Penalties"
    - "Owner opt-outs"
privacy:
  pii_in_logs: false
  retention_days: 400
