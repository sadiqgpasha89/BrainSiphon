serving:
  deadline_ms: 2500
  stages:
    - { name: state_estimate_intake, timeout_ms: 270, on_timeout: fallback_level_1 }
    - { name: contingency_list_build, timeout_ms: 135, on_timeout: fallback_level_1 }
    - { name: surrogate_scoring, timeout_ms: 540, on_timeout: fallback_level_1 }
    - { name: risk_ranking, timeout_ms: 539, on_timeout: fallback_level_1 }
    - { name: full_solver_verification, timeout_ms: 539, on_timeout: fallback_level_1 }
    - { name: operator_display, timeout_ms: 202, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Screening time"
    - "Dangerous cases found early"
    - "Solver compute cost"
privacy:
  pii_in_logs: false
  retention_days: 400
