serving:
  deadline_ms: 2500
  stages:
    - { name: live_system_data_intake, timeout_ms: 148, on_timeout: fallback_level_1 }
    - { name: feature_build_with_availability_checks, timeout_ms: 297, on_timeout: fallback_level_1 }
    - { name: direction_classifier, timeout_ms: 593, on_timeout: fallback_level_1 }
    - { name: price_quantile_model, timeout_ms: 593, on_timeout: fallback_level_1 }
    - { name: cost_aware_alert, timeout_ms: 148, on_timeout: fallback_level_1 }
    - { name: trader_display, timeout_ms: 223, on_timeout: fallback_level_1 }
    - { name: outcome_tracking, timeout_ms: 223, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Imbalance cost"
    - "Alerts acted on"
    - "Position adjustment value"
privacy:
  pii_in_logs: false
  retention_days: 400
