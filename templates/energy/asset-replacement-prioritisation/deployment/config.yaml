serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: asset_risk_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: cost_and_consequence_join, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: portfolio_optimiser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: scenario_budgets, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: plan_export, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Risk reduced per budget"
    - "Emergency replacements"
    - "Planner acceptance of the ranking"
privacy:
  pii_in_logs: false
  retention_days: 400
