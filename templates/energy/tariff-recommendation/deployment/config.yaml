serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: usage_and_eligibility_lookup, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: tariff_replay, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: sensitivity_range, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: eligibility_and_rules_check, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: recommendation_text, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: customer_or_agent_view, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outcome_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Customer savings realised"
    - "Complaints about advice"
    - "Plan switch satisfaction"
privacy:
  pii_in_logs: false
  retention_days: 400
