serving:
  deadline_ms: 2500
  stages:
    - { name: passive_capture, timeout_ms: 234, on_timeout: fallback_level_1 }
    - { name: protocol_parsing, timeout_ms: 234, on_timeout: fallback_level_1 }
    - { name: baseline_model, timeout_ms: 937, on_timeout: fallback_level_1 }
    - { name: graph_change_detection, timeout_ms: 351, on_timeout: fallback_level_1 }
    - { name: context_enrichment, timeout_ms: 469, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Mean time to detect"
    - "Unknown devices found"
    - "Incidents in OT zones"
privacy:
  pii_in_logs: false
  retention_days: 400
