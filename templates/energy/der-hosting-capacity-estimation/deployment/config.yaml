serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: network_model_export, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: scenario_generation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: surrogate_training, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: conservative_bounds, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: hosting_map, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: validation, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Connection offer time"
    - "Unnecessary studies"
    - "Voltage or thermal violations after connection"
privacy:
  pii_in_logs: false
  retention_days: 400
