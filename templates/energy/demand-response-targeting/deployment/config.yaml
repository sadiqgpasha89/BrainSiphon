serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: enrolment_and_interval_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: baseline_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: reduction_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: event_planner, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: notification, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: reduction_measurement, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: learning_loop, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Delivered reduction"
    - "Event cost"
    - "Opt-out rate"
privacy:
  pii_in_logs: false
  retention_days: 400
