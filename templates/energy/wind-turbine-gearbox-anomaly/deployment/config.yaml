serving:
  deadline_ms: 2500
  stages:
    - { name: scada_and_vibration_capture, timeout_ms: 165, on_timeout: fallback_level_1 }
    - { name: state_segmentation, timeout_ms: 660, on_timeout: fallback_level_1 }
    - { name: residual_model, timeout_ms: 659, on_timeout: fallback_level_1 }
    - { name: trend_test, timeout_ms: 247, on_timeout: fallback_level_1 }
    - { name: alert_and_lead_time, timeout_ms: 247, on_timeout: fallback_level_1 }
    - { name: maintenance_planning, timeout_ms: 247, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Major component failures"
    - "Crane cost"
    - "Lost generation"
privacy:
  pii_in_logs: false
  retention_days: 400
