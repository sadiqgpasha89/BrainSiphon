serving:
  deadline_ms: 2500
  stages:
    - { name: contact_intake, timeout_ms: 223, on_timeout: fallback_level_1 }
    - { name: address_resolution, timeout_ms: 334, on_timeout: fallback_level_1 }
    - { name: outage_lookup, timeout_ms: 222, on_timeout: fallback_level_1 }
    - { name: answer_draft, timeout_ms: 890, on_timeout: fallback_level_1 }
    - { name: priority_routing, timeout_ms: 222, on_timeout: fallback_level_1 }
    - { name: update_subscription, timeout_ms: 334, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Calls during storms"
    - "Repeat contacts"
    - "Customer satisfaction after outages"
privacy:
  pii_in_logs: false
  retention_days: 400
