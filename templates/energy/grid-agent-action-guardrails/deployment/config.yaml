serving:
  deadline_ms: 2500
  stages:
    - { name: control_network_gate, timeout_ms: 290, on_timeout: fallback_level_1 }
    - { name: switching_rule_decision, timeout_ms: 194, on_timeout: fallback_level_1 }
    - { name: operator_countersign, timeout_ms: 290, on_timeout: fallback_level_1 }
    - { name: order_record, timeout_ms: 387, on_timeout: fallback_level_1 }
    - { name: setpoint_drift_monitor, timeout_ms: 774, on_timeout: fallback_level_1 }
    - { name: order_replay_console, timeout_ms: 290, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Unsafe orders blocked before reaching the field"
    - "Customer minutes lost from agent orders"
    - "Minutes to produce a regulator evidence pack"
privacy:
  pii_in_logs: false
  retention_days: 400
