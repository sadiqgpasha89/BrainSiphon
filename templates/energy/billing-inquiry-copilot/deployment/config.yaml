serving:
  deadline_ms: 2500
  stages:
    - { name: inquiry_intake, timeout_ms: 159, on_timeout: fallback_level_1 }
    - { name: identity_check, timeout_ms: 238, on_timeout: fallback_level_1 }
    - { name: billing_retrieval, timeout_ms: 477, on_timeout: fallback_level_1 }
    - { name: policy_retrieval, timeout_ms: 477, on_timeout: fallback_level_1 }
    - { name: explanation_draft, timeout_ms: 636, on_timeout: fallback_level_1 }
    - { name: quality_sampling, timeout_ms: 238, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Handle time"
    - "First-contact resolution"
    - "Billing complaints escalated"
privacy:
  pii_in_logs: false
  retention_days: 400
