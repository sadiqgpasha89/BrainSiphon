serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: session_and_meter_aggregation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: feature_build, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: demand_forecast, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: hierarchical_reconciliation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: feeder_peak_view, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: accuracy_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Feeder overloads"
    - "Upgrade cost avoided"
    - "Forecast bias at peak"
privacy:
  pii_in_logs: false
  retention_days: 400
