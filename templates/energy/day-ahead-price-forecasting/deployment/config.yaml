serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: market_and_fundamentals_ingestion, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: feature_build, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: quantile_forecast, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: spike_probability, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: scenario_ensemble, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: publish_to_bidding, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: accuracy_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Bid value against the baseline"
    - "Hedging cost"
    - "Forecast error at peaks"
privacy:
  pii_in_logs: false
  retention_days: 400
