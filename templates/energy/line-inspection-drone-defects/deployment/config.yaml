serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: image_ingestion, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: structure_matching, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: defect_detection, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: severity_and_criticality_scoring, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: work_order_proposal, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Inspector review time"
    - "Defects found per survey"
    - "Failures from missed defects"
privacy:
  pii_in_logs: false
  retention_days: 400
