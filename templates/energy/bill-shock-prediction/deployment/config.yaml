serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: consumption_and_billing_extraction, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: weather_adjustment, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: bill_shock_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: reason_code, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outreach_list, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: customer_message, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outcome_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Bill complaints"
    - "Arrears after high bills"
    - "Contact centre calls"
privacy:
  pii_in_logs: false
  retention_days: 400
