serving:
  deadline_ms: 2500
  stages:
    - { name: fault_and_state_intake, timeout_ms: 207, on_timeout: fallback_level_1 }
    - { name: graph_search, timeout_ms: 414, on_timeout: fallback_level_1 }
    - { name: plan_scoring, timeout_ms: 414, on_timeout: fallback_level_1 }
    - { name: power_flow_and_protection_check, timeout_ms: 414, on_timeout: fallback_level_1 }
    - { name: ranked_plans, timeout_ms: 414, on_timeout: fallback_level_1 }
    - { name: operator_execution, timeout_ms: 155, on_timeout: fallback_level_1 }
    - { name: result_logging, timeout_ms: 207, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Customer minutes interrupted"
    - "Switching steps"
    - "Plans accepted by operators"
privacy:
  pii_in_logs: false
  retention_days: 400
