serving:
  deadline_ms: 2500
  stages:
    - { name: telemetry_and_meter_voltages, timeout_ms: 148, on_timeout: fallback_level_1 }
    - { name: state_estimate, timeout_ms: 297, on_timeout: fallback_level_1 }
    - { name: load_and_der_forecast, timeout_ms: 593, on_timeout: fallback_level_1 }
    - { name: setting_optimiser, timeout_ms: 593, on_timeout: fallback_level_1 }
    - { name: safety_clip, timeout_ms: 148, on_timeout: fallback_level_1 }
    - { name: operator_advice_display, timeout_ms: 223, on_timeout: fallback_level_1 }
    - { name: savings_evaluation, timeout_ms: 223, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Voltage violations"
    - "Technical losses"
    - "Device switching count"
privacy:
  pii_in_logs: false
  retention_days: 400
