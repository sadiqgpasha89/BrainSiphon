serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: thermal_image_capture, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: component_detection, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: normalisation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: hot_spot_scoring, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: ranked_repair_list, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: technician_confirmation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outcome_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Failures from hot connections"
    - "Unplanned outages"
    - "Repair backlog by severity"
privacy:
  pii_in_logs: false
  retention_days: 400
