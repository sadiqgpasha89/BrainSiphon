serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: weather_and_fuel_data_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: segment_feature_build, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: risk_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: calibration, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: scenario_ranges, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: risk_map_and_brief, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: decision_log, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Ignition events"
    - "Inspections targeted"
    - "Public safety decision quality"
privacy:
  pii_in_logs: false
  retention_days: 400
