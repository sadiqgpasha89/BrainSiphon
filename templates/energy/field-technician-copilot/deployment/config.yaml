serving:
  deadline_ms: 2500
  stages:
    - { name: question_intake, timeout_ms: 185, on_timeout: fallback_level_1 }
    - { name: asset_context, timeout_ms: 371, on_timeout: fallback_level_1 }
    - { name: retrieval, timeout_ms: 556, on_timeout: fallback_level_1 }
    - { name: answer_with_citation, timeout_ms: 742, on_timeout: fallback_level_1 }
    - { name: safety_step_insertion, timeout_ms: 371, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Calls to the helpdesk"
    - "First-time fix rate"
    - "Time to find a procedure"
privacy:
  pii_in_logs: false
  retention_days: 400
