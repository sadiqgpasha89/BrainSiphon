serving:
  deadline_ms: 2500
  stages:
    - { name: data_request_intake, timeout_ms: 495, on_timeout: fallback_level_1 }
    - { name: retrieval_of_prior_answers, timeout_ms: 371, on_timeout: fallback_level_1 }
    - { name: calculation_tools, timeout_ms: 124, on_timeout: fallback_level_1 }
    - { name: draft_answer, timeout_ms: 494, on_timeout: fallback_level_1 }
    - { name: consistency_check, timeout_ms: 494, on_timeout: fallback_level_1 }
    - { name: submission_pack, timeout_ms: 247, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Drafting time"
    - "Regulator follow-up questions"
    - "Corrections after submission"
privacy:
  pii_in_logs: false
  retention_days: 400
