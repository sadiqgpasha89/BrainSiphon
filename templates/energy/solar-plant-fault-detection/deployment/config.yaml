serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: plant_and_weather_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: expected_power_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: fault_classifier, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: thermal_image_analysis, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: loss_ranking, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: work_plan, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outcome_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Recovered energy"
    - "Time to repair"
    - "Cleaning cost per kWh recovered"
privacy:
  pii_in_logs: false
  retention_days: 400
