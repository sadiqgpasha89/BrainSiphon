serving:
  deadline_ms: 80
  stages:
    - { name: posting_api, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: feature_service, timeout_ms: 12, on_timeout: fallback_level_1 }
    - { name: image_reuse_search, timeout_ms: 17, on_timeout: fallback_level_1 }
    - { name: scam_model, timeout_ms: 23, on_timeout: fallback_level_1 }
    - { name: policy, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: outcome_log, timeout_ms: 6, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Scam exposure"
    - "False blocks"
privacy:
  pii_in_logs: false
  retention_days: 400
