serving:
  deadline_ms: 2500
  stages:
    - { name: listing_facts, timeout_ms: 209, on_timeout: fallback_level_1 }
    - { name: photo_tags, timeout_ms: 556, on_timeout: fallback_level_1 }
    - { name: description_drafter, timeout_ms: 556, on_timeout: fallback_level_1 }
    - { name: fact_verifier, timeout_ms: 139, on_timeout: fallback_level_1 }
    - { name: fair_housing_checker, timeout_ms: 556, on_timeout: fallback_level_1 }
    - { name: publish, timeout_ms: 209, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Listing quality"
    - "Complaints"
privacy:
  pii_in_logs: false
  retention_days: 400
