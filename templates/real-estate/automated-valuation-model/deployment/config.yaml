serving:
  deadline_ms: 2500
  stages:
    - { name: property_record_lookup, timeout_ms: 191, on_timeout: fallback_level_1 }
    - { name: geospatial_features, timeout_ms: 254, on_timeout: fallback_level_1 }
    - { name: comparable_retriever, timeout_ms: 381, on_timeout: fallback_level_1 }
    - { name: photo_condition_model, timeout_ms: 509, on_timeout: fallback_level_1 }
    - { name: value_model, timeout_ms: 508, on_timeout: fallback_level_1 }
    - { name: confidence_calibrator, timeout_ms: 191, on_timeout: fallback_level_1 }
    - { name: valuation_log, timeout_ms: 191, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Appraisal orders avoided"
    - "Value disputes raised by lenders"
privacy:
  pii_in_logs: false
  retention_days: 400
