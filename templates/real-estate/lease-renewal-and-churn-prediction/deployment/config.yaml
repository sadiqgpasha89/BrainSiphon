serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: lease_and_service_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: market_rent_feed, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: renewal_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: offer_optimiser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: manager_console, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: offer_log, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outcome_feed, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Renewal rate"
    - "Net effective rent"
privacy:
  pii_in_logs: false
  retention_days: 400
