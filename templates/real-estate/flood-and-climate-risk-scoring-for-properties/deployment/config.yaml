serving:
  deadline_ms: 2500
  stages:
    - { name: hazard_layers, timeout_ms: 574, on_timeout: fallback_level_1 }
    - { name: property_features, timeout_ms: 287, on_timeout: fallback_level_1 }
    - { name: vulnerability_model, timeout_ms: 574, on_timeout: fallback_level_1 }
    - { name: calibrator, timeout_ms: 216, on_timeout: fallback_level_1 }
    - { name: score_api, timeout_ms: 574, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Loss ratio"
    - "Disputes"
privacy:
  pii_in_logs: false
  retention_days: 400
