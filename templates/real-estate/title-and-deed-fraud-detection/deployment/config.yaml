    - { name: entity_graph, timeout_ms: 297, on_timeout: fallback_level_1 }
    - { name: feature_builder, timeout_ms: 297, on_timeout: fallback_level_1 }
    - { name: fraud_model, timeout_ms: 593, on_timeout: fallback_level_1 }
    - { name: document_checks, timeout_ms: 593, on_timeout: fallback_level_1 }
    - { name: outcome_log, timeout_ms: 222, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
