serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: sensor_stream, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: feature_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: health_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: alert_ranker, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: work_orders, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: technician_app, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outcome_log, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Unplanned downtime"
    - "Maintenance cost"
privacy:
  pii_in_logs: false
  retention_days: 400
