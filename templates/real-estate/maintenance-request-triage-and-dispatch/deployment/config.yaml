serving:
  deadline_ms: 2500
  stages:
    - { name: request_intake, timeout_ms: 131, on_timeout: fallback_level_1 }
    - { name: text_and_image_classifier, timeout_ms: 524, on_timeout: fallback_level_1 }
    - { name: urgency_rules, timeout_ms: 131, on_timeout: fallback_level_1 }
    - { name: parts_predictor, timeout_ms: 524, on_timeout: fallback_level_1 }
    - { name: dispatcher, timeout_ms: 523, on_timeout: fallback_level_1 }
    - { name: tenant_update, timeout_ms: 196, on_timeout: fallback_level_1 }
    - { name: outcome_log, timeout_ms: 196, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "First-visit fix rate"
    - "Emergency response time"
privacy:
  pii_in_logs: false
  retention_days: 400
