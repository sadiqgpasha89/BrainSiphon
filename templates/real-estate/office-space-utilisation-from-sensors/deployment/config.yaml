serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: sensors, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: cleaner, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: occupancy_estimator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: pattern_miner, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: recommender, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: facilities_dashboard, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Space released"
    - "Cost saved"
privacy:
  pii_in_logs: false
  retention_days: 400
