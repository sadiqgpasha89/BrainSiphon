serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: property_and_debt_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: entity_resolver, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: features, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: sale_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: ranker, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outcome_feed, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Off-market deals"
    - "Contact success"
privacy:
  pii_in_logs: false
  retention_days: 400
