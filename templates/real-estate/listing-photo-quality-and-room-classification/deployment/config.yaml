serving:
  deadline_ms: 80
  stages:
    - { name: image_upload, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: preprocessor, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: room_and_quality_model, timeout_ms: 26, on_timeout: fallback_level_1 }
    - { name: privacy_blur, timeout_ms: 26, on_timeout: fallback_level_1 }
    - { name: gallery_orderer, timeout_ms: 6, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Listing engagement"
    - "Agent reshoot rate"
privacy:
  pii_in_logs: false
  retention_days: 400
