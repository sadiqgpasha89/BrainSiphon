serving:
  deadline_ms: 2500
  stages:
    - { name: session_start, timeout_ms: 223, on_timeout: fallback_level_1 }
    - { name: preference_capture, timeout_ms: 148, on_timeout: fallback_level_1 }
    - { name: item_embeddings, timeout_ms: 593, on_timeout: fallback_level_1 }
    - { name: user_tower, timeout_ms: 223, on_timeout: fallback_level_1 }
    - { name: ann_retrieval, timeout_ms: 445, on_timeout: fallback_level_1 }
    - { name: bandit_re_ranker, timeout_ms: 593, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Enquiry rate for new users"
    - "Return visits"
privacy:
  pii_in_logs: false
  retention_days: 400
