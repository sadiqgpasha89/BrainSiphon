serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: map_and_amenity_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: imagery_features, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: routing_features, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: score_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: score_store, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: api, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Search engagement with area filters"
    - "Complaints about scores"
privacy:
  pii_in_logs: false
  retention_days: 400
