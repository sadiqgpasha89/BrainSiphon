serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: calendar_and_bookings, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: event_feed, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: occupancy_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: price_optimiser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: host_controls, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: price_push, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outcome_log, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "RevPAR"
    - "Occupancy"
privacy:
  pii_in_logs: false
  retention_days: 400
