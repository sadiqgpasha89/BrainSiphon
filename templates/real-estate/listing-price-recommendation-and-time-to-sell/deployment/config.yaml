serving:
  deadline_ms: 2500
  stages:
    - { name: property_and_market_data, timeout_ms: 262, on_timeout: fallback_level_1 }
    - { name: value_baseline, timeout_ms: 196, on_timeout: fallback_level_1 }
    - { name: survival_model, timeout_ms: 524, on_timeout: fallback_level_1 }
    - { name: price_time_optimiser, timeout_ms: 524, on_timeout: fallback_level_1 }
    - { name: advisor_view, timeout_ms: 523, on_timeout: fallback_level_1 }
    - { name: outcome_feed, timeout_ms: 196, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Median days on market"
    - "Sale-to-list ratio"
privacy:
  pii_in_logs: false
  retention_days: 400
