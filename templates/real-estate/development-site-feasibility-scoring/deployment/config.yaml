serving:
  deadline_ms: 2500
  stages:
    - { name: parcel_and_zoning_data, timeout_ms: 257, on_timeout: fallback_level_1 }
    - { name: rule_extractor, timeout_ms: 171, on_timeout: fallback_level_1 }
    - { name: constraint_overlay, timeout_ms: 171, on_timeout: fallback_level_1 }
    - { name: feasibility_model, timeout_ms: 685, on_timeout: fallback_level_1 }
    - { name: residual_value, timeout_ms: 684, on_timeout: fallback_level_1 }
    - { name: outcome_log, timeout_ms: 257, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Sites progressed per analyst-week"
    - "Win rate"
privacy:
  pii_in_logs: false
  retention_days: 400
