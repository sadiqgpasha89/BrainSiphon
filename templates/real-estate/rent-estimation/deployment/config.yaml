serving:
  deadline_ms: 80
  stages:
    - { name: listing_and_lease_feed, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: geospatial_features, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: amenity_extractor, timeout_ms: 18, on_timeout: fallback_level_1 }
    - { name: rent_model, timeout_ms: 18, on_timeout: fallback_level_1 }
    - { name: range_calibrator, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: api_response, timeout_ms: 4, on_timeout: fallback_level_1 }
    - { name: outcome_store, timeout_ms: 9, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Listing price changes after estimate"
    - "Time to lease"
privacy:
  pii_in_logs: false
  retention_days: 400
