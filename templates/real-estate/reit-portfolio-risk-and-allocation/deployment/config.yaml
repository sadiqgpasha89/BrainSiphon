serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: property_valuations, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: return_de_smoother, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: risk_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: optimiser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: scenario_tool, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: committee_pack, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Risk-adjusted return"
    - "Drawdown"
privacy:
  pii_in_logs: false
  retention_days: 400
