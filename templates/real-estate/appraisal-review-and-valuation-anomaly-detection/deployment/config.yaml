serving:
  deadline_ms: 2500
  stages:
    - { name: avm_benchmark, timeout_ms: 304, on_timeout: fallback_level_1 }
    - { name: comparable_checker, timeout_ms: 809, on_timeout: fallback_level_1 }
    - { name: risk_model, timeout_ms: 809, on_timeout: fallback_level_1 }
    - { name: outcome_log, timeout_ms: 303, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Valuation losses avoided"
    - "Review turnaround"
privacy:
  pii_in_logs: false
  retention_days: 400
