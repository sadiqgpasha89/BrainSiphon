serving:
  deadline_ms: 2500
  stages:
    - { name: application_intake, timeout_ms: 144, on_timeout: fallback_level_1 }
    - { name: plan_reader, timeout_ms: 574, on_timeout: fallback_level_1 }
    - { name: rule_engine, timeout_ms: 144, on_timeout: fallback_level_1 }
    - { name: narrative_checker, timeout_ms: 574, on_timeout: fallback_level_1 }
    - { name: findings_drafter, timeout_ms: 574, on_timeout: fallback_level_1 }
    - { name: record, timeout_ms: 215, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Review time"
    - "Rework cycles"
privacy:
  pii_in_logs: false
  retention_days: 400
