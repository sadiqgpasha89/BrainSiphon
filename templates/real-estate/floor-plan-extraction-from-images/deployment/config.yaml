serving:
  deadline_ms: 2500
  stages:
    - { name: image_upload, timeout_ms: 159, on_timeout: fallback_level_1 }
    - { name: preprocessor, timeout_ms: 159, on_timeout: fallback_level_1 }
    - { name: wall_and_room_model, timeout_ms: 636, on_timeout: fallback_level_1 }
    - { name: ocr, timeout_ms: 636, on_timeout: fallback_level_1 }
    - { name: vectoriser, timeout_ms: 238, on_timeout: fallback_level_1 }
    - { name: validator, timeout_ms: 159, on_timeout: fallback_level_1 }
    - { name: correction_tool, timeout_ms: 238, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Manual tracing hours saved"
    - "3D tour conversion"
privacy:
  pii_in_logs: false
  retention_days: 400
