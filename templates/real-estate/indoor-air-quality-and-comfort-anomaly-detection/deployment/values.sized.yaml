# Overrides for deployment/helm/ai-solution in the free BrainSiphon deployment kit, for Indoor Air Quality & Comfort Anomaly Detection.
# Modelled sizing at 10M registered users. Replace with your measured peak, and set autoscaling bounds from a load test.
# Blueprint compute statement: 36 8-vCPU pods for 90,000 req/s (≈2,500 scores/s per pod (GBDT / small NN, features already in memory)); 3 online feature-store shards and 12 event-bus partitions.
replicaCount: 36   # modelled pods at peak, including failover headroom
resources:
  requests:
    cpu: '8000m'
  limits:
    cpu: '8000m'
