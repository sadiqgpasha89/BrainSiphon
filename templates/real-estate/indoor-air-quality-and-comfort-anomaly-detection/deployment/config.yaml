serving:
  deadline_ms: 2500
  stages:
    - { name: sensors, timeout_ms: 159, on_timeout: fallback_level_1 }
    - { name: cleaner, timeout_ms: 159, on_timeout: fallback_level_1 }
    - { name: baseline_model, timeout_ms: 636, on_timeout: fallback_level_1 }
    - { name: anomaly_scorer, timeout_ms: 636, on_timeout: fallback_level_1 }
    - { name: sensor_health, timeout_ms: 159, on_timeout: fallback_level_1 }
    - { name: work_order, timeout_ms: 238, on_timeout: fallback_level_1 }
    - { name: dashboard, timeout_ms: 238, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Complaints"
    - "Alerts acted on"
privacy:
  pii_in_logs: false
  retention_days: 400
