serving:
  deadline_ms: 2500
  stages:
    - { name: message_intake, timeout_ms: 159, on_timeout: fallback_level_1 }
    - { name: identity_resolver, timeout_ms: 636, on_timeout: fallback_level_1 }
    - { name: retriever, timeout_ms: 477, on_timeout: fallback_level_1 }
    - { name: typed_tools, timeout_ms: 159, on_timeout: fallback_level_1 }
    - { name: answer_composer, timeout_ms: 635, on_timeout: fallback_level_1 }
    - { name: verifier, timeout_ms: 159, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Deflection rate"
    - "Response time"
privacy:
  pii_in_logs: false
  retention_days: 400
