serving:
  deadline_ms: 2500
  stages:
    - { name: application_intake, timeout_ms: 148, on_timeout: fallback_level_1 }
    - { name: document_verifier, timeout_ms: 593, on_timeout: fallback_level_1 }
    - { name: feature_builder, timeout_ms: 297, on_timeout: fallback_level_1 }
    - { name: risk_model, timeout_ms: 593, on_timeout: fallback_level_1 }
    - { name: fairness_monitor, timeout_ms: 223, on_timeout: fallback_level_1 }
    - { name: landlord_decision, timeout_ms: 148, on_timeout: fallback_level_1 }
    - { name: dispute_handling, timeout_ms: 223, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Delinquency rate"
    - "Approval equity"
privacy:
  pii_in_logs: false
  retention_days: 400
