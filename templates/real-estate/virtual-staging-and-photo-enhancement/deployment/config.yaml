serving:
  deadline_ms: 2500
  stages:
    - { name: photo_upload, timeout_ms: 139, on_timeout: fallback_level_1 }
    - { name: depth_and_edge_extraction, timeout_ms: 556, on_timeout: fallback_level_1 }
    - { name: staging_generator, timeout_ms: 556, on_timeout: fallback_level_1 }
    - { name: structure_checker, timeout_ms: 209, on_timeout: fallback_level_1 }
    - { name: label_stamper, timeout_ms: 209, on_timeout: fallback_level_1 }
    - { name: agent_approval, timeout_ms: 556, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Listing views"
    - "Buyer complaints about staging"
privacy:
  pii_in_logs: false
  retention_days: 400
