serving:
  deadline_ms: 2500
  stages:
    - { name: data_room_ingest, timeout_ms: 223, on_timeout: fallback_level_1 }
    - { name: classifier, timeout_ms: 890, on_timeout: fallback_level_1 }
    - { name: checklist_matcher, timeout_ms: 222, on_timeout: fallback_level_1 }
    - { name: issue_extractor, timeout_ms: 890, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Review hours"
    - "Missed issues"
privacy:
  pii_in_logs: false
  retention_days: 400
