serving:
  deadline_ms: 2500
  stages:
    - { name: sensors, timeout_ms: 154, on_timeout: fallback_level_1 }
    - { name: state_estimator, timeout_ms: 614, on_timeout: fallback_level_1 }
    - { name: thermal_model, timeout_ms: 614, on_timeout: fallback_level_1 }
    - { name: controller, timeout_ms: 230, on_timeout: fallback_level_1 }
    - { name: safety_layer, timeout_ms: 153, on_timeout: fallback_level_1 }
    - { name: bms_write, timeout_ms: 230, on_timeout: fallback_level_1 }
    - { name: energy_log, timeout_ms: 230, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "kWh"
    - "Complaints"
privacy:
  pii_in_logs: false
  retention_days: 400
