serving:
  deadline_ms: 80
  stages:
    - { name: subject_property_features, timeout_ms: 10, on_timeout: fallback_level_1 }
    - { name: candidate_retrieval, timeout_ms: 15, on_timeout: fallback_level_1 }
    - { name: reranker, timeout_ms: 20, on_timeout: fallback_level_1 }
    - { name: adjustment_model, timeout_ms: 20, on_timeout: fallback_level_1 }
    - { name: rule_check, timeout_ms: 5, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Appraiser time per report"
    - "Revisions requested"
privacy:
  pii_in_logs: false
  retention_days: 400
