serving:
  deadline_ms: 2500
  stages:
    - { name: cameras, timeout_ms: 247, on_timeout: fallback_level_1 }
    - { name: edge_detector, timeout_ms: 660, on_timeout: fallback_level_1 }
    - { name: tracker, timeout_ms: 659, on_timeout: fallback_level_1 }
    - { name: rules, timeout_ms: 165, on_timeout: fallback_level_1 }
    - { name: alert, timeout_ms: 247, on_timeout: fallback_level_1 }
    - { name: supervisor_app, timeout_ms: 247, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Incidents"
    - "Near misses"
privacy:
  pii_in_logs: false
  retention_days: 400
