serving:
  deadline_ms: 80
  stages:
    - { name: query_and_filters, timeout_ms: 4, on_timeout: fallback_level_1 }
    - { name: candidate_retrieval, timeout_ms: 13, on_timeout: fallback_level_1 }
    - { name: feature_service, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: ranker, timeout_ms: 18, on_timeout: fallback_level_1 }
    - { name: fairness_re_rank, timeout_ms: 18, on_timeout: fallback_level_1 }
    - { name: results, timeout_ms: 4, on_timeout: fallback_level_1 }
    - { name: click_log, timeout_ms: 4, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Saves and enquiries per session"
    - "Time to first enquiry"
privacy:
  pii_in_logs: false
  retention_days: 400
