serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: drone_capture, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: photogrammetry, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: registration, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: element_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: progress, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: pm_dashboard, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Report time"
    - "Rework found"
privacy:
  pii_in_logs: false
  retention_days: 400
