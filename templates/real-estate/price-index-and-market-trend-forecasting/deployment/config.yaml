serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: sales_records, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: index_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: leading_indicators, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: forecast_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: interval_engine, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: publication, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Users of the index"
    - "Forecast hit rate"
privacy:
  pii_in_logs: false
  retention_days: 400
