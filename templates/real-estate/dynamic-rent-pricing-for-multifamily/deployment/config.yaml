serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: leasing_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: competitor_listings, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: demand_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: pricing_policy, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: guardrails, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: manager_approval, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outcome_log, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Revenue per available unit"
    - "Occupancy"
privacy:
  pii_in_logs: false
  retention_days: 400
