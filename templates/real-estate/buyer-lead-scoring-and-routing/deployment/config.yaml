serving:
  deadline_ms: 80
  stages:
    - { name: enquiry_intake, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: bot_filter, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: lead_scoring, timeout_ms: 20, on_timeout: fallback_level_1 }
    - { name: agent_matching, timeout_ms: 19, on_timeout: fallback_level_1 }
    - { name: notification, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: crm_sync, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: outcome_feed, timeout_ms: 7, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Lead-to-viewing rate"
    - "Time to first contact"
privacy:
  pii_in_logs: false
  retention_days: 400
