serving:
  deadline_ms: 2500
  stages:
    - { name: document_upload, timeout_ms: 154, on_timeout: fallback_level_1 }
    - { name: forensics_model, timeout_ms: 614, on_timeout: fallback_level_1 }
    - { name: issuer_verification, timeout_ms: 153, on_timeout: fallback_level_1 }
    - { name: institution_graph_check, timeout_ms: 230, on_timeout: fallback_level_1 }
    - { name: risk_scorer, timeout_ms: 614, on_timeout: fallback_level_1 }
    - { name: verification_specialist, timeout_ms: 230, on_timeout: fallback_level_1 }
    - { name: outcomes, timeout_ms: 230, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Fraudulent credentials caught"
    - "Verification turnaround"
privacy:
  pii_in_logs: false
  retention_days: 400
