serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: learner_logs, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: learner_state, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: offline_rl_trainer, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: safety_constraints, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: policy_service, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: a_b_and_holdouts, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Mastery gain vs control"
    - "Teacher override rate"
privacy:
  pii_in_logs: false
  retention_days: 400
