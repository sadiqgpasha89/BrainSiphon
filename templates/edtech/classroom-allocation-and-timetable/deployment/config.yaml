serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: enrolment_forecast, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: constraint_model_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: timetable_solver, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: preference_scorer, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: publication, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: utilisation_analytics, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Utilisation rate"
    - "Student gap hours"
privacy:
  pii_in_logs: false
  retention_days: 400
