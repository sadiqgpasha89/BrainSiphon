serving:
  deadline_ms: 80
  stages:
    - { name: interaction_events, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: baseline_tracker, timeout_ms: 25, on_timeout: fallback_level_1 }
    - { name: affect_model, timeout_ms: 24, on_timeout: fallback_level_1 }
    - { name: intervention_policy, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: learner_ui, timeout_ms: 9, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Help acceptance"
    - "Learning gain with adaptive support"
privacy:
  pii_in_logs: false
  retention_days: 400
