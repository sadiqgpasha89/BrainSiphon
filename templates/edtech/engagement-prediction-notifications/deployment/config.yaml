serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: activity_events, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: lapse_features, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: hazard_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: timing_and_message_bandit, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: frequency_arbiter, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: push_service, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outcomes, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Weekly active practice minutes"
    - "Opt-out rate"
privacy:
  pii_in_logs: false
  retention_days: 400
