serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: lms_and_sis_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: feature_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: dropout_hazard_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: uplift_allocator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: advisor_worklist, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outreach_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: retention_outcomes, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Retention rate in treated vs control"
    - "Advisor contacts per saved student"
privacy:
  pii_in_logs: false
  retention_days: 400
