serving:
  deadline_ms: 2500
  stages:
    - { name: source_passage, timeout_ms: 239, on_timeout: fallback_level_1 }
    - { name: level_estimator, timeout_ms: 636, on_timeout: fallback_level_1 }
    - { name: simplifier, timeout_ms: 636, on_timeout: fallback_level_1 }
    - { name: fact_retention_checker, timeout_ms: 238, on_timeout: fallback_level_1 }
    - { name: vocabulary_glosser, timeout_ms: 238, on_timeout: fallback_level_1 }
    - { name: learner_comprehension, timeout_ms: 238, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Comprehension scores"
    - "Reading time"
privacy:
  pii_in_logs: false
  retention_days: 400
