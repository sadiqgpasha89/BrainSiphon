serving:
  deadline_ms: 80
  stages:
    - { name: registration_data, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: prior_builder, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: item_selector, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: ability_estimator, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: stopping_rule, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: learner_model_init, timeout_ms: 22, on_timeout: fallback_level_1 }
    - { name: placement_outcome, timeout_ms: 8, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Day-7 retention"
    - "Early mastery gain"
privacy:
  pii_in_logs: false
  retention_days: 400
