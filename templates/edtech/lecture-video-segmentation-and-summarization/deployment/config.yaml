serving:
  deadline_ms: 2500
  stages:
    - { name: video_upload, timeout_ms: 114, on_timeout: fallback_level_1 }
    - { name: asr_with_glossary_biasing, timeout_ms: 457, on_timeout: fallback_level_1 }
    - { name: slide_and_scene_detector, timeout_ms: 457, on_timeout: fallback_level_1 }
    - { name: segmenter, timeout_ms: 456, on_timeout: fallback_level_1 }
    - { name: summariser, timeout_ms: 456, on_timeout: fallback_level_1 }
    - { name: chapter_ui, timeout_ms: 171, on_timeout: fallback_level_1 }
    - { name: learner_interaction, timeout_ms: 114, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Chapter navigation usage"
    - "Time to find content"
privacy:
  pii_in_logs: false
  retention_days: 400
