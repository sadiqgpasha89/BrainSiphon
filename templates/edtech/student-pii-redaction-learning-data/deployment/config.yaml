serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: data_export, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: normaliser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: ner_ensemble, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: roster_matcher, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: pseudonymiser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: analytics_release, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "PII leaks in audits"
    - "Data availability for analytics"
privacy:
  pii_in_logs: false
  retention_days: 400
