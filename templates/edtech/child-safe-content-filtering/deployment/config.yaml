serving:
  deadline_ms: 80
  stages:
    - { name: content_and_chat, timeout_ms: 10, on_timeout: fallback_level_1 }
    - { name: text_and_image_classifiers, timeout_ms: 27, on_timeout: fallback_level_1 }
    - { name: context_scorer, timeout_ms: 27, on_timeout: fallback_level_1 }
    - { name: age_band_policy, timeout_ms: 6, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Unsafe content exposure"
    - "Educator complaints about over-blocking"
privacy:
  pii_in_logs: false
  retention_days: 400
