serving:
  deadline_ms: 2500
  stages:
    - { name: student_audio, timeout_ms: 209, on_timeout: fallback_level_1 }
    - { name: streaming_asr, timeout_ms: 556, on_timeout: fallback_level_1 }
    - { name: dialogue_agent, timeout_ms: 556, on_timeout: fallback_level_1 }
    - { name: follow_up_policy, timeout_ms: 139, on_timeout: fallback_level_1 }
    - { name: transcript_scorer, timeout_ms: 556, on_timeout: fallback_level_1 }
    - { name: appeals, timeout_ms: 209, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Instructor hours saved"
    - "Student fairness perception"
privacy:
  pii_in_logs: false
  retention_days: 400
