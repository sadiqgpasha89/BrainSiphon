serving:
  deadline_ms: 2500
  stages:
    - { name: audio_capture, timeout_ms: 185, on_timeout: fallback_level_1 }
    - { name: noise_suppression, timeout_ms: 278, on_timeout: fallback_level_1 }
    - { name: child_asr, timeout_ms: 742, on_timeout: fallback_level_1 }
    - { name: passage_aligner, timeout_ms: 278, on_timeout: fallback_level_1 }
    - { name: miscue_classifier, timeout_ms: 742, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
