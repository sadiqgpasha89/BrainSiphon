serving:
  deadline_ms: 2500
  stages:
    - { name: webcam_and_screen_feed, timeout_ms: 393, on_timeout: fallback_level_1 }
    - { name: on_device_detectors, timeout_ms: 1047, on_timeout: fallback_level_1 }
    - { name: flag_aggregator, timeout_ms: 523, on_timeout: fallback_level_1 }
    - { name: decision_and_appeal, timeout_ms: 262, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Confirmed integrity violations"
    - "Student complaint rate"
privacy:
  pii_in_logs: false
  retention_days: 400
