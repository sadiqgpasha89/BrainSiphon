serving:
  deadline_ms: 80
  stages:
    - { name: test_items, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: response_collector, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: word_knowledge_model, timeout_ms: 22, on_timeout: fallback_level_1 }
    - { name: pseudo_word_correction, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: text_recommender, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: longitudinal_updates, timeout_ms: 22, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Text-difficulty match"
    - "Learning gain"
privacy:
  pii_in_logs: false
  retention_days: 400
