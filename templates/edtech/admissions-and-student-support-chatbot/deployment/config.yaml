serving:
  deadline_ms: 2500
  stages:
    - { name: chat_gateway, timeout_ms: 154, on_timeout: fallback_level_1 }
    - { name: intent_and_risk_router, timeout_ms: 614, on_timeout: fallback_level_1 }
    - { name: retriever, timeout_ms: 460, on_timeout: fallback_level_1 }
    - { name: answer_llm, timeout_ms: 614, on_timeout: fallback_level_1 }
    - { name: citation_verifier, timeout_ms: 153, on_timeout: fallback_level_1 }
    - { name: staff_handoff, timeout_ms: 230, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Deflection with satisfaction"
    - "Wrong-answer complaints"
privacy:
  pii_in_logs: false
  retention_days: 400
