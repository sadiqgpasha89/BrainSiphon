serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: pilot_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: feature_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: uplift_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: policy_learner, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: equity_check, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: educator_decision, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outcome_follow_up, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Learning gain per support hour"
    - "Equity metrics"
privacy:
  pii_in_logs: false
  retention_days: 400
