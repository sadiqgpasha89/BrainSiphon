serving:
  deadline_ms: 2500
  stages:
    - { name: audio_capture, timeout_ms: 202, on_timeout: fallback_level_1 }
    - { name: vad_and_noise_suppression, timeout_ms: 304, on_timeout: fallback_level_1 }
    - { name: phoneme_recogniser, timeout_ms: 304, on_timeout: fallback_level_1 }
    - { name: pronunciation_scorer, timeout_ms: 809, on_timeout: fallback_level_1 }
    - { name: learner_ui, timeout_ms: 303, on_timeout: fallback_level_1 }
    - { name: rater_labels, timeout_ms: 303, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Speaking improvement per month"
    - "Learner retention"
privacy:
  pii_in_logs: false
  retention_days: 400
