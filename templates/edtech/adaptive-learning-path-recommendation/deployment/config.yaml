serving:
  deadline_ms: 80
  stages:
    - { name: learner_state, timeout_ms: 11, on_timeout: fallback_level_1 }
    - { name: eligible_activity_filter, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: candidate_scorer, timeout_ms: 16, on_timeout: fallback_level_1 }
    - { name: bandit_policy, timeout_ms: 22, on_timeout: fallback_level_1 }
    - { name: activity_delivery, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: learning_gain_labels, timeout_ms: 8, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Mastery gain per week"
    - "Completion and retention"
privacy:
  pii_in_logs: false
  retention_days: 400
