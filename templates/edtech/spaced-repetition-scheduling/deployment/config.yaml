serving:
  deadline_ms: 80
  stages:
    - { name: memory_state_store, timeout_ms: 15, on_timeout: fallback_level_1 }
    - { name: memory_model, timeout_ms: 31, on_timeout: fallback_level_1 }
    - { name: scheduler, timeout_ms: 12, on_timeout: fallback_level_1 }
    - { name: workload_balancer, timeout_ms: 12, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Retention at 30 days"
    - "Study minutes per retained item"
privacy:
  pii_in_logs: false
  retention_days: 400
