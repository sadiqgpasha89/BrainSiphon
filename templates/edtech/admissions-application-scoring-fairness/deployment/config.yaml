serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: application_ingest, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: document_parser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: evidence_extractor, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: calibration_analytics, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outcomes, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Reviewer throughput"
    - "Diversity of admitted class"
privacy:
  pii_in_logs: false
  retention_days: 400
