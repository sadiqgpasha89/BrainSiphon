serving:
  deadline_ms: 2500
  stages:
    - { name: item_stem_and_key, timeout_ms: 185, on_timeout: fallback_level_1 }
    - { name: misconception_retriever, timeout_ms: 371, on_timeout: fallback_level_1 }
    - { name: distractor_generator, timeout_ms: 495, on_timeout: fallback_level_1 }
    - { name: ambiguity_checker, timeout_ms: 495, on_timeout: fallback_level_1 }
    - { name: quality_ranker, timeout_ms: 494, on_timeout: fallback_level_1 }
    - { name: pilot_statistics, timeout_ms: 185, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Item discrimination index"
    - "Teacher edit rate"
privacy:
  pii_in_logs: false
  retention_days: 400
