serving:
  deadline_ms: 2500
  stages:
    - { name: student_work_input, timeout_ms: 230, on_timeout: fallback_level_1 }
    - { name: math_parser, timeout_ms: 614, on_timeout: fallback_level_1 }
    - { name: step_verifier, timeout_ms: 153, on_timeout: fallback_level_1 }
    - { name: error_classifier, timeout_ms: 614, on_timeout: fallback_level_1 }
    - { name: explanation_generator, timeout_ms: 614, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Revision rate after feedback"
    - "Teacher grading time"
privacy:
  pii_in_logs: false
  retention_days: 400
