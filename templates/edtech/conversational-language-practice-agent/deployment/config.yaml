serving:
  deadline_ms: 2500
  stages:
    - { name: learner_speech_or_text, timeout_ms: 155, on_timeout: fallback_level_1 }
    - { name: asr_or_text_input, timeout_ms: 414, on_timeout: fallback_level_1 }
    - { name: level_estimator, timeout_ms: 414, on_timeout: fallback_level_1 }
    - { name: dialogue_llm, timeout_ms: 414, on_timeout: fallback_level_1 }
    - { name: error_detector, timeout_ms: 414, on_timeout: fallback_level_1 }
    - { name: progress_store, timeout_ms: 414, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Proficiency gains"
    - "Weekly active practice"
privacy:
  pii_in_logs: false
  retention_days: 400
