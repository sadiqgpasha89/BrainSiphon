serving:
  deadline_ms: 80
  stages:
    - { name: ticket_intake, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: topic_and_language_classifier, timeout_ms: 23, on_timeout: fallback_level_1 }
    - { name: expertise_lookup, timeout_ms: 12, on_timeout: fallback_level_1 }
    - { name: assignment_optimiser, timeout_ms: 23, on_timeout: fallback_level_1 }
    - { name: reassign_rules, timeout_ms: 6, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to first response"
    - "Resolution satisfaction"
privacy:
  pii_in_logs: false
  retention_days: 400
