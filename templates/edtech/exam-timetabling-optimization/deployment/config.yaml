serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: enrolment_and_exam_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: conflict_matrix_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: timetable_solver, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: accessibility_checker, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: staff_roster_merger, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: registrar_approval, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: change_management, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Complaints from clashes"
    - "Manual repair hours"
privacy:
  pii_in_logs: false
  retention_days: 400
