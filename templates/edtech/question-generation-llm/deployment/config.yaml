serving:
  deadline_ms: 2500
  stages:
    - { name: objective_and_material_selection, timeout_ms: 185, on_timeout: fallback_level_1 }
    - { name: retriever, timeout_ms: 371, on_timeout: fallback_level_1 }
    - { name: question_generator, timeout_ms: 495, on_timeout: fallback_level_1 }
    - { name: solver_verifier, timeout_ms: 495, on_timeout: fallback_level_1 }
    - { name: difficulty_and_distractor_ranker, timeout_ms: 494, on_timeout: fallback_level_1 }
    - { name: item_bank, timeout_ms: 185, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Teacher time saved"
    - "Item quality after pilot"
privacy:
  pii_in_logs: false
  retention_days: 400
