serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: activity_events, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: learner_features, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: reward_policy, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: wellbeing_guardrail, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: reward_delivery, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: experiment_platform, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: learning_outcomes, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Learning gain per active week"
    - "90-day retention"
privacy:
  pii_in_logs: false
  retention_days: 400
