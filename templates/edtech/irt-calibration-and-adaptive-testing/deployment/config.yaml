serving:
  deadline_ms: 80
  stages:
    - { name: response_data, timeout_ms: 13, on_timeout: fallback_level_1 }
    - { name: item_calibration, timeout_ms: 13, on_timeout: fallback_level_1 }
    - { name: ability_estimator, timeout_ms: 12, on_timeout: fallback_level_1 }
    - { name: item_selector, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: exposure_controller, timeout_ms: 12, on_timeout: fallback_level_1 }
    - { name: dif_monitor, timeout_ms: 12, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Test length for target precision"
    - "Score validity evidence"
privacy:
  pii_in_logs: false
  retention_days: 400
