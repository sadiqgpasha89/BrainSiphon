serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: scholarship_ingestion, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: criteria_extractor, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: eligibility_engine, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: win_probability_ranker, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: matching_api, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: student_application, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outcomes, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Funds awarded per student"
    - "Application completion"
privacy:
  pii_in_logs: false
  retention_days: 400
