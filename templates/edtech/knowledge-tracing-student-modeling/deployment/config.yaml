serving:
  deadline_ms: 80
  stages:
    - { name: answer_event_stream, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: learner_state_cache, timeout_ms: 11, on_timeout: fallback_level_1 }
    - { name: kt_model, timeout_ms: 23, on_timeout: fallback_level_1 }
    - { name: mastery_calibrator, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: practice_selector, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: progress_api, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: interaction_logs, timeout_ms: 9, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Learning gain per hour"
    - "Practice efficiency"
privacy:
  pii_in_logs: false
  retention_days: 400
