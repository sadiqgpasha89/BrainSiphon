serving:
  deadline_ms: 2500
  stages:
    - { name: learning_data, timeout_ms: 202, on_timeout: fallback_level_1 }
    - { name: mastery_and_clustering, timeout_ms: 202, on_timeout: fallback_level_1 }
    - { name: insight_generator, timeout_ms: 540, on_timeout: fallback_level_1 }
    - { name: impact_ranker, timeout_ms: 540, on_timeout: fallback_level_1 }
    - { name: narrative_writer, timeout_ms: 539, on_timeout: fallback_level_1 }
    - { name: action_logging, timeout_ms: 202, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Insights acted on"
    - "Student outcomes in classes using insights"
privacy:
  pii_in_logs: false
  retention_days: 400
