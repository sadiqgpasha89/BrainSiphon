serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: content_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: text_extraction, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: candidate_retrieval, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: re_ranker, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: hierarchy_resolver, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: tag_store, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Tagging cost per item"
    - "Search success"
privacy:
  pii_in_logs: false
  retention_days: 400
