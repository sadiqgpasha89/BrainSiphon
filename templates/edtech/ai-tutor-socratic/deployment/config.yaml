serving:
  deadline_ms: 2500
  stages:
    - { name: student_message, timeout_ms: 267, on_timeout: fallback_level_1 }
    - { name: safety_and_age_filter, timeout_ms: 712, on_timeout: fallback_level_1 }
    - { name: dialogue_manager, timeout_ms: 178, on_timeout: fallback_level_1 }
    - { name: tutor_llm, timeout_ms: 712, on_timeout: fallback_level_1 }
    - { name: maths_and_fact_verifier, timeout_ms: 178, on_timeout: fallback_level_1 }
    - { name: student_response, timeout_ms: 178, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Learning gain vs control"
    - "Teacher-reported usefulness"
privacy:
  pii_in_logs: false
  retention_days: 400
