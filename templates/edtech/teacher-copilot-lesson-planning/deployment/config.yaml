serving:
  deadline_ms: 2500
  stages:
    - { name: standards_retriever, timeout_ms: 445, on_timeout: fallback_level_1 }
    - { name: lesson_drafter, timeout_ms: 594, on_timeout: fallback_level_1 }
    - { name: differentiation_generator, timeout_ms: 593, on_timeout: fallback_level_1 }
    - { name: alignment_and_level_check, timeout_ms: 593, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Prep time saved"
    - "Plan reuse"
privacy:
  pii_in_logs: false
  retention_days: 400
