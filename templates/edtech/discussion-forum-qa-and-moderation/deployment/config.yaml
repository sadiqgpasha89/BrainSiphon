serving:
  deadline_ms: 80
  stages:
    - { name: new_post, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: moderation_classifier, timeout_ms: 14, on_timeout: fallback_level_1 }
    - { name: duplicate_retriever, timeout_ms: 11, on_timeout: fallback_level_1 }
    - { name: answer_ranker, timeout_ms: 14, on_timeout: fallback_level_1 }
    - { name: grounded_answer_llm, timeout_ms: 14, on_timeout: fallback_level_1 }
    - { name: instructor_approval, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: forum_update, timeout_ms: 5, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to first answer"
    - "Instructor workload"
privacy:
  pii_in_logs: false
  retention_days: 400
