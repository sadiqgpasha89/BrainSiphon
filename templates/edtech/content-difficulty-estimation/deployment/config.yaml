serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: content_ingestion, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: feature_extraction, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: difficulty_regressor, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: response_collector, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: bayesian_updater, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: content_tagging, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Placement accuracy"
    - "Learner frustration rate"
privacy:
  pii_in_logs: false
  retention_days: 400
