serving:
  deadline_ms: 2500
  stages:
    - { name: script_scanning, timeout_ms: 230, on_timeout: fallback_level_1 }
    - { name: layout_detection, timeout_ms: 614, on_timeout: fallback_level_1 }
    - { name: handwriting_ocr, timeout_ms: 614, on_timeout: fallback_level_1 }
    - { name: auto_marker, timeout_ms: 154, on_timeout: fallback_level_1 }
    - { name: confidence_router, timeout_ms: 153, on_timeout: fallback_level_1 }
    - { name: grader_ui, timeout_ms: 230, on_timeout: fallback_level_1 }
    - { name: marks_export, timeout_ms: 230, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Grading turnaround"
    - "Re-mark rate"
privacy:
  pii_in_logs: false
  retention_days: 400
