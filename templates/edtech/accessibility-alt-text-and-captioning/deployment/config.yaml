serving:
  deadline_ms: 2500
  stages:
    - { name: content_images, timeout_ms: 202, on_timeout: fallback_level_1 }
    - { name: diagram_classifier, timeout_ms: 540, on_timeout: fallback_level_1 }
    - { name: ocr_and_chart_parser, timeout_ms: 540, on_timeout: fallback_level_1 }
    - { name: description_generator, timeout_ms: 539, on_timeout: fallback_level_1 }
    - { name: factuality_check, timeout_ms: 202, on_timeout: fallback_level_1 }
    - { name: publish, timeout_ms: 202, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Accessibility issue backlog"
    - "Learner feedback"
privacy:
  pii_in_logs: false
  retention_days: 400
