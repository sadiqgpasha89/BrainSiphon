serving:
  deadline_ms: 2500
  stages:
    - { name: failure_intake, timeout_ms: 117, on_timeout: fallback_level_1 }
    - { name: error_clustering, timeout_ms: 469, on_timeout: fallback_level_1 }
    - { name: log_and_commit_retrieval, timeout_ms: 351, on_timeout: fallback_level_1 }
    - { name: cause_proposal, timeout_ms: 468, on_timeout: fallback_level_1 }
    - { name: routing, timeout_ms: 176, on_timeout: fallback_level_1 }
    - { name: engineer_confirmation, timeout_ms: 468, on_timeout: fallback_level_1 }
    - { name: accuracy_tracking, timeout_ms: 176, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to triage"
    - "Re-runs"
    - "Failures bounced between teams"
privacy:
  pii_in_logs: false
  retention_days: 400
