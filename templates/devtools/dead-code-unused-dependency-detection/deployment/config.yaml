serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: static_analysis, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: production_coverage_join, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: flag_and_dependency_check, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: removal_ranking, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: removal_pull_request, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: post_removal_monitoring, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Lines and dependencies removed"
    - "Vulnerable unused dependencies removed"
    - "Incidents from removals"
privacy:
  pii_in_logs: false
  retention_days: 400
