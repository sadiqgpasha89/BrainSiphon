serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: flag_evaluation_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: code_reference_search, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: stale_flag_detection, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: interaction_analysis, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: removal_pull_request, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: cleanup_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Stale flags removed"
    - "Incidents from flags"
    - "Code paths removed"
privacy:
  pii_in_logs: false
  retention_days: 400
