serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: usage_analysis, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: change_plan, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: edit_and_build_in_sandbox, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: test_run, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: pull_request_with_evidence, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: rollout_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Repositories upgraded"
    - "Engineer hours per upgrade"
    - "Incidents from upgrades"
privacy:
  pii_in_logs: false
  retention_days: 400
