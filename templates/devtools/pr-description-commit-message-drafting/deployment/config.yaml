serving:
  deadline_ms: 2500
  stages:
    - { name: diff_and_issue_retrieval, timeout_ms: 445, on_timeout: fallback_level_1 }
    - { name: change_summarisation, timeout_ms: 593, on_timeout: fallback_level_1 }
    - { name: template_fill, timeout_ms: 148, on_timeout: fallback_level_1 }
    - { name: risk_note, timeout_ms: 593, on_timeout: fallback_level_1 }
    - { name: author_edit, timeout_ms: 223, on_timeout: fallback_level_1 }
    - { name: posting, timeout_ms: 223, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Review time"
    - "Description edits by reviewers"
    - "Pull requests with empty descriptions"
privacy:
  pii_in_logs: false
  retention_days: 400
