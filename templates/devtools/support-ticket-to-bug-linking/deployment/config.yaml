serving:
  deadline_ms: 2500
  stages:
    - { name: ticket_intake, timeout_ms: 104, on_timeout: fallback_level_1 }
    - { name: redaction, timeout_ms: 414, on_timeout: fallback_level_1 }
    - { name: candidate_retrieval, timeout_ms: 310, on_timeout: fallback_level_1 }
    - { name: link_ranking, timeout_ms: 414, on_timeout: fallback_level_1 }
    - { name: agent_confirmation, timeout_ms: 414, on_timeout: fallback_level_1 }
    - { name: impact_dashboard, timeout_ms: 155, on_timeout: fallback_level_1 }
    - { name: fix_status_sync, timeout_ms: 414, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to link"
    - "Bugs prioritised by customer impact"
    - "Duplicate tickets"
privacy:
  pii_in_logs: false
  retention_days: 400
