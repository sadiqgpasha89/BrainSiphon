serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: code_and_trace_ingestion, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: dependency_graph_build, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: rule_evaluation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: exception_workflow, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: owner_tickets, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: trend_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Open violations"
    - "New violations per month"
    - "Architecture review effort"
privacy:
  pii_in_logs: false
  retention_days: 400
