serving:
  deadline_ms: 2500
  stages:
    - { name: agent_edit_recording, timeout_ms: 712, on_timeout: fallback_level_1 }
    - { name: signed_provenance, timeout_ms: 267, on_timeout: fallback_level_1 }
    - { name: risk_tier, timeout_ms: 712, on_timeout: fallback_level_1 }
    - { name: licence_and_similarity_scan, timeout_ms: 267, on_timeout: fallback_level_1 }
    - { name: merge_gate, timeout_ms: 267, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Defects in AI-assisted changes"
    - "Review time"
    - "Licence findings"
privacy:
  pii_in_logs: false
  retention_days: 400
