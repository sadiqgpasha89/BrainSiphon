serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: event_ingestion, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: aggregation_to_team_level, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: metric_computation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: trend_explanation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: team_dashboard, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: team_retrospectives, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Lead time"
    - "Change failure rate"
    - "Team satisfaction with metrics"
privacy:
  pii_in_logs: false
  retention_days: 400
