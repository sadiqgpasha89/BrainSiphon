serving:
  deadline_ms: 2500
  stages:
    - { name: failure_event, timeout_ms: 186, on_timeout: fallback_level_1 }
    - { name: log_parsing_and_first_error, timeout_ms: 185, on_timeout: fallback_level_1 }
    - { name: change_and_history_retrieval, timeout_ms: 556, on_timeout: fallback_level_1 }
    - { name: diagnosis, timeout_ms: 742, on_timeout: fallback_level_1 }
    - { name: comment_on_pull_request, timeout_ms: 278, on_timeout: fallback_level_1 }
    - { name: accuracy_tracking, timeout_ms: 278, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to fix a broken build"
    - "Re-run rate"
    - "Builds blocked on one cause"
privacy:
  pii_in_logs: false
  retention_days: 400
