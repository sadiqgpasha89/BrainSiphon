serving:
  deadline_ms: 2500
  stages:
    - { name: draft_issue_text, timeout_ms: 405, on_timeout: fallback_level_1 }
    - { name: embedding_and_signature_search, timeout_ms: 303, on_timeout: fallback_level_1 }
    - { name: candidate_ranking, timeout_ms: 303, on_timeout: fallback_level_1 }
    - { name: suggestion_display, timeout_ms: 405, on_timeout: fallback_level_1 }
    - { name: maintainer_confirmation, timeout_ms: 405, on_timeout: fallback_level_1 }
    - { name: link_creation, timeout_ms: 404, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Duplicate issues filed"
    - "Time to first fix"
    - "Triage effort"
privacy:
  pii_in_logs: false
  retention_days: 400
