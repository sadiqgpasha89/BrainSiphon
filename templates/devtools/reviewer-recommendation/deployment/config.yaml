serving:
  deadline_ms: 2500
  stages:
    - { name: pull_request_event, timeout_ms: 202, on_timeout: fallback_level_1 }
    - { name: ownership_and_expertise_graph, timeout_ms: 405, on_timeout: fallback_level_1 }
    - { name: availability_and_load_lookup, timeout_ms: 304, on_timeout: fallback_level_1 }
    - { name: ranker, timeout_ms: 809, on_timeout: fallback_level_1 }
    - { name: suggestion_display, timeout_ms: 303, on_timeout: fallback_level_1 }
    - { name: author_choice_captured, timeout_ms: 202, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to first review"
    - "Review load balance"
    - "Knowledge spread"
privacy:
  pii_in_logs: false
  retention_days: 400
