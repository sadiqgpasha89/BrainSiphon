serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: coverage_gap_analysis, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: test_drafting, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: compile_and_run_in_sandbox, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: mutation_check, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: pull_request, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: flake_monitoring, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Coverage of critical code"
    - "Escaped defects"
    - "Test maintenance cost"
privacy:
  pii_in_logs: false
  retention_days: 400
