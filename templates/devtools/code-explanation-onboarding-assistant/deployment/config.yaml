serving:
  deadline_ms: 2500
  stages:
    - { name: question_intake, timeout_ms: 202, on_timeout: fallback_level_1 }
    - { name: permission_check, timeout_ms: 304, on_timeout: fallback_level_1 }
    - { name: hybrid_retrieval, timeout_ms: 607, on_timeout: fallback_level_1 }
    - { name: answer_with_links, timeout_ms: 809, on_timeout: fallback_level_1 }
    - { name: ownership_lookup, timeout_ms: 303, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to first contribution"
    - "Questions to senior engineers"
    - "Docs updated after feedback"
privacy:
  pii_in_logs: false
  retention_days: 400
