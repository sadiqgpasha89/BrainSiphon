serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: build_event_ingestion, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: critical_path_analysis, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: duration_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: recommendation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: output_hash_validation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: pull_request_with_change, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: savings_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Median build time"
    - "Cache hit rate"
    - "Compute cost"
privacy:
  pii_in_logs: false
  retention_days: 400
