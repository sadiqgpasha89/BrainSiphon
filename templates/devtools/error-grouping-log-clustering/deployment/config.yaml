serving:
  deadline_ms: 2500
  stages:
    - { name: event_ingestion, timeout_ms: 154, on_timeout: fallback_level_1 }
    - { name: masking_and_normalisation, timeout_ms: 153, on_timeout: fallback_level_1 }
    - { name: grouping, timeout_ms: 230, on_timeout: fallback_level_1 }
    - { name: group_assignment, timeout_ms: 230, on_timeout: fallback_level_1 }
    - { name: impact_ranking, timeout_ms: 614, on_timeout: fallback_level_1 }
    - { name: issue_creation, timeout_ms: 614, on_timeout: fallback_level_1 }
    - { name: regression_flag, timeout_ms: 230, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Distinct issues to review"
    - "Time to find a regression"
    - "Alert noise"
privacy:
  pii_in_logs: false
  retention_days: 400
