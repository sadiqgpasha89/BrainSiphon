serving:
  deadline_ms: 2500
  stages:
    - { name: repository_gateway, timeout_ms: 202, on_timeout: fallback_level_1 }
    - { name: branch_tier_decision, timeout_ms: 202, on_timeout: fallback_level_1 }
    - { name: codeowner_approval, timeout_ms: 304, on_timeout: fallback_level_1 }
    - { name: change_ledger, timeout_ms: 405, on_timeout: fallback_level_1 }
    - { name: push_monitor, timeout_ms: 809, on_timeout: fallback_level_1 }
    - { name: session_replay_console, timeout_ms: 303, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Unsafe pushes stopped at the gateway"
    - "Production incidents traced to agent changes"
    - "Minutes to answer a reviewer replay request"
privacy:
  pii_in_logs: false
  retention_days: 400
