serving:
  deadline_ms: 2500
  stages:
    - { name: question_intake, timeout_ms: 194, on_timeout: fallback_level_1 }
    - { name: entity_resolution, timeout_ms: 290, on_timeout: fallback_level_1 }
    - { name: query_generation, timeout_ms: 774, on_timeout: fallback_level_1 }
    - { name: permission_and_cost_check, timeout_ms: 194, on_timeout: fallback_level_1 }
    - { name: query_run, timeout_ms: 290, on_timeout: fallback_level_1 }
    - { name: result_validation, timeout_ms: 193, on_timeout: fallback_level_1 }
    - { name: answer_with_query, timeout_ms: 290, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Analyst requests"
    - "Time to answer"
    - "Disputes about numbers"
privacy:
  pii_in_logs: false
  retention_days: 400
