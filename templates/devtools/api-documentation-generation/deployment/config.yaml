serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: schema_extraction, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: description_draft, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: example_generation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: example_execution, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: pull_request, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: docs_publish, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Doc freshness"
    - "Support questions about APIs"
    - "Time to document a change"
privacy:
  pii_in_logs: false
  retention_days: 400
