serving:
  deadline_ms: 2500
  stages:
    - { name: job_intake, timeout_ms: 154, on_timeout: fallback_level_1 }
    - { name: duration_prediction, timeout_ms: 614, on_timeout: fallback_level_1 }
    - { name: priority_and_fairness_rules, timeout_ms: 153, on_timeout: fallback_level_1 }
    - { name: packing_and_scaling, timeout_ms: 614, on_timeout: fallback_level_1 }
    - { name: runner_allocation, timeout_ms: 230, on_timeout: fallback_level_1 }
    - { name: metrics, timeout_ms: 230, on_timeout: fallback_level_1 }
    - { name: simulation_test, timeout_ms: 230, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Median wait time"
    - "Compute cost"
    - "Release build delays"
privacy:
  pii_in_logs: false
  retention_days: 400
