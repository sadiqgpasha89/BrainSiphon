serving:
  deadline_ms: 2500
  stages:
    - { name: pull_request_event, timeout_ms: 159, on_timeout: fallback_level_1 }
    - { name: analyser_run, timeout_ms: 238, on_timeout: fallback_level_1 }
    - { name: context_retrieval, timeout_ms: 477, on_timeout: fallback_level_1 }
    - { name: comment_drafting, timeout_ms: 636, on_timeout: fallback_level_1 }
    - { name: confidence_filter, timeout_ms: 159, on_timeout: fallback_level_1 }
    - { name: comment_posting, timeout_ms: 238, on_timeout: fallback_level_1 }
    - { name: acceptance_tracking, timeout_ms: 318, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Bugs found before merge"
    - "Review cycle time"
    - "Comments dismissed as noise"
privacy:
  pii_in_logs: false
  retention_days: 400
