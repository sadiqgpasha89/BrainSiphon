serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: update_discovery, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: changelog_and_api_diff_analysis, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: code_adaptation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: sandbox_tests, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: pull_request_with_risks, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: rollout_monitoring, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to fix vulnerable dependencies"
    - "Dependency age"
    - "Incidents from updates"
privacy:
  pii_in_logs: false
  retention_days: 400
