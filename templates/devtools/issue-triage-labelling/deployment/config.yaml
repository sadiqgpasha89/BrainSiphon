serving:
  deadline_ms: 2500
  stages:
    - { name: issue_intake, timeout_ms: 660, on_timeout: fallback_level_1 }
    - { name: text_and_trace_parsing, timeout_ms: 247, on_timeout: fallback_level_1 }
    - { name: label_classifier, timeout_ms: 659, on_timeout: fallback_level_1 }
    - { name: security_rule_layer, timeout_ms: 165, on_timeout: fallback_level_1 }
    - { name: owner_suggestion, timeout_ms: 247, on_timeout: fallback_level_1 }
    - { name: accuracy_tracking, timeout_ms: 247, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to first response"
    - "Misrouted issues"
    - "Maintainer triage time"
privacy:
  pii_in_logs: false
  retention_days: 400
