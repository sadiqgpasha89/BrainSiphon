serving:
  deadline_ms: 2500
  stages:
    - { name: deployment_request, timeout_ms: 257, on_timeout: fallback_level_1 }
    - { name: feature_build, timeout_ms: 342, on_timeout: fallback_level_1 }
    - { name: repository_risk_model, timeout_ms: 684, on_timeout: fallback_level_1 }
    - { name: repository_calibration, timeout_ms: 257, on_timeout: fallback_level_1 }
    - { name: repository_policy_mapping, timeout_ms: 171, on_timeout: fallback_level_1 }
    - { name: rollout_strategy, timeout_ms: 257, on_timeout: fallback_level_1 }
    - { name: repository_outcome_tracking, timeout_ms: 257, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Change failure rate"
    - "Time to deploy safe changes"
    - "Incidents from deployments"
privacy:
  pii_in_logs: false
  retention_days: 400
