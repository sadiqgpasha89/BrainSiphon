serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: dependency_and_file_scan, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: licence_identification, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: policy_mapping, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: sbom_generation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: merge_gate, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Releases with licence issues"
    - "Legal review time"
    - "Audit findings"
privacy:
  pii_in_logs: false
  retention_days: 400
