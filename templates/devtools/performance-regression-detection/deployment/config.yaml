serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: benchmark_ingestion, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: noise_modelling, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: change_point_detection, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: bisection, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: ticket_with_evidence, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: accuracy_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Regressions caught before release"
    - "Time to culprit"
    - "Performance incidents"
privacy:
  pii_in_logs: false
  retention_days: 400
