serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: test_result_ingestion, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: flip_detection, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: cause_hints, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: quarantine_decision, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: owner_ticket, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: dashboards, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outcome_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Reruns per pipeline"
    - "CI trust surveys"
    - "Time to fix flakes"
privacy:
  pii_in_logs: false
  retention_days: 400
