serving:
  deadline_ms: 2500
  stages:
    - { name: task_start, timeout_ms: 636, on_timeout: fallback_level_1 }
    - { name: sandbox_provisioning, timeout_ms: 636, on_timeout: fallback_level_1 }
    - { name: credential_issuance, timeout_ms: 238, on_timeout: fallback_level_1 }
    - { name: policy_enforcement, timeout_ms: 159, on_timeout: fallback_level_1 }
    - { name: command_and_network_logging, timeout_ms: 318, on_timeout: fallback_level_1 }
    - { name: teardown, timeout_ms: 238, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Agent sessions without incidents"
    - "Blocked egress attempts"
    - "Credential exposure events"
privacy:
  pii_in_logs: false
  retention_days: 400
