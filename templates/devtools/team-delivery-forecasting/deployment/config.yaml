serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: work_item_history, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: distribution_fitting, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: monte_carlo_simulation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: scope_change_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: range_output, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: accuracy_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Missed delivery dates"
    - "Planning surprises"
    - "Time spent estimating"
privacy:
  pii_in_logs: false
  retention_days: 400
