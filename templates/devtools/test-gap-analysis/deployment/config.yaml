serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: coverage_and_change_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: risk_join, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: gap_ranking, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: test_suggestions, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: team_backlog, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: progress_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Escaped defects in high-churn code"
    - "Coverage of risky code"
    - "Test effort per defect avoided"
privacy:
  pii_in_logs: false
  retention_days: 400
