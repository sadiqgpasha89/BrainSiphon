serving:
  deadline_ms: 2500
  stages:
    - { name: confirmed_finding_intake, timeout_ms: 495, on_timeout: fallback_level_1 }
    - { name: code_context_retrieval, timeout_ms: 371, on_timeout: fallback_level_1 }
    - { name: fix_proposal, timeout_ms: 495, on_timeout: fallback_level_1 }
    - { name: test_generation_and_run, timeout_ms: 494, on_timeout: fallback_level_1 }
    - { name: pull_request, timeout_ms: 185, on_timeout: fallback_level_1 }
    - { name: closure_verification, timeout_ms: 185, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to fix"
    - "Fixes accepted"
    - "Security regressions"
privacy:
  pii_in_logs: false
  retention_days: 400
