serving:
  deadline_ms: 2500
  stages:
    - { name: push_and_commit_capture, timeout_ms: 135, on_timeout: fallback_level_1 }
    - { name: candidate_detection, timeout_ms: 405, on_timeout: fallback_level_1 }
    - { name: context_classifier, timeout_ms: 540, on_timeout: fallback_level_1 }
    - { name: live_validation, timeout_ms: 202, on_timeout: fallback_level_1 }
    - { name: block_or_allow, timeout_ms: 202, on_timeout: fallback_level_1 }
    - { name: rotation_ticket, timeout_ms: 539, on_timeout: fallback_level_1 }
    - { name: history_scan, timeout_ms: 202, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Live secrets leaked"
    - "Time to rotate"
    - "Developer friction from false blocks"
privacy:
  pii_in_logs: false
  retention_days: 400
