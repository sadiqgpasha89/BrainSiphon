serving:
  deadline_ms: 2500
  stages:
    - { name: metric_collection, timeout_ms: 393, on_timeout: fallback_level_1 }
    - { name: traffic_matching, timeout_ms: 393, on_timeout: fallback_level_1 }
    - { name: statistical_comparison, timeout_ms: 393, on_timeout: fallback_level_1 }
    - { name: recommendation, timeout_ms: 262, on_timeout: fallback_level_1 }
    - { name: release_owner_confirmation, timeout_ms: 392, on_timeout: fallback_level_1 }
    - { name: action, timeout_ms: 392, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Bad releases caught in canary"
    - "Rollbacks after full rollout"
    - "Time in rollout"
privacy:
  pii_in_logs: false
  retention_days: 400
