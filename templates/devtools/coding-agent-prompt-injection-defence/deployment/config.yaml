serving:
  deadline_ms: 2500
  stages:
    - { name: untrusted_input_tagging, timeout_ms: 614, on_timeout: fallback_level_1 }
    - { name: injection_detector, timeout_ms: 614, on_timeout: fallback_level_1 }
    - { name: taint_tracking, timeout_ms: 614, on_timeout: fallback_level_1 }
    - { name: tool_risk_gate, timeout_ms: 153, on_timeout: fallback_level_1 }
    - { name: red_team_replay, timeout_ms: 230, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Blocked injection attempts"
    - "Successful attacks"
    - "Approval rate on risky calls"
privacy:
  pii_in_logs: false
  retention_days: 400
