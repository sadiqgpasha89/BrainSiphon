serving:
  deadline_ms: 80
  stages:
    - { name: editor_context_capture, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: repository_retrieval, timeout_ms: 12, on_timeout: fallback_level_1 }
    - { name: completion_model, timeout_ms: 16, on_timeout: fallback_level_1 }
    - { name: secret_and_licence_filter, timeout_ms: 4, on_timeout: fallback_level_1 }
    - { name: suggestion_display, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: acceptance_and_retention_metrics, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: model_evaluation, timeout_ms: 16, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Retained accepted code"
    - "Time to complete tasks"
    - "Defects in suggested code"
privacy:
  pii_in_logs: false
  retention_days: 400
