serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: release_scope_query, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: grouping_and_labelling, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: note_drafting, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: filter_for_internal_and_embargoed_text, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: publication, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to publish notes"
    - "Support tickets about changes"
    - "Missed breaking changes"
privacy:
  pii_in_logs: false
  retention_days: 400
