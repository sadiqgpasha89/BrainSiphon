serving:
  deadline_ms: 2500
  stages:
    - { name: test_failure_intake, timeout_ms: 234, on_timeout: fallback_level_1 }
    - { name: failure_type_check, timeout_ms: 234, on_timeout: fallback_level_1 }
    - { name: candidate_search, timeout_ms: 703, on_timeout: fallback_level_1 }
    - { name: proposed_fix, timeout_ms: 352, on_timeout: fallback_level_1 }
    - { name: engineer_approval, timeout_ms: 351, on_timeout: fallback_level_1 }
    - { name: re_run, timeout_ms: 351, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Test maintenance hours"
    - "Escaped regressions"
    - "Healed failures later found to be bugs"
privacy:
  pii_in_logs: false
  retention_days: 400
