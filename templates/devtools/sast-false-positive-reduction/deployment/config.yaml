serving:
  deadline_ms: 2500
  stages:
    - { name: finding_intake, timeout_ms: 234, on_timeout: fallback_level_1 }
    - { name: feature_build, timeout_ms: 469, on_timeout: fallback_level_1 }
    - { name: ranker, timeout_ms: 937, on_timeout: fallback_level_1 }
    - { name: threshold_policy, timeout_ms: 234, on_timeout: fallback_level_1 }
    - { name: developer_view, timeout_ms: 351, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Alerts per pull request"
    - "True vulnerabilities missed"
    - "Developer dismissal rate"
privacy:
  pii_in_logs: false
  retention_days: 400
