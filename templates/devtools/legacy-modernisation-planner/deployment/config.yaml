serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: code_ingestion, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: parsing_and_graph_build, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: rule_extraction, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: characterisation_tests, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: slice_planning, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: progress_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Analysis time"
    - "Slices delivered"
    - "Production defects in migrated slices"
privacy:
  pii_in_logs: false
  retention_days: 400
