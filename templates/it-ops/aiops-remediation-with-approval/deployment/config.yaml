serving:
  deadline_ms: 2500
  stages:
    - { name: incident_pattern_match, timeout_ms: 304, on_timeout: fallback_level_1 }
    - { name: pre_checks, timeout_ms: 304, on_timeout: fallback_level_1 }
    - { name: approval_by_tier, timeout_ms: 303, on_timeout: fallback_level_1 }
    - { name: step_execution, timeout_ms: 303, on_timeout: fallback_level_1 }
    - { name: post_checks, timeout_ms: 303, on_timeout: fallback_level_1 }
    - { name: rollback_on_failure, timeout_ms: 303, on_timeout: fallback_level_1 }
    - { name: execution_log, timeout_ms: 405, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Mean time to restore for known patterns"
    - "Failed remediations"
    - "Manual toil"
privacy:
  pii_in_logs: false
  retention_days: 400
