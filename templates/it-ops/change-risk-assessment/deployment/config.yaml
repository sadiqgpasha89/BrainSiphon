serving:
  deadline_ms: 2500
  stages:
    - { name: change_submission, timeout_ms: 257, on_timeout: fallback_level_1 }
    - { name: feature_build, timeout_ms: 342, on_timeout: fallback_level_1 }
    - { name: risk_model, timeout_ms: 684, on_timeout: fallback_level_1 }
    - { name: calibration, timeout_ms: 257, on_timeout: fallback_level_1 }
    - { name: policy_routing, timeout_ms: 171, on_timeout: fallback_level_1 }
    - { name: approval, timeout_ms: 257, on_timeout: fallback_level_1 }
    - { name: outcome_tracking, timeout_ms: 257, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Change failure rate"
    - "Time to approve low-risk changes"
    - "Incidents caused by changes"
privacy:
  pii_in_logs: false
  retention_days: 400
