serving:
  deadline_ms: 2500
  stages:
    - { name: plan_generation, timeout_ms: 989, on_timeout: fallback_level_1 }
    - { name: plan_parsing, timeout_ms: 247, on_timeout: fallback_level_1 }
    - { name: policy_and_cost_checks, timeout_ms: 247, on_timeout: fallback_level_1 }
    - { name: blast_radius_lookup, timeout_ms: 371, on_timeout: fallback_level_1 }
    - { name: apply, timeout_ms: 371, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Incidents from infrastructure changes"
    - "Review time"
    - "Policy violations merged"
privacy:
  pii_in_logs: false
  retention_days: 400
