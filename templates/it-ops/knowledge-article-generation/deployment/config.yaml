serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: candidate_ticket_selection, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: redaction, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: article_drafting, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: duplicate_check, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: publication, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Knowledge coverage of top issues"
    - "Deflection rate"
    - "Articles with negative feedback"
privacy:
  pii_in_logs: false
  retention_days: 400
