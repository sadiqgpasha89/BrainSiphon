serving:
  deadline_ms: 2500
  stages:
    - { name: event_and_content_capture, timeout_ms: 212, on_timeout: fallback_level_1 }
    - { name: classification, timeout_ms: 847, on_timeout: fallback_level_1 }
    - { name: policy_decision, timeout_ms: 212, on_timeout: fallback_level_1 }
    - { name: warn_block_or_allow, timeout_ms: 318, on_timeout: fallback_level_1 }
    - { name: user_justification, timeout_ms: 318, on_timeout: fallback_level_1 }
    - { name: metadata_alert, timeout_ms: 318, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Sensitive data leaving the company"
    - "False blocks"
    - "Policy exceptions"
privacy:
  pii_in_logs: false
  retention_days: 400
