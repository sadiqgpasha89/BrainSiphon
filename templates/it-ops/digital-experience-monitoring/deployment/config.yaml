serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: experience_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: aggregation_to_groups, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: index_computation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: cause_attribution, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: service_owner_dashboard, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: fix_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Experience index"
    - "Tickets per user"
    - "Time to fix systemic issues"
privacy:
  pii_in_logs: false
  retention_days: 400
