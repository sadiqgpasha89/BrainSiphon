serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: utilisation_collection, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: percentile_and_season_analysis, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: option_pricing, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: risk_tier, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: pull_request, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: owner_approval, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: savings_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Realised savings"
    - "Incidents after rightsizing"
    - "Resources oversized"
privacy:
  pii_in_logs: false
  retention_days: 400
