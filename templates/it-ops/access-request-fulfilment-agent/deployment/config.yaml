serving:
  deadline_ms: 2500
  stages:
    - { name: request_intake, timeout_ms: 223, on_timeout: fallback_level_1 }
    - { name: policy_and_role_check, timeout_ms: 222, on_timeout: fallback_level_1 }
    - { name: separation_of_duty_check, timeout_ms: 222, on_timeout: fallback_level_1 }
    - { name: approval_routing, timeout_ms: 334, on_timeout: fallback_level_1 }
    - { name: provisioning, timeout_ms: 890, on_timeout: fallback_level_1 }
    - { name: confirmation, timeout_ms: 334, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Fulfilment time"
    - "Manual handling share"
    - "Access violations found in review"
privacy:
  pii_in_logs: false
  retention_days: 400
