serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: incident_close_event, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: timeline_assembly, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: factor_and_action_drafting, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: blame_language_check, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: publication, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: action_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to publish a postmortem"
    - "Action item completion"
    - "Repeat incidents"
privacy:
  pii_in_logs: false
  retention_days: 400
