serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: resource_and_setting_collection, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: rule_evaluation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: exposure_and_data_join, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: priority_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: fix_pull_request, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: closure_check, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Exposed critical resources"
    - "Time to fix"
    - "Repeat findings"
privacy:
  pii_in_logs: false
  retention_days: 400
