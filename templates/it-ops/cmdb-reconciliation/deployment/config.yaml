serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: discovery_and_cloud_ingest, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: entity_matching, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: dependency_inference, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: merge_and_update, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: data_quality_dashboard, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "CMDB accuracy"
    - "Incidents with wrong owner"
    - "Time to find dependencies"
privacy:
  pii_in_logs: false
  retention_days: 400
