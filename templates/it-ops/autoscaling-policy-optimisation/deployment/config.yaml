serving:
  deadline_ms: 2500
  stages:
    - { name: traffic_replay, timeout_ms: 247, on_timeout: fallback_level_1 }
    - { name: simulator, timeout_ms: 660, on_timeout: fallback_level_1 }
    - { name: policy_search, timeout_ms: 659, on_timeout: fallback_level_1 }
    - { name: guardrail_check, timeout_ms: 165, on_timeout: fallback_level_1 }
    - { name: staged_rollout, timeout_ms: 247, on_timeout: fallback_level_1 }
    - { name: latency_watch, timeout_ms: 247, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Latency target attainment"
    - "Compute cost"
    - "Scaling incidents"
privacy:
  pii_in_logs: false
  retention_days: 400
