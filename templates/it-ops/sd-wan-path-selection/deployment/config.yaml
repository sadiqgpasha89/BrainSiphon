serving:
  deadline_ms: 80
  stages:
    - { name: probe_data, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: quality_forecast, timeout_ms: 30, on_timeout: fallback_level_1 }
    - { name: policy_and_cost_rules, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: path_decision, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: hold_time_check, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: quality_tracking, timeout_ms: 11, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Application quality complaints"
    - "WAN cost"
    - "Failover time"
privacy:
  pii_in_logs: false
  retention_days: 400
