serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: billing_line_ingestion, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: tag_and_owner_join, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: baseline_and_deviation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: cause_attribution, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: owner_alert, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Cost spikes caught before month end"
    - "Waste recovered"
    - "Time to owner response"
privacy:
  pii_in_logs: false
  retention_days: 400
