serving:
  deadline_ms: 2500
  stages:
    - { name: open_ticket_stream, timeout_ms: 222, on_timeout: fallback_level_1 }
    - { name: feature_build, timeout_ms: 445, on_timeout: fallback_level_1 }
    - { name: breach_model, timeout_ms: 890, on_timeout: fallback_level_1 }
    - { name: calibration, timeout_ms: 334, on_timeout: fallback_level_1 }
    - { name: rebalancing, timeout_ms: 334, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "SLA breaches"
    - "Breaches caught early"
    - "Overtime hours"
privacy:
  pii_in_logs: false
  retention_days: 400
