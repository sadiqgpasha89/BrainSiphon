serving:
  deadline_ms: 2500
  stages:
    - { name: metric_ingestion, timeout_ms: 185, on_timeout: fallback_level_1 }
    - { name: seasonal_baseline_fit, timeout_ms: 742, on_timeout: fallback_level_1 }
    - { name: anomaly_scoring, timeout_ms: 742, on_timeout: fallback_level_1 }
    - { name: multi_metric_confirmation, timeout_ms: 185, on_timeout: fallback_level_1 }
    - { name: alert_with_context, timeout_ms: 371, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Incidents detected by anomaly"
    - "Alert precision"
    - "Customer-reported outages"
privacy:
  pii_in_logs: false
  retention_days: 400
