serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: request_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: traffic_forecast_lookup, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: conflict_and_dependency_check, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: window_scoring, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: proposal_to_owner, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: notification, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "User impact during maintenance"
    - "Change conflicts"
    - "Overrun rate"
privacy:
  pii_in_logs: false
  retention_days: 400
