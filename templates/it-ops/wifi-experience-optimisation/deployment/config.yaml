serving:
  deadline_ms: 2500
  stages:
    - { name: controller_telemetry, timeout_ms: 159, on_timeout: fallback_level_1 }
    - { name: aggregation_to_access_point, timeout_ms: 318, on_timeout: fallback_level_1 }
    - { name: experience_model, timeout_ms: 636, on_timeout: fallback_level_1 }
    - { name: change_proposal, timeout_ms: 636, on_timeout: fallback_level_1 }
    - { name: staged_rollout, timeout_ms: 238, on_timeout: fallback_level_1 }
    - { name: experience_check, timeout_ms: 238, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Wi-Fi tickets"
    - "Connection success rate"
    - "Throughput at peak"
privacy:
  pii_in_logs: false
  retention_days: 400
