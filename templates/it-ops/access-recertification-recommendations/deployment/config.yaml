serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: entitlement_extraction, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: usage_and_peer_analysis, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: recommendation_ranking, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: revocation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outcome_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Excess access removed"
    - "Review completion time"
    - "Audit findings"
privacy:
  pii_in_logs: false
  retention_days: 400
