serving:
  deadline_ms: 2500
  stages:
    - { name: sensor_data, timeout_ms: 154, on_timeout: fallback_level_1 }
    - { name: simulator_calibration, timeout_ms: 614, on_timeout: fallback_level_1 }
    - { name: policy_search, timeout_ms: 614, on_timeout: fallback_level_1 }
    - { name: limit_check, timeout_ms: 153, on_timeout: fallback_level_1 }
    - { name: engineer_approval, timeout_ms: 230, on_timeout: fallback_level_1 }
    - { name: set_point_change, timeout_ms: 230, on_timeout: fallback_level_1 }
    - { name: energy_tracking, timeout_ms: 230, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Power usage effectiveness"
    - "Temperature excursions"
    - "Cooling energy"
privacy:
  pii_in_logs: false
  retention_days: 400
