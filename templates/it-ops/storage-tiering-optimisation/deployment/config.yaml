serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: access_log_ingestion, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: feature_build, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: access_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: retention_check, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: lifecycle_rule_proposal, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: owner_approval, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: savings_and_retrieval_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Storage cost"
    - "Retrieval delays"
    - "Rule violations"
privacy:
  pii_in_logs: false
  retention_days: 400
