serving:
  deadline_ms: 2500
  stages:
    - { name: alert_context, timeout_ms: 387, on_timeout: fallback_level_1 }
    - { name: runbook_retrieval, timeout_ms: 580, on_timeout: fallback_level_1 }
    - { name: applicability_filter, timeout_ms: 194, on_timeout: fallback_level_1 }
    - { name: step_summary_with_links, timeout_ms: 774, on_timeout: fallback_level_1 }
    - { name: responder_questions, timeout_ms: 290, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to find a runbook"
    - "Escalations from missing procedures"
    - "Runbook coverage"
privacy:
  pii_in_logs: false
  retention_days: 400
