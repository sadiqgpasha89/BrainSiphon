serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: device_telemetry, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: feature_build, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: failure_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: calibration, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: employee_notice, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: repair_task, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outcome_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Unplanned device failures"
    - "Time without a device"
    - "Employee satisfaction"
privacy:
  pii_in_logs: false
  retention_days: 400
