serving:
  deadline_ms: 2500
  stages:
    - { name: ticket_intake, timeout_ms: 171, on_timeout: fallback_level_1 }
    - { name: text_parsing, timeout_ms: 257, on_timeout: fallback_level_1 }
    - { name: category_and_team_classifier, timeout_ms: 685, on_timeout: fallback_level_1 }
    - { name: urgency_rules, timeout_ms: 171, on_timeout: fallback_level_1 }
    - { name: routing, timeout_ms: 257, on_timeout: fallback_level_1 }
    - { name: agent_override, timeout_ms: 684, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Reassignment rate"
    - "Time to first touch"
    - "Resolution time"
privacy:
  pii_in_logs: false
  retention_days: 400
