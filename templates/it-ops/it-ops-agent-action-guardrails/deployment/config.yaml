serving:
  deadline_ms: 2500
  stages:
    - { name: automation_broker, timeout_ms: 290, on_timeout: fallback_level_1 }
    - { name: change_tier_decision, timeout_ms: 194, on_timeout: fallback_level_1 }
    - { name: owner_approval, timeout_ms: 290, on_timeout: fallback_level_1 }
    - { name: command_log, timeout_ms: 387, on_timeout: fallback_level_1 }
    - { name: behaviour_monitor, timeout_ms: 774, on_timeout: fallback_level_1 }
    - { name: command_replay_console, timeout_ms: 290, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Risky commands stopped before execution"
    - "Outages traced to agent changes"
    - "Minutes to find what ran on a host"
privacy:
  pii_in_logs: false
  retention_days: 400
