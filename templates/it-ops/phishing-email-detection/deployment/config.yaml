serving:
  deadline_ms: 2500
  stages:
    - { name: message_intake, timeout_ms: 262, on_timeout: fallback_level_1 }
    - { name: authentication_and_link_checks, timeout_ms: 392, on_timeout: fallback_level_1 }
    - { name: content_and_sender_model, timeout_ms: 1047, on_timeout: fallback_level_1 }
    - { name: verdict_tier, timeout_ms: 262, on_timeout: fallback_level_1 }
    - { name: quarantine_or_deliver, timeout_ms: 262, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Phishing reaching inboxes"
    - "Time to remove campaigns"
    - "User reports handled"
privacy:
  pii_in_logs: false
  retention_days: 400
