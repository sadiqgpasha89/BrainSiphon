serving:
  deadline_ms: 2500
  stages:
    - { name: log_ingestion, timeout_ms: 144, on_timeout: fallback_level_1 }
    - { name: masking, timeout_ms: 574, on_timeout: fallback_level_1 }
    - { name: template_extraction, timeout_ms: 144, on_timeout: fallback_level_1 }
    - { name: frequency_and_novelty_scoring, timeout_ms: 574, on_timeout: fallback_level_1 }
    - { name: ranked_anomalies, timeout_ms: 574, on_timeout: fallback_level_1 }
    - { name: baseline_refresh, timeout_ms: 215, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Faults found from logs"
    - "Time to detect"
    - "Investigation time"
privacy:
  pii_in_logs: false
  retention_days: 400
