serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: hr_event_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: role_delta_calculation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: task_plan, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: low_risk_provisioning, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: approval_for_sensitive_steps, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: verification, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Orphaned accounts"
    - "Time to full access on day one"
    - "Audit findings on leavers"
privacy:
  pii_in_logs: false
  retention_days: 400
