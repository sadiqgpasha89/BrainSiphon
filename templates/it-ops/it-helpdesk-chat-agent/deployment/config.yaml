serving:
  deadline_ms: 2500
  stages:
    - { name: chat_intake, timeout_ms: 178, on_timeout: fallback_level_1 }
    - { name: identity_check, timeout_ms: 267, on_timeout: fallback_level_1 }
    - { name: intent_and_retrieval, timeout_ms: 534, on_timeout: fallback_level_1 }
    - { name: guided_answer, timeout_ms: 712, on_timeout: fallback_level_1 }
    - { name: ticket_on_failure, timeout_ms: 267, on_timeout: fallback_level_1 }
    - { name: outcome_survey, timeout_ms: 267, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Chat resolution rate"
    - "Ticket volume"
    - "Employee satisfaction"
privacy:
  pii_in_logs: false
  retention_days: 400
