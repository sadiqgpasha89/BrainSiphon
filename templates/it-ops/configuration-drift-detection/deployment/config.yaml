serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: state_collection, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: baseline_diff, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: change_record_match, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: risk_classification, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: revert_pull_request, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: drift_trend, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Unmanaged drift"
    - "Time to reconcile"
    - "Incidents from drift"
privacy:
  pii_in_logs: false
  retention_days: 400
