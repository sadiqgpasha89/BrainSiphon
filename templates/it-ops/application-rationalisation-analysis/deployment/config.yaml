serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: inventory_and_usage, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: cost_join, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: functional_clustering, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: option_scoring, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: migration_plan, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: savings_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Application count"
    - "Run cost"
    - "Security exposure from unsupported applications"
privacy:
  pii_in_logs: false
  retention_days: 400
