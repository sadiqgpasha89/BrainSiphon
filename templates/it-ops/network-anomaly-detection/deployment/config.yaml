serving:
  deadline_ms: 2500
  stages:
    - { name: telemetry_and_flow_ingestion, timeout_ms: 139, on_timeout: fallback_level_1 }
    - { name: baseline_fit, timeout_ms: 556, on_timeout: fallback_level_1 }
    - { name: anomaly_scoring, timeout_ms: 556, on_timeout: fallback_level_1 }
    - { name: fault_or_security_classification, timeout_ms: 556, on_timeout: fallback_level_1 }
    - { name: routing, timeout_ms: 209, on_timeout: fallback_level_1 }
    - { name: baseline_refresh, timeout_ms: 209, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Network incidents detected early"
    - "Time to isolate faults"
    - "Alerts per site"
privacy:
  pii_in_logs: false
  retention_days: 400
