serving:
  deadline_ms: 2500
  stages:
    - { name: trace_capture, timeout_ms: 139, on_timeout: fallback_level_1 }
    - { name: redaction, timeout_ms: 556, on_timeout: fallback_level_1 }
    - { name: quality_sampling_and_scoring, timeout_ms: 556, on_timeout: fallback_level_1 }
    - { name: slo_calculation, timeout_ms: 209, on_timeout: fallback_level_1 }
    - { name: alerting, timeout_ms: 209, on_timeout: fallback_level_1 }
    - { name: model_and_prompt_change_gate, timeout_ms: 556, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Regressions caught before users"
    - "Cost per task"
    - "Safety events"
privacy:
  pii_in_logs: false
  retention_days: 400
