serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: inventory_and_activity_join, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: idle_scoring, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: dependency_check, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: owner_notice, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: stop_and_snapshot, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: delete_after_wait, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: savings_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Idle spend"
    - "Wrongly stopped systems"
    - "Time to clean"
privacy:
  pii_in_logs: false
  retention_days: 400
