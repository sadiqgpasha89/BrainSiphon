serving:
  deadline_ms: 2500
  stages:
    - { name: alert_intake, timeout_ms: 185, on_timeout: fallback_level_1 }
    - { name: context_enrichment, timeout_ms: 371, on_timeout: fallback_level_1 }
    - { name: priority_scoring, timeout_ms: 742, on_timeout: fallback_level_1 }
    - { name: investigation_summary, timeout_ms: 742, on_timeout: fallback_level_1 }
    - { name: rule_tuning, timeout_ms: 185, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Mean time to triage"
    - "Analyst time per alert"
    - "True incidents missed"
privacy:
  pii_in_logs: false
  retention_days: 400
