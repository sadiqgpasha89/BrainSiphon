serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: patch_and_vulnerability_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: exposure_join, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: priority_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: ring_plan, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: change_approval, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: rollout_with_health_gates, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to patch exploited flaws"
    - "Failed patch rollouts"
    - "Exposed unpatched systems"
privacy:
  pii_in_logs: false
  retention_days: 400
