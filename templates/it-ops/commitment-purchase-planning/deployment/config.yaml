serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: usage_history, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: baseline_estimate, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: scenario_simulation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: option_comparison, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: purchase, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: utilisation_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Commitment utilisation"
    - "Effective savings rate"
    - "Unused commitments"
privacy:
  pii_in_logs: false
  retention_days: 400
