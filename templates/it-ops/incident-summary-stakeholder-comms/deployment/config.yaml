serving:
  deadline_ms: 2500
  stages:
    - { name: update_request, timeout_ms: 257, on_timeout: fallback_level_1 }
    - { name: timeline_and_impact_retrieval, timeout_ms: 513, on_timeout: fallback_level_1 }
    - { name: draft_by_audience, timeout_ms: 685, on_timeout: fallback_level_1 }
    - { name: unconfirmed_claim_check, timeout_ms: 171, on_timeout: fallback_level_1 }
    - { name: publication, timeout_ms: 257, on_timeout: fallback_level_1 }
    - { name: update_log, timeout_ms: 342, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to first update"
    - "Update cadence adherence"
    - "Customer complaints about communication"
privacy:
  pii_in_logs: false
  retention_days: 400
