serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: task_curation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: platform_sandbox_run, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: automated_grading, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: platform_expert_sampling, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: platform_safety_check, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: platform_task_refresh, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Platform regressions caught before rollout"
    - "Cost per solved task"
    - "Agent changes shipped with evidence"
privacy:
  pii_in_logs: false
  retention_days: 400
