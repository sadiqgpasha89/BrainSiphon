serving:
  deadline_ms: 2500
  stages:
    - { name: incident_declared, timeout_ms: 290, on_timeout: fallback_level_1 }
    - { name: telemetry_and_change_retrieval, timeout_ms: 581, on_timeout: fallback_level_1 }
    - { name: onset_ordering_and_dependency_analysis, timeout_ms: 290, on_timeout: fallback_level_1 }
    - { name: hypothesis_ranking, timeout_ms: 774, on_timeout: fallback_level_1 }
    - { name: post_to_incident_channel, timeout_ms: 290, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to identify the cause"
    - "Mean time to restore"
    - "Misdiagnosed incidents"
privacy:
  pii_in_logs: false
  retention_days: 400
