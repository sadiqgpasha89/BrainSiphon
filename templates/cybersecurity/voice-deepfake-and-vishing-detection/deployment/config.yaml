serving:
  deadline_ms: 2500
  stages:
    - { name: call_audio_stream, timeout_ms: 111, on_timeout: fallback_level_1 }
    - { name: anti_spoofing_model, timeout_ms: 445, on_timeout: fallback_level_1 }
    - { name: streaming_asr_and_intent, timeout_ms: 445, on_timeout: fallback_level_1 }
    - { name: call_metadata_risk, timeout_ms: 445, on_timeout: fallback_level_1 }
    - { name: risk_fusion, timeout_ms: 167, on_timeout: fallback_level_1 }
    - { name: agent_alert_and_step_up, timeout_ms: 445, on_timeout: fallback_level_1 }
    - { name: confirmed_fraud, timeout_ms: 167, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Vishing losses"
    - "Step-up rate for genuine callers"
privacy:
  pii_in_logs: false
  retention_days: 400
