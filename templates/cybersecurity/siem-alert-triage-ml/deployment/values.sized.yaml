# Overrides for deployment/helm/ai-solution in the free BrainSiphon deployment kit, for SIEM Alert Triage & Prioritisation.
# Modelled sizing at 10M registered users. Replace with your measured peak, and set autoscaling bounds from a load test.
# Blueprint compute statement: 63 8-vCPU pods for 156,250 req/s (≈2,500 scores/s per pod (GBDT / small NN, features already in memory)); 6 online feature-store shards and 66 event-bus partitions.
replicaCount: 63   # modelled pods at peak, including failover headroom
resources:
  requests:
    cpu: '8000m'
  limits:
    cpu: '8000m'
