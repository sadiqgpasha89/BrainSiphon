serving:
  deadline_ms: 8
  stages:
    - { name: request_ingress, timeout_ms: 0.6, on_timeout: fallback_level_1 }
    - { name: normaliser, timeout_ms: 0.6, on_timeout: fallback_level_1 }
    - { name: rules_engine, timeout_ms: 0.6, on_timeout: fallback_level_1 }
    - { name: ml_scorer, timeout_ms: 2.5, on_timeout: fallback_level_1 }
    - { name: decision, timeout_ms: 0.6, on_timeout: fallback_level_1 }
    - { name: tuning_console, timeout_ms: 0.9, on_timeout: fallback_level_1 }
    - { name: attack_labels, timeout_ms: 0.9, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Blocked attack requests"
    - "False-block incidents"
privacy:
  pii_in_logs: false
  retention_days: 400
