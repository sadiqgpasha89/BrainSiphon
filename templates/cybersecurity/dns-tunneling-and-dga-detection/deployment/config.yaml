serving:
  deadline_ms: 80
  stages:
    - { name: dns_query_stream, timeout_ms: 18, on_timeout: fallback_level_1 }
    - { name: lexical_scorer, timeout_ms: 18, on_timeout: fallback_level_1 }
    - { name: client_aggregator, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: behaviour_model, timeout_ms: 18, on_timeout: fallback_level_1 }
    - { name: soc_alerts, timeout_ms: 7, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Blocked C2 domains"
    - "False blocks of legitimate services"
privacy:
  pii_in_logs: false
  retention_days: 400
