serving:
  deadline_ms: 80
  stages:
    - { name: signup_api, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: cohort_aggregator, timeout_ms: 13, on_timeout: fallback_level_1 }
    - { name: risk_model, timeout_ms: 26, on_timeout: fallback_level_1 }
    - { name: graph_cluster_lookup, timeout_ms: 13, on_timeout: fallback_level_1 }
    - { name: friction_policy, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: downstream_abuse_labels, timeout_ms: 6, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Fake account share after 30 days"
    - "Signup conversion"
privacy:
  pii_in_logs: false
  retention_days: 400
