serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: defang_and_extract, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: role_classifier, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: corroboration_scorer, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: confidence_with_decay, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: blocklist_publisher, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Detections from IOCs"
    - "Stale-IOC false blocks"
privacy:
  pii_in_logs: false
  retention_days: 400
