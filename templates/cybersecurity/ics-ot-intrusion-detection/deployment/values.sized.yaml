# Overrides for deployment/helm/ai-solution in the free BrainSiphon deployment kit, for ICS/OT Intrusion Detection.
# Modelled sizing at 10M registered users. Replace with your measured peak, and set autoscaling bounds from a load test.
# Blueprint compute statement: 1,407 8-vCPU pods for 1,125,000 req/s (≈800 scores/s per pod (cached neighbourhood embeddings + light head)); 38 online feature-store shards and 150 event-bus partitions.
replicaCount: 1407   # modelled pods at peak, including failover headroom
resources:
  requests:
    cpu: '8000m'
  limits:
    cpu: '8000m'
