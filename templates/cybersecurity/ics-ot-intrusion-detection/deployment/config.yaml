serving:
  deadline_ms: 80
  stages:
    - { name: span_or_tap_capture, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: protocol_dissector, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: communication_graph_model, timeout_ms: 20, on_timeout: fallback_level_1 }
    - { name: process_residual_model, timeout_ms: 19, on_timeout: fallback_level_1 }
    - { name: alert_correlation, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: ot_security_operator, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: incident_labels, timeout_ms: 7, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to detect OT anomalies"
    - "Operator disruption events"
privacy:
  pii_in_logs: false
  retention_days: 400
