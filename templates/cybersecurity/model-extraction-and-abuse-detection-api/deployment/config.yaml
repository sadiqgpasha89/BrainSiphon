serving:
  deadline_ms: 80
  stages:
    - { name: api_gateway, timeout_ms: 16, on_timeout: fallback_level_1 }
    - { name: query_embedding_logger, timeout_ms: 15, on_timeout: fallback_level_1 }
    - { name: behaviour_model, timeout_ms: 15, on_timeout: fallback_level_1 }
    - { name: account_graph_clustering, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: response_shaper, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: abuse_team, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: confirmed_incidents, timeout_ms: 6, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Extraction attempts blocked"
    - "Customer friction"
privacy:
  pii_in_logs: false
  retention_days: 400
