serving:
  deadline_ms: 80
  stages:
    - { name: flow_collectors, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: flow_aggregator, timeout_ms: 11, on_timeout: fallback_level_1 }
    - { name: role_aware_baseline, timeout_ms: 22, on_timeout: fallback_level_1 }
    - { name: anomaly_and_class_model, timeout_ms: 21, on_timeout: fallback_level_1 }
    - { name: alert_enrichment, timeout_ms: 11, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Mean time to detect"
    - "Analyst false-positive hours"
privacy:
  pii_in_logs: false
  retention_days: 400
