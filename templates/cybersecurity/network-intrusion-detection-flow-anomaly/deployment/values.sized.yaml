# Overrides for deployment/helm/ai-solution in the free BrainSiphon deployment kit, for Network Intrusion Detection via Flow Anomalies.
# Modelled sizing at 10M registered users. Replace with your measured peak, and set autoscaling bounds from a load test.
# Blueprint compute statement: 250 8-vCPU pods for 625,000 req/s (≈2,500 scores/s per pod (GBDT / small NN, features already in memory)); 21 online feature-store shards and 84 event-bus partitions.
replicaCount: 250   # modelled pods at peak, including failover headroom
resources:
  requests:
    cpu: '8000m'
  limits:
    cpu: '8000m'
