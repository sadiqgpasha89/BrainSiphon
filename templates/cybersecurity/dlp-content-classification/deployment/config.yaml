serving:
  deadline_ms: 80
  stages:
    - { name: content_capture, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: ocr_and_extraction, timeout_ms: 18, on_timeout: fallback_level_1 }
    - { name: detectors, timeout_ms: 18, on_timeout: fallback_level_1 }
    - { name: document_classifier, timeout_ms: 18, on_timeout: fallback_level_1 }
    - { name: policy_engine, timeout_ms: 4, on_timeout: fallback_level_1 }
    - { name: user_prompt_or_block, timeout_ms: 7, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Prevented leaks"
    - "User override rate"
privacy:
  pii_in_logs: false
  retention_days: 400
