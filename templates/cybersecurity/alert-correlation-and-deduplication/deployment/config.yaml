serving:
  deadline_ms: 80
  stages:
    - { name: alert_stream, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: entity_resolver, timeout_ms: 25, on_timeout: fallback_level_1 }
    - { name: pair_similarity_model, timeout_ms: 24, on_timeout: fallback_level_1 }
    - { name: incremental_clusterer, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: incident_builder, timeout_ms: 9, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Alerts per incident"
    - "Analyst handling time"
privacy:
  pii_in_logs: false
  retention_days: 400
