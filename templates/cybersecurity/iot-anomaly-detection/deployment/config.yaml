serving:
  deadline_ms: 80
  stages:
    - { name: network_taps_and_telemetry, timeout_ms: 4, on_timeout: fallback_level_1 }
    - { name: device_fingerprinting, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: profile_model, timeout_ms: 19, on_timeout: fallback_level_1 }
    - { name: anomaly_scorer, timeout_ms: 19, on_timeout: fallback_level_1 }
    - { name: quarantine_action, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: security_operations, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: fleet_learning, timeout_ms: 7, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Compromised devices quarantined"
    - "Alert noise"
privacy:
  pii_in_logs: false
  retention_days: 400
