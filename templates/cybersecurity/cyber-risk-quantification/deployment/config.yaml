serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: asset_and_control_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: telemetry_derived_efficacy, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: frequency_severity_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: monte_carlo_simulation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: scenario_comparator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: ciso_and_board, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: incident_outcomes, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Risk reduced per dollar invested"
    - "Decision usage by leadership"
privacy:
  pii_in_logs: false
  retention_days: 400
