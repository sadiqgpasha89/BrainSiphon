serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: device_telemetry, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: feature_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: posture_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: remediation_ranker, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: policy_integration, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: it_ops, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: incident_outcomes, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Incidents per 1000 devices"
    - "Time to remediate high-risk devices"
privacy:
  pii_in_logs: false
  retention_days: 400
