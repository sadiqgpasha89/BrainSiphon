serving:
  deadline_ms: 8
  stages:
    - { name: flow_and_sampled_packets, timeout_ms: 0.8, on_timeout: fallback_level_1 }
    - { name: streaming_sketches, timeout_ms: 0.5, on_timeout: fallback_level_1 }
    - { name: anomaly_detector, timeout_ms: 2.2, on_timeout: fallback_level_1 }
    - { name: signature_synthesiser, timeout_ms: 0.8, on_timeout: fallback_level_1 }
    - { name: mitigation_controller, timeout_ms: 0.8, on_timeout: fallback_level_1 }
    - { name: noc, timeout_ms: 0.8, on_timeout: fallback_level_1 }
    - { name: attack_library, timeout_ms: 0.8, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to mitigate"
    - "Customer impact minutes"
privacy:
  pii_in_logs: false
  retention_days: 400
