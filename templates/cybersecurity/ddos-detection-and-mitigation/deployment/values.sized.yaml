# Overrides for deployment/helm/ai-solution in the free BrainSiphon deployment kit, for DDoS Detection & Mitigation.
# Modelled sizing at 10M registered users. Replace with your measured peak, and set autoscaling bounds from a load test.
# Blueprint compute statement: 1,667 8-vCPU pods for 4,166,667 req/s (≈2,500 scores/s per pod (GBDT / small NN, features already in memory)); 139 online feature-store shards and 546 event-bus partitions.
replicaCount: 1667   # modelled pods at peak, including failover headroom
resources:
  requests:
    cpu: '8000m'
  limits:
    cpu: '8000m'
