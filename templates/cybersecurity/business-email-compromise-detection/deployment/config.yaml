serving:
  deadline_ms: 80
  stages:
    - { name: mail_gateway, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: relationship_graph_lookup, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: intent_classifier, timeout_ms: 19, on_timeout: fallback_level_1 }
    - { name: bec_scorer, timeout_ms: 19, on_timeout: fallback_level_1 }
    - { name: policy_and_banner, timeout_ms: 4, on_timeout: fallback_level_1 }
    - { name: finance_verification, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: confirmed_cases, timeout_ms: 7, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Dollar loss from BEC"
    - "Verification calls triggered"
privacy:
  pii_in_logs: false
  retention_days: 400
