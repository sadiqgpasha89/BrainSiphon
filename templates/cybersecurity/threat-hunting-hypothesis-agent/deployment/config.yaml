serving:
  deadline_ms: 2500
  stages:
    - { name: threat_intel_feeds, timeout_ms: 171, on_timeout: fallback_level_1 }
    - { name: technique_extractor, timeout_ms: 685, on_timeout: fallback_level_1 }
    - { name: query_synthesiser, timeout_ms: 257, on_timeout: fallback_level_1 }
    - { name: cost_guard, timeout_ms: 684, on_timeout: fallback_level_1 }
    - { name: hunt_executor, timeout_ms: 257, on_timeout: fallback_level_1 }
    - { name: detection_engineering, timeout_ms: 171, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Detections created per hunt"
    - "Hunter hours saved"
privacy:
  pii_in_logs: false
  retention_days: 400
