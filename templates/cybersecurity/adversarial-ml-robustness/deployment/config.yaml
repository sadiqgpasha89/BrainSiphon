serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: model_and_data_registry, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: attack_library, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: robust_trainer, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: evaluator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: release_gate, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: monitoring, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Evasion incidents"
    - "Detection recall after attacker adaptation"
privacy:
  pii_in_logs: false
  retention_days: 400
