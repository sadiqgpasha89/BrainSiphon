# Overrides for deployment/helm/ai-solution in the free BrainSiphon deployment kit, for Container Runtime Anomaly Detection.
# Modelled sizing at 10M registered users. Replace with your measured peak, and set autoscaling bounds from a load test.
# Blueprint compute statement: 125 8-vCPU pods for 312,500 req/s (≈2,500 scores/s per pod (GBDT / small NN, features already in memory)); 11 online feature-store shards and 42 event-bus partitions.
replicaCount: 125   # modelled pods at peak, including failover headroom
resources:
  requests:
    cpu: '8000m'
  limits:
    cpu: '8000m'
