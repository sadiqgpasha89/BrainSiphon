serving:
  deadline_ms: 80
  stages:
    - { name: ebpf_syscall_and_network_events, timeout_ms: 15, on_timeout: fallback_level_1 }
    - { name: metadata_enricher, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: image_profile_model, timeout_ms: 15, on_timeout: fallback_level_1 }
    - { name: anomaly_scorer, timeout_ms: 15, on_timeout: fallback_level_1 }
    - { name: response_action, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: soc_alert, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: incident_labels, timeout_ms: 6, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Container compromise dwell time"
    - "False quarantines"
privacy:
  pii_in_logs: false
  retention_days: 400
