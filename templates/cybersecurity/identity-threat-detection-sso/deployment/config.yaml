serving:
  deadline_ms: 80
  stages:
    - { name: idp_log_stream, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: session_and_device_features, timeout_ms: 13, on_timeout: fallback_level_1 }
    - { name: risk_model, timeout_ms: 27, on_timeout: fallback_level_1 }
    - { name: policy_engine, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: step_up_or_revoke, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: confirmed_compromises, timeout_ms: 10, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Account takeovers per 100k users"
    - "Step-up rate for legitimate users"
privacy:
  pii_in_logs: false
  retention_days: 400
