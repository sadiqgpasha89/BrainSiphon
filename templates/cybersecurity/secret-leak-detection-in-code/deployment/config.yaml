serving:
  deadline_ms: 80
  stages:
    - { name: commit_hook, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: pattern_detectors, timeout_ms: 20, on_timeout: fallback_level_1 }
    - { name: context_classifier, timeout_ms: 19, on_timeout: fallback_level_1 }
    - { name: verifier, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: policy_action, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: developer_notification, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: rotation_workflow, timeout_ms: 7, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Secrets leaked to default branch"
    - "Developer overrides"
privacy:
  pii_in_logs: false
  retention_days: 400
