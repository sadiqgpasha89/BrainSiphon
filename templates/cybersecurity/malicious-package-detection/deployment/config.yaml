serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: registry_feed, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: static_analyser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: sandbox_detonation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: maintainer_behaviour_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: risk_scorer, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: ci_gate, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Malicious packages blocked before install"
    - "Developer friction"
privacy:
  pii_in_logs: false
  retention_days: 400
