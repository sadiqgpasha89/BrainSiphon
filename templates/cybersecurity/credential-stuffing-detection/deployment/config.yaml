serving:
  deadline_ms: 80
  stages:
    - { name: login_request, timeout_ms: 10, on_timeout: fallback_level_1 }
    - { name: aggregate_stream_features, timeout_ms: 13, on_timeout: fallback_level_1 }
    - { name: stuffing_scorer, timeout_ms: 25, on_timeout: fallback_level_1 }
    - { name: breach_check, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: challenge_policy, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: confirmed_attacks, timeout_ms: 10, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Account takeovers from stuffing"
    - "Challenge rate for good users"
privacy:
  pii_in_logs: false
  retention_days: 400
