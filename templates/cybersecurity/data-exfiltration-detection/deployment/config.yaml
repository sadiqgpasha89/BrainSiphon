serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: egress_logs, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: entity_baseline_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: destination_rarity_graph, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: exfil_scorer, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: sensitivity_join, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Mean time to detect exfil"
    - "Data volume leaked before containment"
privacy:
  pii_in_logs: false
  retention_days: 400
