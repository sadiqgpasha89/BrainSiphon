serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: asset_iam_and_network_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: graph_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: exploitability_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: path_engine, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: remediation_optimiser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: security_engineer, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: fix_verification, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Reachable crown-jewel paths"
    - "Mean time to break top paths"
privacy:
  pii_in_logs: false
  retention_days: 400
