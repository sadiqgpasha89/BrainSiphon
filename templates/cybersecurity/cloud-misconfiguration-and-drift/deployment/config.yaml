serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: posture_graph, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: exposure_analyser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: risk_scorer, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: owner_attribution, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: ticketing, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: remediation_status, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Mean time to remediate critical exposures"
    - "Open exposures"
privacy:
  pii_in_logs: false
  retention_days: 400
