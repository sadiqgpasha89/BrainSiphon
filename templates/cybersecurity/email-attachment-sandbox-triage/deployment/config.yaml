serving:
  deadline_ms: 2500
  stages:
    - { name: attachment_extraction, timeout_ms: 212, on_timeout: fallback_level_1 }
    - { name: static_parser, timeout_ms: 212, on_timeout: fallback_level_1 }
    - { name: visual_lure_model, timeout_ms: 847, on_timeout: fallback_level_1 }
    - { name: detonation_scheduler, timeout_ms: 212, on_timeout: fallback_level_1 }
    - { name: sandbox, timeout_ms: 318, on_timeout: fallback_level_1 }
    - { name: verdict_cache, timeout_ms: 424, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Malicious attachments delivered"
    - "Mail delay time"
privacy:
  pii_in_logs: false
  retention_days: 400
