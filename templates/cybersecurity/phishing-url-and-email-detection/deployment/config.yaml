serving:
  deadline_ms: 80
  stages:
    - { name: mail_gateway, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: header_and_sender_graph_features, timeout_ms: 10, on_timeout: fallback_level_1 }
    - { name: text_and_url_model, timeout_ms: 21, on_timeout: fallback_level_1 }
    - { name: page_crawler_and_screenshot, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: phish_classifier, timeout_ms: 21, on_timeout: fallback_level_1 }
    - { name: policy_action, timeout_ms: 5, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Phish delivered per 1M"
    - "User-reported phish rate"
privacy:
  pii_in_logs: false
  retention_days: 400
