serving:
  deadline_ms: 2500
  stages:
    - { name: incident_context, timeout_ms: 445, on_timeout: fallback_level_1 }
    - { name: planner_agent, timeout_ms: 890, on_timeout: fallback_level_1 }
    - { name: typed_response_tools, timeout_ms: 334, on_timeout: fallback_level_1 }
    - { name: risk_gate, timeout_ms: 222, on_timeout: fallback_level_1 }
    - { name: incident_commander, timeout_ms: 334, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Mean time to contain"
    - "Analyst hours saved"
privacy:
  pii_in_logs: false
  retention_days: 400
