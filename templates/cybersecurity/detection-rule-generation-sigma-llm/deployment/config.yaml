serving:
  deadline_ms: 2500
  stages:
    - { name: technique_mapper, timeout_ms: 660, on_timeout: fallback_level_1 }
    - { name: rule_generator, timeout_ms: 659, on_timeout: fallback_level_1 }
    - { name: backend_compiler, timeout_ms: 247, on_timeout: fallback_level_1 }
    - { name: test_harness, timeout_ms: 247, on_timeout: fallback_level_1 }
    - { name: detection_engineer, timeout_ms: 247, on_timeout: fallback_level_1 }
    - { name: deployment, timeout_ms: 165, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time from report to deployed detection"
    - "Detections that fire in production"
privacy:
  pii_in_logs: false
  retention_days: 400
