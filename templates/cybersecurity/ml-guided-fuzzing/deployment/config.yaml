serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: corpus_manager, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: mutation_scheduler, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: fuzz_executors, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: coverage_monitor, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: crash_triager, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: security_engineer, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: fixed_bugs, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Bugs found per fuzz month"
    - "Time to find regression"
privacy:
  pii_in_logs: false
  retention_days: 400
