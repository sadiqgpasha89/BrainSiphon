serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: incident_and_cti_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: evidence_extraction, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: evidence_graph, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: link_scorer, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: constrained_clustering, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Analyst time saved"
    - "Attribution reviews with revised outcomes"
privacy:
  pii_in_logs: false
  retention_days: 400
