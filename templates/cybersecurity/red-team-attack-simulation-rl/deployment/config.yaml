serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: environment_twin, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: attack_technique_library, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: planner_agent, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: safe_emulation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: security_engineer, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: gap_tracker, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Detection gaps closed"
    - "Time to validate new detections"
privacy:
  pii_in_logs: false
  retention_days: 400
