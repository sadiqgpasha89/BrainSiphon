serving:
  deadline_ms: 80
  stages:
    - { name: input_and_retrieved_content, timeout_ms: 17, on_timeout: fallback_level_1 }
    - { name: normaliser, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: injection_classifier, timeout_ms: 23, on_timeout: fallback_level_1 }
    - { name: privilege_separation_layer, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: output_validator, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: security_logging, timeout_ms: 9, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Successful injection incidents"
    - "False block rate"
privacy:
  pii_in_logs: false
  retention_days: 400
