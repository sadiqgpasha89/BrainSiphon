serving:
  deadline_ms: 80
  stages:
    - { name: access_request, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: signal_collector, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: risk_scorer, timeout_ms: 28, on_timeout: fallback_level_1 }
    - { name: policy_decision, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: step_up_or_deny, timeout_ms: 11, on_timeout: fallback_level_1 }
    - { name: outcome_labels, timeout_ms: 10, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Compromised sessions contained"
    - "Step-up friction"
privacy:
  pii_in_logs: false
  retention_days: 400
