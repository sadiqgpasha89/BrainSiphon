serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: collection, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: language_detection_and_translation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: entity_extraction_and_linking, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: relevance_and_credibility_scorer, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: leak_validator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: takedown_actions, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time from leak post to action"
    - "False incident escalations"
privacy:
  pii_in_logs: false
  retention_days: 400
