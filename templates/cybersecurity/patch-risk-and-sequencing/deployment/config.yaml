serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: patch_catalogue, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: asset_and_config_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: risk_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: ring_planner, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: deployment_orchestrator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: health_checks, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Patch-induced incidents"
    - "Time to patch critical vulnerabilities"
privacy:
  pii_in_logs: false
  retention_days: 400
