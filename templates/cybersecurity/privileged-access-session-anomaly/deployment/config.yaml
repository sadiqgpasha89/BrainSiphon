serving:
  deadline_ms: 80
  stages:
    - { name: session_proxy, timeout_ms: 11, on_timeout: fallback_level_1 }
    - { name: command_parser, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: sequence_risk_model, timeout_ms: 30, on_timeout: fallback_level_1 }
    - { name: context_join, timeout_ms: 15, on_timeout: fallback_level_1 }
    - { name: response_policy, timeout_ms: 7, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Risky command terminations"
    - "Admin friction hours"
privacy:
  pii_in_logs: false
  retention_days: 400
