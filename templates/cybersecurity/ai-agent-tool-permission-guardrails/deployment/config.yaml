serving:
  deadline_ms: 80
  stages:
    - { name: agent_tool_call, timeout_ms: 20, on_timeout: fallback_level_1 }
    - { name: capability_check, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: intent_consistency_model, timeout_ms: 19, on_timeout: fallback_level_1 }
    - { name: sensitivity_classifier, timeout_ms: 19, on_timeout: fallback_level_1 }
    - { name: policy_decision, timeout_ms: 5, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Blocked unsafe actions"
    - "Task completion rate"
privacy:
  pii_in_logs: false
  retention_days: 400
