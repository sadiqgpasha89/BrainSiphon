serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: binary_ingestion, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: disassembly, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: function_embedding, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: ann_search, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: patch_verifier, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: security_engineer, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: confirmed_matches, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Vulnerable components found in firmware"
    - "Time to SBOM"
privacy:
  pii_in_logs: false
  retention_days: 400
