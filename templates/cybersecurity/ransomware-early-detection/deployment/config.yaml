serving:
  deadline_ms: 80
  stages:
    - { name: kernel_i_o_telemetry, timeout_ms: 4, on_timeout: fallback_level_1 }
    - { name: sliding_window_features, timeout_ms: 19, on_timeout: fallback_level_1 }
    - { name: behaviour_classifier, timeout_ms: 19, on_timeout: fallback_level_1 }
    - { name: containment, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: snapshot_rollback, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: soc_alert, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: incident_labels, timeout_ms: 7, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Files encrypted before containment"
    - "Business interruption events"
privacy:
  pii_in_logs: false
  retention_days: 400
