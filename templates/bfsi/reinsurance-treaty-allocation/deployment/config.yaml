serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: exposure_and_loss_sims, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: treaty_library, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: optimiser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: credit_adjustment, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: board_pack, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: decision_log, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Reinsurance spend per unit of capital relief"
    - "Earnings volatility"
privacy:
  pii_in_logs: false
  retention_days: 400
