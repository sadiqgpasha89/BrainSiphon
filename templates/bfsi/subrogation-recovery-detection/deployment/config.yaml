serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: claims_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: notes_processor, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: liability_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: value_estimator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: legal_tracker, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outcome_feed, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Recovery rate"
    - "Cost per recovered dollar"
privacy:
  pii_in_logs: false
  retention_days: 400
