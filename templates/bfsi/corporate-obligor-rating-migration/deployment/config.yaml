serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: rating_history_store, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: financial_spread_feed, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: feature_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: migration_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: calibrator, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Share of downgrades flagged at least one quarter early"
    - "Expected loss variance"
privacy:
  pii_in_logs: false
  retention_days: 400
