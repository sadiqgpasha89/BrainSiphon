serving:
  deadline_ms: 2500
  stages:
    - { name: payment_message_feed, timeout_ms: 202, on_timeout: fallback_level_1 }
    - { name: state_aggregator, timeout_ms: 405, on_timeout: fallback_level_1 }
    - { name: forecast_model, timeout_ms: 809, on_timeout: fallback_level_1 }
    - { name: intraday_corrector, timeout_ms: 304, on_timeout: fallback_level_1 }
    - { name: funding_recommender, timeout_ms: 202, on_timeout: fallback_level_1 }
    - { name: treasury_dashboard, timeout_ms: 303, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Overdraft days and intraday credit usage"
    - "Excess buffer cost"
privacy:
  pii_in_logs: false
  retention_days: 400
