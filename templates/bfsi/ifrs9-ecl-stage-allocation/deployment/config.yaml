serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: exposure_data_mart, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: origination_pd_vault, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: lifetime_pd_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: scenario_engine, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: stage_allocator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: ecl_calculator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: finance_reconciliation, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Provision volatility relative to credit losses"
    - "Late stage-3 recognitions"
privacy:
  pii_in_logs: false
  retention_days: 400
