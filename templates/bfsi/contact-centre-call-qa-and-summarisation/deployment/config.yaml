serving:
  deadline_ms: 2500
  stages:
    - { name: call_recording, timeout_ms: 202, on_timeout: fallback_level_1 }
    - { name: speech_to_text, timeout_ms: 540, on_timeout: fallback_level_1 }
    - { name: pii_redaction, timeout_ms: 202, on_timeout: fallback_level_1 }
    - { name: checklist_scorer, timeout_ms: 540, on_timeout: fallback_level_1 }
    - { name: summariser, timeout_ms: 539, on_timeout: fallback_level_1 }
    - { name: crm_note, timeout_ms: 202, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "QA coverage"
    - "After-call work time"
privacy:
  pii_in_logs: false
  retention_days: 400
