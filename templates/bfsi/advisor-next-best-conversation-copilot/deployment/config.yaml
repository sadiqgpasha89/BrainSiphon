serving:
  deadline_ms: 2500
  stages:
    - { name: client_data_hub, timeout_ms: 223, on_timeout: fallback_level_1 }
    - { name: trigger_detector, timeout_ms: 593, on_timeout: fallback_level_1 }
    - { name: contact_ranker, timeout_ms: 593, on_timeout: fallback_level_1 }
    - { name: note_drafter, timeout_ms: 445, on_timeout: fallback_level_1 }
    - { name: suitability_checker, timeout_ms: 148, on_timeout: fallback_level_1 }
    - { name: advisor_inbox, timeout_ms: 223, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Meaningful conversations per advisor-week"
    - "Client assets retained"
privacy:
  pii_in_logs: false
  retention_days: 400
