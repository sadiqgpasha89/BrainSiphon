serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: sales_records, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: call_transcripts, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: fit_feature_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: fit_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: claim_detector, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: compliance_workbench, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Confirmed breaches found per 100 reviews"
    - "Time to detect"
privacy:
  pii_in_logs: false
  retention_days: 400
