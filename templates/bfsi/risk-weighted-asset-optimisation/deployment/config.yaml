serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: exposure_and_rwa_feed, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: action_generator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: cost_estimator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: optimiser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: capital_committee_pack, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: execution_tracker, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Capital ratio change"
    - "Cost of execution"
privacy:
  pii_in_logs: false
  retention_days: 400
