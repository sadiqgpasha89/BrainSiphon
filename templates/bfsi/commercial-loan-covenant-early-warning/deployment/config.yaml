serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: financial_statement_store, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: covenant_definition_service, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: feature_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: breach_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: watchlist_ranker, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: credit_officer_workbench, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outcome_store, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Breaches caught at least one quarter early"
    - "Share of watchlist cases that needed action"
privacy:
  pii_in_logs: false
  retention_days: 400
