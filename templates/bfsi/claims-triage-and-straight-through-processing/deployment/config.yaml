serving:
  deadline_ms: 2500
  stages:
    - { name: claim_intake, timeout_ms: 223, on_timeout: fallback_level_1 }
    - { name: coverage_verification, timeout_ms: 222, on_timeout: fallback_level_1 }
    - { name: triage_model, timeout_ms: 890, on_timeout: fallback_level_1 }
    - { name: stp_policy, timeout_ms: 222, on_timeout: fallback_level_1 }
    - { name: payment, timeout_ms: 334, on_timeout: fallback_level_1 }
    - { name: outcome_log, timeout_ms: 334, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "STP share"
    - "Cycle time"
privacy:
  pii_in_logs: false
  retention_days: 400
