serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: complaint_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: text_processor, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: category_classifier, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: cluster_engine, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: emerging_issue_detector, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: owner_dashboard, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: action_tracker, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to detect new issues"
    - "Repeat complaints"
privacy:
  pii_in_logs: false
  retention_days: 400
