serving:
  deadline_ms: 2500
  stages:
    - { name: statement_intake, timeout_ms: 262, on_timeout: fallback_level_1 }
    - { name: table_detector, timeout_ms: 524, on_timeout: fallback_level_1 }
    - { name: cell_reader, timeout_ms: 523, on_timeout: fallback_level_1 }
    - { name: account_mapper, timeout_ms: 523, on_timeout: fallback_level_1 }
    - { name: validator, timeout_ms: 131, on_timeout: fallback_level_1 }
    - { name: spread_store, timeout_ms: 262, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Analyst minutes per statement"
    - "Rating rework caused by spreading errors"
privacy:
  pii_in_logs: false
  retention_days: 400
