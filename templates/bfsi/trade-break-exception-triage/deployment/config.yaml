serving:
  deadline_ms: 2500
  stages:
    - { name: reconciliation_engine, timeout_ms: 209, on_timeout: fallback_level_1 }
    - { name: break_feature_builder, timeout_ms: 278, on_timeout: fallback_level_1 }
    - { name: cause_classifier, timeout_ms: 556, on_timeout: fallback_level_1 }
    - { name: action_recommender, timeout_ms: 556, on_timeout: fallback_level_1 }
    - { name: worklist, timeout_ms: 209, on_timeout: fallback_level_1 }
    - { name: four_eyes_approval, timeout_ms: 209, on_timeout: fallback_level_1 }
    - { name: outcome_log, timeout_ms: 208, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Breaks aged beyond SLA"
    - "Operator touches per break"
privacy:
  pii_in_logs: false
  retention_days: 400
