serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: price_feed_ingest, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: asset_reference_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: valuation_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: haircut_calculator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: margin_call_generator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: valuation_history, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Under-secured exposure days"
    - "Margin calls disputed because of valuation"
privacy:
  pii_in_logs: false
  retention_days: 400
