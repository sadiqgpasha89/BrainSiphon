serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: inventory_and_loan_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: market_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: feature_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: fee_and_recall_models, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: price_suggester, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: desk_screen, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Lending revenue"
    - "Failed returns due to recalls"
privacy:
  pii_in_logs: false
  retention_days: 400
