serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: trade_and_instruction_feed, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: feature_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: fail_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: penalty_estimator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outcome_capture, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: model_monitor, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Fails avoided per day"
    - "Penalty cost"
privacy:
  pii_in_logs: false
  retention_days: 400
