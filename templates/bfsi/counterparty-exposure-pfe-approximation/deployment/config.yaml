serving:
  deadline_ms: 2500
  stages:
    - { name: pre_deal_request, timeout_ms: 334, on_timeout: fallback_level_1 }
    - { name: feature_assembler, timeout_ms: 445, on_timeout: fallback_level_1 }
    - { name: pfe_surrogate, timeout_ms: 334, on_timeout: fallback_level_1 }
    - { name: error_monitor, timeout_ms: 334, on_timeout: fallback_level_1 }
    - { name: limit_checker, timeout_ms: 222, on_timeout: fallback_level_1 }
    - { name: trader_response, timeout_ms: 222, on_timeout: fallback_level_1 }
    - { name: engine_runs, timeout_ms: 334, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Pre-deal checks completed within 300 ms"
    - "Limit breaches caught"
privacy:
  pii_in_logs: false
  retention_days: 400
