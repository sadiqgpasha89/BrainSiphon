serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: macro_data_ingest, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: historical_store, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: joint_path_generator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: analogue_matcher, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: narrative_drafter, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: scenario_library, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to produce a scenario set"
    - "Reviewer acceptance rate"
privacy:
  pii_in_logs: false
  retention_days: 400
