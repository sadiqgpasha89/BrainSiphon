serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: loan_tape_ingest, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: feature_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: macro_scenario_service, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: hazard_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: cash_flow_projector, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: model_registry, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Forecast error of monthly cash flow"
    - "Provision movement explained by model drift"
privacy:
  pii_in_logs: false
  retention_days: 400
