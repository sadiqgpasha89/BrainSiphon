serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: population_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: portfolio_deaths, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: mortality_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: credibility_blender, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: scenario_generator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: pricing_and_reserving_feeds, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: documentation, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Reserve movement from assumptions"
    - "Pricing margin"
privacy:
  pii_in_logs: false
  retention_days: 400
