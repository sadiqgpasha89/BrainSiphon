serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: branch_transactions, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: demand_forecaster, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: event_calendar, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: inventory_optimiser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: cit_scheduler, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: branch_manager_view, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outcome_store, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Cash held per branch"
    - "Stock-out events"
privacy:
  pii_in_logs: false
  retention_days: 400
