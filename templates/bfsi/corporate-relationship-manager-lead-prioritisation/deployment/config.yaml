serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: client_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: trigger_detection, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: lead_ranker, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: value_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: rm_list, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outcome_capture, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: monitor, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Pipeline created"
    - "Win rate"
privacy:
  pii_in_logs: false
  retention_days: 400
