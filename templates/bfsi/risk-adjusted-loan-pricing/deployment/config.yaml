serving:
  deadline_ms: 2500
  stages:
    - { name: deal_request, timeout_ms: 247, on_timeout: fallback_level_1 }
    - { name: cost_builder, timeout_ms: 247, on_timeout: fallback_level_1 }
    - { name: win_probability_model, timeout_ms: 660, on_timeout: fallback_level_1 }
    - { name: price_optimiser, timeout_ms: 659, on_timeout: fallback_level_1 }
    - { name: approval_engine, timeout_ms: 165, on_timeout: fallback_level_1 }
    - { name: quote_record, timeout_ms: 247, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Portfolio RAROC"
    - "Win rate at or above the hurdle"
privacy:
  pii_in_logs: false
  retention_days: 400
