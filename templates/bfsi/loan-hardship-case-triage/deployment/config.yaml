serving:
  deadline_ms: 2500
  stages:
    - { name: intake_channel_gateway, timeout_ms: 194, on_timeout: fallback_level_1 }
    - { name: language_and_pii_processor, timeout_ms: 290, on_timeout: fallback_level_1 }
    - { name: hardship_classifier, timeout_ms: 774, on_timeout: fallback_level_1 }
    - { name: urgency_scorer, timeout_ms: 774, on_timeout: fallback_level_1 }
    - { name: treatment_router, timeout_ms: 193, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to first response"
    - "Share of vulnerable customers reached by a specialist"
privacy:
  pii_in_logs: false
  retention_days: 400
