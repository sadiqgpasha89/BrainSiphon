serving:
  deadline_ms: 2500
  stages:
    - { name: notice_intake, timeout_ms: 178, on_timeout: fallback_level_1 }
    - { name: document_parser, timeout_ms: 712, on_timeout: fallback_level_1 }
    - { name: event_extractor, timeout_ms: 712, on_timeout: fallback_level_1 }
    - { name: reconciler, timeout_ms: 178, on_timeout: fallback_level_1 }
    - { name: golden_source, timeout_ms: 267, on_timeout: fallback_level_1 }
    - { name: downstream_publish, timeout_ms: 178, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Manual touches per event"
    - "Entitlement errors"
privacy:
  pii_in_logs: false
  retention_days: 400
