serving:
  deadline_ms: 2500
  stages:
    - { name: validation_request, timeout_ms: 238, on_timeout: fallback_level_1 }
    - { name: document_retriever, timeout_ms: 477, on_timeout: fallback_level_1 }
    - { name: sandbox_runner, timeout_ms: 238, on_timeout: fallback_level_1 }
    - { name: policy_checker, timeout_ms: 636, on_timeout: fallback_level_1 }
    - { name: finding_drafter, timeout_ms: 636, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Validation cycle time"
    - "Findings missed on later audit"
privacy:
  pii_in_logs: false
  retention_days: 400
