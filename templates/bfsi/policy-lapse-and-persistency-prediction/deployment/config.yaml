serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: policy_admin_extract, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: feature_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: lapse_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: uplift_ranker, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: campaign_lists, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: actuarial_feed, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: monitor, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Persistency uplift"
    - "Retention cost per saved policy"
privacy:
  pii_in_logs: false
  retention_days: 400
