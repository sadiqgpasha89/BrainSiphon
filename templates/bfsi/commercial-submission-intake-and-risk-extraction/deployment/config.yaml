serving:
  deadline_ms: 2500
  stages:
    - { name: submission_mailbox, timeout_ms: 131, on_timeout: fallback_level_1 }
    - { name: document_classifier, timeout_ms: 524, on_timeout: fallback_level_1 }
    - { name: extractor, timeout_ms: 524, on_timeout: fallback_level_1 }
    - { name: appetite_triage, timeout_ms: 131, on_timeout: fallback_level_1 }
    - { name: missing_info_drafter, timeout_ms: 523, on_timeout: fallback_level_1 }
    - { name: underwriter_desk, timeout_ms: 196, on_timeout: fallback_level_1 }
    - { name: quote_system, timeout_ms: 196, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to first quote"
    - "Underwriter keying time"
privacy:
  pii_in_logs: false
  retention_days: 400
