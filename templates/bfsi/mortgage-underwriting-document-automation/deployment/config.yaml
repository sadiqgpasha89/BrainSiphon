serving:
  deadline_ms: 2500
  stages:
    - { name: broker_upload_api, timeout_ms: 159, on_timeout: fallback_level_1 }
    - { name: document_classifier, timeout_ms: 636, on_timeout: fallback_level_1 }
    - { name: field_extractor, timeout_ms: 636, on_timeout: fallback_level_1 }
    - { name: cross_document_reconciler, timeout_ms: 159, on_timeout: fallback_level_1 }
    - { name: tamper_checker, timeout_ms: 635, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Underwriter minutes per file"
    - "Straight-through documents with no manual correction"
privacy:
  pii_in_logs: false
  retention_days: 400
