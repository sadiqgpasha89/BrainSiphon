serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: balance_sheet_snapshot, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: behaviour_models, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: scenario_curve_engine, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: nii_simulator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: attribution_engine, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: alco_dashboard, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Variance of NII versus plan"
    - "Hedge cost"
privacy:
  pii_in_logs: false
  retention_days: 400
