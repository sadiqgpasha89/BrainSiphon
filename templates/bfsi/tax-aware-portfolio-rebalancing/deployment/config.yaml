serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: positions_and_lots, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: target_allocation_service, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: cost_and_tax_estimator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: optimiser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: compliance_check, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: trade_file, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Net-of-tax return"
    - "Turnover"
privacy:
  pii_in_logs: false
  retention_days: 400
