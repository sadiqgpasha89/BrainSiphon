serving:
  deadline_ms: 2500
  stages:
    - { name: regulatory_feed, timeout_ms: 223, on_timeout: fallback_level_1 }
    - { name: document_parser, timeout_ms: 148, on_timeout: fallback_level_1 }
    - { name: obligation_extractor, timeout_ms: 593, on_timeout: fallback_level_1 }
    - { name: policy_mapper, timeout_ms: 445, on_timeout: fallback_level_1 }
    - { name: impact_drafter, timeout_ms: 593, on_timeout: fallback_level_1 }
    - { name: obligation_register, timeout_ms: 223, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time from publication to impact assessment"
    - "Missed obligations at audit"
privacy:
  pii_in_logs: false
  retention_days: 400
