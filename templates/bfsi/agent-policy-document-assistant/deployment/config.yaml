serving:
  deadline_ms: 2500
  stages:
    - { name: document_ingest, timeout_ms: 144, on_timeout: fallback_level_1 }
    - { name: version_index, timeout_ms: 215, on_timeout: fallback_level_1 }
    - { name: question_router, timeout_ms: 574, on_timeout: fallback_level_1 }
    - { name: answer_composer, timeout_ms: 574, on_timeout: fallback_level_1 }
    - { name: verifier, timeout_ms: 144, on_timeout: fallback_level_1 }
    - { name: agent_portal, timeout_ms: 574, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Underwriter queries deflected"
    - "Wrong-version incidents"
privacy:
  pii_in_logs: false
  retention_days: 400
