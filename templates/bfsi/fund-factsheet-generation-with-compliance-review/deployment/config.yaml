serving:
  deadline_ms: 2500
  stages:
    - { name: performance_data, timeout_ms: 238, on_timeout: fallback_level_1 }
    - { name: manager_notes, timeout_ms: 318, on_timeout: fallback_level_1 }
    - { name: commentary_drafter, timeout_ms: 636, on_timeout: fallback_level_1 }
    - { name: number_verifier, timeout_ms: 159, on_timeout: fallback_level_1 }
    - { name: phrase_and_disclosure_checker, timeout_ms: 636, on_timeout: fallback_level_1 }
    - { name: publish, timeout_ms: 238, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to publish"
    - "Compliance rework"
privacy:
  pii_in_logs: false
  retention_days: 400
