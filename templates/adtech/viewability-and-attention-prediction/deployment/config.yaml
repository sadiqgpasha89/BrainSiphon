serving:
  deadline_ms: 80
  stages:
    - { name: bid_request, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: placement_features, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: viewability_model, timeout_ms: 17, on_timeout: fallback_level_1 }
    - { name: attention_estimator, timeout_ms: 17, on_timeout: fallback_level_1 }
    - { name: bid_modifier, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: measurement_vendor, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: calibration, timeout_ms: 6, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Viewable CPM"
    - "Attention per dollar"
privacy:
  pii_in_logs: false
  retention_days: 400
