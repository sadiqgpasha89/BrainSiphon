serving:
  deadline_ms: 80
  stages:
    - { name: engagement_events, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: cascade_builder, timeout_ms: 10, on_timeout: fallback_level_1 }
    - { name: virality_predictor, timeout_ms: 27, on_timeout: fallback_level_1 }
    - { name: promotion_allocator, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: creator_analytics, timeout_ms: 10, on_timeout: fallback_level_1 }
    - { name: final_outcomes, timeout_ms: 10, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Promotion ROI"
    - "Creator satisfaction"
privacy:
  pii_in_logs: false
  retention_days: 400
