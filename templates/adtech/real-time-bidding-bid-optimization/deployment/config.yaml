serving:
  deadline_ms: 8
  stages:
    - { name: bid_request_listener, timeout_ms: 0.7, on_timeout: fallback_level_1 }
    - { name: feature_assembly, timeout_ms: 0.9, on_timeout: fallback_level_1 }
    - { name: pctr_pcvr_model, timeout_ms: 1.8, on_timeout: fallback_level_1 }
    - { name: bid_optimiser, timeout_ms: 1.8, on_timeout: fallback_level_1 }
    - { name: pacing_controller, timeout_ms: 0.4, on_timeout: fallback_level_1 }
    - { name: bid_responder, timeout_ms: 0.7, on_timeout: fallback_level_1 }
    - { name: win_and_loss_logs, timeout_ms: 0.4, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Cost per acquisition"
    - "Return on ad spend"
privacy:
  pii_in_logs: false
  retention_days: 400
