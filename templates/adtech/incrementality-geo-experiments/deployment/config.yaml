serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: geo_level_outcome_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: geo_matcher, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: power_simulator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: test_execution, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: effect_estimator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: results_registry, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Decision agreement with later tests"
    - "Test cost per decision"
privacy:
  pii_in_logs: false
  retention_days: 400
