# Overrides for deployment/helm/ai-solution in the free BrainSiphon deployment kit, for Bid Traffic Shaping & QPS Throttling.
# Modelled sizing at 10M registered users. Replace with your measured peak, and set autoscaling bounds from a load test.
# Blueprint compute statement: 7 8-vCPU pods for 16,667 req/s (≈2,500 scores/s per pod (GBDT / small NN, features already in memory)); 3 online feature-store shards and 12 event-bus partitions.
replicaCount: 7   # modelled pods at peak, including failover headroom
resources:
  requests:
    cpu: '8000m'
  limits:
    cpu: '8000m'
