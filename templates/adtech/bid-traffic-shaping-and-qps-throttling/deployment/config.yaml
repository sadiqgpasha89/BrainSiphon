serving:
  deadline_ms: 8
  stages:
    - { name: bid_request_ingress, timeout_ms: 0.8, on_timeout: fallback_level_1 }
    - { name: segment_classifier, timeout_ms: 2.2, on_timeout: fallback_level_1 }
    - { name: value_table, timeout_ms: 1.1, on_timeout: fallback_level_1 }
    - { name: throttle_policy, timeout_ms: 0.6, on_timeout: fallback_level_1 }
    - { name: pass_through_to_bidder, timeout_ms: 0.8, on_timeout: fallback_level_1 }
    - { name: outcome_stream, timeout_ms: 0.6, on_timeout: fallback_level_1 }
    - { name: policy_updater, timeout_ms: 0.6, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Infrastructure cost per won impression"
    - "Win volume retained"
privacy:
  pii_in_logs: false
  retention_days: 400
