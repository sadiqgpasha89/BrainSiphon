serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: identifier_events, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: consent_filter, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: link_scorer, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: graph_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: constrained_clustering, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: id_service, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Match rate"
    - "Frequency capping accuracy"
privacy:
  pii_in_logs: false
  retention_days: 400
