serving:
  deadline_ms: 2500
  stages:
    - { name: creative_upload, timeout_ms: 171, on_timeout: fallback_level_1 }
    - { name: format_checker, timeout_ms: 171, on_timeout: fallback_level_1 }
    - { name: embedding_model, timeout_ms: 685, on_timeout: fallback_level_1 }
    - { name: ranking_head, timeout_ms: 684, on_timeout: fallback_level_1 }
    - { name: attribute_explainer, timeout_ms: 257, on_timeout: fallback_level_1 }
    - { name: live_performance, timeout_ms: 257, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Share of top creatives chosen"
    - "Wasted spend on weak creatives"
privacy:
  pii_in_logs: false
  retention_days: 400
