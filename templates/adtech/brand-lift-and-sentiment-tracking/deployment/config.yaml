serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: survey_responses, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: social_and_web_text, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: sentiment_and_aspect_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: lift_estimator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: event_detector, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: action_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Brand lift per spend"
    - "Decision usage"
privacy:
  pii_in_logs: false
  retention_days: 400
