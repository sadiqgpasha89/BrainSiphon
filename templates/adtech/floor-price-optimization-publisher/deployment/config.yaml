serving:
  deadline_ms: 80
  stages:
    - { name: ad_request, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: context_features, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: top_bid_distribution_model, timeout_ms: 18, on_timeout: fallback_level_1 }
    - { name: floor_optimiser, timeout_ms: 18, on_timeout: fallback_level_1 }
    - { name: auction_execution, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: revenue_logs, timeout_ms: 4, on_timeout: fallback_level_1 }
    - { name: buyer_response_monitor, timeout_ms: 7, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Revenue per thousand impressions"
    - "Fill rate"
privacy:
  pii_in_logs: false
  retention_days: 400
