serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: user_features, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: randomised_assignment, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: uplift_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: policy_optimiser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: audience_activation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: incremental_measurement, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Incremental conversions per spend"
    - "Sleeping-dog rate"
privacy:
  pii_in_logs: false
  retention_days: 400
