serving:
  deadline_ms: 80
  stages:
    - { name: metrics_stream, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: seasonal_baseline, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: residual_scorer, timeout_ms: 20, on_timeout: fallback_level_1 }
    - { name: cause_linker, timeout_ms: 10, on_timeout: fallback_level_1 }
    - { name: alert_ranker, timeout_ms: 20, on_timeout: fallback_level_1 }
    - { name: account_manager, timeout_ms: 7, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Mean time to detect"
    - "Wasted spend before action"
privacy:
  pii_in_logs: false
  retention_days: 400
