serving:
  deadline_ms: 2500
  stages:
    - { name: user_question, timeout_ms: 223, on_timeout: fallback_level_1 }
    - { name: intent_and_schema_linking, timeout_ms: 593, on_timeout: fallback_level_1 }
    - { name: sql_tool, timeout_ms: 223, on_timeout: fallback_level_1 }
    - { name: result_checker, timeout_ms: 148, on_timeout: fallback_level_1 }
    - { name: chart_and_narrative, timeout_ms: 593, on_timeout: fallback_level_1 }
    - { name: marketer, timeout_ms: 223, on_timeout: fallback_level_1 }
    - { name: query_log, timeout_ms: 222, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Time to insight"
    - "Analyst escalations"
privacy:
  pii_in_logs: false
  retention_days: 400
