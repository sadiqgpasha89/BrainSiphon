serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: creator_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: follower_graph_features, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: fraud_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: brand_safety_scan, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: matching_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: campaign_manager, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: campaign_results, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Cost per engagement on authentic audience"
    - "Campaign ROI"
privacy:
  pii_in_logs: false
  retention_days: 400
