serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: user_features, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: seed_ingestion, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: seed_quality_filter, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: pu_learning_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: audience_scorer, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: audience_export, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Cost per acquisition by audience size"
    - "Reach at target CPA"
privacy:
  pii_in_logs: false
  retention_days: 400
