serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: touchpoint_logs, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: path_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: conversion_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: credit_allocation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: experiment_calibrator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: marketer_dashboard, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: budget_decisions, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "ROAS from reallocated budget"
    - "Agreement with experiments"
privacy:
  pii_in_logs: false
  retention_days: 400
