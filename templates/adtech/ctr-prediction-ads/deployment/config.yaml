serving:
  deadline_ms: 8
  stages:
    - { name: ad_request, timeout_ms: 0.5, on_timeout: fallback_level_1 }
    - { name: feature_hashing, timeout_ms: 0.7, on_timeout: fallback_level_1 }
    - { name: embedding_lookup, timeout_ms: 1.4, on_timeout: fallback_level_1 }
    - { name: dcn_v2_scorer, timeout_ms: 1.4, on_timeout: fallback_level_1 }
    - { name: calibration_layer, timeout_ms: 1.4, on_timeout: fallback_level_1 }
    - { name: candidate_ranking, timeout_ms: 1, on_timeout: fallback_level_1 }
    - { name: click_logs, timeout_ms: 0.3, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Revenue per mille"
    - "Advertiser CTR satisfaction"
privacy:
  pii_in_logs: false
  retention_days: 400
