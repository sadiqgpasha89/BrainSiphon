serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: spend_and_outcome_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: feature_builder, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: bayesian_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: calibration_with_lift_tests, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: budget_optimiser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: marketing_leadership, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: post_campaign_validation, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "ROAS of reallocated budget"
    - "Forecast accuracy of planned outcomes"
privacy:
  pii_in_logs: false
  retention_days: 400
