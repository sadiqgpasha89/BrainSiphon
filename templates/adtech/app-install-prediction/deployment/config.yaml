serving:
  deadline_ms: 80
  stages:
    - { name: bid_request, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: context_features, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: install_and_value_model, timeout_ms: 17, on_timeout: fallback_level_1 }
    - { name: fraud_filter, timeout_ms: 17, on_timeout: fallback_level_1 }
    - { name: bidder, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: attribution_postbacks, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: calibration_job, timeout_ms: 6, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Cost per retained user"
    - "Day-7 ROAS"
privacy:
  pii_in_logs: false
  retention_days: 400
