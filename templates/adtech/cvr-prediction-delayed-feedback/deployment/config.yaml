serving:
  deadline_ms: 80
  stages:
    - { name: click_and_conversion_streams, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: label_joiner, timeout_ms: 11, on_timeout: fallback_level_1 }
    - { name: delay_aware_trainer, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: cvr_scorer, timeout_ms: 22, on_timeout: fallback_level_1 }
    - { name: calibration_layer, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: bidding_service, timeout_ms: 8, on_timeout: fallback_level_1 }
    - { name: late_conversion_corrections, timeout_ms: 8, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Cost per acquisition after full attribution"
    - "Spend efficiency"
privacy:
  pii_in_logs: false
  retention_days: 400
