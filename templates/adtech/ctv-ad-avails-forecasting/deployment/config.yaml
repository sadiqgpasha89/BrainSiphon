serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: playback_logs, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: household_aggregation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: avails_forecaster, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: reach_frequency_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: panel_calibrator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: sales_planning_tool, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: delivery_outcomes, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Delivery vs guarantee"
    - "Reach forecast accuracy"
privacy:
  pii_in_logs: false
  retention_days: 400
