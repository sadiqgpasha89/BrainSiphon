serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: event_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: early_signal_features, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: ltv_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: cohort_calibrator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: bid_multiplier_service, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: matured_ltv, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Realised LTV to CAC ratio"
    - "Payback period"
privacy:
  pii_in_logs: false
  retention_days: 400
