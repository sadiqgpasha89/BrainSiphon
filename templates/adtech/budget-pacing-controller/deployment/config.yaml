serving:
  deadline_ms: 8
  stages:
    - { name: spend_counters, timeout_ms: 1.1, on_timeout: fallback_level_1 }
    - { name: traffic_forecaster, timeout_ms: 2.2, on_timeout: fallback_level_1 }
    - { name: pacing_controller, timeout_ms: 0.6, on_timeout: fallback_level_1 }
    - { name: throttle_policy, timeout_ms: 0.6, on_timeout: fallback_level_1 }
    - { name: bid_service, timeout_ms: 0.8, on_timeout: fallback_level_1 }
    - { name: billing_reconciliation, timeout_ms: 0.8, on_timeout: fallback_level_1 }
    - { name: pacing_metrics, timeout_ms: 0.6, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Budget utilisation"
    - "Overspend percentage"
privacy:
  pii_in_logs: false
  retention_days: 400
