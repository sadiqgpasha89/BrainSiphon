    - { name: brand_context_retriever, timeout_ms: 342, on_timeout: fallback_level_1 }
    - { name: generator_llm_and_image_model, timeout_ms: 457, on_timeout: fallback_level_1 }
    - { name: policy_and_brand_filter, timeout_ms: 457, on_timeout: fallback_level_1 }
    - { name: performance_ranker, timeout_ms: 456, on_timeout: fallback_level_1 }
    - { name: marketer_approval, timeout_ms: 171, on_timeout: fallback_level_1 }
    - { name: live_performance, timeout_ms: 171, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
