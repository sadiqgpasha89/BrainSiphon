serving:
  deadline_ms: 8
  stages:
    - { name: bid_request, timeout_ms: 0.6, on_timeout: fallback_level_1 }
    - { name: value_model, timeout_ms: 1.7, on_timeout: fallback_level_1 }
    - { name: clearing_price_model, timeout_ms: 1.7, on_timeout: fallback_level_1 }
    - { name: shade_optimiser, timeout_ms: 1.7, on_timeout: fallback_level_1 }
    - { name: floor_and_cap_rules, timeout_ms: 0.4, on_timeout: fallback_level_1 }
    - { name: bid_response, timeout_ms: 0.6, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Cost per won impression at equal win rate"
    - "Surplus uplift"
privacy:
  pii_in_logs: false
  retention_days: 400
