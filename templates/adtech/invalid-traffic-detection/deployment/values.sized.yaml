# Overrides for deployment/helm/ai-solution in the free BrainSiphon deployment kit, for Invalid Traffic (IVT) Detection.
# Modelled sizing at 10M registered users. Replace with your measured peak, and set autoscaling bounds from a load test.
# Blueprint compute statement: 16 8-vCPU pods for 12,500 req/s (≈800 scores/s per pod (cached neighbourhood embeddings + light head)); 3 online feature-store shards and 12 event-bus partitions.
replicaCount: 16   # modelled pods at peak, including failover headroom
resources:
  requests:
    cpu: '8000m'
  limits:
    cpu: '8000m'
