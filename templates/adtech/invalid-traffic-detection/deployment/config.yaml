serving:
  deadline_ms: 80
  stages:
    - { name: event_stream, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: entity_aggregates, timeout_ms: 10, on_timeout: fallback_level_1 }
    - { name: pre_bid_ivt_scorer, timeout_ms: 21, on_timeout: fallback_level_1 }
    - { name: post_bid_graph_model, timeout_ms: 21, on_timeout: fallback_level_1 }
    - { name: policy_engine, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: dispute_outcomes, timeout_ms: 8, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Invalid traffic rate"
    - "Advertiser refund requests"
privacy:
  pii_in_logs: false
  retention_days: 400
