serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: event_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: contribution_bounding, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: dp_mechanism, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: privacy_accountant, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: consistency_post_processor, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Usable metrics coverage"
    - "Privacy incidents"
privacy:
  pii_in_logs: false
  retention_days: 400
