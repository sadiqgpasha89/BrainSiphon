serving:
  deadline_ms: 80
  stages:
    - { name: landing_page_crawler, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: content_and_screenshot_features, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: quality_model, timeout_ms: 15, on_timeout: fallback_level_1 }
    - { name: field_signal_merger, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: score_store, timeout_ms: 15, on_timeout: fallback_level_1 }
    - { name: auction_consumer, timeout_ms: 15, on_timeout: fallback_level_1 }
    - { name: advertiser_appeals, timeout_ms: 6, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "User complaint rate"
    - "Revenue per search"
privacy:
  pii_in_logs: false
  retention_days: 400
