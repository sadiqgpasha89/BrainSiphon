serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: channel_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: incrementality_calibrator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: bayesian_bandit, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: constraint_checker, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: budget_changes, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: marketing_lead, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outcome_measurement, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Incremental conversions at constant spend"
    - "Allocation stability"
privacy:
  pii_in_logs: false
  retention_days: 400
