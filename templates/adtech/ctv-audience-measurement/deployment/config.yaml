serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: panel_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: census_logs, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: fusion_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: household_to_person_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: reach_and_frequency_calculator, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Cross-platform reach accuracy vs benchmarks"
    - "Advertiser adoption"
privacy:
  pii_in_logs: false
  retention_days: 400
