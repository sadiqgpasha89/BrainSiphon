serving:
  deadline_ms: 2500
  stages:
    - { name: campaign_brief, timeout_ms: 191, on_timeout: fallback_level_1 }
    - { name: variant_generator, timeout_ms: 509, on_timeout: fallback_level_1 }
    - { name: brand_and_compliance_filter, timeout_ms: 127, on_timeout: fallback_level_1 }
    - { name: response_model, timeout_ms: 508, on_timeout: fallback_level_1 }
    - { name: bandit_selector, timeout_ms: 508, on_timeout: fallback_level_1 }
    - { name: send_service, timeout_ms: 191, on_timeout: fallback_level_1 }
    - { name: click_and_conversion_logs, timeout_ms: 191, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Click-through and conversion rate"
    - "Unsubscribe rate"
privacy:
  pii_in_logs: false
  retention_days: 400
