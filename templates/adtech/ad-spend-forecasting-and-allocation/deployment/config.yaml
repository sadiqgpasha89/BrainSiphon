serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: performance_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: response_curve_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: allocator, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: guardrails, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: budget_api, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: realised_return, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Total conversions at equal budget"
    - "Budget utilisation"
privacy:
  pii_in_logs: false
  retention_days: 400
