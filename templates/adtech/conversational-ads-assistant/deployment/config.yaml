serving:
  deadline_ms: 2500
  stages:
    - { name: ad_unit_chat, timeout_ms: 247, on_timeout: fallback_level_1 }
    - { name: safety_and_age_gate, timeout_ms: 165, on_timeout: fallback_level_1 }
    - { name: retriever, timeout_ms: 495, on_timeout: fallback_level_1 }
    - { name: assistant_llm, timeout_ms: 659, on_timeout: fallback_level_1 }
    - { name: claim_checker, timeout_ms: 165, on_timeout: fallback_level_1 }
    - { name: handoff_tool, timeout_ms: 247, on_timeout: fallback_level_1 }
    - { name: transcript_analytics, timeout_ms: 247, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Conversion per session"
    - "Cost per conversion vs display ads"
privacy:
  pii_in_logs: false
  retention_days: 400
