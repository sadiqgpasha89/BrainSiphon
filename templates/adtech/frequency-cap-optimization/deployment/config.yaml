serving:
  deadline_ms: 80
  stages:
    - { name: ad_request, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: exposure_counters, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: response_curve_model, timeout_ms: 19, on_timeout: fallback_level_1 }
    - { name: cap_policy, timeout_ms: 19, on_timeout: fallback_level_1 }
    - { name: bid_decision, timeout_ms: 5, on_timeout: fallback_level_1 }
    - { name: exposure_logging, timeout_ms: 4, on_timeout: fallback_level_1 }
    - { name: experiment_holdouts, timeout_ms: 7, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Cost per incremental conversion"
    - "Complaint rate"
privacy:
  pii_in_logs: false
  retention_days: 400
