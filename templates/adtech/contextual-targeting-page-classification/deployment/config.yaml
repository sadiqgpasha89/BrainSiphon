serving:
  deadline_ms: 80
  stages:
    - { name: ad_request_url, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: page_cache_lookup, timeout_ms: 7, on_timeout: fallback_level_1 }
    - { name: fallback_url_classifier, timeout_ms: 15, on_timeout: fallback_level_1 }
    - { name: crawler_and_content_extractor, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: topic_classifier, timeout_ms: 15, on_timeout: fallback_level_1 }
    - { name: segment_mapper, timeout_ms: 15, on_timeout: fallback_level_1 }
    - { name: performance_logs, timeout_ms: 6, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Contextual campaign CPA vs behavioural"
    - "Addressable inventory share"
privacy:
  pii_in_logs: false
  retention_days: 400
