# Reproduces the worked example and its tests in a container. It does not start a production service.
services:
  starter:
    build: ../starter
    image: brainsiphon-pro/click-fraud-and-bot-detection-search:starter
    command: ["python", "run_usecase.py"]
    environment:
      OMP_NUM_THREADS: "2"
    volumes:
      - ../starter:/app
  tests:
    build: ../starter
    image: brainsiphon-pro/click-fraud-and-bot-detection-search:starter
    command: ["python", "-m", "pytest", "-q"]
    environment:
      OMP_NUM_THREADS: "2"
