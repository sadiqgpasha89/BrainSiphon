serving:
  deadline_ms: 80
  stages:
    - { name: search_query, timeout_ms: 4, on_timeout: fallback_level_1 }
    - { name: ad_candidate_retrieval, timeout_ms: 12, on_timeout: fallback_level_1 }
    - { name: dual_encoder_scorer, timeout_ms: 17, on_timeout: fallback_level_1 }
    - { name: cross_encoder_reranker, timeout_ms: 17, on_timeout: fallback_level_1 }
    - { name: relevance_gate, timeout_ms: 4, on_timeout: fallback_level_1 }
    - { name: auction, timeout_ms: 16, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Ad quality complaints"
    - "CTR at constant revenue"
privacy:
  pii_in_logs: false
  retention_days: 400
