serving:
  deadline_ms: 80
  stages:
    - { name: ad_submission, timeout_ms: 10, on_timeout: fallback_level_1 }
    - { name: text_and_image_models, timeout_ms: 25, on_timeout: fallback_level_1 }
    - { name: claim_verifier, timeout_ms: 19, on_timeout: fallback_level_1 }
    - { name: policy_engine, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: appeals, timeout_ms: 10, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Policy violation exposure"
    - "Wrongful rejection rate"
privacy:
  pii_in_logs: false
  retention_days: 400
