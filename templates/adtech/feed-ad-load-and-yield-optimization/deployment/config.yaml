serving:
  deadline_ms: 80
  stages:
    - { name: feed_request, timeout_ms: 11, on_timeout: fallback_level_1 }
    - { name: organic_ranker, timeout_ms: 11, on_timeout: fallback_level_1 }
    - { name: ad_ranker, timeout_ms: 11, on_timeout: fallback_level_1 }
    - { name: slate_optimiser, timeout_ms: 11, on_timeout: fallback_level_1 }
    - { name: tolerance_model, timeout_ms: 11, on_timeout: fallback_level_1 }
    - { name: feed_response, timeout_ms: 4, on_timeout: fallback_level_1 }
    - { name: long_term_metric_tracker, timeout_ms: 11, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Long-term revenue per user"
    - "Session frequency"
privacy:
  pii_in_logs: false
  retention_days: 400
