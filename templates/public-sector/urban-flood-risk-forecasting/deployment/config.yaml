serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: rainfall_and_gauge_ingestion, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: network_state, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: hydraulic_simulation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: learned_correction, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: risk_map, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: duty_officer_warning, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: post_event_verification, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Properties flooded"
    - "Warning lead time"
    - "Pump deployment accuracy"
privacy:
  pii_in_logs: false
  retention_days: 400
