serving:
  deadline_ms: 2500
  stages:
    - { name: legal_text_ingestion, timeout_ms: 234, on_timeout: fallback_level_1 }
    - { name: structure_parsing, timeout_ms: 234, on_timeout: fallback_level_1 }
    - { name: index_and_diff_tools, timeout_ms: 469, on_timeout: fallback_level_1 }
    - { name: question_answering, timeout_ms: 937, on_timeout: fallback_level_1 }
    - { name: advice_note, timeout_ms: 351, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Analysis time"
    - "Missed conflicts"
    - "Corrections to advice notes"
privacy:
  pii_in_logs: false
  retention_days: 400
