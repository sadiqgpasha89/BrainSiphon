serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: counter_and_booking_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: aggregation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: forecast_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: equity_target_check, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: hours_and_staffing_proposal, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: manager_approval, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: accuracy_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Use per opening hour"
    - "Access in high-need areas"
    - "Staff overtime"
privacy:
  pii_in_logs: false
  retention_days: 400
