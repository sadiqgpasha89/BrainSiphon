serving:
  deadline_ms: 2500
  stages:
    - { name: vehicle_location_feed, timeout_ms: 371, on_timeout: fallback_level_1 }
    - { name: headway_estimate, timeout_ms: 247, on_timeout: fallback_level_1 }
    - { name: control_policy, timeout_ms: 247, on_timeout: fallback_level_1 }
    - { name: rules_clip, timeout_ms: 247, on_timeout: fallback_level_1 }
    - { name: controller_advice, timeout_ms: 371, on_timeout: fallback_level_1 }
    - { name: driver_message, timeout_ms: 371, on_timeout: fallback_level_1 }
    - { name: evaluation, timeout_ms: 371, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Excess wait time"
    - "Bunching events"
    - "Controller acceptance rate"
privacy:
  pii_in_logs: false
  retention_days: 400
