serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: imagery_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: preprocessing, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: land_cover_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: change_detection, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: accuracy_assessment, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Planning decisions with current data"
    - "Green space tracking"
    - "Survey cost"
privacy:
  pii_in_logs: false
  retention_days: 400
