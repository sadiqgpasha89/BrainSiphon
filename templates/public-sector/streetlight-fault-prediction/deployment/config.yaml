serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: controller_data_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: feature_build, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: failure_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: priority_scoring, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: route_planning, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: work_order, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Lights out"
    - "Repair time"
    - "Night inspections avoided"
privacy:
  pii_in_logs: false
  retention_days: 400
