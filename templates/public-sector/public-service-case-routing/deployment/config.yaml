serving:
  deadline_ms: 2500
  stages:
    - { name: feature_build, timeout_ms: 445, on_timeout: fallback_level_1 }
    - { name: routing_model, timeout_ms: 890, on_timeout: fallback_level_1 }
    - { name: deadline_rules, timeout_ms: 222, on_timeout: fallback_level_1 }
    - { name: assignment, timeout_ms: 334, on_timeout: fallback_level_1 }
    - { name: parity_and_outcome_monitoring, timeout_ms: 334, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Cases past their deadline"
    - "Reassignments"
    - "Waiting time parity"
privacy:
  pii_in_logs: false
  retention_days: 400
