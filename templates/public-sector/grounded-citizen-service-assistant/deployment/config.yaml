serving:
  deadline_ms: 2500
  stages:
    - { name: question_intake, timeout_ms: 139, on_timeout: fallback_level_1 }
    - { name: language_detection, timeout_ms: 556, on_timeout: fallback_level_1 }
    - { name: hybrid_retrieval, timeout_ms: 417, on_timeout: fallback_level_1 }
    - { name: answer_with_citation, timeout_ms: 556, on_timeout: fallback_level_1 }
    - { name: confidence_check, timeout_ms: 139, on_timeout: fallback_level_1 }
    - { name: staff_handoff, timeout_ms: 209, on_timeout: fallback_level_1 }
    - { name: quality_sampling, timeout_ms: 209, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Resolved contacts without staff"
    - "Call volume"
    - "Resident satisfaction by language"
privacy:
  pii_in_logs: false
  retention_days: 400
