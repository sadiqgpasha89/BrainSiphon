serving:
  deadline_ms: 2500
  stages:
    - { name: form_and_attachment_intake, timeout_ms: 154, on_timeout: fallback_level_1 }
    - { name: field_validation, timeout_ms: 153, on_timeout: fallback_level_1 }
    - { name: document_classification, timeout_ms: 614, on_timeout: fallback_level_1 }
    - { name: image_quality_check, timeout_ms: 614, on_timeout: fallback_level_1 }
    - { name: fix_suggestions, timeout_ms: 230, on_timeout: fallback_level_1 }
    - { name: submission_with_note, timeout_ms: 230, on_timeout: fallback_level_1 }
    - { name: return_rate_monitoring, timeout_ms: 230, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Returned applications"
    - "Time to a complete case"
    - "Applicant drop-off"
privacy:
  pii_in_logs: false
  retention_days: 400
