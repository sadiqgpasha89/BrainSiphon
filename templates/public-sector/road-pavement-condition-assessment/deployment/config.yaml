serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: image_capture, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: blur_sensitive_content, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: defect_detection, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: condition_index, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: treatment_optimiser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: re_survey_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Cost per lane-kilometre treated"
    - "Roads in poor condition"
    - "Pothole complaints"
privacy:
  pii_in_logs: false
  retention_days: 400
