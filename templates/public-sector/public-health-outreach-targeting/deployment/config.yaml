serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: coverage_and_service_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: barrier_data_join, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: gap_and_effect_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: channel_selection, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outreach_delivery, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: equity_evaluation, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Uptake gap"
    - "Coverage in underserved areas"
    - "Cost per additional person reached"
privacy:
  pii_in_logs: false
  retention_days: 400
