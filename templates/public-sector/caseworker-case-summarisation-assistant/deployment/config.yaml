serving:
  deadline_ms: 2500
  stages:
    - { name: permission_check, timeout_ms: 290, on_timeout: fallback_level_1 }
    - { name: timeline_and_action_extraction, timeout_ms: 774, on_timeout: fallback_level_1 }
    - { name: summary_with_source_links, timeout_ms: 774, on_timeout: fallback_level_1 }
    - { name: access_logging, timeout_ms: 387, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Preparation time"
    - "Missed actions"
    - "Caseworker satisfaction"
privacy:
  pii_in_logs: false
  retention_days: 400
