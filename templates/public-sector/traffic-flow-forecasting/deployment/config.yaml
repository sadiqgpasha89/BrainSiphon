serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: detector_and_probe_aggregation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: cleaning_and_gap_fill, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: graph_feature_build, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: forecast_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: interval_estimate, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: operator_dashboard, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: accuracy_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Delay forecast accuracy"
    - "Travel time reliability"
    - "Operator response time"
privacy:
  pii_in_logs: false
  retention_days: 400
