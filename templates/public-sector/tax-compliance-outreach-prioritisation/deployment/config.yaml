serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: account_and_notice_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: uplift_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: message_selection, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outreach_send, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: randomised_holdout, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: officer_follow_up, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: impact_evaluation, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Compliance after outreach"
    - "Cost per collected unit"
    - "Complaints about letters"
privacy:
  pii_in_logs: false
  retention_days: 400
