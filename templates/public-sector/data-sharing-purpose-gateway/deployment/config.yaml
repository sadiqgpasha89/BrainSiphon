serving:
  deadline_ms: 80
  stages:
    - { name: purpose_code_intake, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: legal_basis_evaluation, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: field_minimisation, timeout_ms: 9, on_timeout: fallback_level_1 }
    - { name: release_or_denial, timeout_ms: 6, on_timeout: fallback_level_1 }
    - { name: immutable_log, timeout_ms: 11, on_timeout: fallback_level_1 }
    - { name: anomaly_detection, timeout_ms: 23, on_timeout: fallback_level_1 }
    - { name: subject_access_portal, timeout_ms: 9, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Requests denied for no basis"
    - "Time to approve valid requests"
    - "Subject log queries"
privacy:
  pii_in_logs: false
  retention_days: 400
