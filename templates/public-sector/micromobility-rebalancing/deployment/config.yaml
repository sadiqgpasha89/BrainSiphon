serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: telemetry_and_trip_aggregates, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: demand_forecast, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: rebalancing_optimiser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: coverage_rules, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: crew_task_list, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outcome_measurement, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Availability in underserved areas"
    - "Rides served"
    - "Crew cost per ride"
privacy:
  pii_in_logs: false
  retention_days: 400
