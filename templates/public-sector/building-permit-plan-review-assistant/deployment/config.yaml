serving:
  deadline_ms: 2500
  stages:
    - { name: plan_intake, timeout_ms: 139, on_timeout: fallback_level_1 }
    - { name: drawing_parsing, timeout_ms: 557, on_timeout: fallback_level_1 }
    - { name: measurement_extraction, timeout_ms: 556, on_timeout: fallback_level_1 }
    - { name: rule_check, timeout_ms: 139, on_timeout: fallback_level_1 }
    - { name: flag_drafting_with_citation, timeout_ms: 556, on_timeout: fallback_level_1 }
    - { name: rule_version_log, timeout_ms: 278, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Review cycle time"
    - "Resubmissions"
    - "Reviewer time per application"
privacy:
  pii_in_logs: false
  retention_days: 400
