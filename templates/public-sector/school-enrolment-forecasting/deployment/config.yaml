serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: enrolment_and_births_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: cohort_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: housing_pipeline_join, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: scenario_ranges, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: capacity_gap_analysis, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: accuracy_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Over- and under-capacity schools"
    - "Temporary classroom cost"
    - "Planning accuracy"
privacy:
  pii_in_logs: false
  retention_days: 400
