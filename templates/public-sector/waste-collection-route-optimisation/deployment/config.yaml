serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: fill_and_fleet_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: fill_forecast, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: route_optimiser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: service_rule_filter, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: supervisor_approval, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: driver_task_list, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Kilometres driven"
    - "Missed collection complaints"
    - "Overtime hours"
privacy:
  pii_in_logs: false
  retention_days: 400
