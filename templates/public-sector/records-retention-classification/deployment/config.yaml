serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: document_intake, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: classification, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: retention_rule_lookup, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: legal_hold_check, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: disposal_list, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: officer_approval, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Documents correctly retained"
    - "Storage cost"
    - "Disposal errors"
privacy:
  pii_in_logs: false
  retention_days: 400
