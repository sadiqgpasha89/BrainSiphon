serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: asset_and_break_data_extraction, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: survival_data_setup, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: hazard_model, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: consequence_weighting, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: renewal_optimiser, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: outcome_tracking, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Breaks per 100 km"
    - "Renewal cost per avoided break"
    - "Customer minutes lost"
privacy:
  pii_in_logs: false
  retention_days: 400
