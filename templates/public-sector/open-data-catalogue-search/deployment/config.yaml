serving:
  deadline_ms: 2500
  stages:
    - { name: catalogue_harvest, timeout_ms: 216, on_timeout: fallback_level_1 }
    - { name: metadata_enrichment, timeout_ms: 574, on_timeout: fallback_level_1 }
    - { name: quality_checks, timeout_ms: 215, on_timeout: fallback_level_1 }
    - { name: personal_data_scan, timeout_ms: 574, on_timeout: fallback_level_1 }
    - { name: search_index, timeout_ms: 431, on_timeout: fallback_level_1 }
    - { name: usage_analytics, timeout_ms: 215, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Dataset use"
    - "Time to find data"
    - "Quality issues fixed"
privacy:
  pii_in_logs: false
  retention_days: 400
