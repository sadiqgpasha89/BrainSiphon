serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: decision_and_outcome_logs, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: metric_computation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: threshold_evaluation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: register_update, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Tools monitored"
    - "Disparities found and fixed"
    - "Time to pause a faulty tool"
privacy:
  pii_in_logs: false
  retention_days: 400
