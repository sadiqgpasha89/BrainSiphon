serving:
  deadline_ms: 2500
  stages:
    - { name: notice_intake, timeout_ms: 194, on_timeout: fallback_level_1 }
    - { name: machine_translation, timeout_ms: 774, on_timeout: fallback_level_1 }
    - { name: number_and_glossary_checks, timeout_ms: 193, on_timeout: fallback_level_1 }
    - { name: back_translation_test, timeout_ms: 774, on_timeout: fallback_level_1 }
    - { name: approval_and_publish, timeout_ms: 290, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Translation cost per notice"
    - "Time to publish"
    - "Resident complaints about notices"
privacy:
  pii_in_logs: false
  retention_days: 400
