serving:
  deadline_ms: n/a  # batch: run window = 2h
  stages:
    - { name: meter_and_building_data, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: normalisation, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: anomaly_detection, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: cause_hints, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: work_order, timeout_ms: n/a, on_timeout: fallback_level_1 }
    - { name: verification, timeout_ms: n/a, on_timeout: fallback_level_1 }
breaker:            # per dependency, not global
  error_rate_open: 0.5
  window_s: 10
  half_open_probes: 5
rollout:
  shadow_days: 7
  canary_steps_pct: [1, 5, 25, 100]
  auto_rollback_if_degraded:
    - "Energy per square metre"
    - "Faults found"
    - "Comfort complaints"
privacy:
  pii_in_logs: false
  retention_days: 400
